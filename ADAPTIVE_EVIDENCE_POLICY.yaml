schema_version: autoresearch.adaptive_evidence_gate.v1
observed_on: "2026-09-22"
fail_closed: true

scope:
  purpose: post_launch_realization_and_evidence_acceptance
  launch_readiness_ref: EPISODE_READINESS.yaml
  readiness_model_ref: READINESS_MODEL.yaml
  is_launch_readiness_gate: false
  local_launcher_uses_this_file: false
  verified_semantics: accepted_shared_campaign_evidence_not_episode_completion
  episode_completion_without_canonical_binding: allowed_but_not_counted_as_verified_shared_evidence
  per_episode_blockers_semantics: >-
    Gaps between the current state and verified adaptive evidence. They are
    episode-internal or optional post-run evidence gaps, never local launch
    blockers.
  legacy_episode_projection_fields:
    design_status: compatibility_text_not_authoritative_readiness
    gate_status: evidence_acceptance_status_not_launch_status
    blockers: gaps_to_verified_evidence_not_uniform_prelaunch_blockers

count_rule:
  required_evidence_mode: adaptive_search
  required_gate_status: verified
  requires_design_manifest: true
  requires_realization_manifest: true
  manually_overridable: false

design_gate:
  required:
    - canonical_binding_receipt_id
    - registered_program_id_and_version
    - exact_search_policy_ref_and_sha256
    - isolated_development_and_audit_roles
    - frozen_operator_grammar
    - frozen_branch_coverage_rule
    - append_only_trial_ledger_schema
    - numeric_minimum_and_maximum_trials
    - numeric_compute_ceiling
    - numeric_post_coverage_falsifier_fraction
    - qualified_patience_rule
    - nonterminal_incumbent_state
    - configuration_lock_schema_and_operation_verified
    - terminal_status_mapping
    - permission_separated_audit_runner
    - audit_open_once_rule_verified
    - no_post_audit_tuning_rule_verified
    - synthetic_deterministic_replay_verified

realization_gate:
  required:
    - minimum_valid_trials_reached
    - required_branch_coverage_satisfied
    - at_least_two_outcome_adaptive_successor_cycles
    - outcome_adaptive_successor_lineage_verified
    - at_least_two_incumbent_challenger_decisions
    - post_coverage_falsifier_fraction_satisfied
    - append_only_ledger_integrity_verified
    - deterministic_score_replay_verified
    - configuration_lock_record_observed
    - audit_opened_once_after_configuration_lock
    - zero_post_audit_mutations

canonical_integration:
  registered_programs_observed: 5
  adaptive_search_program_observed: false
  status: blocked
  reason: >-
    No currently advertised registered program exposes the policy binding,
    trial ledger, incumbent/challenger state, and inner-loop adaptive search
    semantics required by this gate. Outer-loop next-round governance is not an
    episode-internal adaptive tournament.

current_episode_portfolio:
  registry_ref: EPISODE_REGISTRY.yaml
  scientist_direction: direct_ep01_through_ep17_except_ep18_and_ep19_ep20_adaptive_search
  episode_count: 19
  design_status: current_contracts_not_realized
  direct_contracts_installed: true
  canonical_action_taken: false
