    - ADAPTIVE_SEARCH_PROTOCOL.md
    - ADAPTIVE_CONTROLLER_INTERFACE.md
    - SEARCH_POLICY.schema.json
    - TRIAL_LEDGER.schema.json
  prelaunch_common_blockers:
    - registered_adaptive_program_binding_absent
    - permission_separated_audit_runner_not_bound
  postlaunch_evidence_gaps:
    - no_realized_append_only_trial_lineage

