canonical_authority: Brain Researcher MCP
scope: optional_canonical_confirmation_projection_not_local_launch

portfolio_blockers:
  - blocker_id: trusted_canonical_receipt_verifier_absent
    class: canonical_program
    description: >-
      The local validator has no signed-receipt verifier or fresh server lookup
      capable of proving issuer, freshness, supersession, registered program,
      episode uniqueness, and the exact contract manifest. It therefore rejects
      every locally asserted canonical_ready state.
    resolution_authority: canonical_service
  - blocker_id: trusted_isolated_launch_broker_absent
    class: canonical_program
    description: >-
      bin/codex-episode is a same-UID episode launcher. A separately deployed
      broker would still be needed for an optional externally attested
      canonical confirmation, but not for local episode launch or resume.
    resolution_authority: shared
  - blocker_id: registered_inner_adaptive_program_absent
    class: canonical_program
    description: >-
      The observed codex_autoresearch_v1 profile implements outer-loop
      governance but no registered program has been verified to implement the
      required inner adaptive controller, append-only trial ledger,
      incumbent/challenger tournament, and one-shot evaluation interface. That
      is a canonical-confirmation gap, not a local launch blocker.
    resolution_authority: canonical_service
  - blocker_id: mutable_runtime_state_not_yet_bound
    class: canonical_program
    description: >-
      No current episode has a fresh optional canonical binding receipt tying
      an exact registered program version to the episode identity and policy
      hash. Local episode-managed execution does not require one.
    resolution_authority: canonical_service

