    Optional canonical-confirmation projections only; not consulted by the
    local episode launcher.
  execution_authority: explicit_scientist_invocation_then_episode_managed
  evidence_authority: ADAPTIVE_EVIDENCE_POLICY.yaml
  launch_blocked_field: inert_legacy_canonical_confirmation_projection
  launch_blocked_false_rule: >-
    Applies only to the optional canonical-confirmation lane. The local launcher
    never reads this field.
  search_policy_legacy_state_fields: >-
    Inert immutable authoring-time snapshots. They neither authorize nor block
    episode-managed execution.

