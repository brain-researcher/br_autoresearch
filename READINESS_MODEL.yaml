schema_version: autoresearch.readiness_model.v1
observed_on: "2026-09-22"
fail_closed: true
scope: optional_canonical_confirmation_projection_not_local_launch

episode_managed_launch:
  authority: explicit_scientist_invocation
  launcher: bin/codex-episode
  root_checks:
    - direct_child_workspace
    - goal_datasets_and_one_search_policy_present
    - inputs_and_outputs_present
    - writable_absolute_scratch
    - single_active_process_lock
  episode_internal_after_launch:
    - data_and_numeric_validation
    - split_and_leakage_checks
    - runtime_and_controller_qualification
    - development_search_and_falsification
    - configuration_lock
    - held_out_or_audit_evaluation
    - terminal_mapping
  explicitly_not_required_for_launch:
    - readiness_promotion
    - trusted_builder_receipt
    - external_evaluator
    - permission_separated_audit_broker
    - canonical_binding_receipt

authority:
  local_projection:
    scope: contract_data_and_evaluator_preflight
    may_assert_through: canonical_preflight_ready
  canonical_service:
    name: Brain Researcher MCP
    exclusively_asserts:
      - canonical_ready
      - canonical_binding
      - accepted_claim_or_landscape_transition
  evidence_policy:
    ref: ADAPTIVE_EVIDENCE_POLICY.yaml
    scope: post_launch_realization_and_evidence_acceptance
    is_launch_readiness_gate: false

axes:
  readiness:
    values:
      - draft
      - provisioning
      - development_ready
      - audit_ready
      - canonical_preflight_ready
      - canonical_ready
      - invalidated
  execution:
    values:
      - not_started
      - development_running
      - configuration_locked
      - audit_opened
      - terminal
  evidence:
    values:
      - not_evaluated
      - in_progress
      - verified
      - failed

readiness_transitions:
  draft_to_provisioning:
    requires:
      - complete_local_contract_structure
      - structurally_valid_search_policy
      - declared_scientific_question_and_audit_boundary
  provisioning_to_development_ready:
    requires:
      - frozen_development_source_eligibility_splits_hashes_and_exposure
      - frozen_estimand_audit_unit_grammar_metrics_margins_budgets_and_stop_rule
      - append_only_trial_ledger_genesis_and_writer_synthetically_verified
      - audit_identity_or_irrevocable_prospective_acquisition_protocol
      - trusted_evaluator_synthetic_fixture_pass
  development_ready_to_audit_ready:
    requires:
      - sealed_audit_payload_or_prospective_collection_commitment
      - permission_separated_evaluator
      - one_open_rule_output_allowlist_and_retry_semantics_verified
      - outcome_free_synthetic_audit_dry_run
  audit_ready_to_canonical_preflight_ready:
    requires:
      - all_local_gates_passed
      - goal_datasets_policy_and_readiness_manifest_share_one_clean_git_head
      - all_hashes_and_references_replay
      - shared_evidence_ledgers_coordinated
      - no_unresolved_identity_collision
  canonical_preflight_ready_to_canonical_ready:
    authority: Brain Researcher MCP only
    requires:
      - fresh_server_receipt
      - exact_registered_program_and_version
      - exact_policy_reference_and_hash
      - exact_contract_revision_git_commit_and_manifest_hash
      - unique_episode_identity_without_collision
      - current_binding_receipt_not_superseded
      - trusted_server_receipt_verification

runtime_transitions:
  explicit_invocation_to_development_running:
    requires:
      - explicit_user_launch_authorization
      - launcher_root_checks_pass
    automatic: false
  development_running_to_configuration_locked:
    requires:
      - observed_append_only_lock_receipt
  configuration_locked_to_audit_opened:
    requires:
      - one_shot_audit_open_receipt
  audit_opened_to_terminal:
    requires:
      - episode_terminal_record
  terminal_to_verified_evidence:
    requires:
      - all_realization_gates_pass
    automatic: false

invalidation_rules:
  candidate_discriminating_outcome_opened_before_freeze:
    action: invalidate_or_start_new_episode_with_new_audit_source
  post_audit_design_mutation:
    action: invalidate_and_require_new_episode
  pre_outcome_contract_revision:
    action: increment_contract_revision_and_invalidate_older_receipts
  canonical_identity_collision:
    action: remain_below_canonical_preflight_ready_until_reconciled

compatibility_projection:
  authoritative: false
  scope: optional_canonical_confirmation_only
  launch_blocked:
    deprecated: true
    derivation: >-
      false only when readiness is canonical_ready and execution is
      not_started with a currently verified canonical binding and no
      invalidation; true in every other state. The local launcher ignores this
      legacy field.
  launch_eligible:
    derivation: >-
      readiness equals canonical_ready, execution equals not_started,
      canonical binding is currently verified, and no collision or
      invalidation exists

episode_internal_realization:
  verify_during_bootstrap_or_before_corresponding_stage:
    - trial_ledger_schema_and_writer
    - configuration_lock_schema_and_operation
    - audit_open_operation
    - synthetic_deterministic_replay
  observe_during_episode_execution:
    - minimum_valid_trials_reached
    - required_branch_coverage_satisfied
    - adaptive_successor_cycles_realized
    - incumbent_challenger_decisions_realized
    - configuration_lock_record_observed
    - audit_opened_once
    - zero_post_audit_mutations
    - realized_deterministic_replay
