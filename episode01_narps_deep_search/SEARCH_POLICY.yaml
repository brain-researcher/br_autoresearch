schema_version: autoresearch.adaptive_search_policy.v1
policy_id: ep01_narps_adaptive_smoothing_search_v1
episode_id: ep01
common_protocol_ref: ../ADAPTIVE_SEARCH_PROTOCOL.md
evidence_mode: adaptive_search

prior_lineage:
  manifest: inputs/prior_lineage/PRIOR_LINEAGE_MANIFEST.json
  materialization_status: manifest_only_not_launch_ready
  role: fully_exposed_development_prior
  counts_as_new_evidence: false
  live_sibling_reads_during_run: prohibited
  prior_records:
    - prior_id: narps_prior_v1
      former_display_alias: ep01
      canonical_loop_id: arl_8cbd25a7a8610a008c2830ba624052c4
      canonical_goal_handoff_id: goal_handoff_e3f79fc20a54776ebf304655
      observed_state: COMPLETE
      observed_revision: 3
      observed_terminal_status: closed_no_candidate
      reusable_as_current_identity: false
    - prior_id: narps_prior_v2
      former_display_alias: ep02
      canonical_loop_id: arl_b622657e9fbd000075c5ad5f4cf30c44
      canonical_goal_handoff_id: goal_handoff_daf31dc2e8aa7a9965a9a8e7
      observed_state: AWAITING_REWARD
