policy_version: 6
policy_id: ep01_narps_cognitive_estimands_v6
episode_id: ep01
evidence_mode: behavioral_recovery_then_cross_run_prediction_then_controlled_fmri_factorial_then_many_team_estimand_audit
scientific_focus: cognitive_estimand_ambiguity_in_neural_loss_aversion_maps

current_status:
  scientific_design_rewritten: true
  literature_collision_audit_complete: true
  local_participant_assets_observed: true
  curated_many_team_archive_observed: true
  behavioral_recovery_run: false
  behavioral_observed_fit_run: false
  fmri_design_simulation_run: false
  fmri_observed_fit_run: false
  team_projection_run: false
  scientific_result: none

retired_directions:
  multiscale_smoothing:
    reason: direct_prior_art_on_scale_and_pre_vs_post_glm_timing
  derivative_sufficiency:
    reason: viable_methods_question_but_less_substantively_interesting_than_the_explicit_scientist_selected_narps_estimand_question
  range_normalization:
    reason: direct_narps_collision_with_brochard_and_daunizeau_2024
  generic_subjective_value_or_entropy_mapping:
    reason: direct_narps_collision_with_bobadilla_suarez_et_al_2020
  generic_brain_to_choice_decoding:
    reason: cross_run_narps_decoding_already_reported_by_soch_and_haynes

novelty_boundary:
  not_claimed_as_novel:
    - behavioral_ddm_decomposition_of_loss_aversion_alone
    - neural_gain_or_loss_encoding_alone
    - generic_pipeline_variability
    - generic_map_similarity_or_consensus
    - t_to_z_conversion_sign_rectification_resampling_or_smoothness_estimation
    - generic_cross_run_choice_decoding
    - range_adaptation_or_ofc_rsa
  proposed_contribution:
    - recoverable_cross_run_separation_of_valuation_asymmetry_and_value_independent_bias
    - fixed_pipeline_factorial_showing_how_cognitive_controls_change_gain_and_loss_estimands
    - numerically_recoverable_same_data_shape_coordinates_on_cross_run_stable_specification_axes
    - association_of_declared_cognitive_operationalization_with_team_map_shape_coordinates_beyond_technical_controls

dataset_roles:
  synthetic_behavior:
    use: exact_design_model_and_parameter_recovery
  synthetic_fmri_design:
    use: efficiency_collinearity_and_stimulus_response_separability
  synthetic_map_linear_combinations:
    use: numerical_coordinate_recovery_and_false_coordinate_calibration
  participant_behavior:
    source: OpenNeuro_ds001734_v1_0_5_original_events
    participants: 108
    task_versions:
      equal_indifference: 54
      equal_range: 54
    runs_per_participant: 4
    trials_per_run: 64
    deadline_seconds: 4
  participant_bold:
    source: fmriprep_21_0_2_MNI_2mm_preprocessed_series
    complete_runs: 432
  many_team_maps:
    source: narps_results_zenodo_3634120_v2_0_1
    level: group
    hypotheses: 9
  many_team_methods:
    source: narps_metadata_all_teams_and_linked_public_reports
  historical_prior:
    source: narps_prior_v1_and_narps_prior_v2_manifest
    use: lineage_only
    counts_as_new_evidence: false
  live_sibling_outputs:
    use: prohibited

event_source:
  required: events_ORIGINAL_tsv
  transformed_events_tsv_as_primary_source: prohibited
  required_fields:
    - participant
    - task_version
    - run
    - trial_order
    - onset
    - gain
    - positive_loss_magnitude
    - participant_response
    - binary_choice
    - response_time
    - deadline_or_no_response

behavioral_parameterization:
  upper_boundary: accept
  lower_boundary: reject
  gain_scale: G_divided_by_10_without_within_version_standardization
  loss_scale: L_divided_by_10_without_within_version_standardization
  drift: exp_kappa_minus_eta_over_2_times_G_minus_exp_kappa_plus_eta_over_2_times_L_plus_c
  valuation_asymmetry:
    symbol: eta
    definition: log_beta_loss_over_beta_gain
    loss_overweighting_direction: positive
  starting_bias:
    symbol: z
    transform: logistic_rho
    reject_bias_direction: below_0_5
  drift_criterion:
    symbol: c
    interpretation: value_independent_post_stimulus_evidence_offset
  nuisance:
    - boundary_separation_a
    - nondecision_time_t0
    - overall_sensitivity_kappa
    - small_contaminant_mixture
  diffusion_variance: fixed_to_1
  task_version_structure: separate_partially_pooled_hyperparameters

behavioral_models:
  M0:
    eta: fixed_zero
    z: fixed_half
    c: fixed_zero
  MV:
    eta: free
    z: fixed_half
    c: fixed_zero
  MZ:
    eta: fixed_zero
    z: free
    c: fixed_zero
  MC:
    eta: fixed_zero
    z: fixed_half
    c: free
  MVZ:
    eta: free
    z: free
    c: fixed_zero
  MVC:
    eta: free
    z: fixed_half
    c: free
  MZC:
    fit_only_if_joint_z_c_recovery_passes: true
  MVZC:
    fit_only_if_joint_z_c_recovery_passes: true
  benchmark:
    choice_only_logistic: true
  robustness_competitors:
    collapsing_bound_urgency:
      boundary: a0_times_exp_minus_u_t
      u_constraint: greater_than_or_equal_to_zero
      symmetric_across_accept_reject: true
      deadline_and_contaminant_likelihood: same_as_primary
    monotone_nonlinear_value:
      gain: G_divided_by_10_to_power_gamma_G
      loss: L_divided_by_10_to_power_gamma_L
      gamma_G_range: [0.5, 1.5]
      gamma_L_range: [0.5, 1.5]
      scale_anchor: ten_dollars
      selection_rule: same_training_only_two_SE_and_0_01_nat_rule

response_handling:
  primary_likelihood: binary_choice_plus_response_time
  strong_weak_role: held_out_ordinal_response_strength_only
  confidence_claim_allowed: false
  ordinal_layer:
    trained_on_training_runs_only: true
    scored_on_held_out_runs: true
  no_response:
    likelihood: survival_through_4_second_deadline
    code_as_reject: false
    discard: false
  fast_rt:
    primary: contaminant_mixture
    sensitivity_milliseconds: [100, 150, 200]

behavioral_recovery:
  exact_offer_matrices: true
  exact_four_run_structure: true
  preserve_deadline_and_missingness: true
  simulation_levels: [null, half_sesoi, sesoi, twice_sesoi]
  sesoi:
    eta: log_1_15
    absolute_z_minus_half: 0.05
    c:
      calibration: per_simulated_participant
      nuisance_anchor: that_participants_drawn_eta_z_a_t0_and_kappa
      offer_anchor: zero_drift_offer_when_c_is_zero
      target: five_percentage_point_change_in_four_second_acceptance_probability
      group_summary: median_absolute_calibrated_c
  family_selection_rule:
    score: heldout_joint_choice_rt_and_censoring_log_predictive_density
    mechanism_present_only_if_all_nested_models_lacking_it_are_beaten: true
    standard_error_margin: 2
    nat_per_trial_margin: 0.01
    otherwise_select_simpler_mechanism_set: true
    in_sample_likelihood_selection: prohibited
  pass_rules:
    correct_mechanism_set_selection_at_or_above_sesoi: 0.90
    false_component_selection_under_null_max: 0.05
    z_c_confusion_max: 0.10
    group_relative_bias_max: 0.10
    interval95_coverage_range: [0.90, 0.98]
    individual_rank_recovery_min: 0.60
    individual_rmse_between_subject_sd_max: 0.75
  fallback_if_z_c_fail:
    label: value_independent_decision_bias
    starting_point_or_prevaluation_claim: prohibited
    relabel_single_winner: prohibited
    bias_family_ensemble:
      members: [MZ, MC, MVZ, MVC, recoverable_joint_models]
      weights: learned_on_training_runs_only
    no_bias_family_ensemble:
      members: [M0, MV]
      weights: learned_on_training_runs_only
    required_heldout_advantage:
      standard_errors_min: 2
      nats_per_trial_min: 0.01
    no_ensemble_advantage: no_value_independent_bias_claim
  fallback_if_individual_recovery_fails:
    group_mechanism_inference: allowed_if_group_recovery_passes
    individual_neural_association: prohibited

cross_run_behavior:
  primary_partition:
    half_a: [1, 4]
    half_b: [2, 3]
    evaluate_both_directions: true
  sensitivities:
    complementary_two_run_partitions: all_three
    leave_one_run_out: all_four
  hyperparameters_refit_with_heldout_data: false
  primary_score: joint_log_predictive_density_choice_rt_and_censoring
  secondary_scores:
    - choice_log_loss
    - brier_score
    - choice_calibration
    - rt_quantiles_by_choice
    - no_response_rate
    - four_category_log_score
  superiority_rule:
    delta_elpd_standard_errors_min: 2
    delta_nats_per_trial_min: 0.01
    same_sign_in_EI_and_ER: true
    omitted_runs_with_same_sign_min: 3
    participant_median_advantage_positive: true
    participant_cluster_interval_above_zero: true
  full_two_process_gate:
    requirement: valuation_plus_one_recoverable_bias_beats_both_single_process_accounts
  stop_before_bold_if:
    - no_model_exceeds_fixed_predictive_margin
    - response_time_or_deadline_calibration_fails
    - conclusion_reverses_under_urgency_or_nonlinear_value
    - effect_is_driven_by_one_task_version_or_one_to_two_sequence_templates

fmri_common_pipeline:
  source_events: original
  fit_level: runwise
  fixed_across_arms:
    - preprocessing
    - mask
    - confounds
    - hrf
    - temporal_filter
    - prewhitening
    - spatial_smoothing
    - group_estimator
  gain_loss_scale: physical_units_mean_centered_within_task_version
  serial_orthogonalization: disabled
  no_response_trials: separate

fmri_arms:
  S00:
    blocks:
      - unit_height_offer_onset_impulse
      - gain_modulator
      - loss_modulator
    role: legacy_stimulus_value_specification
  S10:
    extends: S00
    blocks:
      - cross_fitted_binary_choice_entropy_at_offer_onset
      - unit_height_offer_to_response_decision_epoch
    role: joint_decision_state_block_specification
  S01:
    extends: S00
    blocks:
      - response_onset_four_observed_categories
    role: response_controlled
  S11:
    extends: S00
    blocks:
      - cross_fitted_binary_choice_entropy_at_offer_onset
      - unit_height_offer_to_response_decision_epoch
      - response_onset_four_observed_categories
    role: full_primary
  R11:
    extends: S11
    change: gain_and_loss_modulators_at_response_onset_or_four_second_deadline_for_misses
    identical_trial_support_and_no_response_nuisance_as_S11: true
    role: response_or_deadline_timing_sensitivity_only

fmri_interpretation:
  fully_adjusted_conditional_gain_loss_maps: S11_gain_and_loss
  total_omitted_process_sensitivity: S00_minus_S11
  omission_sign_convention: positive_means_omitting_the_block_increases_the_reported_gain_or_positive_loss_magnitude_slope
  decision_state_omission_main_effect: half_times_S00_minus_S10_plus_S01_minus_S11
  response_block_omission_main_effect: half_times_S00_minus_S01_plus_S10_minus_S11
  decision_response_nonadditivity: S00_minus_S10_minus_S01_plus_S11
  cellwise_simple_effects:
    - S00_minus_S10
    - S01_minus_S11
    - S00_minus_S01
    - S10_minus_S11
  simple_effects_as_marginal_displacement_axes: prohibited
  total_displacement_as_independent_axis: prohibited
  timing_sensitivity: R11_minus_S11_on_identical_trial_support
  timing_sensitivity_label: response_or_deadline_lock_not_commitment_specific_or_neural_ordering
  cross_model_displacement_construction:
    level: matched_run_level_effect_estimates_before_group_aggregation
    common_units_required: true
    group_inference: participant_paired_with_participant_level_resampling
    subtract_group_t_or_z_images: prohibited
  signed_ddm_drift_alongside_gain_and_loss: prohibited_due_to_collinearity
  response_category_block_label: choice_strength_and_finger_mixture
  pure_motor_or_pure_response_bias_label: prohibited
  difference_maps_as_identified_neural_process_maps: prohibited
  S11_as_pure_valuation_map: prohibited
  decision_state_block:
    difficulty_formula: minus_p_log_p_minus_one_minus_p_log_one_minus_p
    p_source: frozen_cross_fitted_probability_of_accept_conditional_on_a_boundary_response_by_four_seconds_excluding_contaminant
    three_outcome_accept_reject_noresponse_entropy: sensitivity_only
    difficulty_timing: zero_duration_offer_onset_modulator
    difficulty_scaling: within_run_center_and_sd_using_covariate_values_only
    epoch: unit_height_offer_onset_to_response_or_four_second_deadline
    negative_absolute_drift: sensitivity_only
    delta_D_label: joint_decision_state_block_displacement
    separate_difficulty_vs_duration_attribution: prohibited

fmri_design_gate:
  use_actual_onsets_and_response_times: true
  inspect:
    - gain_loss_efficiency
    - condition_number
    - variance_inflation
    - stimulus_response_separability
  fixed_thresholds:
    task_column_condition_number_after_nuisance_residualization_and_unit_scaling_max: 30
    focal_gain_loss_VIF_max: 5
    S11_gain_loss_efficiency_relative_to_S00_min: 0.50
    R11_gain_loss_efficiency_relative_to_S11_min: 0.50
  fail_specification_displacement_claim_if:
    - gain_or_loss_is_nonestimable_in_S11
    - stimulus_and_response_blocks_are_not_separable
  drop_timing_sensitivity_if:
    - R11_task_column_condition_number_exceeds_30
    - R11_gain_or_loss_VIF_exceeds_5
    - R11_gain_loss_efficiency_below_half_of_S11
  temporal_before_vs_during_claim: prohibited

fmri_regions:
  allowed_primary_summaries:
    - public_narps_vmpfc_hypothesis_mask
    - public_narps_ventral_striatum_hypothesis_mask
    - public_narps_amygdala_hypothesis_mask
  freeze_before_observed_fit: true
  select_from_new_maps: prohibited
  if_original_hypothesis_provenance_is_ambiguous: omit_regional_gate_without_posthoc_substitution

cross_run_fmri:
  primary_partition_matches_behavior: true
  behavior_generates_only_other_half_regressors: true
  required:
    - S11_gain_loss_patterns_agree_across_halves
    - S00_minus_S11_direction_agrees_across_halves
    - order_invariant_decision_and_response_omission_axes_agree_across_halves
    - retained_nonadditivity_axis_agrees_across_halves
    - if_R11_passes_design_gates_retained_R11_minus_S11_on_identical_trial_support_agrees_across_halves
    - directions_agree_within_EI_and_ER
    - team_projection_templates_stable_across_halves_masks_and_smoothness
  template_retention:
    robust_spatial_cosine_min: 0.20
    participant_bootstrap_95pct_lower_bound_min: 0
    participant_sign_flip_null_percentile_required: 0.95
    qualified_regional_vector_cosine_min: 0.50
    qualified_regional_bootstrap_95pct_lower_bound_min: 0
    full_data_rescue_after_half_failure: prohibited
  individual_brain_behavior:
    role: optional_incremental_heldout_validity_only
    eligibility: one_identifiable_eta_plus_one_identifiable_z_or_c_family_and_both_individual_rank_gates_pass
    generic_z_c_bias_ensemble_mapping: prohibited
    target: untouched_target_half_choice_rt_and_deadline_behavior
    baseline_predictors:
      - predictor_half_behavior
      - task_version
    expanded_predictors:
      - baseline_predictors
      - predictor_half_neural_gain_loss_vector
    neural_predictor_construction:
      difficulty_for_each_predictor_run: fit_from_the_other_run_in_the_predictor_half
      population_quantities: predictor_half_data_only
      target_half_used_in_neural_predictor: prohibited
      primary_arm: S11
      participant_map: equal_average_of_two_predictor_half_runwise_beta_maps
      dimensions:
        - gain
        - positive_loss_magnitude
      template: task_version_matched_leave_one_participant_out_group_S11_template_from_predictor_half_only
      mask: fixed_outcome_blind_whole_brain_intersection_mask
      spatial_preprocessing: demean_participant_map_and_template_within_mask_then_unit_norm_template
      score: inner_product_of_demeaned_participant_map_with_matching_unit_norm_template
      score_standardization: other_predictor_half_participants_within_task_version_only
      participant_in_own_template_or_scaling: prohibited
      ROI_displacement_R11_or_alternative_template_predictors: prohibited
    target_likelihood:
      responded_trials: same_first_passage_choice_rt_density_as_winning_behavioral_DDM
      no_response_trials: survival_through_four_second_deadline
      contaminant_mixture: same_frozen_channel_as_winning_behavioral_DDM
    model_mapping:
      baseline: task_version_plus_participant_predictor_half_behavior
      expanded: baseline_plus_standardized_two_dimensional_predictor_half_neural_gain_loss_vector
      neural_vector_enters_population_prior_means_for:
        - eta
        - logit_z_or_c_as_selected_by_identified_family
      neural_terms_for_a_t0_kappa_or_contaminant: prohibited
      interactions_or_beta_ratio: prohibited
    subject_out_training:
      neural_regression_coefficients: leave_one_participant_out_within_predictor_half
      neural_scaling_priors_regularization: other_participants_predictor_half_only
      heldout_participant_predictor_behavior_updates_random_effects_equally_in_both_models: true
    nested_predictor_half_selection:
      behavioral_family: reselected_by_two_run_swap_inside_predictor_half
      priors_regularization_and_tuning: predictor_half_only
      four_run_winner_inherited_without_reselection: prohibited
      whole_brain_template: predictor_half_leave_one_participant_out
    evaluate_both_directions: true
    primary_score: incremental_joint_heldout_choice_rt_and_censoring_log_predictive_density
    retention_gate:
      mean_increment_nat_per_trial_min_each_direction: 0.01
      participant_cluster_bootstrap_95pct_lower_bound_strictly_greater_than_each_direction: 0
    requires_individual_rank_recovery: true
    neural_score: exactly_two_primary_S11_whole_brain_pattern_expression_values_gain_and_loss
    compare_gain_loss_as_two_dimensional_vector: true
    beta_ratio: prohibited
    claim: within_session_generalizability_only

team_map_harmonization:
  primary_maps: unthresholded_group_maps
  coefficient_direction_sign: positive_statistic_corresponds_to_positive_underlying_coefficient_per_increasing_positive_gain_or_loss_magnitude
  statistic_maps_are_beta_or_effect_units: false
  hypothesis_rectified_sign_as_coefficient_direction_sign: prohibited
  base_estimands:
    - gain_EI_H1_H3
    - gain_ER_H2_H4
    - loss_EI_H5_H7
    - loss_ER_H6_H8
    - loss_ER_minus_EI_H9
  deduplication:
    same_submitted_file_or_numerically_equal_on_same_finite_support: true
    high_spatial_correlation_alone: prohibited
  common_grid: MNI_2mm
  map_comparison: robust_within_map_shape
  incompatible_statistic_amplitude_comparison: prohibited
  controls:
    - statistic_conversion_when_df_known
    - intersection_mask
    - effective_smoothness
    - global_scale
    - software
    - preprocessing_source
    - mask_and_grid
    - statistic_type
    - motion_handling
    - inference_family
    - participant_count
    - participant_exclusion_count_and_rule
    - available_sample_identity_summary
    - higher_level_covariates_and_design
    - group_estimator

team_projection:
  template_source: cross_run_stable_base_estimand_matched_S11_delta_D_delta_R_optional_I_DR_and_optional_gate_passing_R11_minus_S11_maps
  base_estimand_matching:
    gain_EI: EI_gain_templates_only
    gain_ER: ER_gain_templates_only
    loss_EI: EI_loss_templates_only
    loss_ER: ER_loss_templates_only
    loss_ER_minus_EI: explicit_ER_minus_EI_difference_for_each_loss_template
    pooled_or_cross_estimand_template: prohibited
    task_version_difference_interpretation: descriptive_between_participants_not_causal
  validate_before_observed_team_interpretation:
    - synthetic_template_linear_combinations
    - held_out_spatial_parcels
    - run_half_swap
    - mask_sensitivity
    - smoothness_matched_templates
  basis_retention_after_unit_norm_scaling:
    condition_number_max: 10
    pairwise_absolute_spatial_correlation_max: 0.85
  synthetic_coordinate_recovery:
    RMSE_coordinate_sd_max: 0.20
    absolute_bias_coordinate_sd_max: 0.10
    interval95_coverage_range: [0.90, 0.98]
  sensitivity_stability:
    spearman_min: 0.80
    sign_agreement_min: 0.90
    median_absolute_shift_coordinate_sd_max: 0.25
  coordinate_interpretation:
    unit: unitless_within_map_standardized_shape_coordinate
    templates_and_team_maps_share_narps_participants: true
    half_template_swap_provides_independence: false
    synthetic_recovery_validates_numerics_not_cognitive_content: true
    mixture_proportion_or_cognitive_content_claim: prohibited
    generalization_requires_independent_dataset: true
  primary_metadata:
    - event_support_and_duration
    - gain_loss_scaling_centering_and_orthogonalization
    - RT_or_decision_duration_modeling
    - choice_or_response_modeling
    - first_level_regressor_set
  metadata_coding_blinded_to_projection_score: true
  unit: team
  repeated_hypotheses_are_independent: false
  voxelwise_independence: false
  method_association_model:
    family: multivariate_partially_pooled_ridge
    baseline_predictors:
      - base_estimand_identity
      - frozen_technical_controls
    expanded_predictors:
      - baseline_predictors
      - frozen_cognitive_operationalization_feature_blocks
    outer_validation: leave_one_team_out_with_all_team_maps_bundled
    regularization_selection: nested_within_training_teams_only
    primary_scores:
      - heldout_joint_log_predictive_density_change
      - heldout_multivariate_R2_change
    uncertainty:
      - team_cluster_bootstrap
      - team_bundle_feature_block_permutation
    stepwise_or_coordinate_informed_feature_selection: prohibited
    metadata_missingness:
      - explicit_missingness_indicators
      - complete_case_sensitivity
    unrecorded_sample_or_group_model_differences:
      cognitive_specification_isolation_claim: prohibited
      allowed_claim: conditional_on_recorded_sample_composition_and_group_model_proxies
  association_interpretation: descriptive_not_causal
  equivalence_for_cognitive_feature_increment:
    interval: team_cluster_bootstrap_90pct
    delta_leave_one_team_out_log_score_nat_per_standardized_coordinate_bounds: [-0.01, 0.01]
    delta_multivariate_R2_bounds: [-0.02, 0.02]
    requires_entire_interval_inside_both_bounds: true
    p_greater_than_0_05_as_equivalence: prohibited
    interpretation: negligible_increment_for_tested_coded_features_only
  stop_if:
    - specification_displacement_templates_are_too_collinear
    - synthetic_coordinate_recovery_fails
    - projection_changes_materially_across_run_halves_masks_or_smoothness
    - cognitive_increment_is_neither_positive_nor_equivalent

fmri_equivalence:
  interval: participant_bootstrap_90pct
  paired_regional_standardized_displacement_absolute_max: 0.20
  symmetric_whole_brain_relative_RMS_displacement_max: 0.10
  whole_brain_spatial_cosine_min: 0.90
  requires_entire_interval_inside_all_applicable_bounds: true
  p_greater_than_0_05_as_equivalence: prohibited
  denominator: max_of_mean_S00_S11_RMS_and_participant_sign_flip_null_95th_percentile_RMS
