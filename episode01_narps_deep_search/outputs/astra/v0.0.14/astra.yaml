    outputs:
      - id: behavior_report
        type: report
        format: json
        inputs: [asset_report, search_policy]
        decisions: [recovery, robustness_rivals, deadline_likelihood, heldout_partition, mechanism_tier]
      - id: resumed_criterion_component
        type: data
        format: directory
        inputs: [implementation, resume_code, stopped_recovery_attempt]
        recipe:
          command: >-
            python {inputs.resume_code} --implementation {inputs.implementation}
            --replicate-index 0 --source-attempt "{inputs.stopped_recovery_attempt}"
            --output-dir {output}
          resources: {cpus: 1, memory: 2Gi, time_limit: 30m}
      - id: criterion_replicate
        type: data
        format: directory
        inputs: [implementation, criterion_code, original_events]
        recipe:
          command: >-
            python {inputs.criterion_code} --implementation {inputs.implementation}
            --events {inputs.original_events} --replicate-index $SLURM_ARRAY_TASK_ID
            --output-dir {output}
          resources: {cpus: 1, memory: 2Gi, time_limit: 90m}
      - id: single_process_mv_replicate
        type: data
        format: directory
        description: >-
          Declared MV uniform-SESOI necessary recovery cell, explicit fixed index.
          All108 participants and both primary half directions; unchanged
          fitter/likelihood. Passing cannot establish complete recovery or
          reopen observed behavior/BOLD. The failed MC cell stays closed.
        inputs: [implementation, single_process_specification, single_process_code, single_process_tests, preserved_synthetic_design]
        recipe:
          command: >-
