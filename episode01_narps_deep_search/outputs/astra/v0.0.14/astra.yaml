version: "0.0.14"
name: EP01 NARPS cognitive-estimand audit

inputs:
  - id: goal
    type: data
    source: GOAL.md
  - id: datasets
    type: data
    source: DATASETS.md
  - id: search_policy
    type: data
    source: SEARCH_POLICY.yaml
  - id: literature_audit
    type: data
    source: outputs/paper_plan.md

outputs:
  - id: exploratory_observed_model_contrasts
    from: exploratory_observed_model_contrasts.contrast_report
  - id: exploratory_behavior_descriptions
    from: exploratory_observed_behavior.descriptive_report
  - id: exploratory_behavior_fit
    from: exploratory_observed_behavior.fit_report
  - id: asset_report
    from: public_asset_qualification.asset_report
  - id: behavior_report
    from: behavioral_mechanism_kill_test.behavior_report
  - id: fmri_design_report
    from: fmri_design_identifiability.fmri_design_report
  - id: fmri_run_report
    from: fmri_split_first_level.fmri_run_report
  - id: neural_report
    from: fmri_cross_run_falsification.neural_report
  - id: team_map_report
    from: team_map_harmonization.team_map_report
  - id: projection_report
    from: team_estimand_projection.projection_report
  - id: integrated_claim_report
    from: integrated_claim_audit.integrated_claim_report

analyses:
  exploratory_observed_model_contrasts:
    name: Describe all paired differences among six completed observed-data models
    inputs:
      - {id: goal, from: ../goal}
      - {id: search_policy, from: ../search_policy}
      - id: saved_summary
        type: data
        source: outputs/runs/exploratory_observed_behavior/20261005-closeout-46651952/observed_behavior_summary.json
      - id: comparison_code
        type: data
        source: outputs/code/analyze_observed_model_contrasts.py
    outputs:
      - id: contrast_report
        type: report
        format: json
        inputs: [goal, search_policy, saved_summary, comparison_code]
        decisions: [complete_posthoc_menu]
        recipe:
          command: >-
            timeout --signal=TERM --kill-after=10s 120s
            python outputs/code/analyze_observed_model_contrasts.py
            --output-dir {output}
            --figure-prefix outputs/figures/observed_model_contrasts
          resources: {cpus: 1, memory: 2Gi, time_limit: 3m}
    decisions:
      complete_posthoc_menu:
        label: Retain all models and all 15 paired comparisons after outcome exposure
        default: complete_saved_score_menu
        options:
          complete_saved_score_menu:
            label: >-
              Post-hoc exploratory interpretation authorized by the scientist's
              request to keep investigating current episodes. Read only the completed
              summary, retain all 108 participants and both original scoring directions,
              and report all six model means and all 15 unique paired contrasts with
              participant SE, median, positive/negative counts, EI/ER means, and the
              deterministic range of means after omitting one saved participant score.
              No refit, new split, likelihood evaluation, bootstrap, inferential
              threshold, mechanism winner, or independent confirmation is introduced.
              The figure distinguishes total gain over M0 from the four nested additions;
              the full report retains every contrast irrespective of its sign.
  exploratory_observed_behavior:
    name: Describe actual behavior and evaluate frozen within-session predictions
    inputs:
      - {id: goal, from: ../goal}
      - {id: search_policy, from: ../search_policy}
      - id: original_events
        type: data
        source: outputs/runs/public_asset_qualification/20261003-attempt01/original_events.csv.gz
      - id: implementation
        type: data
        source: outputs/code/behavioral_implementation.json
      - id: observed_runner
        type: data
        source: outputs/code/run_observed_behavior.py
    outputs:
      - id: descriptive_report
        type: report
        format: json
        inputs: [goal, search_policy, original_events, observed_runner]
        decisions: [observed_scope]
        recipe:
          command: >-
            python outputs/code/run_observed_behavior.py describe
            --output-dir {output} --max-seconds 120
          resources: {cpus: 1, memory: 2Gi, time_limit: 2m}
      - id: fit_report
        type: report
        format: json
        inputs: [goal, search_policy, original_events, implementation, observed_runner]
        decisions: [observed_scope, fixed_menu]
        recipe:
          command: >-
            python outputs/code/run_observed_behavior.py fit
            --model "$EP_OBS_MODEL" --direction "$EP_OBS_DIRECTION"
            --implementation outputs/code/behavioral_implementation.json
            --output-dir {output} --max-seconds 1800
          resources: {cpus: 4, memory: 8Gi, time_limit: 35m}
    decisions:
      observed_scope:
        label: Claim and access boundary
        default: exploratory_descriptive_predictive
        options:
          exploratory_descriptive_predictive:
            label: Frozen descriptions and training-only plug-in prediction; recovery and mechanism/neural claims remain deferred
      fixed_menu:
        label: Finite observed-data fit menu
        default: six_models_two_directions
        options:
          six_models_two_directions:
            label: M0 MV MZ MC MVZ MVC each in both primary directions; first M0 runtime pilot then remaining eleven once; compare only complete 108-person models

  public_asset_qualification:
    name: Freeze participant and many-team source semantics
    inputs:
      - id: goal
        from: ../goal
      - id: datasets
        from: ../datasets
      - id: search_policy
        from: ../search_policy
      - id: literature_audit
        from: ../literature_audit
    outputs:
      - id: asset_report
        type: report
        format: json
        inputs: [goal, datasets, search_policy, literature_audit]
        decisions: [event_source, participant_assets, team_assets, sign_semantics]
        recipe:
          command: >-
            python outputs/code/qualify_assets.py
            --source-root "$NARPS_BIDS_ROOT"
            --source-mapping outputs/code/original_events_mapping.json
            --fmriprep-root "$NARPS_FMRIPREP_ROOT"
            --output-dir {output}
          resources: {cpus: 1, memory: 2Gi, time_limit: 30m}
    decisions:
      event_source:
        label: Behavioral event source
        default: original_events_only
        options:
          original_events_only:
            label: Use events_ORIGINAL.tsv for gain, loss, response, RT, onset, deadline, run, and order
      participant_assets:
        label: Participant-level source
        default: complete_fmriprep_21_series
        options:
          complete_fmriprep_21_series:
            label: Use all eligible original events and complete fMRIPrep 21.0.2 MNI 2-mm BOLD/confounds/masks
      team_assets:
        label: Many-team source
        default: curated_v2_0_1_group_maps_and_methods
        options:
          curated_v2_0_1_group_maps_and_methods:
            label: Inventory unthresholded group maps, team identities, degrees of freedom, and detailed method reports without assuming subject maps
      sign_semantics:
        label: Gain/loss sign convention
        default: coefficient_direction_increasing_positive_magnitude
        options:
          coefficient_direction_increasing_positive_magnitude:
            label: Restore statistic-map signs to the underlying gain/loss coefficient direction rather than reusing hypothesis-directed rectification; do not infer beta or effect units

