<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">EP01 conceptual question</title>
  <desc id="desc">Three evidence layers connect recoverable behavioral mechanisms, a controlled fMRI estimand factorial, and an ecological audit of NARPS team maps. Each layer has a stop gate and limited claim.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#344054"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#101828" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1400" height="760" fill="#f8fafc"/>
  <text x="700" y="62" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#101828">What do neural loss-aversion maps measure?</text>
  <text x="700" y="101" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#475467">Separate the behavioral mechanisms, perturb the cognitive estimand, then test the ecological analyst maps</text>

  <g filter="url(#shadow)">
    <rect x="70" y="165" width="360" height="365" rx="20" fill="#eef4ff" stroke="#6172f3" stroke-width="2"/>
    <rect x="520" y="165" width="360" height="365" rx="20" fill="#ecfdf3" stroke="#12b76a" stroke-width="2"/>
    <rect x="970" y="165" width="360" height="365" rx="20" fill="#fff6ed" stroke="#f79009" stroke-width="2"/>
  </g>

  <circle cx="112" cy="207" r="24" fill="#6172f3"/>
  <text x="112" y="215" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="white">1</text>
  <text x="250" y="215" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#253b80">Behavioral identification</text>
  <text x="100" y="266" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#344054">Valuation asymmetry</text>
  <text x="100" y="298" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#344054">vs. value-independent rejection bias</text>
  <line x1="100" y1="324" x2="400" y2="324" stroke="#b2c0f7" stroke-width="2"/>
  <text x="100" y="363" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#475467">Choice + RT + 4-s deadline</text>
  <text x="100" y="393" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#475467">Exact-design recovery</text>
  <text x="100" y="423" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#475467">Held-out run-half prediction</text>
  <rect x="100" y="462" width="300" height="42" rx="10" fill="#d9e3ff"/>
  <text x="250" y="489" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#253b80">STOP if mechanisms are not recoverable</text>

  <circle cx="562" cy="207" r="24" fill="#12b76a"/>
  <text x="562" y="215" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="white">2</text>
  <text x="700" y="215" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#05603a">Controlled fMRI estimands</text>
  <text x="550" y="266" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#344054">S00 legacy value</text>
  <text x="550" y="298" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#344054">S10 decision controlled</text>
  <text x="550" y="330" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#344054">S01 response controlled</text>
  <text x="550" y="362" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#344054">S11 full model + R11 sensitivity</text>
  <line x1="550" y1="386" x2="850" y2="386" stroke="#86efac" stroke-width="2"/>
  <text x="550" y="425" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#475467">All technical steps held fixed</text>
  <text x="550" y="455" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#475467">Cross-fitted difficulty; half-swap maps</text>
  <rect x="550" y="482" width="300" height="42" rx="10" fill="#d1fadf"/>
  <text x="700" y="509" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#05603a">KEEP only reproducible displacement axes</text>

  <circle cx="1012" cy="207" r="24" fill="#f79009"/>
  <text x="1012" y="215" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="white">3</text>
  <text x="1150" y="215" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#93370d">Many-team ecology</text>
  <text x="1000" y="266" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#344054">Physically sign-correct maps</text>
  <text x="1000" y="298" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#344054">Deduplicate base contrasts</text>
  <text x="1000" y="330" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#344054">Validate mixture projections</text>
  <text x="1000" y="362" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#344054">Blind-code cognitive model choices</text>
  <line x1="1000" y1="386" x2="1300" y2="386" stroke="#fed7aa" stroke-width="2"/>
  <text x="1000" y="425" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#475467">Control smoothness, mask, scale, software</text>
  <text x="1000" y="455" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#475467">Team is the analysis unit</text>
  <rect x="1000" y="482" width="300" height="42" rx="10" fill="#ffead5"/>
  <text x="1150" y="509" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#93370d">ASSOCIATION, not causal attribution</text>

  <line x1="442" y1="348" x2="506" y2="348" stroke="#344054" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="892" y1="348" x2="956" y2="348" stroke="#344054" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="130" y="590" width="1140" height="104" rx="18" fill="#ffffff" stroke="#d0d5dd" stroke-width="2"/>
  <text x="700" y="628" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#101828">Claim boundary</text>
  <text x="700" y="661" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#475467">Computational mechanism comparison + map sensitivity + descriptive analyst ecology</text>
  <text x="700" y="686" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#b42318">No temporal pre-valuation localization · no causal neural mechanism · no trait claim · no 70-team biological replication</text>
</svg>
