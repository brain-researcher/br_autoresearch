# Narrative annotation only: operative grammar, objective, required falsifiers,
# promotion, budgets and audit rules are unchanged by the 2026-09-30 rewrite.
# A null gain is not evidence of equivalence without adequate precision.
paper_framing:
  question: what_does_signed_condition_text_add_beyond_task_family
  proposed_contribution: incremental_sign_sensitive_map_geometry_across_independent_dataset_groups
  target_interpretation: normalized_group_z_statistical_map_not_effect_amplitude
  not_claimed:
    - first_text_to_brain_mapping
    - first_contrast_description_prediction
    - first_statistical_map_evaluation
    - causal_neural_mechanism
    - null_gain_proves_task_family_sufficiency
  evidence_status: design_only_no_current_contract_experiment
  paper_plan: outputs/paper_plan.md
  conceptual_figure: outputs/ep03_conceptual_question.png

dataset_roles:
  development:
    source: exposed_neuroeffect_51_independent_dataset_groups
    use: grouped_nested_cross_validation_and_mechanism_search
    freshness: historically_exposed
  selection:
    source: same_51_groups_with_frozen_outer_group_folds
    use: out_of_fold_constrained_model_selection
    freshness: internal_only
  audit:
    source: prospective_independent_new_dataset_groups
    use: one_shot_locked_evaluation
    freshness: must_be_sealed_and_lineage_disjoint
    available: false

grammar:
  semantic_inputs:
    - signed_standardized_contrast_template
    - train_fold_lexical_ngrams
    - frozen_ontology_indicators
    - prespecified_versioned_frozen_text_encoder
    - registered_lexical_ontology_encoder_concat
  semantic_transforms:
    - none
    - train_fold_pca
    - train_fold_pls
    - signed_positive_negative_difference_composition
  map_bases:
    - train_fold_voxel_pca
    - registered_atlas_network_basis
  predictors:
    - ridge
    - elastic_net
    - partial_least_squares
    - kernel_ridge_linear
    - kernel_ridge_cosine
    - kernel_ridge_rbf
    - reduced_rank_multioutput_regression
  nuisance_modes:
    - none
    - train_only_residualization
    - prespecified_stratification
  ensemble:
    max_members: 2
    rule: convex_blend_of_pre_evaluated_complementary_pipelines
  forbidden:
    - arbitrary_code_mutation
    - target_map_features
    - result_or_discussion_text
    - dataset_or_publication_identity
    - map_derived_taxonomy
    - audit_adaptive_preprocessing

objectives:
  primary:
    name: dataset_group_weighted_relative_mse_gain_over_task_family_prototype
    direction: maximize
    formula: mean_d(1-L_model_d/L_family_d)
  secondary:
    - spatial_correlation_gain
    - reliability_normalized_gain
    - leave_one_family_out_gain
    - fraction_of_dataset_groups_improved
  constraints:
    - polarity_equivariance_pass
    - positive_cluster_excluded_direction
    - complete_procedure_permutation_pass
    - metadata_and_lexical_controls_do_not_explain_gain
    - no_single_dataset_group_dominance
    - leakage_duplicate_reliability_gates_pass

