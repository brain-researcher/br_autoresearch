        description: >-
          Prepared complete-panel consumer; launch requires completed full null,
          sensitivity and encoding collections plus the existing matched training
          RSA/context. Admit all25 cells and required diagnostics before applying
          frozen gates, including low-level partial gain and every participant
          leave-one-out gain positive. Select the highest passing native row with
          the frozen tie rule, or close without a candidate. Publish one atomic
          no-overwrite decision at outputs/runs/panel_decision/registered_panel_decision.json;
          admission failure is not a scientific decision. A selected row still
          requires its exact full rerun; no configuration lock or OOD opening.
