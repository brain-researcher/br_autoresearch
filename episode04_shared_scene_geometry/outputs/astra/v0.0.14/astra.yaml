  development_rerun:
    name: Recompute the selected row once with its mandatory falsifiers
    inputs:
      - {id: decision, from: ../candidate_decision.single_decision}
      - {id: design, from: ../fold_freeze.development_design}
      - {id: panel, from: ../fixed_panel.panel_scores}
      - {id: controls, from: ../controls_diagnostics.control_scores}
      - {id: policy, from: ../policy}
      - {id: implementation, type: data, source: outputs/code/run_selected_development_rerun.py}
      - {id: focused_checks, type: data, source: outputs/tests/test_selected_development_rerun.py}
      - {id: batch, type: data, source: outputs/code/selected_development_rerun.sbatch}
    outputs:
      - id: full_rerun
        type: report
        format: json
        inputs: [decision, design, panel, controls, policy, implementation, focused_checks, batch]
        description: >-
          Conditional on the one saved selected_candidate_pending_exact_full_rerun
          decision. Recompute selected VLM and DINO native/partial RSA, four
          mandatory sensitivities, all10000 permutation components and1000
          selected random geometries in each of25 frozen participant/fold cells.
          Preserve original model seed indices and the original120h clock.
          Complete nonselected null components are retained; all three-VLM
          familywise winners, signed statistics and higher95th thresholds are
          rebuilt with fresh DINO and compared to the immutable originals.
          No second candidate decision, configuration lock or OOD access.
          Existing encoding, EVC and training-context diagnostics remain complete
          without refitting. All six focused checks run before values in each
          substantive unit allocation. Root first selects the actual candidate
          and remaining budget, then submits array slots1-24%24 with the explicit
          one-hour override and argument unit. One dependent90-minute job runs
          slot0 and collection, aggregating the short final stage with useful
          computation. Root binds EP04_RERUN_ARRAY_JOB to that actual array ID;
          no standalone collector allocation, automatic retry or successor.
          Fixed fresh output is outputs/runs/selected_development_rerun/20261005-once01/collection/selected_development_rerun.json.
          Closed/missing decisions or incomplete/mismatched units cannot report
          successful rerun completion. Preparation alone grants no launch.
        recipe:
          command: >-
            test -n "$EP04_RERUN_ARRAY_JOB" &&
            sbatch --dependency="afterok:$EP04_RERUN_ARRAY_JOB" --kill-on-invalid-dep=yes
            outputs/code/selected_development_rerun.sbatch finish
          resources: {cpus: 1, memory: 4Gi, time_limit: 90m}
