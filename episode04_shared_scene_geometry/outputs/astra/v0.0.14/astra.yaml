  controls_diagnostics:
    name: Complete selection-aware nulls, mandatory sensitivities and diagnostics
    inputs:
      - {id: panel, from: ../fixed_panel.panel_scores}
      - {id: design, from: ../source_readiness.metadata_folds}
      - {id: low_level_features, from: ../low_level_control.complete_features}
      - {id: sensitivities, type: data, source: outputs/code/run_native_sensitivities.py}
      - {id: encoding, type: data, source: outputs/code/run_identical_fold_encoding.py}
      - {id: nulls, type: data, source: outputs/code/run_registered_null_unit.py}
      - {id: encoding_checks, type: data, source: outputs/tests/test_identical_fold_encoding.py}
      - {id: null_checks, type: data, source: outputs/tests/test_registered_null_unit.py}
      - {id: null_collector, type: data, source: outputs/code/collect_registered_nulls.py}
      - {id: encoding_collector, type: data, source: outputs/code/collect_identical_fold_encoding.py}
      - {id: null_collection_checks, type: data, source: outputs/tests/test_collect_registered_nulls.py}
      - {id: encoding_collection_checks, type: data, source: outputs/tests/test_collect_identical_fold_encoding.py}
      - {id: panel_screen_checks, type: data, source: outputs/tests/test_screen_registered_panel.py}
      - {id: first_pass_batch, type: data, source: outputs/code/controls_first_pass01.sbatch}
