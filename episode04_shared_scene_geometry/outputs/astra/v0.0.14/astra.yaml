      - {id: remaining_dispatch, type: data, source: outputs/code/remaining_controls_tasks.py}
      - {id: remaining_batch, type: data, source: outputs/code/remaining_controls_array.sbatch}
      - {id: remaining_selected, type: data, source: outputs/code/remaining_controls_selected/20261005-full01/manifest.json}
      - {id: collection_entrypoint, type: data, source: outputs/code/collect_and_screen_full01.sh}
      - {id: collection_batch, type: data, source: outputs/code/collect_and_screen_full01.sbatch}
      - {id: training_context, from: ../training_neural_context.reliability_context}
      - {id: training_context_sub01, from: ../training_neural_context.reliability_context_sub01}
      - {id: training_context_remaining_participants, from: ../training_neural_context.reliability_context_remaining_participants}
      - {id: matched_training_rsa_pilot, from: ../training_neural_context.matched_training_rsa_pilot}
      - {id: matched_training_rsa_remaining_participants, from: ../training_neural_context.matched_training_rsa_remaining_participants}
      - {id: policy, from: ../policy}
    outputs:
      - id: first_controls_pass
        type: report
        format: directory
        inputs: [panel, design, low_level_features, sensitivities, encoding, nulls, encoding_checks, null_checks, null_collection_checks, encoding_collection_checks, panel_screen_checks, first_pass_batch, first_pass_worker, policy]
        description: >-
          After the complete observed panel, two exclusive1CPU4Gi steps in a
          2CPU8Gi50-minute allocation. One computes all1600 fixed rows across
          four registered sensitivities, internal2400s. The other runs four
          focused ridge checks, then fixed sub01/fold0 encoding (16 rows,
          internal1200s), then focused cached-null equivalence checks and
          sub01/fold0 permutation0:256 and geometry0:8 perVLM (internal1200s).
          Both scientific prefixes are retained in the eventual complete
          calculations; no duplicate reruns or full remainder dispatch follows
          automatically. Existing120h panel clock is enforced without restart.
          Primary sensitivity support never shrinks for EVC; EVC is descriptive.
          Null output preserves signed per-model/ROI/draw contributions, with
          no local winner or threshold. Full null and encoding reservations
          require the observed cost and remaining budget. All action statuses
          and partial results survive failure; missing cells block completeness.
          No rawbeta/image read, new preprocessing, candidate decision or OOD.
          The existing allocation also checks the two complete-panel collectors
          and final screen arithmetic/publication, without executing collection
          or selecting a candidate. A separately
          scoped EP12 completed-table figure shares the allocation after the
          sensitivity worker, followed by a separately scoped EP19 public
          documentation-page read. EP04 science consumes no sibling outputs
          and the shared resource charge is recorded once.
        recipe:
          command: sbatch outputs/code/controls_first_pass01.sbatch
          resources: {cpus: 2, memory: 8Gi, time_limit: 50m}
      - id: control_scores
        type: report
        format: json
        inputs: [panel, sensitivities, null_collector, encoding_collector, remaining_plan, remaining_dispatch, remaining_batch, remaining_selected, collection_entrypoint, collection_batch, policy]
        description: >-
          Complete registered-null and encoding collections bind explicit unit
          reports to all25 participant/fold cells and the original panel clock.
          Null collection requires all10000 image permutations and1000 random
          geometries perVLM, applies the unconditional pooled gain argmax and
          retains signed alignment with the higher95th quantile. Encoding
          retains all400 rows and negativeR2, with equal biological weighting
          and explicit RSA/encoding and high-level/EVC descriptive comparisons.
          No collector screens or selects a candidate. Measured first-pass cost
          selected25 explicit participant/fold bundles, each1CPU4Gi90m, up to25
          concurrent; encoding300s then null4800s within5190s including graces.
          The selected manifest preserves sub01/fold0 encoding and null prefixes
          and complete disjoint residual ranges for the frozen sub01/03/05/06/07
          roster. Fully recorded not-evaluable encoding remains scientific
          non-evaluability and does not suppress the independent null action.
          Technical failures stop. The dispatcher never submits or retries;
          collection still requires every complete registered input.
  candidate_decision:
    name: Screen every panel row then select the highest passing native VLM
    inputs:
      - {id: panel, from: ../fixed_panel.panel_scores}
      - {id: controls, from: ../controls_diagnostics.control_scores}
      - {id: policy, from: ../policy}
