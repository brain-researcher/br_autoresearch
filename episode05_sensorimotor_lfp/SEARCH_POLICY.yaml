episode: EP05
title: Does the LFP explain why one reach was different?
status: planned; no real-data analysis has run under this revision

scientific_question:
  primary: >-
    Does an individual trial's M1 LFP improve prediction of its complete X/Y
    velocity beyond the movement expected from reach direction and elapsed time?
  explanation_if_positive: >-
    Does the useful LFP signal track the same trial-varying motor-population
    activity that is visible in simultaneously recorded spikes?

evidence:
  development:
    source: all eligible M1 sessions in the previously exposed Dryad release
    role: model development and comparison only
  future_test:
    source: compatible whole sessions kept unseen during development
    role: evaluate the final analysis once
    currently_available: false
  biological_replication:
    rule: report Mihili and Chewie separately; Chewie implants are one animal
    broader_claim: requires a future session from a new animal

primary_comparison:
  evaluation_unit: one whole session, summarized separately within each animal
  split: train on seven reach directions and test on the eighth
  baseline: cyclic direction-by-elapsed-time prediction fit without the held-out direction
  candidate: the same baseline plus an LFP prediction of the remaining X/Y velocity error
  score: improvement in full-trajectory R-squared over the baseline on identical trials
  trial_specific_check: >-
    Keep every fitted model fixed and pair each predicted trajectory with a
    different trial to the same target. Correct trial pairings must score better.

model_choices:
  lfp_features:
    - local motor potential
    - one documented power band
    - prespecified low-frequency, high-frequency, or all-band blocks
    - local motor potential plus one band block
  channel_summaries:
    - fixed mean or median across matched electrodes
    - training-only principal components
    - training-only reliability weights
    - training-only top-k choice from a short prespecified list
  temporal_inputs:
    - current bin
    - a prespecified finite history window
  predictors:
    - ridge or elastic-net regression
    - reduced-rank or partial-least-squares regression
    - linear or radial-basis kernel ridge
  not_allowed:
    - choosing a different winning method for each session
    - searching arbitrary time windows
    - splitting individual time bins across training and test sets
    - fitting preprocessing on the held-out direction
    - claiming online or cross-session weight transfer from these offline tests

minimum_model_set:
  - direction-and-time baseline
  - local motor potential
  - canonical low-frequency and high-frequency blocks
  - regularized linear model
  - reduced-rank model
  - one nonlinear reference

requirements_for_a_positive_result:
  - the prespecified animal-level summary is positive in both animals
  - the prespecified majority of eligible sessions is positive
  - correct trial pairings beat wrong pairings within the same reach direction
  - the result survives leaving out each session in turn
  - the result survives matched trial and channel counts
  - behavior-only and elapsed-time-only models do not explain the gain
  - temporal-offset and feature-label negative controls pass
  - the gain is not confined to 100-400 Hz power or same-electrode spike contamination

development_process:
  initial_stage: run every model in the minimum model set
  later_trials: change one interpretable scientific choice at a time
  finalist_limit: 4
  final_choice: one analysis recipe used for every session
  future_test_rule: no feature, model, threshold, exclusion, or candidate change after any future score is visible
  control_fraction_after_initial_stage: 0.40
  adaptive_rounds_before_final_choice: 2
  leader_challenger_comparisons_before_final_choice: 2

budget:
  minimum_scientific_trials: 28
  maximum_scientific_trials: 64
  patience_after_minimum_without_material_improvement: 12
  cpu_core_hours: 2000
  gpu_hours: 0
  wall_clock_hours: 120
  maximum_parallel_cpu_cores: 32
  memory_gb_per_trial: 128
  scratch_gb: 750
  future_session_evaluations: 1

study_outcomes:
  supported_in_future_sessions: >-
    One global analysis passes development, all required controls, and the
    single evaluation on compatible sessions kept unseen during development.
  no_supported_candidate: >-
    No model survives the comparisons and controls, or the final model fails
    on the future sessions.
  development_only: >-
    Development finishes on the exposed public recordings but no sealed future
    session is available; any result remains exploratory.
  no_scientific_answer: >-
    The source, event meanings, eligibility, reproduction, or scoring cannot be
    established reliably, or the planned separation of evidence is broken.

follow_up_if_primary_is_positive:
  source: exposed M1 development sessions, not independent replication
  lfp_input: the final primary LFP representation without follow-up retuning
  question: >-
    Does that LFP representation predict held-out changes in a training-derived
    spike-population state, and do both signals predict the same speed or
    curvature correction?
  required_alternatives:
    - direction and elapsed time alone
    - matched low-frequency and high-frequency features
    - temporal offsets and wrong-trial pairings
    - matched channel, trial, and model capacity
    - same-electrode spike-contamination sensitivity
  boundary: the follow-up cannot change the answer to the primary kinematic test

claim_limits:
  - offline post-processed LFP features only
  - no causal claim
  - no online BCI claim
  - no raw-voltage claim
  - no broad population claim without a new-animal test
