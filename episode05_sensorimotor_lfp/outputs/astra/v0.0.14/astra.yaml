version: "0.0.14"
name: "EP05: trial-specific LFP information about reach variation"
description: >-
  Standalone exposed-corpus development and conditional explanation program.
  Animal-level biological grouping is preserved; future-session confirmation
  requires a genuinely unseen source. Runtime evidence belongs in the log.
inputs:
  - {id: goal, type: data, source: GOAL.md}
  - {id: datasets, type: data, source: DATASETS.md}
  - {id: policy, type: data, source: SEARCH_POLICY.yaml}
  - {id: publication_comparison, type: data, source: outputs/publication_comparison.md}
  - {id: primary_recipe, type: data, source: outputs/primary_reference_proposal.md}
  - {id: multichannel_recipe, type: data, source: outputs/primary_multichannel_proposal.md}
  - {id: capacity_recipe, type: data, source: outputs/primary_capacity_proposal.md}
  - {id: temporal_control_recipe, type: data, source: outputs/primary_temporal_control_proposal.md}
  - {id: history_control_recipe, type: data, source: outputs/primary_history_control_proposal.md}
  - {id: lmp_high_recipe, type: data, source: outputs/primary_lmp_high_control_proposal.md}
  - {id: temporal_offset_recipe, type: data, source: outputs/primary_temporal_offset_proposal.md}
  - {id: pca_recipe, type: data, source: outputs/primary_pca_denoising_proposal.md}
  - {id: relevance_recipe, type: data, source: outputs/primary_relevance_top16_proposal.md}
  - {id: covariance_svd_recipe, type: data, source: outputs/primary_covariance_svd_proposal.md}
  - {id: elastic_net_recipe, type: data, source: outputs/primary_elastic_net_proposal.md}
  - {id: repeatability_weight_recipe, type: data, source: outputs/primary_repeatability_weight_proposal.md}
  - {id: history_repeatability_weight_recipe, type: data, source: outputs/primary_history_repeatability_weight_proposal.md}
  - {id: full_target_sensitivity_recipe, type: data, source: outputs/primary_full_target_sensitivity_proposal.md}
  - {id: all_band_recipe, type: data, source: outputs/primary_all_band_complementarity_proposal.md}
  - {id: patience_interpretation, type: data, source: outputs/primary_patience_interpretation.md}
  - {id: matched_budget_recipe, type: data, source: outputs/primary_matched_budget_proposal.md}
  - {id: elapsed_only_recipe, type: data, source: outputs/primary_elapsed_only_proposal.md}
  - {id: capacity_surrogate_recipe, type: data, source: outputs/primary_capacity_matched_surrogate_proposal.md}
  - {id: intersection_recipe, type: data, source: outputs/primary_intersection_sensitivity_proposal.md}
  - {id: intersection_metadata_repair_recipe, type: data, source: outputs/primary_intersection_metadata_repair_proposal.md}
  - {id: history_blend_recipe, type: data, source: outputs/primary_history_blend_proposal.md}
  - {id: history2_repeatability_recipe, type: data, source: outputs/primary_next_history_proposal.md}
  - {id: timevarying_history_blend_recipe, type: data, source: outputs/primary_timevarying_history_blend_proposal.md}
  - {id: history_blend_intersection_recipe, type: data, source: outputs/primary_history_blend_intersection_proposal.md}
  - {id: history_rbf_recipe, type: data, source: outputs/primary_history_rbf_proposal.md}
  - {id: history_pls_recipe, type: data, source: outputs/primary_history_pls_proposal.md}
  - {id: history_pls_basis_recipe, type: data, source: outputs/primary_post_pls_coverage_review.md}
outputs:
  - {id: development_report, from: adaptive_search.development_report}
  - {id: future_report, from: future_session_evaluation.future_report}
  - {id: correction_calibration_report, from: fixed_hw_correction_calibration.calibration_report}
  - {id: fixed_component_report, from: fixed_prediction_components.component_report}
analyses:
  fixed_prediction_components:
    name: Compare mean and trial-varying contributions in completed predictions
    description: >-
      Descriptive comparison of original HW, current/history blend and completed
      scalar calibration across both animals, every original session and all
      fifteen bins. Reuse saved decomposition tables and verify original score
      reconstruction; no neural-source access, refit, selection, bootstrap,
      future-session opening or change to original stopping and practical margins.
    inputs:
      - {id: policy, from: ../policy}
      - {id: calibration_report, from: ../fixed_hw_correction_calibration.calibration_report}
      - {id: original_report, type: data, source: outputs/runs/descriptive_secondary/fixed_prediction_decomposition_attempt001/decomposition.json}
      - {id: original_sessions, type: data, source: outputs/runs/descriptive_secondary/fixed_prediction_decomposition_attempt001/sessions.csv}
      - {id: original_bins, type: data, source: outputs/runs/descriptive_secondary/fixed_prediction_decomposition_attempt001/bins.csv}
      - {id: calibrated_sessions, type: data, source: outputs/runs/fixed_hw_correction_calibration/attempt001/decomposition_sessions.csv}
      - {id: calibrated_bins, type: data, source: outputs/runs/fixed_hw_correction_calibration/attempt001/direction_bins.csv}
      - {id: runner, type: data, source: outputs/tools/plot_fixed_prediction_components.py}
    outputs:
      - id: component_report
        type: report
        format: json
        inputs: [policy, calibration_report, original_report, original_sessions, original_bins, calibrated_sessions, calibrated_bins, runner]
        description: >-
          Component aggregates, all48 session rows, all720 session/bin rows,
          all32 fixed session contrasts, source paths and score reconstruction;
          companion PNG/PDF and interpretation preserve development-only claims.
        recipe:
          command: >-
            env OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1
            timeout 120s python3.12 -B outputs/tools/plot_fixed_prediction_components.py
            --out outputs/figures/fixed_prediction_components_attempt001
          resources: {cpus: 1, memory: 2Gi, time_limit: 3m}
  fixed_hw_correction_calibration:
    name: Calibrate one scalar on frozen HW corrections using other sessions
    description: >-
      One separate exposed-development successor. Freeze HWlambda1 and amplitudes
      0,0.25,0.5,0.75,1; select by other-fifteen-session equal-animal primary,
      exact ties nearest1. Preserve original45-comparison stop, practical margins,
      original identity and fixed HW/half-blend references. No neural source reads,
      decoder refits, independent penalty amendment, new search or confirmation.
    inputs:
      - {id: policy, from: ../policy}
      - {id: protocol, type: data, source: outputs/paper_plan.md}
      - {id: prior_report, from: ../adaptive_search.development_report}
      - {id: hw_banks, type: data, source: outputs/runs/adaptive_search/primary_history_repeatability_weight_control_attempt002}
      - {id: w_banks_for_replay, type: data, source: outputs/runs/adaptive_search/primary_repeatability_weight_control_attempt001}
      - {id: hw_summary, type: data, source: outputs/runs/adaptive_search/primary_history_repeatability_weight_summary_attempt002/primary_history_repeatability_weight.json}
      - {id: blend_summary_and_predictions, type: data, source: outputs/runs/adaptive_search/primary_history_blend_summary_attempt001}
      - {id: runner, type: data, source: outputs/tools/calibrate_fixed_hw_correction.py}
    outputs:
      - id: calibration_report
        type: report
        format: json
        inputs: [policy, protocol, prior_report, hw_banks, w_banks_for_replay, hw_summary, blend_summary_and_predictions, runner]
        description: >-
          Complete sixteen-session scalar policy, five-cell banks, frozen reference
          contrasts, both animals, fixed-prediction omissions and literal duplicates.
          Selected arrays and every direction/bin decomposition remain available.
          One successor comparison; no increment to original stopped search.
        recipe:
          command: >-
            env OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1 NUMEXPR_NUM_THREADS=1
            timeout 210s python3.12 -B outputs/tools/calibrate_fixed_hw_correction.py
            --out outputs/runs/fixed_hw_correction_calibration/attempt001 --max-seconds 180
          resources: {cpus: 1, memory: 2Gi, time_limit: 4m}
  source_support:
    name: Establish original-source identities and structural support
    description: >-
      All sixteen M1 session candidates, native time/event conventions,
      guide-based feature meanings, trial identities and exposed evidence role.
      Spike integer validity is not a primary-kinematic eligibility gate.
    inputs:
      - {id: datasets, from: ../datasets}
    outputs:
      - id: source_report
        type: report
        format: json
        inputs: [datasets]
        recipe:
          command: >-
            python3 outputs/tools/source_adapter.py
            --source "$OAK/data/br_autoresearch_data/sensorimotor_lfp/dryad-xd2547dkt-v5-payload/source"
            --out outputs/runs/source_support/attempt002
          resources: {cpus: 1, memory: 4Gi, time_limit: 10m}
  publication_reproduction:
    name: Reproduce fixed M1 population and velocity publication analyses
    description: >-
      Run unchanged pinned fCCA and vel_decoder with the historical TrialData
      compatibility revision. The first full fifty-split exposed M1 session
      measures cost and reference execution; it cannot establish the complete
      sixteen-session paper result. Preserve all-trial PCA and the Y-only cubic
      mapping as reproduction semantics, never as primary analysis choices.
      Reuse the completed first session and execute fifteen remaining sessions
      in five finite three-session groups. Apply the fixed scoped M1 comparison;
      first-session completion alone is not the benchmark decision. A technical
      recovery runs only the unfinished Chewie_20150313 session in fresh attempt004
      paths with unchanged seed, trials, functions and per-session MATLAB bound.
    inputs:
      - {id: goal, from: ../goal}
      - {id: source_report, from: ../source_support.source_report}
      - {id: comparison, from: ../publication_comparison}
    outputs:
      - id: reproduction_report
        type: report
        format: json
        inputs: [goal, source_report]
        recipe:
          command: >-
            python3 outputs/tools/run_publication_reproduction.py
            --source "$OAK/data/br_autoresearch_data/sensorimotor_lfp/dryad-xd2547dkt-v5-payload/source"
            --trial-table outputs/runs/source_support/attempt002/trial_identity.csv
            --session Mihili_20140217
            --work "$SCRATCH/br_autoresearch/episode05_sensorimotor_lfp/reference_Mihili_20140217_attempt002"
            --out outputs/runs/publication_reproduction/Mihili_20140217_attempt002
            --matlab /share/software/user/restricted/matlab/R2022b/bin/matlab
          resources: {cpus: 1, memory: 8Gi, time_limit: 30m}
      - id: remaining_session_reports
        type: report
        format: json
        inputs: [goal, source_report, comparison]
        recipe:
          command: sbatch --parsable outputs/tools/publication_reproduction_attempt003.sbatch
          resources: {cpus: 1, memory: 8Gi, time_limit: 30m}
      - id: benchmark_report
        type: report
        format: json
        inputs: [goal, source_report, comparison]
        recipe:
          command: >-
            python3 outputs/tools/summarize_publication_reproduction.py
            --first-session outputs/runs/publication_reproduction/Mihili_20140217_attempt002
            --remaining-root outputs/runs/publication_reproduction/remaining_sessions_attempt003
            --chewie-20150313-recovery outputs/runs/publication_reproduction/remaining_sessions_attempt004/Chewie_20150313
            --out outputs/runs/publication_reproduction/comparison_attempt001
            --split-bootstrap
          resources: {cpus: 1, memory: 2Gi, time_limit: 10m}
      - id: recovered_chewie_20150313_report
        type: report
        format: json
        inputs: [goal, source_report, comparison]
        description: >-
          One unchanged1038-trial session in a fresh directory after its grouped
          job timed out. Original reports and partial artifacts are preserved.
          All other completed sessions are reused; no scientific trial increment.
        recipe:
          command: sbatch --parsable outputs/tools/publication_reproduction_attempt004.sbatch
          resources: {cpus: 1, memory: 8Gi, time_limit: 40m}
  adaptive_search:
    name: Compare global LFP policies with grouped nested session selection
    description: >-
      Preserve the open feature/model grammar, minimum model set, 28–64 valid
      trials, 12-trial patience, paired nulls, control fraction, two adaptive
      rounds and two leader-challenger comparisons. Fit every transformation
      without the evaluated direction; summarize sessions within both animals.
      Benchmark acceptance precedes primary execution. The complete mean-LMP
      recipe is retained as the first negative scientific trial. Three adopted
      full-channel LMP/low/high ridge recipes use the full unwhitened PCA-span
      equivalent direct solve without numerical PCA or rank truncation. All
      other falsifiers and influence requirements still gate any promotion.
    inputs:
      - {id: policy, from: ../policy}
      - {id: source_report, from: ../source_support.source_report}
      - {id: reproduction_report, from: ../publication_reproduction.benchmark_report}
      - {id: primary_recipe, from: ../primary_recipe}
      - {id: primary_runner, type: data, source: outputs/tools/run_primary_reference.py}
      - {id: primary_banks, type: data, source: outputs/runs/adaptive_search/primary_reference_attempt001}
