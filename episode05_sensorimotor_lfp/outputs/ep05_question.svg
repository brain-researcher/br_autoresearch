<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">EP05 scientific concept figure</title>
  <desc id="desc">Synthetic concept mockup showing two reaches to the same target, the trial-specific residual that LFP must predict, three competing explanations, and four bounded scientific interpretations.</desc>
  <defs>
    <style type="text/css">
      .bg{fill:#f7f9fc}.panel{fill:#fff;stroke:#94a3b8;stroke-width:1.5;rx:15}.card{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.3;rx:10}
      .bluebox{fill:#eff6ff;stroke:#60a5fa;stroke-width:1.5;rx:10}.orangebox{fill:#fff7ed;stroke:#fb923c;stroke-width:1.5;rx:10}.greenbox{fill:#ecfdf5;stroke:#34d399;stroke-width:1.5;rx:10}.purplebox{fill:#faf5ff;stroke:#c084fc;stroke-width:1.5;rx:10}.redbox{fill:#fef2f2;stroke:#f87171;stroke-width:1.5;rx:10}
      .title{font-family:Arial,sans-serif;font-size:25px;font-weight:700;fill:#0f172a}.head{font-family:Arial,sans-serif;font-size:20px;font-weight:700;fill:#0f172a}.sub{font-family:Arial,sans-serif;font-size:15px;font-weight:700;fill:#334155}.text{font-family:Arial,sans-serif;font-size:14px;fill:#334155}.small{font-family:Arial,sans-serif;font-size:13px;fill:#475569}.tiny{font-family:Arial,sans-serif;font-size:13px;fill:#64748b}
      .axis{stroke:#94a3b8;stroke-width:1.5;fill:none}.template{stroke:#94a3b8;stroke-width:3;stroke-dasharray:7 6;fill:none}.blue{stroke:#2563eb;stroke-width:4;fill:none}.orange{stroke:#ea580c;stroke-width:4;fill:none}.green{stroke:#059669;stroke-width:3;fill:none}.purple{stroke:#7e22ce;stroke-width:3;fill:none}.thinblue{stroke:#2563eb;stroke-width:2.5;fill:none}.thinorange{stroke:#ea580c;stroke-width:2.5;fill:none}.cross{stroke:#dc2626;stroke-width:3}.arrow{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
  </defs>
  <rect class="bg" width="1500" height="900"/>
  <text x="750" y="38" text-anchor="middle" class="title">EP05 — Does the LFP explain why this reach differed from the expected reach?</text>
  <rect x="560" y="49" width="380" height="29" rx="15" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="750" y="69" text-anchor="middle" class="small">CONCEPT MOCKUP · SYNTHETIC PATTERNS · NOT RESULTS</text>

  <rect x="20" y="92" width="455" height="600" class="panel"/>
  <text x="40" y="126" class="head">A  Same target, different reaches?</text>
  <text x="40" y="151" class="small">Same direction and elapsed time; individual paths still differ.</text>
  <line x1="63" y1="350" x2="405" y2="350" class="axis"/><line x1="63" y1="350" x2="63" y2="184" class="axis"/>
  <circle cx="397" cy="202" r="12" fill="#fff" stroke="#f59e0b" stroke-width="3"/>
  <path d="M72 340 C165 319 249 248 397 202" class="template"/>
  <path d="M72 340 C165 350 258 286 397 202" class="blue"/>
  <path d="M72 340 C151 269 264 196 397 202" class="orange"/>
  <text x="76" y="374" class="small">same start</text><text x="354" y="185" class="small">same target</text>
  <g transform="translate(42,397)">
    <rect x="0" y="0" width="390" height="80" class="bluebox"/>
    <text x="14" y="24" class="sub">Trial A</text><path d="M88 45 C110 18 134 68 156 40 S199 19 222 49 S266 69 289 37 S331 20 369 44" class="thinblue"/>
    <text x="14" y="64" class="tiny">paired LFP</text>
  </g>
  <g transform="translate(42,488)">
    <rect x="0" y="0" width="390" height="80" class="orangebox"/>
    <text x="14" y="24" class="sub">Trial B</text><path d="M88 45 C112 64 135 17 160 49 S205 68 229 32 S274 16 300 51 S343 64 369 37" class="thinorange"/>
    <text x="14" y="64" class="tiny">paired LFP</text>
  </g>
  <rect x="42" y="585" width="390" height="72" class="card"/>
  <line x1="62" y1="614" x2="105" y2="614" class="template"/><text x="116" y="619" class="small">direction × time expectation</text>
  <line x1="62" y1="638" x2="105" y2="638" class="blue"/><text x="116" y="643" class="small">individual observed reach</text>

  <rect x="490" y="92" width="485" height="600" class="panel"/>
  <text x="510" y="126" class="head">B  What must the LFP predict?</text>
  <text x="510" y="151" class="small">Subtract the training-fit expectation; predict the held-out residual.</text>
  <g transform="translate(520,172)">
    <circle cx="64" cy="64" r="45" fill="none" stroke="#cbd5e1" stroke-width="2"/>
    <g stroke="#2563eb" stroke-width="4"><line x1="64" y1="19" x2="64" y2="5"/><line x1="96" y1="32" x2="107" y2="21"/><line x1="109" y1="64" x2="123" y2="64"/><line x1="96" y1="96" x2="107" y2="107"/><line x1="64" y1="109" x2="64" y2="123"/><line x1="32" y1="96" x2="21" y2="107"/><line x1="19" y1="64" x2="5" y2="64"/></g>
    <line x1="32" y1="32" x2="21" y2="21" stroke="#f97316" stroke-width="5"/>
    <text x="64" y="148" text-anchor="middle" class="small">fit 7 directions</text><text x="64" y="167" text-anchor="middle" class="small">test the 8th</text>
  </g>
  <path d="M650 236L700 236" class="arrow"/>
  <g transform="translate(714,168)">
    <rect x="0" y="0" width="225" height="160" class="card"/>
    <text x="112" y="26" text-anchor="middle" class="sub">Residual trajectory</text>
    <line x1="24" y1="75" x2="205" y2="75" class="axis"/>
    <path d="M24 75 C55 38 91 119 125 69 S168 38 205 79" class="thinblue"/>
    <path d="M24 75 C55 101 89 45 126 82 S168 109 205 67" class="thinorange"/>
    <text x="24" y="112" class="small" fill="#2563eb">x residual</text><text x="124" y="112" class="small" fill="#ea580c">y residual</text>
    <text x="112" y="142" text-anchor="middle" class="tiny">observed − direction/time expectation</text>
  </g>
  <text x="732" y="355" text-anchor="middle" class="sub">Freeze the prediction; swap only trial identity</text>
  <g transform="translate(518,378)">
    <rect x="0" y="0" width="200" height="186" class="greenbox"/>
    <text x="100" y="27" text-anchor="middle" class="sub">Correct pairing</text>
    <path d="M22 66 C44 35 67 92 92 58 S137 35 176 68" class="thinblue"/>
    <path d="M22 128 C45 96 67 153 92 119 S137 96 176 129" class="thinblue"/>
    <path d="M100 79L100 104" class="arrow"/>
    <text x="100" y="171" text-anchor="middle" class="small">LFPᵢ → residualᵢ</text>
  </g>
  <text x="735" y="471" text-anchor="middle" class="head">vs</text>
  <g transform="translate(750,378)">
    <rect x="0" y="0" width="200" height="186" class="redbox"/>
    <text x="100" y="27" text-anchor="middle" class="sub">Wrong-trial swap</text>
    <path d="M22 66 C44 35 67 92 92 58 S137 35 176 68" class="thinblue"/>
    <path d="M22 128 C45 153 69 95 96 132 S139 151 176 115" class="thinorange"/>
    <line x1="76" y1="82" x2="124" y2="116" class="cross"/><line x1="124" y1="82" x2="76" y2="116" class="cross"/>
    <text x="100" y="171" text-anchor="middle" class="small">same prediction → residualⱼ</text>
  </g>
  <rect x="518" y="584" width="432" height="73" class="card"/>
  <text x="734" y="610" text-anchor="middle" class="sub">Trial-specific information survives only if</text>
  <text x="734" y="634" text-anchor="middle" class="small">correct pairing predicts better than the complete wrong-trial null.</text>

  <rect x="990" y="92" width="490" height="600" class="panel"/>
  <text x="1010" y="126" class="head">C  Competing explanations</text>
  <g transform="translate(1010,151)">
    <rect x="0" y="0" width="450" height="147" class="card"/>
    <text x="16" y="27" class="head">N — No supported LFP gain</text>
    <path d="M24 83 C73 54 124 53 176 82" class="template"/><path d="M24 83 C73 57 124 56 176 82" class="thinblue"/>
    <line x1="220" y1="84" x2="416" y2="84" class="axis"/><path d="M220 84 C260 82 300 86 340 83 S390 85 416 84" class="thinblue"/>
    <text x="16" y="125" class="small">No candidate adds supported held-out prediction.</text>
  </g>
  <g transform="translate(1010,311)">
    <rect x="0" y="0" width="450" height="147" class="orangebox"/>
    <text x="16" y="27" class="head">D — Direction-level correction</text>
    <path d="M24 72 C72 38 121 103 176 66" class="thinblue"/><path d="M24 100 C72 67 121 130 176 94" class="thinblue"/>
    <path d="M230 63 C271 34 315 100 359 62" class="thinorange"/><path d="M230 106 C271 77 315 143 359 105" class="thinorange"/>
    <path d="M188 84L217 84" class="arrow"/>
    <text x="16" y="128" class="small">LFP helps a direction, but swapping trials does not hurt.</text>
  </g>
  <g transform="translate(1010,471)">
    <rect x="0" y="0" width="450" height="183" class="greenbox"/>
    <text x="16" y="27" class="head">I — Trial-specific LFP–reach link</text>
    <path d="M24 70 C52 33 80 104 110 63 S160 37 192 74" class="thinblue"/><path d="M24 122 C55 144 80 83 112 126 S163 139 192 107" class="thinorange"/>
    <path d="M220 70 C248 33 276 104 306 63 S356 37 388 74" class="thinblue"/><path d="M220 122 C251 144 276 83 308 126 S359 139 388 107" class="thinorange"/>
    <path d="M199 94L216 94" class="arrow"/>
    <text x="16" y="154" class="small">Each LFP predicts its own residual; a trial swap breaks the match.</text>
  </g>

  <rect x="20" y="708" width="1460" height="158" class="panel"/>
  <text x="40" y="742" class="head">D  Scientific interpretation</text>
  <rect x="42" y="758" width="340" height="72" class="greenbox"/>
  <text x="212" y="783" text-anchor="middle" class="sub">Trial-specific link</text><text x="212" y="804" text-anchor="middle" class="small">Next: test whether low-frequency LFP</text><text x="212" y="821" text-anchor="middle" class="small">and spike residuals share the same signal.</text>
  <rect x="400" y="758" width="340" height="72" class="orangebox"/>
  <text x="570" y="783" text-anchor="middle" class="sub">Direction-level correction only</text><text x="570" y="804" text-anchor="middle" class="small">Predictive gain, but no evidence</text><text x="570" y="821" text-anchor="middle" class="small">of trial-specific information.</text>
  <rect x="758" y="758" width="340" height="72" class="card"/>
  <text x="928" y="783" text-anchor="middle" class="sub">No supported LFP gain</text><text x="928" y="804" text-anchor="middle" class="small">No candidate resolved LFP information beyond</text><text x="928" y="821" text-anchor="middle" class="small">direction and elapsed time.</text>
  <rect x="1116" y="758" width="340" height="72" class="purplebox"/>
  <text x="1286" y="783" text-anchor="middle" class="sub">Unresolved</text><text x="1286" y="804" text-anchor="middle" class="small">Wide uncertainty or inconsistent</text><text x="1286" y="821" text-anchor="middle" class="small">animals or sessions.</text>
  <text x="750" y="854" text-anchor="middle" class="tiny">Held-out-direction, offline prediction only — no causal, online-BCI, cross-session-weight-transfer, or new-animal claim.</text>
</svg>
