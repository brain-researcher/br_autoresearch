  <g id="text_17">
   <text style="font: 700 16px 'DejaVu Sans'; text-anchor: start" x="51.876" y="33.5415" transform="rotate(-0 51.876 33.5415)">EP05 · two conditional PLS comparisons</text>
  </g>
  <g id="text_18">
   <text style="fill: #555555; font: 10px 'DejaVu Sans'; text-anchor: start" x="51.876" y="47.52" transform="rotate(-0 51.876 47.52)">16 sessions · two animals · held-out directions · exposed development evidence</text>
  </g>
  <g id="text_19">
   <text style="fill: #444444; font: 9px 'DejaVu Sans'; text-anchor: start" x="51.876" y="382.536" transform="rotate(-0 51.876 382.536)">P − B asks whether paired projection construction helps when every head receives true fitting targets.</text>
  </g>
  <g id="text_20">
   <text style="fill: #444444; font: 9px 'DejaVu Sans'; text-anchor: start" x="51.876" y="401.544" transform="rotate(-0 51.876 401.544)">B − F asks whether true head targets help on the identical stored shuffled projections and penalties.</text>
  </g>
  <g id="text_21">
   <text style="fill: #444444; font: 9px 'DejaVu Sans'; text-anchor: start" x="51.876" y="420.552" transform="rotate(-0 51.876 420.552)">Positive values favor the first arm. These are separate conditional comparisons, not a causal decomposition.</text>
  </g>
  <g id="text_22">
   <text style="fill: #444444; font: 9px 'DejaVu Sans'; text-anchor: start" x="51.876" y="439.56" transform="rotate(-0 51.876 439.56)">P/B can differ in effective capacity. The eight matched draws are averaged losses, not biological replicates.</text>
  </g>
  <g id="text_23">
   <text style="fill: #444444; font: 9px 'DejaVu Sans'; text-anchor: start" x="51.876" y="458.568" transform="rotate(-0 51.876 458.568)">Two animals; no confidence intervals or population inference. Zero is the directional reference; no new margin is introduced.</text>
  </g>
