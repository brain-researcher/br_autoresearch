primary_test:
  unit: one_profile_per_region_per_session
  target: single_trial_spike_population_residual_only
  residual_definition: held_out_spike_response_minus_training_only_direction_by_time_mean
  profile_value: held_out_fraction_of_residual_activity_recovered_by_each_registered_lfp_feature_block
  profile_definition:
    selected_before_neural_scoring: "2026-10-10"
    residual: "R = (Y_evaluation - training_direction_time_mean) @ training_population_loadings"
    score: "S_block = 1 - sum((R - prediction_block)^2) / sum(R^2)"
    weighting: uniform_whole_trial_and_native_bin_rows_pool_all_population_coordinates
    denominator: common_zero_origin_training_template_residual_energy_for_every_block
    evaluation_recentering: false
    average_coordinatewise_scores: false
    clipping_or_denominator_epsilon: false
    zero_or_nonfinite_energy: unavailable_not_zero_or_failed_prediction
    component_positive_energy_gate_applies_to_primary: false
    paired_profile: exact_same_session_trials_directions_native_times_blocks_and_rank_with_independent_regional_axes
    signed_difference: M1_minus_PMd
  component_followup_may_redefine_primary: false
  directions:
    - train_mihili_test_chewie
    - train_chewie_test_mihili
  score: equal_mean_of_two_balanced_accuracies_minus_chance
  report_each_direction_separately: true
  signed_m1_minus_pmd_profile_must_agree_across_animals: true
  initial_classifier_conventions:
    selected_before_neural_scoring: "2026-10-11"
    shape: center_each_region_profile_across_its_declared_blocks_then_unit_L2
    prototype: equal_session_mean_of_normalized_source_rows_per_assigned_class_then_unit_L2
    prototype_score: cosine
    logistic_objective: mean_row_logloss_plus_half_lambda_times_squared_coefficient_norm
    logistic_intercept: unpenalized
    logistic_penalty: explicit_positive_candidate_choice
    logistic_solver: Newton_Armijo_maximum_100_iterations_40_line_search_halvings
    logistic_convergence: maximum_absolute_gradient_at_most_1e_minus_9
    exact_prediction_tie: abstain_label_and_half_credit_in_balanced_accuracy
    unavailable: whole_comparison_if_any_required_profile_or_prototype_has_zero_nonfinite_shape_or_optimizer_fails
    labels: explicit_complete_paired_session_labels_M1_1_PMd_0_or_declared_within_session_swap
    block_binding: physically_identical_ordered_blocks_across_every_source_and_target_profile
    target_fitted_transformation: false
  initial_comparisons_20261011:
    specification: outputs/paper_plan.md#october-11-initial-comparisons-and-development-references
    adopted_before_any_EP06_fit_or_score: true
    starting_ids: [starting_00, starting_01, starting_02, starting_03, starting_04, starting_05, starting_06, starting_07, starting_08, starting_09, starting_10, starting_11]
    unique_fit_ids: [starting_00, starting_02, starting_03, starting_04, starting_05, starting_09]
    all_initial_predictions_fixed_before_development_scoring: true
    calibration_outcomes_used_in_primary_starts: false
    future_model_menu_closed: false
  development_reference:
    magnitude_specification: outputs/paper_plan.md#october-11-magnitude-and-lmp-comparisons
    followup_specification: outputs/paper_plan.md#october-11-evidence-led-successors-and-first-recording-controls
    specification: outputs/paper_plan.md#october-11-initial-comparisons-and-development-references
    assignments: all_128_independent_within_session_paired_region_label_swaps
    ordering: three_Mihili_then_four_Chewie_in_declared_order
    source_label_dependent_steps: refit_for_each_distinct_source_assignment
    upper_tail: inclusive_count_divided_by_128_no_plus_one_for_exhaustive_reference
    undefined_assignment: whole_reference_unavailable_no_drop_redraw_or_imputation
    scope: fixed_candidate_conditional_diagnostic_not_selection_adjusted_or_directional_IUT
