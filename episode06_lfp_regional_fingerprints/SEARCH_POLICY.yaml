manuscript_scope:
  owner: EP07_history_and_population_components_paper
  EP06_role: recording_domain_frequency_rule_component_consequence
  exact_distinction: >-
    EP06 compares source-animal correct-domain pooled and swapped frequency
    rules on projected population activity. It does not estimate EP07's
    history-minus-today-only pairing increment or replace either primary test.
  access_order: >-
    Different session/trial roles can expose EP07 closed spikes. EP06 neural
    fitting/scoring on this corpus follows EP07 full freeze and single primary
    opening, unless the scientist approves compatible prospective joint roles
    before relevant scores. EP06 retains its own final freeze and one reserved
    opening; no sibling outcomes or fitted state enter EP07 development.
  evidence_scope: same_corpus_component_not_fresh_animal_or_day_replication
  ownership_decision: EP06_component_not_independent_generic_LFP_to_spikes_paper
  operative_contract: >-
    Manuscript integration itself leaves session/trial roles, residual primary,
    controls, component margins, support thresholds, model space and budgets
    unchanged. The explicit 2026-10-02 nomination and adopted 2026-10-10
    eleven-session amendments are recorded above. Existing resume authority
    persists; no EP06 role export, neural opening, test or job was performed by
    this adoption. EP07 freeze/opening prerequisites and budgets still apply.
  shared_exposure_record_before_fits: exact_session_trial_IDs_episode_roles_permitted_readers_actual_openings_freezes_and_information_transfers
  cross_episode_reserved_exposure: EP06_reserved_March3_October6_are_EP07_history_and_March7_October21_are_EP07_targets
  reader_boundary: procedural_not_OS_isolation

