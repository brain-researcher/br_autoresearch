episode: EP07
title: What do earlier recording days preserve - task structure or trial-specific coupling?
status: planned_not_run

scientific_question: >-
  After a new recording day provides a nominal 20 percent calibration sample,
  do three earlier days from the same animal, implant, and cortical region add
  predictive information about population spiking on untouched new-day trials?

paper_scope:
  owner: EP07 history-and-population-components paper
  component_study: >-
    EP06 supplies a separately specified recording-domain frequency-rule and
    population-component analysis, not an independent LFP-predicts-spikes paper.
  candidate_contribution: >-
    Earlier days add correct-versus-mismatched trial information beyond the
    equally tuned today-only model, after a training/calibration population
    bridge is frozen. Stable means, latent alignment, and absolute history
    residual prediction are not sufficient.
  outcome_separation: >-
    EP06 has different session and trial roles. Its outcomes and fitted state
    cannot enter EP07 development. On this corpus, EP06 scoring follows EP07's
    full freeze and single primary opening unless a scientist prospectively
    approves compatible joint roles before relevant score access. Component
    evidence remains same-corpus and cannot rescue the primary result.
  distinct_targets:
    EP05: trial-specific reach deviation
    EP07: history-added population-spike prediction and its explanation
    EP06: recording-domain frequency-rule component consequence
    EP08: acquisition-visible predictors of marginal electrode or trial value
  operative_rules: >-
    Primary day/trial roles, score, margins, calibration, model family, budgets,
    falsifiers, and held-out decision below are unchanged. Explanatory work
    remains a planned conditional follow-up and is not a new primary endpoint.

development_search_intent:
  direction: broad_adaptive_development_search_not_preselected_finalists
  candidate_scope: diverse_combinations_within_existing_declared_model_families
  starting_models_role: seeds_not_fixed_final_architecture_shortlist
  residual_architecture_chosen_before_development: false
  bridge_freeze_scope: each_candidate_fitting_fold_before_residual_fit_or_score
  mechanism_indicator_exploration_count_cap: null
  mechanism_indicator_examples: not_an_exhaustive_list
  benefit_forecast_selection: day_wise_crossfit_all_selection_scaling_and_tuning
  simple_final_explanation: desirable_not_a_search_prerequisite
  final_choices_frozen: before_applicable_held_out_or_new_day_evaluation
  primary_roles_margins_falsifiers_model_structural_limits_and_budgets: unchanged
  extra_execution_outcome_access_or_resources_authorized: false

primary_settings:
  m1_movement:
    region: M1
    window: 150 to 450 ms after movement onset
    native_bin_ms: 30
    bins: 10
  pmd_preparation:
    region: PMd
    window: 450 ms before the go cue up to the go cue
    native_bin_ms: 30
    bins: 15

recording_days:
  mihili:
    earlier_days: ["2014-02-17", "2014-02-18", "2014-03-03"]
    new_days: ["2014-03-04", "2014-03-06", "2014-03-07"]
  chewie_l:
    earlier_days: ["2016-09-29", "2016-10-05", "2016-10-06"]
    new_days: ["2016-10-07", "2016-10-14", "2016-10-21"]
  rules:
    - M1 and PMd from the same day always share the same role.
    - A new-day trial never enters an earlier-day fit.
    - Fitting never crosses animal, implant, or cortical-region boundaries.
    - Chewie-R is an implant sensitivity, not an independent animal.

new_day_trial_split:
  unit: whole behavioral trial within each day and reach direction
  ordinary_seed: ep07-target-role-split-v1
  method: >-
    Shuffle once with the predeclared seed, save the resulting table before
    outcomes are examined, allocate 20 percent to calibration, and divide the
    remainder as evenly as possible between development and held-out testing.
  counts:
    calibration: floor(0.2*n + 0.5)
    development: floor((n - calibration)/2)
    held_out: n - calibration - development
  minimum_complete_trials_per_direction: 15
  minimum_counts_per_direction:
    calibration: 3
    development: 6
    held_out: 6
  reach_directions: 8
  no_role_changes_after_outcomes: true

data_rules:
  response: provider-released native-bin spike counts on the original scale
  inputs:
    - LMP
    - eight released power-band classes
  primary_representation: provider-preprocessed offline LFP features
  eligibility_uses_only:
    - successful reach status
    - matching animal, implant, day, direction, M1, and PMd identities
    - supported movement and go-cue windows
    - present finite LFP and spike values
    - nonnegative integer spike counts
  eligibility_must_not_use:
    - neural magnitude or variability
    - model residuals
    - candidate or comparison scores
  neuron_rule: >-
    Keep the consistently present neurons within each day and region without
    using outcome values; do not match neuron identities across days.

models:
  lfp_representation:
    - moments and quantiles across electrodes
    - robust histograms
    - low-rank permutation-invariant set encoder
  population_rank: [4, 8, 12, 16]
  alignment:
    - none
    - behavior-guided orthogonal alignment
    - regularized correlation alignment
  direction_and_time_adjustment:
    - residualize
    - include as predictors
    - combine the two approaches
  earlier_day_weighting:
    - equal
    - reliability based
    - calibration similarity based
    - hierarchical shrinkage
    - leave-one-day stacking
  mapping:
    - ridge
    - elastic net
    - reduced-rank ridge
    - shallow two-layer network with width at most 64
  ensemble:
    maximum_models: 2
    members_must_already_be_evaluated: true
  excluded:
    - raw-waveform networks
    - non-native temporal summaries
    - cross-animal or cross-region inputs
    - matching numeric channel identities across days
    - a different winner for each session, animal, or setting
    - any choice based on held-out outcomes

comparisons:
  direction_time_mean: >-
    Mean response for reach direction and native time bin, estimated from the
    new day's calibration trials only.
  today_only_model: >-
    Equally tuned model using the same new-day calibration and development
    opportunities but no earlier-day observations or fitted state.
  history_assisted_model: >-
    Model using the three earlier days plus the same new-day calibration data.
  requirement: The history-assisted model must beat both comparisons.

primary_measure:
  metric: joint R2_SSE across all held-out trials, native bins, and eligible neurons
  negative_values_are_reported: true
  averaging:
    - compute the difference for each new day and each comparison
    - average the three days within each animal
    - give Mihili and Chewie-L equal weight
    - keep M1 and PMd separate
  meaningful_margin_r2: 0.01

search_budget:
  paired_streams:
    - history-assisted
    - today-only
  starting_models_per_stream: 16
  adaptive_successor_pairs:
    minimum_valid: 2
    maximum_attempted: 14
  planned_alternative_explanation_pairs: 10
  evaluations_per_stream:
    minimum: 28
    maximum: 40
  total_evaluations:
    minimum: 56
    maximum: 80
  post_starting_check_fraction_minimum: 0.4167
  patience:
    consecutive_valid_pairs: 7
    improvement_r2: 0.002
    note: This controls search duration and is not the scientific effect threshold.
  retry_limits:
    same_model_attempts: 2
    total_infrastructure_retries: 12
  resources:
    hardware: CPU only
    aggregate_cpu_hours: 800
    wall_clock_hours: 96
    concurrent_cores: 32
    temporary_storage_gb: 500

planned_alternative_explanation_checks:
  - shuffle earlier-day labels
  - break earlier-day trial correspondence
  - break calibration-trial correspondence
  - remove earlier-day information
  - retain only the direction-and-time template
  - replace learned source weights with equal weights
  - omit earlier-day position 1
  - omit earlier-day position 2
  - omit earlier-day position 3
  - remove the first active optional component in a predeclared order

additional_checks:
  simulated_cases:
    - stable relationship
    - drifting relationship
    - no relationship
    - shifted latent scale
  data_separation: >-
    Demonstrate once that development and held-out spike targets cannot enter
    candidate fitting.
  failed_scientific_check: The selected model is ineligible; do not substitute a runner-up.

held_out_evaluation:
  timing: after all model and analysis choices are final
  openings: 1
  uncertainty:
    method: paired whole-trial bootstrap within day and reach direction
    samples: 9999
    seed: 7007999
  multiplicity:
    method: one-sided Holm across M1 and PMd
    familywise_alpha: 0.05
  support_requires:
    - improvement greater than 0.01 R2 against both comparisons
    - positive mean improvement in both animals
    - positive improvement on at least two of three new days in each animal
    - positive result after omitting each new day in turn
    - all planned scientific and data-separation checks pass

possible_results:
  - support in M1 only
  - support in PMd only
  - support in both settings
  - positive but ambiguous or insufficiently robust
  - no model clears the prespecified rule
  - study incomplete because required search or resources were not completed
  - study invalid because data separation or inference failed

follow_up_if_primary_result_supports_transfer:
  question: >-
    Does earlier-day information transfer only an average reach response or a
    trial-specific LFP-population relationship after direction and time are removed?
  frozen_population_bridge:
    fitting_data: >-
      Unresidualized spike responses from earlier-day training trials and the
      new day's calibration trials only, within animal, implant, and region.
    anchors: >-
      Direction-by-native-time response averages in common condition cells,
      computed only from the permitted fitting or calibration trials.
    learned_objects:
      - within-day population bases
      - the mapping from each earlier-day coordinate system to the new day
      - the new-day loading used to reconstruct native-neuron residuals
    freeze_rule: >-
      Freeze all three objects before fitting or scoring a residual predictor.
      Development and held-out spike outcomes cannot define or update them.
    important_ordering: >-
      Learn the bridge before residualization. Subtracting direction-by-time
      averages first would set the proposed behavioral anchors to zero.
    identifiability:
      candidate_ranks_in_order: [16, 12, 8, 4]
      common_cells_required: all 8 directions and at least 8 native time bins
      common_cells_minimum: 64
      common_cells_per_latent_dimension_minimum: 4
      centered_anchor_rank_must_reach_candidate_rank: true
      centered_anchor_condition_number_maximum: 30
      cross_day_anchor_singular_value_ratio_minimum: 0.05
      anchor_matrix_A_day: >-
        The K-by-r matrix of unresidualized direction-by-native-time mean
        anchors, K at least 64, projected into day d's permitted population
        basis and centered across anchor rows.
      cross_day_support_matrix: >-
        Q_source transpose times Q_target, where A_day = Q_day R_day is the
        thin QR factorization at the candidate rank.
      singular_value_ratio: sigma_min_cross_day_support_matrix_divided_by_sigma_max
      selection_rule: >-
        For each new day and region, use the largest candidate rank that passes
        every gate for the new day and all three source-to-new-day links. The
        gates use fitting and calibration responses only, never development or
        held-out scores.
      if_no_rank_passes: >-
        The aligned residual comparison is unavailable for that day and region;
        do not drop only the inconvenient source day or relax a gate.
  residual_test:
    means: >-
      Estimate direction-and-time means separately within each day from that
      day's permitted training or calibration trials.
    fitting: >-
      Remove those means from LFP inputs and spike targets, project spike
      residuals through the frozen population bridge, and fit capacity-matched
      history-assisted and today-only residual predictors.
    predictor_must_not_receive:
      - uncentered neural responses
      - direction or time labels
      - direction-by-time mean values or templates
      - development or held-out spike outcomes
    scoring: >-
      Score predictions against held-out native-neuron spike residuals. Report
      coordinate-space prediction only as a supporting diagnostic.
  held_out_trial_identity_test:
    correct_pair: >-
      Pair each fixed history-assisted and today-only held-out prediction with
      the spike residuals from the LFP trial that produced it.
    mismatched_pair: >-
      With fitted objects and predictions fixed, apply the identical whole-
      trial derangement to both prediction sets within the same new day,
      region, and reach direction. Preserve every time bin and forbid an
      original trial identity from pairing with itself.
    score: joint native_neuron residual R2_SSE across directions trials and native time bins
    correct_increment: history_correct_score_minus_today_only_correct_score
    mismatch_increment_per_derangement: history_mismatch_score_minus_today_only_mismatch_score_under_the_same_derangement
    mismatch_bank:
      draws: 9999
      seed: ep07-residual-trial-identity-v1
      operation: paired whole_trial_derangement_applied_identically_to_history_and_today_only_within_each_day_region_and_direction
      self_pairs_allowed: false
      fitted_objects_or_predictions_refit: false
    null_center: arithmetic_mean_of_the_9999_mismatch_increment_scores
    effect: correct_increment_minus_mismatch_increment_center
    equivalent_effect: history_pairing_gain_minus_today_only_pairing_gain
    absolute_history_correct_minus_mismatch_role: diagnostic_only
    practical_margin_R2: 0.01
    shared_mean_error_control: >-
      Correct and mismatched pairs use exactly the same training/calibration
      mean estimates, and the same derangement is applied to both model streams.
      A shared mean error or pairing signal already available to today-only is
      therefore retained on both sides of the incremental comparison.
    interpretation: >-
      A history residual gain without an incremental pairing advantage over
      today-only does not show that earlier days add same-trial information; it
      establishes residual predictive benefit only. Shared mean-estimation
      error or aligned population geometry remain possible, not identified,
      explanations. Failure to clear a margin, especially with imprecise
      evidence, does not establish mean-only transfer or absence of coupling.
    aggregation: >-
      Compute one effect per new day and region, average the three days equally
      within animal, then average Mihili and Chewie-L equally. M1 and PMd remain
      separate.
    uncertainty:
      draws: 9999
      resampling_unit: paired whole held_out trials within new day and direction
      keep_native_time_bins_and_neurons_together: true
      refit_frozen_objects: false
      mismatch_center_recomputed_inside_every_bootstrap_draw: true
      same_fixed_seed_derangement_bank_used_for_both_model_streams: true
      bootstrap_draw_without_a_self_free_derangement: adverse_infinite_tail_not_redrawn
      requirement: >-
        Simultaneous one-sided lower bounds for both the history-minus-today-only
        residual gain and the incremental trial-identity gain must exceed 0.01 R2.
      multiplicity: one_sided_Holm_across_M1_and_PMd_at_familywise_alpha_0p05
    invalid_cell_rule: >-
      Every one of the eight directions must retain at least six held-out trials.
      Otherwise the explanatory comparison for that day and region is unavailable;
      directions or trials cannot be dropped after their scores are known.
  discriminating_prediction: >-
    If earlier days add reusable trial-specific coupling, history's correct-
    versus-mismatch pairing gain will exceed today-only's pairing gain after the
    bridge is frozen. If shared calibration-mean error, today-only pairing
    information, or average aligned geometry explains the score, that
    incremental gain will not clear its margin. Failure to clear the margin
    alone does not identify which explanation holds.
  data_requirements:
    - verified simultaneous LFP and spike trial identities
    - unresidualized training and calibration spike responses
    - complete common direction-by-time cells for alignment
    - at least six held-out trials per direction after eligibility filtering
  current_availability: >-
    The selected public release is described as containing simultaneous LFP and
    spike recordings, and the planned minimum gives at least six held-out trials
    per direction. Prepared episode views are still absent, so correspondence,
    condition support, and bridge rank must be verified before scoring.
  signal_controls:
    - LMP or low-frequency features only
    - exclude all 100 to 400 Hz power
    - account for electrode proximity to recorded units
    - match spike-quality and channel-support summaries
  prediction: >-
    Use only earlier days and new-day calibration to predict whether history
    will help, then test that prediction on genuinely new recording days.

claim_limits:
  supported_claim: >-
    Earlier days add predictive information after limited same-day calibration
    in the supported setting, within these two animals and six fixed new days.
  not_supported:
    - stable single-neuron or electrode identity
    - causal influence of LFP on spiking
    - transfer to an unseen session, animal, implant, or raw-voltage pipeline
    - online or clinical BCI improvement
    - a general preparation-versus-execution difference
