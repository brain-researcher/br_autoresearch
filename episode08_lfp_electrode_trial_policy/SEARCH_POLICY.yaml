episode: EP08
title: Can a short pilot tell us what to record next?
status: planned_not_run

scientific_question: >-
  After 16 pilot reaches recorded on all eligible electrodes, can one common
  rule choose 4, 8, or 16 electrodes and the direction of each additional
  calibration trial, then beat random, spatial, and signal-quality rules at
  exactly the same electrode and trial budget?

data:
  primary_animals: [Mihili, Chewie-L]
  sessions_per_animal: 6
  development_sessions_per_animal: 4
  held_sessions_per_animal: 2
  primary_region: M1
  movement_window: 150 to 450 ms after movement onset
  sensitivity_only: Chewie-R implant
  evidence_strength: internal held-session test in an already used public corpus
  external_claim_requires: newly collected or sequestered sessions from a third animal

common_pilot:
  trials: 16
  reach_directions: 8
  trials_per_direction: 2
  electrodes_visible: all structurally eligible physical electrodes
  evaluation_trials_excluded: true

acquisition_choices:
  electrode_counts: [4, 8, 16]
  additional_trial_counts: [32, 64, 128]
  complete_grid_cells: 9
  electrode_choice_timing: once, immediately after the common pilot
  later_electrode_addition: false
  historical_nonpilot_backfill: false
  trial_action: choose one of the eight reach directions
  within_direction_order: >-
    Use one ordinary seeded order chosen before policy scores; a direction
    choice reveals only the next recorded trial in that order.
  lookahead_steps_maximum: 2
  pilot_cost_reported_separately: true

information_available_at_choice_time:
  before_electrode_selection:
    - static electrode geometry and quality information
    - summaries from the common all-electrode pilot
  during_trial_selection:
    - the retained electrode set
    - LFP and spike targets from calibration trials already acquired
    - current direction counts and calibration fit summaries
  never_available:
    - future acquisition trials
    - untouched evaluation spike targets
    - realized future electrode or trial value
    - a session-specific winning method

electrode_selectors:
  - reliability and signal quality
  - spatial diversity and array coverage
  - redundancy-aware selection
  - simple linear learned ranking
  - shallow learned ranking
  - offline contextual ranking

trial_allocators:
  - direction balanced
  - uncertainty weighted
  - residual diversity
  - information gain
  - bounded upper confidence

shared_prediction_model:
  decoder: reduced-rank ridge
  lfp_features:
    - LMP
    - 100 to 200 Hz power
    - 200 to 400 Hz power
  same_decoder_capacity_for_every_method: true
  same_population_target_for_every_method: true
  same_evaluation_trials_for_every_method: true

comparisons:
  - repeated uniform-random electrodes with balanced-random trials
  - geometry-only farthest-first electrodes
  - reliability-only electrode ranking
  - full-resource decoder as a ceiling check
  - development-only hindsight best case as an upper bound

primary_measure:
  metric: held-out R2_SSE difference from the strongest cost-matched simple rule
  aggregation:
    - give all nine grid cells equal weight within session
    - average sessions within each animal
    - give Mihili and Chewie-L equal weight
  meaningful_improvement_r2: 0.005
  required_scarce_resource_cells:
    - 4 electrodes and 32 additional trials
    - 8 electrodes and 64 additional trials
  report_every_grid_cell_session_and_animal: true
  keep_electrode_and_trial_axes_separate: true

search_budget:
  diverse_family_coverage_evaluations_minimum: 20
  valid_evaluations_minimum: 40
  valid_evaluations_maximum: 112
  patience_after_minimum:
    consecutive_valid_evaluations: 20
    score_improvement_r2: 0.005
    also_continue_for_new_feasible_utility_robustness_cost_point: true
  failed_engineering_runs_retry_maximum: 16
  post_coverage_alternative_check_fraction_minimum: 0.40
  adaptive_successor_cycles_minimum: 2
  incumbent_challenger_decisions_minimum: 2
  resources:
    hardware: CPU only
    aggregate_cpu_hours: 1200
    gpu_hours: 0
    wall_clock_hours: 120
    concurrent_cores: 48
    memory_gb: 256
    temporary_storage_gb: 750

required_family_coverage:
  - every electrode-selector family
  - every trial-allocator family
  - repeated simple comparisons
  - every planned alternative-explanation check

alternative_explanation_checks:
  - repeated random choices with matched action counts and compute
  - permuted development electrode-value labels
  - shuffled electrode locations for spatial methods
  - remove reliability, diversity, learned score, and adaptive trial components in turn
  - redundancy-matched and quality-matched comparisons
  - reverse animal transfer
  - omit each development session in turn
  - train on one animal and apply to the other
  - verify step by step that each decision used only information then available
  - low-frequency-only and spike-contamination sensitivities
  - saturating, spatially clustered, redundant, trial-limited, and null simulations

held_session_evaluation:
  timing: after one global method and all analysis choices are final
  evaluations: 1
  successful_primary_result_requires:
    - mean gain of at least 0.005 R2_SSE over the strongest cost-matched simple rule
    - positive mean gain in both primary animals
    - improvement in at least 3 of 4 held sessions
    - success at both prespecified scarce-resource cells in both animals
    - no material loss relative to the full-resource ceiling under the chosen equivalence margin
    - robustness to influential-session and leave-one-animal checks
    - every required alternative-explanation and information-timing check passes
  possible_results:
    - reproducible joint electrode-and-trial policy
    - positive but ambiguous or insufficiently robust result
    - no method clears the prespecified rule
    - study incomplete because required coverage or resources were not completed
    - analysis invalid because data separation or scoring failed

electrode_value_explanation:
  outcome: >-
    Increase in untouched-trial loss when one retained electrode is removed
    while calibration data and the decoder procedure remain unchanged.
  predictors_visible_in_pilot:
    - reliability and missingness
    - spatial coverage relative to the retained set
    - correlation or conditional variance relative to the retained set
    - the selected learned pilot score, if it survives primary controls
  development_method: whole-session cross-fitting
  decisive_comparison: prediction of removal value versus reliability alone

next_direction_explanation:
  outcome: >-
    Decrease in untouched-trial loss after adding the next prespecified trial
    from one legal reach direction to the current calibration state.
  predictors_visible_before_choice:
    - direction-wise calibration counts
    - cross-validated calibration error
    - uncertainty
    - residual diversity
  comparisons:
    - direction-balanced choice
    - random choice at the same point in the recorded order
  interpretation_limit: retrospective prediction, not a causal online intervention

resource_axis_explanation:
  report:
    - performance change from 4 to 8 electrodes at each trial count
    - performance change from 32 to 64 trials at each electrode count
    - interaction between electrode and trial steps
  forbidden_claim: an electrode equals a number of trials without a separate measured cost model

external_confirmation:
  required_source: independent third animal with compatible M1 data
  test_every_eligible_session: true
  must_predict:
    - conditional electrode-value ordering
    - next-direction value ordering
    - shape or prespecified steps of the nine-cell performance surface
    - matched-budget joint policy performance
  current_four_held_sessions_confirm_later_explanation: false

claim_limits:
  supported_claim: >-
    In these recordings, a common 16-trial pilot guides post-pilot electrode
    retention and calibration-trial allocation better than cost-matched simple
    rules under the supported budgets.
  not_supported:
    - from-scratch electrode placement
    - causal or biological electrode importance
    - measured power or bandwidth savings
    - a universal electrode count
    - real-time behavioral control
    - clinical BCI performance
    - generalization to a new animal without the third-animal test
