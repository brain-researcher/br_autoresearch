  internal_held_policy:
    name: One-shot selected protocols in four internal held sessions
    description: >-
      For the optional reference, apply unchanged aggregation, 0.005 R2_SSE margin, both-animal,
      three-of-four-session and scarce-resource requirements and required
      controls. Other selected branches need their own prospectively fixed
      decisions; none is invented here. Score only analyses selected before
      the one shared opening. These source-exposed sessions do not confirm an explanation
      selected after their outcomes. No partial results return to search.
    inputs:
      - {id: policy, from: ../policy}
      - {id: selection_report, from: ../development_search.selection_report}
    outputs:
      - {id: policy_report, type: report, format: json, inputs: [policy, selection_report]}
  conditional_electrode_value:
    name: Allowed-information prediction of conditional electrode-removal value
    description: >-
      Test the existing removal-loss labels and quality-matched swap contrasts
      under supported fitting information states, without requiring a policy
      winner or a 16-trial pilot, with session cross-fitting versus reliability. Additional named
      proxy scoring choices need a separate prospective amendment; this node
      does not activate those choices or open held outcomes.
    inputs:
      - {id: policy, from: ../policy}
      - {id: support_report, from: ../source_support.support_report}
    outputs:
      - {id: electrode_value_report, type: report, format: json, inputs: [policy, support_report]}
  repeatable_direction_value:
    name: Existing pre-choice prediction of repeatable next-direction benefit
    description: >-
      Branch every legal direction at supported frozen balanced states across
      prospectively specified ordinary replay orders; the original reference
      retains at least three explanation orders. Compare predictions with
      average realized loss benefit beyond balance and one lucky future trial.
      Future features and targets are not inputs to pre-choice predictions.
      Initial information state is open; the reference checkpoints/order
      requirements apply only to that reference. New branch replay support,
      proxy scores and margins remain prospective choices, not activated here.
    inputs:
      - {id: policy, from: ../policy}
      - {id: support_report, from: ../source_support.support_report}
    outputs:
      - {id: direction_value_report, type: report, format: json, inputs: [policy, support_report]}
  electrode_trial_coupling:
    name: Existing sensor-dependent trial ordering and factorial interaction
    description: >-
      Hold calibration trials fixed during quality-matched electrode swaps.
      Test predicted direction-order changes across states orders sessions and
      animals. The original reference retains its resolved interaction
      requirement; other branch decisions need prospective specification. Two additive
      component gains do not support a joint principle. Insufficient branch
      or swap support limits the claim without changing the policy decision.
    inputs:
      - {id: policy, from: ../policy}
      - {id: electrode_value_report, from: ../conditional_electrode_value.electrode_value_report}
      - {id: direction_value_report, from: ../repeatable_direction_value.direction_value_report}
    outputs:
      - {id: coupling_report, type: report, format: json, inputs: [policy, electrode_value_report, direction_value_report]}
  resource_axes:
    name: Existing separate electrode and trial resource-step explanation
    description: >-
      Report selected prospectively specified electrode and trial contrasts;
      the old nine-cell steps apply only to the reference. Include session
      and animal influence and actual initialization/later exposure. No common
      cost, power or bandwidth equivalence is inferred.
    inputs:
      - {id: policy, from: ../policy}
      - {id: selection_report, from: ../development_search.selection_report}
      - {id: policy_report, from: ../internal_held_policy.policy_report}
    outputs:
      - {id: resource_report, type: report, format: json, inputs: [policy, selection_report, policy_report]}
  external_animal_confirmation:
    name: Conditional planned third-animal explanation and policy confirmation
    description: >-
      Run only with a separately selected compatible newly sequestered source
      and prospective external protocol. No such third-animal source is
      currently available; Chewie-R is the same animal. Test conditional
      electrode value, direction value, coupling and policy transfer in every
      eligible session. This plan provides no execution or access authority.
    inputs:
      - {id: goal, from: ../goal}
      - {id: data_contract, from: ../data_contract}
      - {id: coupling_report, from: ../electrode_trial_coupling.coupling_report}
      - {id: resource_report, from: ../resource_axes.resource_report}
    outputs:
      - {id: external_report, type: report, format: json, inputs: [goal, data_contract, coupling_report, resource_report]}
  final_report:
    name: Development-only conclusion with initializer and evidence limits
    description: >-
      Synthesize the completed development comparisons at outputs/final_report.md
      with the machine-readable development summary. Average correspondence
      remains positive, but Mihili reverses in one initializer order and three
      of four mean-order session effects are nonpositive. Preserve this limited
      finding without a stable-policy, joint-principle or confirmation claim.
      The development-only terminal route consumes completed development
      evidence; it does not require or pretend to complete the unselected held,
      conditional-explanation or external-confirmation branches above. All four
      held sessions remain closed and any later held protocol needs a separate
      prospective decision. Optional 16-trial reference criteria and 0.005 margin
      do not transfer automatically; 0.001 is search resolution only.
    inputs:
      - {id: goal, from: ../goal}
      - {id: policy, from: ../policy}
      - {id: open_design, from: ../open_design}
      - {id: selection_report, from: ../development_search.selection_report}
      - {id: initializer_robustness_report, from: ../development_search.initializer_robustness_report}
      - {id: raw_initializer_report, from: ../development_search.initializer_raw_marginal_report}
      - {id: original_initializer_report, from: ../initializer_target_label_reference}
    outputs:
      - id: study_report
        type: report
        format: markdown
        inputs: [goal, policy, open_design, selection_report, initializer_robustness_report, raw_initializer_report, original_initializer_report]
        description: >-
          outputs/final_report.md: local development-only report and stopping
          rationale, with exact initializer contrasts, session/animal influence,
          claim limits, resource evidence and links to complete source reports
          and figure data. Companion outputs/development_summary.json records
          the adopted development_only_no_initializer_robust_policy route.
          Coordinator and independent scientific/stopping reviews passed;
          no held confirmation or canonical acceptance is claimed.
