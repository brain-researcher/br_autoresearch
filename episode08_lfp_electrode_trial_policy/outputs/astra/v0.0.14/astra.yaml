version: "0.0.14"
name: EP08 open information-value and acquisition experiment program
description: >-
  Experiments required by the EP08 contracts. Source support precedes
  separated data handoffs and neural scoring. Models summaries and information
  states remain open; the original 16-trial numerical protocol is an optional
  reference. The fixed random-subset baseline, five selectors and three
  direction-control, capacity, residual-selector, acquired-only, trial-allocation,
  arrival-order and mapping comparisons completed on eight development sessions.
  The mapping heuristic underperforms balance in both animals; its acquired-row
  grouping ablation reduced that loss without beating balance. A session-cross-
  fitted linear electrode ranker with three donor-label controls is adopted;
  donor supervision adds information/cost beyond matched target acquisition.
  Additional named explanatory scoring remains inactive and held sessions closed.
  One shared budget and held opening apply.
inputs:
  - {id: goal, type: data, source: GOAL.md}
  - {id: data_contract, type: data, source: DATASETS.md}
  - {id: policy, type: data, source: SEARCH_POLICY.yaml}
  - {id: open_design, type: data, source: outputs/open_exploration_design.md}
  - {id: development_recipe, type: data, source: outputs/development_comparison_proposal.md}
  - {id: selector_recipe, type: data, source: outputs/selector_comparison_proposal.md}
  - {id: direction_recipe, type: data, source: outputs/direction_confounding_proposal.md}
  - {id: capacity_recipe, type: data, source: outputs/representation_capacity_proposal.md}
  - {id: residual_selection_recipe, type: data, source: outputs/residual_selection_proposal.md}
  - {id: acquired_only_recipe, type: data, source: outputs/acquired_only_proposal.md}
  - {id: trial_allocation_recipe, type: data, source: outputs/trial_allocation_proposal.md}
  - {id: arrival_order_recipe, type: data, source: outputs/trial_arrival_order_proposal.md}
  - {id: mapping_recipe, type: data, source: outputs/mapping_variance_proposal.md}
  - {id: mapping_original_reference, type: data, source: outputs/runs/development_search/trial_allocation_attempt001/trial_allocation.json}
  - {id: mapping_arrival_reference, type: data, source: outputs/runs/development_search/arrival_order_attempt001/arrival_order.json}
  - {id: grouping_recipe, type: data, source: outputs/mapping_grouping_control_proposal.md}
  - {id: grouping_mapping_reference, type: data, source: outputs/runs/development_search/mapping_variance_attempt001/mapping_variance.json}
  - {id: learned_electrode_recipe, type: data, source: outputs/learned_electrode_value_proposal.md}
  - {id: learned_electrode_reference, type: data, source: outputs/runs/development_search/acquired_only_attempt001/acquired_only.json}
  - {id: reverse_animal_recipe, type: data, source: outputs/reverse_animal_electrode_value_proposal.md}
  - {id: reverse_animal_training, type: data, source: outputs/runs/development_search/learned_electrode_attempt001/learned_electrode_value.json}
  - {id: initializer_target_label_recipe, type: data, source: outputs/initializer_target_label_control_proposal.md}
  - {id: lmp_correspondence_recipe, type: data, source: outputs/lmp_only_correspondence_proposal.md}
  - {id: high_power_correspondence_recipe, type: data, source: outputs/high_power_correspondence_proposal.md}
  - {id: high_power_lmp_reference, type: data, source: outputs/runs/development_search/lmp_correspondence_attempt001/lmp_correspondence.json}
  - {id: high_power_completed_fits, type: data, source: outputs/runs/development_search/high_power_correspondence_attempt001/high_power_correspondence.json}
  - {id: initializer_target_label_reference, type: data, source: outputs/runs/development_search/initializer_target_label_control_attempt001/initializer_target_label_control.json}
  - {id: initializer_repeatability_recipe, type: data, source: outputs/initializer_repeatability_proposal.md}
  - {id: initializer_logdet_recipe, type: data, source: outputs/initializer_logdet_proposal.md}
  - {id: initializer_cv_utility_recipe, type: data, source: outputs/initializer_cv_utility_proposal.md}
  - {id: initializer_raw_marginal_recipe, type: data, source: outputs/initializer_raw_marginal_proposal.md}
  - {id: initializer_robustness_recipe, type: data, source: outputs/initializer_robustness_proposal.md}
  - {id: cv_utility_completed_pilot, type: data, source: outputs/runs/development_search/initializer_cv_utility_pilot_attempt001/initializer_cv_utility.json}
  - {id: initializer_conditional_recipe, type: data, source: outputs/initializer_conditional_gain_proposal.md}
  - {id: conditional_uniform_reference, type: data, source: outputs/runs/development_search/initializer_repeatability_attempt001/initializer_repeatability.json}
  - {id: conditional_completed_pilot, type: data, source: outputs/runs/development_search/initializer_conditional_pilot_attempt001/initializer_conditional_gain.json}
outputs:
  - {id: final_report, from: final_report.study_report}
analyses:
  source_support:
    name: Establish source roles and scientific support
    description: >-
      Confirm existing source requirements, twelve-session and animal identity,
      physical electrodes, geometry fallback, feature meanings, fixed
      population target, permitted fitting pool and separated evaluation.
      Establish support separately for offline value and sequential variants.
      Pilot and full-grid support apply only if the reference case is selected;
      lack of that support does not stop other supported branches. Determine
      replay and swap support only for claims that require those contrasts.
      No source is implied to be acquired by this plan.
    inputs:
      - {id: goal, from: ../goal}
      - {id: data_contract, from: ../data_contract}
      - {id: open_design, from: ../open_design}
      - id: completed_metadata
        type: data
        source: outputs/runs/source_support/attempt002/metadata_support.json
      - {id: development_recipe, from: ../development_recipe}
      - {id: initializer_robustness_recipe, from: ../initializer_robustness_recipe}
      - id: completed_trial_roles
        type: data
        source: outputs/runs/source_support/development_trial_roles_attempt001/development_trial_roles.json
    outputs:
      - id: support_report
        type: report
        format: json
        inputs: [goal, data_contract, open_design]
        recipe:
          command: >-
            python3 outputs/tools/source_support.py
            --source $OAK/data/br_autoresearch_data/sensorimotor_lfp/dryad-xd2547dkt-v5-payload/source
            --out $EP08_METADATA_REPORT
      - id: development_trial_roles
        type: report
        format: json
        inputs: [completed_metadata, open_design]
        recipe:
          command: >-
            python3 outputs/tools/prepare_development_trial_roles.py
            --metadata-report outputs/runs/source_support/attempt002/metadata_support.json
            --output-dir $EP08_TRIAL_ROLE_OUTPUT
      - id: initializer_robustness_roles
        type: report
        format: json
        inputs: [completed_metadata, completed_trial_roles, initializer_robustness_recipe]
        description: >-
          Metadata-only creation of24 separate session/order roles. Three
          ordinary seeded twelve-ID queues per direction remain entirely in
          the original96 fitting whitelist; unchanged40 evaluation IDs/order.
          Each first-four direction prefix is a new32-row initializer. Record
          all32/48/64/80/96 nested prefixes and original-style position-mod4
          metadata folds; actual later CV remains initializer-conditioned.
          Preserve old roles, never read neural values, redraw or select orders.
        recipe:
          command: >-
            timeout 90s python3.12 outputs/tools/initializer_robustness_roles.py
            --metadata-report outputs/runs/source_support/attempt002/metadata_support.json
            --trial-roles outputs/runs/source_support/development_trial_roles_attempt001/development_trial_roles.json
            --output-dir outputs/runs/source_support/initializer_robustness_roles_attempt001
          resources: {cpus: 1, memory: 1Gi, time_limit: 2m}
      - id: training_cost_pilot
        type: report
        format: json
        inputs: [completed_metadata, completed_trial_roles, development_recipe]
        recipe:
          command: >-
            python3 outputs/tools/training_cost_pilot.py
            --source-file $OAK/data/br_autoresearch_data/sensorimotor_lfp/dryad-xd2547dkt-v5-payload/source/Mihili_CO_20140217.mat
            --metadata-report outputs/runs/source_support/attempt002/metadata_support.json
            --trial-roles outputs/runs/source_support/development_trial_roles_attempt001/development_trial_roles.json
            --output-dir $EP08_COST_PILOT_OUTPUT
          resources: {cpus: 1, memory: 2Gi, time_limit: 10m}
  offline_information_value:
    name: Development information-state and conditional-value exploration
    description: >-
      Explore models temporal summaries fitting amounts coverage and declared
      training/calibration states without requiring a separate pilot or an
      acquisition-policy win. Separate fitting from evaluation, cross-fit
      transferred value labels by session and match decoder target and tuning
      when comparing selection value. No sequential-efficiency claim follows
      from access to the whole training pool. Endpoints and stopping decisions
      need prospective specification; this node does not activate them.
    inputs:
      - {id: policy, from: ../policy}
      - {id: open_design, from: ../open_design}
      - {id: support_report, from: ../source_support.support_report}
    outputs:
      - {id: offline_value_report, type: report, format: json, inputs: [policy, open_design, support_report]}
  simple_comparisons:
    name: Cost-matched random spatial reliability and fixed-trial comparisons
    description: >-
      Establish the existing simple rules, repeated random choices, common
      decoder and full-resource ceiling on development sessions with matched
      allowed information, actual initial and later exposure, target, decoder
      and tuning. A common 16-trial pilot is required only for the reference.
    inputs:
      - {id: policy, from: ../policy}
      - {id: support_report, from: ../source_support.support_report}
      - {id: development_recipe, from: ../development_recipe}
      - {id: trial_roles, from: ../source_support.development_trial_roles}
      - {id: training_cost_pilot, from: ../source_support.training_cost_pilot}
    outputs:
      - id: comparison_report
        type: report
        format: json
        inputs: [policy, support_report, development_recipe, trial_roles, training_cost_pilot]
        recipe:
          command: >-
            python3 outputs/tools/development_baseline.py
            --source-root $OAK/data/br_autoresearch_data/sensorimotor_lfp/dryad-xd2547dkt-v5-payload/source
            --metadata-report outputs/runs/source_support/attempt002/metadata_support.json
            --trial-roles outputs/runs/source_support/development_trial_roles_attempt001/development_trial_roles.json
            --max-seconds $EP08_SELECTED_COMPARISON_SECONDS
            --output-dir $EP08_DEVELOPMENT_BASELINE_OUTPUT
  development_search:
    name: Open bounded development acquisition search and controls
    description: >-
      Explore selectors allocators models summaries and initial information
      states; candidate menus are not exhaustive. Perform applicable controls
      within 40 to 112 valid evaluations and the existing patience and resource
      limits. Use whole-session cross-fitting and one global policy; preserve
      the original nine cells and four factorial combinations only when
      running the optional reference. New endpoints and stopping rules need
      specification before their first scored search; final choices and
      decisions are locked before one shared internal held-session opening.
      The completed first five selector panels motivate direction-only and
      within-direction alternatives. Completed D/W/R shows direction means
      outperform the raw selectors while residual ridge adds prediction beyond
      direction means. Temporal representation and model capacity have a
      completed three-panel recipe. Reduced-rank ridge leads in aggregate but
      its gain differs by animal. Completed residual marginal and conditional
      selection improve the matched random decoder in aggregate; conditional
      beats its within-direction permutation control but not marginal selection.
      Acquired-only initial selection completed one20cell comparison, bringing
      the total to16. Its modest heterogeneous performance gain uses greater
      initial observation cost. The adopted next comparison uses fixed-random
      electrodes for mean-value versus mean-error trial allocation with a
      balanced reference, frozen initial rank/alpha and common initial scoring
      normalization. Both allocator panels completed, bringing the total to18.
      Mean-value improves modestly in both animal means; mean-error is below
      balance in both means, with heterogeneous session effects. Initial/final
      models are shared. A three-order fixed-initializer robustness comparison
      completed one shared evaluation and zero new method families, bringing
      the total to19. Mean-value gain across the three orders is below0.001
      and reverses in some animal/order and omission summaries. The adopted
      mapping-informed successor uses acquired LFP design-index reduction on
      all four fixed orders, preserving initializer coordinates and penalty,
      decoder fairness and post-fit reference reuse. It is a dimensionless
      full-linear proxy, not calibrated uncertainty or a coupling claim.
      The completed mapping comparison is below balance in both animals,
      all eight session means and all four order aggregates. The adopted
      three-seed grouping ablation shuffles only acquired row-to-direction
      utility association, preserving actual counts, same-history global
      geometry and true decoder labels/targets. This is one alternative-
      explanation comparison, not a rescue or new named explanatory endpoint.
    inputs:
      - {id: goal, from: ../goal}
      - {id: policy, from: ../policy}
      - {id: comparison_report, from: ../simple_comparisons.comparison_report}
      - {id: selector_recipe, from: ../selector_recipe}
      - {id: direction_recipe, from: ../direction_recipe}
      - {id: capacity_recipe, from: ../capacity_recipe}
      - {id: residual_selection_recipe, from: ../residual_selection_recipe}
      - {id: acquired_only_recipe, from: ../acquired_only_recipe}
      - {id: trial_allocation_recipe, from: ../trial_allocation_recipe}
      - {id: arrival_order_recipe, from: ../arrival_order_recipe}
      - {id: mapping_recipe, from: ../mapping_recipe}
      - {id: mapping_original_reference, from: ../mapping_original_reference}
      - {id: mapping_arrival_reference, from: ../mapping_arrival_reference}
      - {id: grouping_recipe, from: ../grouping_recipe}
      - {id: grouping_mapping_reference, from: ../grouping_mapping_reference}
      - {id: learned_electrode_recipe, from: ../learned_electrode_recipe}
      - {id: learned_electrode_reference, from: ../learned_electrode_reference}
      - {id: reverse_animal_recipe, from: ../reverse_animal_recipe}
      - {id: reverse_animal_training, from: ../reverse_animal_training}
      - {id: initializer_target_label_recipe, from: ../initializer_target_label_recipe}
      - {id: lmp_correspondence_recipe, from: ../lmp_correspondence_recipe}
      - {id: high_power_correspondence_recipe, from: ../high_power_correspondence_recipe}
      - {id: high_power_lmp_reference, from: ../high_power_lmp_reference}
      - {id: high_power_completed_fits, from: ../high_power_completed_fits}
      - {id: initializer_target_label_reference, from: ../initializer_target_label_reference}
      - {id: initializer_repeatability_recipe, from: ../initializer_repeatability_recipe}
      - {id: initializer_logdet_recipe, from: ../initializer_logdet_recipe}
      - {id: initializer_cv_utility_recipe, from: ../initializer_cv_utility_recipe}
      - {id: initializer_raw_marginal_recipe, from: ../initializer_raw_marginal_recipe}
      - {id: initializer_robustness_recipe, from: ../initializer_robustness_recipe}
      - {id: initializer_robustness_roles, from: ../source_support.initializer_robustness_roles}
      - {id: cv_utility_completed_pilot, from: ../cv_utility_completed_pilot}
      - {id: initializer_conditional_recipe, from: ../initializer_conditional_recipe}
      - {id: conditional_uniform_reference, from: ../conditional_uniform_reference}
      - {id: conditional_completed_pilot, from: ../conditional_completed_pilot}
    outputs:
      - id: selection_report
        type: report
        format: json
        inputs: [goal, policy, comparison_report]
        description: >-
          Local completed-development synthesis at outputs/development_summary.json.
          Reconcile 41 valid comparisons, conservative 26 consecutive no-progress
          evaluations after the completed 13-15 block, and 11 alternative checks
          among 21 post-coverage comparisons. No mandatory 60 floor; no reset from
          a first new-support score, subthreshold raw challenger or initializer
          sensitivity. Preserve the residual-marginal development reference and
          limited average target-correspondence finding; stable initializer-
          independent policy is not established. Coordinator and independent
          scientific/stopping reviews support the adopted local development-only
          terminal conclusion. The patience counter is explicitly reconstructed.
          No held protocol, named explanation or canonical transition is selected.
      - id: selector_comparison_report
        type: report
        format: json
        inputs: [goal, policy, comparison_report, selector_recipe]
        recipe:
          command: >-
            python3 outputs/tools/development_selectors.py
            --source-root $OAK/data/br_autoresearch_data/sensorimotor_lfp/dryad-xd2547dkt-v5-payload/source
            --metadata-report outputs/runs/source_support/attempt002/metadata_support.json
            --trial-roles outputs/runs/source_support/development_trial_roles_attempt001/development_trial_roles.json
            --baseline-report outputs/runs/simple_comparisons/development_baseline_attempt001/development_baseline.json
            --max-seconds 840
            --output-dir outputs/runs/development_search/selector_comparison_attempt001
          resources: {cpus: 1, memory: 2Gi, time_limit: 15m}
      - id: mapping_variance_report
        type: report
        format: json
        inputs: [goal, policy, mapping_recipe, mapping_original_reference, mapping_arrival_reference]
        recipe:
          command: >-
            python3.12 outputs/tools/development_mapping_variance.py
            --source-root $OAK/data/br_autoresearch_data/sensorimotor_lfp/dryad-xd2547dkt-v5-payload/source
            --metadata-report outputs/runs/source_support/attempt002/metadata_support.json
            --trial-roles outputs/runs/source_support/development_trial_roles_attempt001/development_trial_roles.json
            --original-report outputs/runs/development_search/trial_allocation_attempt001/trial_allocation.json
            --arrival-report outputs/runs/development_search/arrival_order_attempt001/arrival_order.json
            --max-seconds 840
            --output-dir outputs/runs/development_search/mapping_variance_attempt001
          resources: {cpus: 1, memory: 2Gi, time_limit: 15m}
      - id: mapping_grouping_control_report
        type: report
        format: json
        inputs: [goal, policy, grouping_recipe, grouping_mapping_reference, mapping_original_reference, mapping_arrival_reference]
        description: >-
          Three fixed MC seeds, all four orders, all eight development sessions
          and sixteen fixed electrode sets. Pseudo labels only group acquired
          row gains, retain actual direction-count multiset and include exhausted
          groups before actual legality filtering. True coordinates/M/eta/A,
          direction labels and targets remain unchanged at the same history.
          Different histories can acquire different rows and A. Every actual
          group mapping is retained; no future or cross-history observations.
          Share identical initializer/final fits only, average seed correct/wrong
          SSE rather than predictions, preserve all twenty resource cells and
          equal order/session/animal aggregation. Reuse completed references only
          after all new fits and verify endpoint scores/capacity/normalization.
          One control comparison within the shared budget; no held or named
          explanatory opening.1140s internal,1200s external, no retry.
        recipe:
          command: >-
            timeout 1200s python3.12 outputs/tools/development_mapping_grouping.py
            --source-root $OAK/data/br_autoresearch_data/sensorimotor_lfp/dryad-xd2547dkt-v5-payload/source
            --metadata-report outputs/runs/source_support/attempt002/metadata_support.json
            --trial-roles outputs/runs/source_support/development_trial_roles_attempt001/development_trial_roles.json
            --mapping-report outputs/runs/development_search/mapping_variance_attempt001/mapping_variance.json
            --original-report outputs/runs/development_search/trial_allocation_attempt001/trial_allocation.json
            --arrival-report outputs/runs/development_search/arrival_order_attempt001/arrival_order.json
            --max-seconds 1140
            --output-dir outputs/runs/development_search/mapping_grouping_control_attempt001
          resources: {cpus: 1, memory: 2Gi, time_limit: 20m}
      - id: learned_electrode_pilot_report
        type: report
        format: json
        inputs: [goal, policy, learned_electrode_recipe]
        description: >-
          Complete predetermined Mihili20140217 target with seven donor sessions,
          matching24/32 initializer views, three fixed predictors, mean-loss
          alpha1 donor labels and weighted-mean-loss alpha1 ranker. All20 target
          rankings freeze before later target rows; all65 target models precede
          evaluation. Separate per-unit time means, no neuron averaging. Three
          ordinary donor-label shuffles, score means not prediction ensembles.
          Only timing/completion/exposure released until the complete cohort;
          no old reference outcomes read during pilot, no decoder serialization.
          Equal target acquisition does not mean equal donor information/cost.
        recipe:
          command: >-
            timeout 300s python3.12 outputs/tools/development_learned_electrodes.py
            --mode pilot
            --source-root $OAK/data/br_autoresearch_data/sensorimotor_lfp/dryad-xd2547dkt-v5-payload/source
            --metadata-report outputs/runs/source_support/attempt002/metadata_support.json
            --trial-roles outputs/runs/source_support/development_trial_roles_attempt001/development_trial_roles.json
            --max-seconds 270
            --output-dir outputs/runs/development_search/learned_electrode_pilot_attempt001
          resources: {cpus: 1, memory: 4Gi, time_limit: 5m}
      - id: learned_electrode_comparison_report
        type: report
        format: json
        inputs: [goal, policy, learned_electrode_recipe, learned_electrode_reference]
        description: >-
          Remaining seven complete target sessions plus the complete predetermined
          pilot, with old acquired-only scores read after all new fits. Two
          learned-selector/control comparisons; three seeds are one control.
          Full-electrode score/capacity replay required. Remaining resource bound
          is selected only from measured pilot timing, not its scientific scores.
        recipe:
          command: >-
            timeout 600s python3.12 outputs/tools/development_learned_electrodes.py
            --mode remaining
            --source-root $OAK/data/br_autoresearch_data/sensorimotor_lfp/dryad-xd2547dkt-v5-payload/source
            --metadata-report outputs/runs/source_support/attempt002/metadata_support.json
            --trial-roles outputs/runs/source_support/development_trial_roles_attempt001/development_trial_roles.json
            --pilot-report outputs/runs/development_search/learned_electrode_pilot_attempt001/learned_electrode_value.json
            --reference-report outputs/runs/development_search/acquired_only_attempt001/acquired_only.json
            --max-seconds 540
            --output-dir outputs/runs/development_search/learned_electrode_attempt001
          resources: {cpus: 1, memory: 4Gi, time_limit: 10m}
      - id: reverse_animal_electrode_report
        type: report
        format: json
        inputs: [goal, policy, reverse_animal_recipe, reverse_animal_training, learned_electrode_reference]
        description: >-
          Both transfer directions use only four other-animal donor sessions and
          the unchanged three-predictor alpha1 ranker. Reuse forty existing donor
          views as declared training inputs; physically parse the combined report
          before fits but use no old outcome fields for fitting. Forty shared
          rankers,520 target models,three original label-control seeds. All target
          orderings precede future reads; all65 models precede each evaluation.
          Reference outcomes are used only after all new fits. Inherited donor
          costs remain explicit; target-cost matching is not total-cost matching.
          Two complete panels count two evaluations, with held sessions closed.
        recipe:
          command: >-
            timeout 300s python3.12 outputs/tools/development_reverse_animal_electrodes.py
            --source-root $OAK/data/br_autoresearch_data/sensorimotor_lfp/dryad-xd2547dkt-v5-payload/source
            --metadata-report outputs/runs/source_support/attempt002/metadata_support.json
            --trial-roles outputs/runs/source_support/development_trial_roles_attempt001/development_trial_roles.json
            --training-report outputs/runs/development_search/learned_electrode_attempt001/learned_electrode_value.json
            --reference-report outputs/runs/development_search/acquired_only_attempt001/acquired_only.json
            --max-seconds 270
            --output-dir outputs/runs/development_search/reverse_animal_electrode_attempt001
          resources: {cpus: 1, memory: 4Gi, time_limit: 5m}
      - id: initializer_target_label_report
        type: report
        format: json
        inputs: [goal, policy, initializer_target_label_recipe, learned_electrode_reference]
        description: >-
          Five ordinary original-trial-ID permutations within each direction and
          each 24/32-row initializer view affect marginal electrode ranking only.
          True targets train every decoder. All25 orders precede future fitting
          rows and all80 distinct target models precede evaluation per session.
          Mean five correct/wrong SSEs, never prediction averaging. The existing
          true-marginal reference is read after all new fits; five common all96
          cells replay scores and exact capacity/physical IDs for every seed.
          One control comparison across eight sessions, twenty cells, equal
          session/animal weights; four held sessions remain closed. No donor
          supervision or new causal/complementarity/coupling endpoint.
        recipe:
          command: >-
            timeout 300s python3.12 outputs/tools/development_initializer_target_labels.py
            --source-root $OAK/data/br_autoresearch_data/sensorimotor_lfp/dryad-xd2547dkt-v5-payload/source
            --metadata-report outputs/runs/source_support/attempt002/metadata_support.json
            --trial-roles outputs/runs/source_support/development_trial_roles_attempt001/development_trial_roles.json
            --reference-report outputs/runs/development_search/acquired_only_attempt001/acquired_only.json
            --max-seconds 270
            --output-dir outputs/runs/development_search/initializer_target_label_control_attempt001
          resources: {cpus: 1, memory: 4Gi, time_limit: 5m}
      - id: lmp_correspondence_report
        type: report
        format: json
        inputs: [goal, policy, lmp_correspondence_recipe, initializer_target_label_reference, learned_electrode_reference]
        description: >-
          Native guide0/0 LMP only in selection and decoding, one real coordinate
          per electrode. Scalar alpha1 marginal gain and five identical original
          within-direction target-label maps; true-Y decoders and real E-wide
          legal ranks. All30 orders precede future reads and95 distinct models
          precede evaluation in every session. Mean five control SSEs, no
