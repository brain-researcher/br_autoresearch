<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">EP08 scientific concept figure</title>
  <desc id="desc">Synthetic concept mockup showing redundant and complementary electrodes, the four-way electrode-by-trial algorithm comparison at every resource budget, a quality-matched electrode swap that may change which direction is worth sampling next, and bounded scientific interpretations.</desc>
  <defs>
    <style type="text/css">
      .bg{fill:#f7f9fc}.panel{fill:#fff;stroke:#94a3b8;stroke-width:1.5;rx:15}.card{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.3;rx:10}.bluebox{fill:#eff6ff;stroke:#60a5fa;stroke-width:1.5;rx:10}.orangebox{fill:#fff7ed;stroke:#fb923c;stroke-width:1.5;rx:10}.greenbox{fill:#ecfdf5;stroke:#34d399;stroke-width:1.5;rx:10}.purplebox{fill:#faf5ff;stroke:#c084fc;stroke-width:1.5;rx:10}.redbox{fill:#fef2f2;stroke:#f87171;stroke-width:1.5;rx:10}
      .title{font-family:Arial,sans-serif;font-size:25px;font-weight:700;fill:#0f172a}.head{font-family:Arial,sans-serif;font-size:20px;font-weight:700;fill:#0f172a}.sub{font-family:Arial,sans-serif;font-size:15px;font-weight:700;fill:#334155}.text{font-family:Arial,sans-serif;font-size:14px;fill:#334155}.small{font-family:Arial,sans-serif;font-size:13px;fill:#475569}.tiny{font-family:Arial,sans-serif;font-size:13px;fill:#64748b}
      .axis{stroke:#94a3b8;stroke-width:1.5;fill:none}.black{stroke:#0f172a;stroke-width:3;fill:none}.blue{stroke:#2563eb;stroke-width:3;fill:none}.orange{stroke:#ea580c;stroke-width:3;fill:none}.green{stroke:#059669;stroke-width:3;fill:none}.gray{stroke:#94a3b8;stroke-width:2;stroke-dasharray:6 5;fill:none}.arrow{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
  </defs>
  <rect class="bg" width="1500" height="900"/>
  <text x="750" y="38" text-anchor="middle" class="title">EP08 — Can a small pilot reveal what to record next?</text>
  <rect x="560" y="49" width="380" height="29" rx="15" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="750" y="69" text-anchor="middle" class="small">CONCEPT MOCKUP · SYNTHETIC PATTERNS · NOT RESULTS</text>

  <rect x="20" y="92" width="455" height="600" class="panel"/>
  <text x="40" y="126" class="head">A  What can the pilot reveal?</text>
  <text x="40" y="151" class="small">Clean signals can be redundant; some directions remain uncertain.</text>
  <rect x="42" y="176" width="390" height="245" class="bluebox"/>
  <text x="237" y="203" text-anchor="middle" class="sub">Electrode candidates</text>
  <g fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5">
    <circle cx="95" cy="245" r="15"/><circle cx="155" cy="245" r="15"/><circle cx="215" cy="245" r="15"/><circle cx="275" cy="245" r="15"/><circle cx="335" cy="245" r="15"/>
    <circle cx="95" cy="305" r="15"/><circle cx="155" cy="305" r="15"/><circle cx="215" cy="305" r="15"/><circle cx="275" cy="305" r="15"/><circle cx="335" cy="305" r="15"/>
    <circle cx="95" cy="365" r="15"/><circle cx="155" cy="365" r="15"/><circle cx="215" cy="365" r="15"/><circle cx="275" cy="365" r="15"/><circle cx="335" cy="365" r="15"/>
  </g>
  <circle cx="155" cy="245" r="19" fill="#34d399" stroke="#059669" stroke-width="3"/><circle cx="215" cy="245" r="19" fill="#34d399" stroke="#059669" stroke-width="3"/>
  <circle cx="335" cy="365" r="19" fill="#fb923c" stroke="#ea580c" stroke-width="3"/>
  <text x="155" y="250" text-anchor="middle" class="small">11</text><text x="215" y="250" text-anchor="middle" class="small">12</text><text x="335" y="370" text-anchor="middle" class="small">37</text>
  <path d="M172 232 C185 220 197 220 211 232" class="green"/><text x="191" y="220" text-anchor="middle" class="tiny">clean + redundant</text>
  <path d="M316 345 C286 327 258 323 235 314" class="orange"/><text x="301" y="327" class="tiny">complementary</text>
  <rect x="42" y="438" width="390" height="168" class="orangebox"/>
  <text x="237" y="465" text-anchor="middle" class="sub">Direction knowledge after the pilot</text>
  <g transform="translate(237,528)">
    <circle cx="0" cy="0" r="49" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <g stroke="#2563eb" stroke-width="6"><line x1="0" y1="-49" x2="0" y2="-72"/><line x1="35" y1="-35" x2="51" y2="-51"/><line x1="49" y1="0" x2="72" y2="0"/><line x1="35" y1="35" x2="51" y2="51"/><line x1="0" y1="49" x2="0" y2="72"/><line x1="-35" y1="35" x2="-51" y2="51"/><line x1="-49" y1="0" x2="-72" y2="0"/></g>
    <line x1="-35" y1="-35" x2="-58" y2="-58" stroke="#ea580c" stroke-width="10"/>
    <text x="-145" y="-35" class="small">largest error</text>
  </g>
  <text x="237" y="632" text-anchor="middle" class="small">Pilot sees quality, overlap, error, and uncertainty.</text>
  <text x="237" y="650" text-anchor="middle" class="small">It does not see future value.</text>

  <rect x="490" y="92" width="485" height="600" class="panel"/>
  <text x="510" y="126" class="head">B  After the pilot</text>
  <text x="510" y="151" class="small">One policy chooses what to retain and which direction comes next.</text>
  <g transform="translate(518,177)">
    <rect x="0" y="0" width="108" height="75" class="bluebox"/><text x="54" y="28" text-anchor="middle" class="sub">Pilot</text><text x="54" y="52" text-anchor="middle" class="small">all electrodes</text>
    <path d="M112 38L145 38" class="arrow"/>
    <rect x="150" y="0" width="108" height="75" class="greenbox"/><text x="204" y="28" text-anchor="middle" class="sub">Retain</text><text x="204" y="52" text-anchor="middle" class="small">one subset</text>
    <path d="M262 38L295 38" class="arrow"/>
    <rect x="300" y="0" width="108" height="75" class="orangebox"/><text x="354" y="28" text-anchor="middle" class="sub">Sample</text><text x="354" y="52" text-anchor="middle" class="small">next direction</text>
  </g>
  <text x="733" y="284" text-anchor="middle" class="sub">Repeat the same 2 × 2 comparison at all nine budgets</text>
  <g transform="translate(518,301)">
    <text x="270" y="14" text-anchor="middle" class="tiny">trial allocation</text>
    <text x="217" y="37" text-anchor="middle" class="sub">Balanced</text><text x="337" y="37" text-anchor="middle" class="sub">Adaptive</text>
    <text x="0" y="94" class="small">Simple electrodes</text><text x="0" y="163" class="small">Conditional-value</text>
    <rect x="160" y="50" width="112" height="64" class="card"/><text x="216" y="78" text-anchor="middle" class="sub">Q_SB</text><text x="216" y="101" text-anchor="middle" class="tiny">reference</text>
    <rect x="281" y="50" width="112" height="64" class="orangebox"/><text x="337" y="78" text-anchor="middle" class="sub">Q_SA</text><text x="337" y="101" text-anchor="middle" class="tiny">trial contribution</text>
    <rect x="160" y="123" width="112" height="64" class="bluebox"/><text x="216" y="151" text-anchor="middle" class="sub">Q_CB</text><text x="216" y="174" text-anchor="middle" class="tiny">electrode contribution</text>
    <rect x="281" y="123" width="112" height="64" class="greenbox"/><text x="337" y="151" text-anchor="middle" class="sub">Q_CA</text><text x="337" y="174" text-anchor="middle" class="tiny">combined</text>
    <text x="197" y="215" text-anchor="middle" class="tiny">electrodes = Q_CB − Q_SB</text>
    <text x="197" y="237" text-anchor="middle" class="tiny">trials = Q_SA − Q_SB</text>
    <text x="197" y="259" text-anchor="middle" class="tiny">combined = Q_CA − Q_SB</text>
    <text x="197" y="287" text-anchor="middle" class="tiny">interaction = Q_CA − Q_CB − Q_SA + Q_SB</text>
  </g>
  <rect x="518" y="604" width="430" height="51" class="card"/>
  <text x="733" y="626" text-anchor="middle" class="small">Positive component gains can still be independent.</text>
  <text x="733" y="646" text-anchor="middle" class="small">A joint claim needs predicted electrode × next-direction coupling.</text>

  <rect x="990" y="92" width="490" height="600" class="panel"/>
  <text x="1010" y="126" class="head">C  What separates the explanations?</text>
  <g transform="translate(1010,151)">
    <rect x="0" y="0" width="450" height="147" class="card"/><text x="16" y="27" class="head">R — Reliability + balance</text>
    <g fill="#60a5fa"><circle cx="50" cy="70" r="14"/><circle cx="92" cy="70" r="13"/><circle cx="134" cy="70" r="12"/><circle cx="176" cy="70" r="11"/></g>
    <g stroke="#94a3b8" stroke-width="4"><line x1="265" y1="58" x2="265" y2="90"/><line x1="301" y1="58" x2="301" y2="90"/><line x1="337" y1="58" x2="337" y2="90"/><line x1="373" y1="58" x2="373" y2="90"/></g>
    <text x="16" y="125" class="small">Keep the cleanest electrodes and sample directions evenly.</text>
  </g>
  <g transform="translate(1010,311)">
    <rect x="0" y="0" width="450" height="147" class="bluebox"/><text x="16" y="27" class="head">I — Two independent improvements</text>
    <rect x="40" y="51" width="65" height="45" class="card"/><rect x="117" y="51" width="65" height="45" class="orangebox"/><rect x="194" y="51" width="65" height="45" class="bluebox"/><rect x="271" y="51" width="65" height="45" class="greenbox"/>
    <text x="72" y="79" text-anchor="middle" class="tiny">Q_SB</text><text x="149" y="79" text-anchor="middle" class="tiny">Q_SA</text><text x="226" y="79" text-anchor="middle" class="tiny">Q_CB</text><text x="303" y="79" text-anchor="middle" class="tiny">Q_CA</text>
    <text x="16" y="123" class="small">Both components help, but the interaction is absent and</text><text x="16" y="140" class="small">the best next direction stays the same after an electrode swap.</text>
  </g>
  <g transform="translate(1010,471)">
    <rect x="0" y="0" width="450" height="183" class="greenbox"/><text x="16" y="27" class="head">J — Joint electrode × trial principle</text>
    <g fill="#60a5fa"><circle cx="55" cy="64" r="12"/><circle cx="88" cy="64" r="12"/><circle cx="121" cy="64" r="12"/></g><text x="88" y="96" text-anchor="middle" class="tiny">simple set</text>
    <path d="M145 66L196 66" class="arrow"/>
    <g fill="#34d399"><circle cx="222" cy="64" r="12"/><circle cx="255" cy="64" r="12"/></g><circle cx="288" cy="64" r="12" fill="#fb923c"/><text x="255" y="96" text-anchor="middle" class="tiny">quality-matched swap</text>
    <path d="M319 66L370 66" class="arrow"/><text x="404" y="60" text-anchor="middle" class="small">best next:</text><text x="404" y="82" text-anchor="middle" class="sub">↖ → ↑</text>
    <text x="16" y="125" class="small">Predict the direction-order change before branch trials appear;</text>
    <text x="16" y="144" class="small">then require the benefit to repeat across replay states and orders.</text>
    <text x="16" y="166" class="tiny">One lucky trial or a persistently noisy direction does not pass.</text>
  </g>

  <rect x="20" y="708" width="1460" height="158" class="panel"/>
  <text x="40" y="742" class="head">D  Scientific interpretation</text>
  <rect x="42" y="758" width="268" height="72" class="greenbox"/><text x="176" y="783" text-anchor="middle" class="sub">Joint principle supported</text><text x="176" y="804" text-anchor="middle" class="small">Interaction and predicted direction</text><text x="176" y="821" text-anchor="middle" class="small">change repeat across replays.</text>
  <rect x="325" y="758" width="268" height="72" class="bluebox"/><text x="459" y="783" text-anchor="middle" class="sub">Two useful methods</text><text x="459" y="804" text-anchor="middle" class="small">Both components help, but</text><text x="459" y="821" text-anchor="middle" class="small">coupling is not supported.</text>
  <rect x="608" y="758" width="268" height="72" class="orangebox"/><text x="742" y="783" text-anchor="middle" class="sub">Engineering gain only</text><text x="742" y="804" text-anchor="middle" class="small">Policy wins, but the proposed</text><text x="742" y="821" text-anchor="middle" class="small">value predictions do not hold.</text>
  <rect x="891" y="758" width="268" height="72" class="card"/><text x="1025" y="783" text-anchor="middle" class="sub">No supported policy gain</text><text x="1025" y="804" text-anchor="middle" class="small">Matched simple rules do not lose</text><text x="1025" y="821" text-anchor="middle" class="small">across registered settings.</text>
  <rect x="1174" y="758" width="282" height="72" class="purplebox"/><text x="1315" y="783" text-anchor="middle" class="sub">Unresolved</text><text x="1315" y="804" text-anchor="middle" class="small">The comparison is imprecise</text><text x="1315" y="821" text-anchor="middle" class="small">or inconsistent.</text>
  <text x="750" y="854" text-anchor="middle" class="tiny">Retrospective policy labels only; forward confirmation of the explanation requires newly sequestered sessions and an independent third animal.</text>
</svg>
