policy_id: ep09_within_class_dendrite_projectome_coupling
episode_id: ep09
evidence_mode: grouped_development_then_one_shot_biological_group_audit

scientific_question:
  plain_language: >-
    Within independently defined cortical IT strata, does the correct neuron's
    dendrite predict its exact distal target vector better than a coherent
    dendritic residual from a tightly matched peer?
  primary_test: >-
    Compare each held-out recipient's locked M1 prediction using its own
    dendritic representation with predictions from the same fitted model after
    substituting each frozen coherent matched-donor dendritic residual.
  required_benchmark: >-
    M1-correct must also improve exact-target prediction over the matched
    context-only M0 and the capacity-matched nuisance bank.
  deeper_prediction: >-
    The correct-minus-matched-donor advantage has a development-frozen
    dendritic-scale by exact-target structure that repeats across held-out
    biological groups within SEU-A1876.
  preferred_explanation: within_class_cell_level_residual_coupling
  alternatives:
    - shared_class_or_neighborhood_organization_without_same_cell_advantage
    - native_dendrite_benchmark_only
    - anatomical_context_sufficient_at_the_frozen_margin
    - residual_context_or_measurement_proxy
    - unresolved_primary_due_to_donor_support_or_power
  novelty_boundary: >-
    M1 beating M0 is confirmation, not the discovery. The proposed contribution
    requires a correct-over-matched-donor advantage at exact-target resolution
    and, for the strongest result, a reproducible scale-by-exact-target pattern.
  strongest_permitted_claim: >-
    Within independently defined cortical IT strata and held-out SEU-A1876
    biological groups, a neuron's own dendritic residual predicts its exact
    reconstructed distal target vector better than coherent matched-donor
    residuals, with a reproducible scale-by-exact-target organization.
  prohibited_claims:
    - synaptic_connectivity
    - physiological_communication
    - causal_target_selection_or_growth_mechanism
    - complete_axonal_fate
    - universal_cell_type
    - unique_neuronal_identity
    - independent_biological_replication
    - novelty_from_M1_over_M0_alone

primary_population:
  scope: cortical_L2_3_L4_L5_IT
  IT_definition:
    allowed_lineage:
      - genetic_metadata_independent_of_axonal_targets
      - experimental_label_independent_of_axonal_targets
      - source_metadata_independent_of_axonal_targets
    provider_projection_class: prohibited_because_axon_derived
    derived_from_exact_target_vector: prohibited
  required_strata:
    - biological_group
    - source_region
    - cortical_layer
    - independently_defined_non_axon_IT_class
  unavailable_action: >-
    Stop or downgrade to a broad benchmark study; do not derive IT membership
    from axonal outcomes or relax the definition after outcome access.

data:
  primary_source:
    collection: SEU_A1876
    record: Zenodo_13944322
    native_dendrites: Full_morphology_RAW.zip
    ccf_whole_neurons: Full_morphology_CCFv3.zip
    candidate_axonal_arbors: Axonal_arbor_CCFv3.zip
    metadata: Full_morphometry.xlsx
    atlas: Allen_Mouse_CCFv3_annotation_and_structure_graph
  optional_sensitivity:
    ccf_dendrites: Dendritic_arbor_CCFv3.zip
    external_representation: CCF_ME_Zenodo_13801372_v2
  status: not_yet_provisioned_or_role_instantiated
  lineage:
    previously_released_refinements_reported_by_Liu_2024: 1736
    newly_annotated_reported_by_Liu_2024: 140
    study_description: predominantly_Peng_2021_lineage_reanalysis
    held_out_groups_support: internal_grouped_reproducibility
    independent_replication_claim: prohibited
    optional_lineage_disjoint_audit: >-
      Eligible only if the newly annotated cells independently satisfy group,
      exact-target, and matched-donor support.
  unit:
    recorded_observation: cell_exact_target_pair
    split_and_inference: most_conservative_verified_animal_brain_or_specimen_group
    random_neuron_split: prohibited
  identity:
    stable_cell_join_across_metadata_dendrite_and_axon: required
    duplicate_and_derivative_detection: required
    outcome_independent_IT_label_provenance: required
    original_release_vs_new_annotation_lineage: required

roles:
  minimum_development_groups: 12
  minimum_audit_groups: 8
  assignment: whole_group_before_dendrite_axon_association_is_inspected
  development_use:
    - observation_pipeline
    - donor_support_and_overlap_qualification
    - grouped_model_selection_and_tuning
    - exact_target_support
    - falsification_and_synthetic_sensitivity
    - hypothesis_margin_and_template_freeze
  audit_use: one_evaluation_of_locked_primary_benchmark_and_explanatory_predictions
  insufficient_verified_groups: stop_or_downgrade_to_grouped_development_evidence
  shared_audit:
    episodes: [ep09, ep10, ep11]
    one_cell_group_role_and_exposure_ledger: required
    independent_results_across_episodes: false
    all_shared_contracts_freeze_before_any_shared_outcome_open: true

outcome:
  endpoint: qualifying_distal_axonal_arbor_detection_by_exact_target
  states:
    detected: qualifying_arbor_is_present
    not_detected: target_is_observable_and_no_qualifying_arbor_is_present
    uncertain: coverage_or_reconstruction_cannot_support_either_conclusion
  uncertain_handling: missing_never_zero
  primary_arbor_rule: null
  primary_distal_rule: null
  observability_requires:
    - authenticated_tree_and_provider_arbor_link
    - valid_coordinate_units_axes_orientation_and_atlas_transform
    - adequate_reconstruction_and_target_coverage
    - no_disqualifying_clipping_or_terminal_capture_failure

targets:
  primary_resolution: exact_nonoverlapping_CCFv3_nodes
  chosen_from: anatomy_and_observation_support_without_association_screening
  every_eligible_target_enters: true
  posthoc_favorable_target_selection: prohibited
  outcome_blind_coverage:
    minimum_observable_cells_per_target_per_group: null
    minimum_allowed_value: 3
    value_selected_from: outcome_blind_counts_and_development_only_precision_simulation
    applies_to: every_development_and_audit_group
    later_violation: technical_failure_without_target_removal_or_renormalization
  development_prevalence_support:
    outer_training_minimum_positive_groups: 3
    outer_training_minimum_negative_groups: 3
    full_development_minimum_positive_groups_for_audit_target: 4
    full_development_minimum_negative_groups_for_audit_target: 4
    recomputed_inside_every_outer_training_fold: true
    held_out_group_may_set_prevalence_eligibility: false
  family_summary:
    role: secondary_aggregation_and_hierarchy_falsification_only
    source: one_outcome_independent_nonoverlapping_Allen_ontology_cut
    each_target_has_exactly_one_family: true
    cannot_replace_exact_target_primary: true

predictors:
  context_M0:
    - source_region
    - cortical_layer
    - soma_coordinates_and_prespecified_spatial_transforms
    - acquisition_or_reconstruction_batch
    - acquisition_and_dendrite_quality_independent_of_axonal_geometry
    - independently_defined_non_axon_class_labels
  native_dendrite_blocks_M1:
    - topology_and_branch_order
    - soma_centered_multiscale_radial_profiles
    - path_length_extent_tortuosity_and_branch_geometry
    - orientation_and_hemispheric_symmetry
    - persistent_homology
  prohibited:
    - any_axonal_predictor
    - provider_Projection_class
    - outcome_derived_subtype
    - target_detection_prevalence_from_validation_or_audit
    - axon_derived_coverage_completeness_total_length_or_projection_breadth_as_predictor
    - audit_derived_feature_screening

model_comparison:
  M0:
    name: anatomical_context_class_and_measurement_quality
    inputs: context_M0
  M1_correct:
    name: same_context_plus_recipient_own_native_dendrite
    inputs: [context_M0, native_dendrite_blocks_M1]
  primary_matched_donor_bank:
    name: same_fitted_M1_with_coherent_matched_donor_dendritic_residual
    donor_plan_count: null
    donor_plan_count_frozen_from: development_only_stability_and_compute_qualification
    evaluation:
      fit_outcome_model_on_correct_development_pairings: true
      refit_outcome_model_on_swapped_pairings: false
      substitute_at_held_out_prediction_only: true
      retain_recipient_context_target_vector_and_missingness: true
    donor_matching:
      exact:
        - biological_group
        - source_region
        - cortical_layer
        - independently_defined_non_axon_IT_class
      frozen_calipers:
        - soma_position
        - axon_independent_quality
      optional_tightening: development_frozen_dendrite_only_neighborhood
      no_fixed_point: true
      minimum_donors_per_pool: null
      minimum_allowed_value: 4
      outcome_access: prohibited
    representation: >-
      Transfer the donor's entire standardized dendritic residual vector into
      the recipient context and reapply recipient missingness. This is a
      coherent matched-donor residual, not a literal untouched native tree.
    required_diagnostics:
      - balance_over_matching_variables
      - conditional_mean_and_covariance
      - heteroscedasticity
      - multimodality
      - missingness
      - joint_support_and_overlap
    failed_support_or_diagnostic: primary_unavailable_without_matching_relaxation
  nuisance_bank:
    name: capacity_matched_independent_block_false_dendrites
    role: supporting_validity_gate
    member_count: 20
    construction: >-
      Independently derange standardized residual rows for each dendritic block
      within biological group after outcome-free conditional location-and-scale
      modeling, then restore recipient context and missingness.
    fitting: >-
      Refit the development-selected M1 pipeline on each nuisance block with
      identical splits but no nuisance-specific adaptive search.
    failed_diagnostic: positive_benchmark_unavailable
  fairness:
    identical_recipients_targets_observable_pairs_and_outer_folds: true
    identical_fitted_M1_for_correct_and_primary_swaps: true
    M0_and_M1_identical_learner_tuning_and_calibration_opportunity: true
    all_imputation_scaling_screening_and_calibration_inside_training_folds: true

development_search:
  representations:
    scaling: [robust, signed_log, block_normalized]
    pca_ranks: [4, 8, 16, 32, 64]
    pls_ranks: [2, 4, 8, 16]
  learners:
    - elastic_net_logistic
    - group_sparse_logistic
    - low_rank_multitarget_logistic
    - shallow_gradient_boosting
    - additive_spline
  calibration:
    options: [none, shared_platt]
    isotonic: prohibited
    shared_platt_eligibility:
      minimum_training_groups: 8
      minimum_groups_with_detected_state: 4
      minimum_groups_with_not_detected_state: 4
      fit_from: grouped_out_of_fold_training_predictions
  maximum_ensemble_members: 2
  target_specific_or_group_specific_winner: prohibited
  nesting:
    outer: leave_whole_biological_groups_out
    inner: grouped_tuning_within_outer_training_groups
    target_support: recomputed_inside_outer_training_data

estimands:
  score:
    probability_score: Brier
    exact_target_score: "B_gt(m) = mean_over_observable_cells_i((y_git-p_git_m)^2)"
    group_score: "B_g(m) = equal_mean_over_exact_targets_t(B_gt(m))"
    group_weights: equal_and_fixed
    exact_target_weights: equal_and_fixed
  primary:
    per_donor_plan: "C_gj = B_g(M1_swap_j) - B_g(M1_correct)"
    per_group: "C_g = mean_over_frozen_donor_plans_j(C_gj)"
    overall: "Delta_cell = equal_group_mean(C_g)"
    larger_is_better: true
    margin: delta_cell
  required_benchmark:
    per_group: "D_g = B_g(M0) - B_g(M1_correct)"
    overall: "Delta_morph = equal_group_mean(D_g)"
    nuisance_member: "R_gj = B_g(N_j) - B_g(M1_correct)"
    larger_is_better: true
    margin: delta_morph
  secondary_family_score: >-
    Equal mean of exact-target scores within each frozen anatomical family.

inference:
  unit: biological_group
  confidence_level_one_sided: 0.95
  primary_bounds:
    lower: "C_bar - c_C_L*s_C/sqrt(G)"
    upper: "C_bar + c_C_U*s_C/sqrt(G)"
  benchmark_bounds:
    lower: "D_bar - c_D_L*s_D/sqrt(G)"
    upper: "D_bar + c_D_U*s_D/sqrt(G)"
  critical_values:
    minimum: ordinary_one_sided_Student_t_with_G_minus_1_degrees_of_freedom
    calibration: separated_lower_and_upper_tail_development_only_scenarios
    validation: disjoint_simulation_seeds
    scenario_families:
      - normal_group_contrasts
      - skewed_group_contrasts
      - heavy_tailed_group_contrasts
      - variance_dependent_on_group_size_and_support
    calibration_replicates_per_scenario: 50000
    validation_replicates_per_scenario: 50000
  influence:
    every_leave_one_group_primary_and_benchmark_mean_positive: true
    maximum_primary_mean_change: delta_cell_divided_by_2
    maximum_benchmark_mean_change: delta_morph_divided_by_2
  neuron_or_cell_target_degrees_of_freedom: prohibited
  failed_assumption_or_coverage: unresolved_before_audit

primary_decision:
  margins:
    delta_cell: null
    delta_morph: null
    status: justify_and_freeze_from_development_only_science_and_precision
  success_requires:
    - primary_lower_bound_exceeds_delta_cell
    - benchmark_lower_bound_exceeds_delta_morph
    - all_simultaneous_M1_correct_vs_nuisance_lower_bounds_exceed_zero
    - donor_balance_overlap_and_common_pair_requirements_pass
    - primary_and_benchmark_leave_one_group_requirements_pass
    - calibration_and_probability_support_pass
    - synthetic_recovery_adequate_at_both_margins
  equivalence_interpretation:
    method: two_one_sided_5_percent_tests
    interval: 90_percent_primary_interval_using_separate_tail_critical_values
    rule: interval_wholly_inside_plus_or_minus_delta_cell
    conclusion: shared_class_or_neighborhood_organization_if_benchmark_passes
  neither_superiority_nor_equivalence:
    conclusion: biological_resolution_unresolved
  unavailable_donor_support:
    conclusion: headline_primary_unavailable
    benchmark_may_replace_primary: false

explanatory_prediction:
  fixed_models:
    E0: context_M0
    E1: context_M0_plus_every_prespecified_dendrite_scale_block
    family: ridge_regularized_multitarget_logistic
    not_eligible_to_replace_primary_M1: true
  scale_by_exact_target:
    formula: >-
      S_btg = mean_j[B_gt(E1_with_block_b_from_matched_donor_j) -
      B_gt(E1_correct)]
    matrix_rows: prespecified_dendritic_scale_blocks
    matrix_columns: every_frozen_exact_target
    donor_source: primary_matched_donor_bank
    outcome_model_and_calibrator_fitted_on_correct_development_pairings: true
    outcome_model_refit_for_donor_substitution: false
    substitution_at_held_out_prediction_only: true
    donor_identity_coherent_across_blocks_within_plan: true
    target_family_pooling_for_decisive_matrix: prohibited
    interpretation: predictive_information_not_causal_importance
  development_freezes:
    - all_block_basis_and_exact_target_entry_order
    - signed_scale_by_exact_target_template
    - robust_scale_per_matrix_entry
    - required_sign_entry_set
    - eta_matrix_minimum_norm
    - rho_matrix_similarity_margin
  audit_replication:
    standardization: development_robust_entry_scales
    similarity: cosine_with_frozen_development_template
    aggregate: equal_group_mean_with_small_G_lower_bound
    success_requires:
      - primary_success
      - fixed_E1_over_E0_group_lower_bound_exceeds_zero
      - development_and_every_audit_matrix_norm_exceed_eta_matrix
      - group_cosine_lower_bound_exceeds_rho_matrix
      - required_sign_entries_repeat_under_frozen_simultaneous_intervals
    undefined_or_failed_donor_diagnostic: explanation_unavailable
  nested_development_pseudo_audits:
    repeat:
      - primary_model_search_and_freeze
      - donor_bank_construction_and_diagnostics
      - E0_E1_fitting
      - exact_target_template_scaling_norm_and_sign_selection
      - complete_replication_decision

secondary_family_hierarchy_test:
  role: anatomical_summary_falsification_not_primary_resolution
  true_hierarchy: frozen_outcome_independent_Allen_anatomical_cut
  matched_shuffle_count: 20
  statistic: >-
    Difference between the E1 dendritic increment under the true hierarchy and
    each matched shuffled hierarchy.
  shuffles_preserve:
    - family_size
    - development_target_prevalence_bin
    - observation_rate_bin
    - source_to_target_centroid_distance_bin
  fewer_than_20_valid_shuffles: hierarchy_summary_unresolved_without_relaxation

validity_gates:
  common:
    - verified_cell_dendrite_axon_identity_and_group_unit
    - outcome_independent_IT_membership
    - valid_observability_and_nondetection
    - no_axonal_geometry_or_outcome_leakage
    - identical_prediction_pairs_across_paired_models
    - valid_matched_donor_construction_and_diagnostics
    - valid_and_available_nuisance_construction_and_diagnostics
    - group_level_inference_and_influence
    - adequate_probability_support_and_calibration
  positive_benchmark_only:
    - M1_correct_beats_capacity_matched_nuisance_bank
  scope_sensitivities:
    - soma_centered_rotation_invariant_representation
    - native_vs_CCFv3_dendrite
    - frozen_arbor_threshold_set
    - registration_clipping_missingness_and_coverage_strata
    - source_family_heterogeneity

search_budget:
  minimum_valid_trials: 40
  maximum_valid_trials: 96
  initial_coverage_trials: 20
  patience_valid_trials: 18
  patience_improvement: 0.001
  patience_is_scientific_margin: false
  maximum_invalid_retries: 16
  minimum_falsification_fraction_after_initial_coverage: 0.40
  cpu_core_hour_ceiling: 1500
  wall_clock_hour_ceiling: 120
  parallel_core_ceiling: 64
  memory_gb_ceiling: 512
  scratch_gb_ceiling: 1024
  gpu_hour_ceiling: 0

candidate_ready_requires:
  - outcome_independent_IT_definition_and_lineage_documented
  - verified_group_provenance_and_minimum_counts
  - exact_target_support_within_primary_IT_population
  - matched_donor_support_within_every_required_stratum
  - authenticated_cell_dendrite_axon_identity_and_coordinate_route
  - frozen_outcome_observability_target_and_family_rules
  - frozen_delta_cell_delta_morph_and_small_group_inference
  - frozen_M1_donor_bank_nuisance_bank_E0_E1_and_exact_target_template
  - independent_calibration_and_validation_simulations_pass
  - synthetic_sensitivity_at_both_scientific_margins
  - full_workload_fits_resource_ceiling
  - reproducible_refit_from_immutable_inputs

audit:
  all_EP09_EP10_EP11_contracts_freeze_before_any_shared_outcome_open: true
  prediction_and_analysis_lock: write_once_before_audit
  maximum_open_count: 1
  audit_updates_model_donors_calibration_margin_target_or_template: false
  audit_group_replacement: prohibited
  failed_scientific_result_may_trigger_reopen: false
  invalid_run_definition:
    - frozen_input_corruption
    - evaluator_implementation_failure_demonstrated_without_result_direction
    - violated_identity_or_role_ledger

terminal_interpretation:
  within_class_cell_level_residual_coupling:
    requires:
      - primary_success
      - benchmark_success
      - common_validity_gates_pass
    strongest_variant_requires:
      - scale_by_exact_target_replication_passes
    additional_anatomical_family_alignment_requires:
      - secondary_family_hierarchy_test_passes
    claim_limit: unmeasured_finer_subtype_remains_possible
  shared_class_or_neighborhood_organization_without_same_cell_advantage:
    requires:
      - benchmark_success
      - primary_equivalence_established
      - common_validity_gates_pass
  native_dendrite_benchmark_only:
    requires:
      - benchmark_success
      - primary_neither_superior_nor_equivalent
    claim: confirmation_without_resolved_biological_scale
  context_sufficient_at_margin:
    requires:
      - benchmark_upper_bound_below_delta_morph
      - synthetic_benchmark_sensitivity_adequate
      - common_validity_gates_pass
  unresolved_primary_due_to_donor_or_support_failure:
    requires: inadequate_IT_group_exact_target_or_matched_donor_support
    benchmark_may_replace_primary: false
  invalid_or_proxy_explanation:
    requires: any_common_validity_gate_fails
  unresolved:
    requires: inadequate_calibration_power_or_probability_support

launch_blockers:
  - source_archives_and_exact_CCFv3_resources_not_provisioned
  - outcome_independent_cortical_IT_definition_not_verified
  - original_release_vs_new_annotation_lineage_not_instantiated
  - biological_group_provenance_not_verified
  - exact_target_support_within_IT_population_not_verified
  - source_layer_class_group_matched_donor_support_not_verified
  - shared_EP09_EP10_EP11_role_and_exposure_ledger_not_built
  - cell_join_coordinate_and_tree_parsing_route_not_authenticated
  - arbor_observability_distal_target_and_ontology_rules_not_frozen
  - donor_plan_count_matching_calipers_diagnostics_and_seeds_not_frozen
  - nuisance_bank_E0_E1_exact_target_template_and_hierarchy_shuffles_not_frozen
  - delta_cell_delta_morph_matrix_margins_and_tail_critical_values_not_frozen
  - simulation_scenarios_and_disjoint_seed_sets_not_frozen
  - complete_workload_not_shown_to_fit_resource_ceiling
