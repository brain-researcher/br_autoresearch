version: "EP09-companion-model-donor-contract-v1.0-draft"
status: "Proposed specification for orchestrator review and scientist approval."
execution_status: "Not executable until required decisions, bindings, and blind artifacts are approved and hashed."
execution_performed: false

authority:
  search_policy: "ep09_within_class_dendrite_projectome_coupling, including adopted amendments"
  measurement_contract:
    version: "EP09-measurement-contract-v1.2-adopted"
    ref: "outputs/runs/measurement_and_roles/attempt005/measurement_contract_v1_2_adopted.yaml"
    sha256: "b01b593e24cd88988cb8fac21bb8a4b7a59a237dc5fdf6a180ae01929a4369b3"
  precedence: >
    The adopted policy and measurement contract govern. This draft fills their
    open specifications. It does not itself authorize an amendment. In particular,
    the recipient-set decision below requires explicit scientist resolution before
    development outcome access.
  inherited_without_change:
    - "Scientific question, outcome definitions, distal and arbor rules."
    - "Frozen cohort membership, animal roles, staged access, and exposure ledger."
    - "Exact-target construction, prevalence gates, and secondary-only family gate."
    - "Equal animal and exact-target weights and the registered estimand formulas."
    - "One audit opening after the shared EP09/10/11 lock."
    - "Claims and limitations, interpreted under the adopted CEBSIT source amendment."
    - "No L5 IT claim, causal claim, synaptic claim, or independent replication claim."

freeze_sequence:
  before_development_axon_or_outcome_access:
    - "Obtain scientist decisions D01-D12 and record their exact accepted wording."
    - "Bind existing manifests, atlas resources, coordinate conventions, and exposure ledger."
    - "Complete and hash the pending stage-A artifacts without substituting estimated values."
    - "Materialize the development donor graph, caliper width, plans, diagnostics, and qualification report."
    - "Hash this resolved specification, feature definitions, seed registry, implementation, and dependency lock."
    - "Complete the outcome-free workload qualification against the cumulative episode budget."
  after_development_only_analysis_before_shared_lock:
    - "Freeze selected pipelines, fitted transformations, models, calibrators, and nuisance models."
    - "Freeze development-supported target inventory and predictions for every such target."
    - "Freeze calibrated and independently validated critical values."
    - "Submit derived scientific margins and their evidence to the scientist for approval."
    - "Freeze explanatory entries, scales, template, sign set, and hierarchy models and shuffles."
    - "Complete nested pseudo-audits and all required validity and recovery checks."
    - "Record immutable prediction and analysis artifacts in the shared lock."
  hash_rule: >
    Hash exact UTF-8 file bytes with SHA-256. Record hashes for every referenced
    artifact in a manifest. Do not insert a file's own digest into its hashed bytes.
    Draft placeholders are not valid execution bindings.
  correction_rule: >
    Implementation corrections must preserve the frozen mathematics and receive a
    versioned correction record. Scientific changes after exposure cannot be
    represented as execution of the original blind specification.

