episode_id: ep10
policy_id: ep10_residual_coprojection_adaptive

# The original M2 objective is closed; the recorded design remains historical.
local_closeout_2026_10_06:
  authority: explicit_scientist_acceptance_of_recommended_closeout
  user_quote: "i agree with your judgement; EP20 is fine with simulation because we dont have real data"
  scope: original_v3_M2_objective
  disposition: incomplete_search
  reason: computational_and_numerical_limits
  retained_evidence: qualified_real_data_M1_and_secondary_exploratory_M1_minus_M0_gain
  scientific_success: false
  biological_negative_or_M1_sufficiency: false
  successor_selected: false
  execution_resumption_authorized: false
  budgets_and_prior_charges_preserved: true
  data_roles_and_closed_outcomes_preserved: true
  canonical_BR_action: false
  adoption_record: outputs/experiment_log.md#2026-10-06--v3_search--scientist-adopted-local-closeout

launch:
  ready: false
  first_stage: qualify one candidate morphology resource before fitting outcome models
  minimum_to_start:
    - >-
      read-only access to candidate morphologies and basic neuron, source, and
      animal-or-specimen metadata

active_regime: v3_positive_only_exploratory
active_exploratory_v3_override:
  authority: explicit_scientist_authorization_2026-09-26
  precedence:
    rank: highest
    controller_rule: >-
      fail closed unless canonical operative keys agree with this override;
      legacy complete-set values are documentation only while active_regime is
      v3_positive_only_exploratory
    supersedes_paths:
      - data.final_opening
      - observation.legacy_complete_set_definition
      - models.M0
      - models.M1
      - models.M2
      - models.common_scoring
      - candidate_combination.event_semantics
      - full_axon_anatomy.status
      - shared_target_question.status
      - external_evaluation.status
      - objectives
      - full_search_null
      - required_falsifiers
      - final_decision.active_v3
  activation_gate:
    eligible_development_cells: 194
    excluded_development_cells: 6
    exclusion_reason: soma_not_MOp
    conservative_group_count: 12
    group_221588_support: 7
    require_exact_postflight_before_modeling: true
  scope: development_only
  relationship_to_original_policy: >-
    This block overrides conflicting complete-set, biological-promotion, and
    shared-target-exclusivity language for the active Gao v3 analysis. The
    original complete-set design remains documented as a failed historical or
    future endpoint and is not silently relabelled.
  observation:
    target_panel_T: frozen_16_nonoverlapping_coordinates
    P_i: mapped positive terminal observations within T
    K_i_obs: cardinality of P_i; recorded-positive count, not biological target count
    Omega_i: every size-K_i_obs subset of T
    zero_semantics: no mapped positive terminal observation recorded; unknown and not negative
    unmapped_content: omit from positive target assignment; never impute absence
    exact_normalization_interpretation: conditional recorded-positive-pattern probability
  scoring_population:
    denominator: all_194_structurally_eligible_development_cells
    K_i_obs_0_or_16: >-
      retain and report by group; singleton Omega gives exactly zero log-score
      gain for every model
    pair_informative_support: report 2 <= K_i_obs <= 15 by group without post-hoc filtering
  mapping_quality:
    rule: freeze target-blind covariates or strata before target-effect inspection
    reuse: identical in fitting evaluation null simulation and falsifiers
    inverse_probability_weighting: forbidden without externally justified observation probabilities
  model_interpretation:
    M0: recorded-positive label frequency, source context, and eligible independent labels
    M1: geometry-associated recorded-positive structure beyond M0
    M2: residual pair structure among recorded positives beyond M1
  objectives:
    primary: equal-group held-out conditional log-score gain for P_i of M2 over M1
    secondary: equal-group held-out conditional log-score gain for P_i of M1 over M0
    smallest_useful_gain_bits_per_eligible_cell: 0.002
    threshold_interpretation: exploratory search threshold, not a biological effect margin
  null_and_falsification:
    generator: >-
      fitted v3 M1 conditional on each fixed K_i_obs, group, source, soma,
      eligible independent and technical covariates, and frozen mapping-quality state
    preserve: group sizes, covariate strata, mapping-quality strata, and each K_i_obs
    reruns: 99 full controller replays with empty search history
    interpretation: excess observation-pattern predictability, not biological co-projection
    permutation: >-
      permute recorded-positive labels within conservative group and frozen
      mapping-quality strata while preserving every K_i_obs
  candidate_language:
    permitted: A and B recorded
    forbidden:
      - treating any zero as B-negative or C-negative
      - biological presence absence or exclusivity claims
  inactive_under_v3:
    - original Route A biological promotion
    - original Route B biological promotion
    - shared-target B-positive/C-negative exclusivity endpoint
    - final data opening without a separately frozen v3 evaluation contract

data:
  candidate_resources:
    SEU_A1876: measurement development and grouped-analysis candidate
    Gao_18621: within-source and cross-position candidate
    MouseLight: possible external replication resource
    Projection_TAGs: possible independent-label test of population mixture
  provisional_priority_source: MOp
  boundary_sources: [MOs, SSp]
  pool_sources_to_manufacture_support: false
  group_unit: most conservative verified animal or specimen group
  minimum_development_groups: 12
  minimum_final_groups: 8
  split_timing: before inspecting candidate co-projection outcomes
  split_rule: whole groups with no cell or group appearing on both sides
  final_opening: forbidden_under_active_v3_without_separately_frozen_evaluation_contract
  post_final_tuning_or_reselection: forbidden
  source_family_definition: prespecified source-by-resource strata with adequate evaluation support
  if_group_requirements_fail: >-
    narrow the claim, use exploratory grouped cross-validation, or stop
  shared_cells_with_ep09_or_ep11_are_independent_replication: false

first_analysis_stage:
  purpose: freeze the active v3 development-only recorded-positive-pattern analysis
  scope: development_only
  before_candidate_effect_search:
    - confirm the already frozen Gao MOp development source and 12 conservative groups
    - >-
      freeze the 16-coordinate panel, laterality, positive-terminal rule, and
      unknown-zero interpretation without claiming absence
    - >-
      freeze target-blind mapping-quality covariates or strata for identical use
      in fitting, evaluation, null simulation, and falsification
    - confirm the exact 194-cell denominator and report K_i_obs support by group
    - estimate precision and the cost of exact scoring and 99 full-search null reruns
  excluded_under_active_v3:
    - final-group opening or evaluation
    - verified absence or biological complete-set claims
    - shared-target exclusivity or full-axon anatomy endpoints
  decision: proceed with exploratory development modeling, revise, or stop

observation:
  full_reconstructions_are_primary: true
  provider_arbors: sensitivity analysis only
  putative_boutons_are_synapses: false
  incomplete_reconstruction_is_absence: false
  unknown_is_absence: false
  projection_derived_classes_as_independent_labels: false
  freeze_before_modeling:
    - target vocabulary and resolution
    - laterality and atlas-boundary rules
    - arborization versus passing-axon rule
    - mapped positive observation versus unknown rule
  active_recorded_positive_definition:
    T: frozen 16-coordinate panel
    P_i: mapped positive terminal observations within T
    K_i_obs: number of recorded positives in P_i supplied equally to all models
    Omega_i: every size-K_i_obs subset of T scored by each model
    interpretation: recorded-positive observation patterns, not complete biological target sets
  legacy_complete_set_definition:
    status: inactive_for_active_v3
    V_i: non-overlapping targets that could have been scored for neuron i
    S_i: complete set of qualifying detected targets within V_i
    K_i: number of targets in S_i supplied equally to all models
    Omega_i: every size-K_i subset of V_i scored by each model
  failure_action: >-
    the Gao complete-set endpoint stopped; active v3 may model recorded-positive
    patterns only and may not infer non-detection or absence

models:
  M0:
    question: >-
      what recorded-positive labels are expected from their observed frequency,
      source context, frozen mapping-quality state, and verified independent labels?
    interpretation: an additive observation-pattern reference, not biological independence
    terms:
      - recorded-positive label preference conditional on K_i_obs
      - smooth soma-position and sampling-composition effects
      - eligible source and layer information
      - documented technical covariates
      - independently measured driver or molecular labels when available
  M1:
    question: how much geometry-associated recorded-positive structure adds beyond M0?
    inherits: M0
    pooling_options: [global, source_hierarchical, bounded_K_partial_pooling]
    geometry:
      - source-to-target geometry
      - pairwise target geometry
      - soma-anchored target-set geometry
      - independent-atlas or development-fold routing priors
  M2:
    question: is residual pair structure among recorded positives left after M1?
    inherits: M1
    core_family: sparse
    penalties: [lasso, elastic_net, group_lasso]
    pair_features_residualized_against_M1: true
  optional_extensions:
    low_rank:
      trigger: development residuals are diffuse and structured
      ranks: [1, 2, 3, 4, 6, 8]
    hierarchical:
      trigger: reproducible between-group heterogeneity remains
    sparse_plus_low_rank:
      trigger: both localized and diffuse residual structure remain
      maximum_sparse_pairs: 16
    rule: >-
      activate only from a grouped-development diagnosis with adequate support
      and synthetic recovery
  population_mixture:
    eligible_labels: independently measured layer driver-line or molecular labels only
    required_comparisons:
      - label overlap with animal and soma position
      - within-label and label-adjusted combination contrasts
      - the same model with and without the label block
    if_no_eligible_label: report that population mixture remains unresolved
  common_scoring:
    condition_on_K_i_obs: true
    K_i_obs_interpretation: recorded-positive count, not biological target count
    same_neurons_and_candidate_sets: true
    exact_normalization: true
    equal_group_weighting: true
    denominator: all 194 eligible development cells
    degenerate_K_i_obs: retain K_i_obs 0 or 16 with zero model gain and report by group
  forbidden:
    - pseudolikelihood or approximate normalization
    - random-neuron splits
    - free-form pair mining
    - final-outcome-dependent choices
    - post-result vocabulary shrinkage
    - treating raw pair coefficients as biological effects
    - pooling MOp MOs or SSp only to increase support

candidate_combination:
  selected_in: grouped development only
  event_semantics: A and B recorded; no negative or exclusivity inference from zeros
  freeze_before_final_evaluation:
    - target pair or target set
    - effect direction and probability-contrast scale
    - common-support domain and anatomical applicability region
    - smallest useful effect
    - group-level uncertainty and pair-level multiplicity rule
  unsupported_position_extrapolation: false
  aggregate_predictive_gain_alone_validates_a_named_combination: false
  novelty_rule:
    prior_overlap: >-
      Yuan et al. 2024 already linked cotarget status to laminar termination
      within a shared cortical target
    each_candidate_must_add:
      - an unresolved explanation it can distinguish
      - one held-out prediction appropriate to Route A or Route B
      - a pathway interpretation that would change after confirmation or refutation

full_axon_anatomy:
  status: inactive_under_active_v3_until_separately_rewritten_and_frozen
  timing: after the target definition and candidate combination are chosen in development
  freeze_before_final_anatomy:
    - each metric and its normalization
    - matched-reference rule and multiplicity rule
  measures:
    - divergence location for paths reaching the frozen targets
    - normalized shared path before divergence
    - separate collateral and terminal-tree coverage
    - continuous terminal trees crossing atlas boundaries
  matched_references_consider:
    - target distance and geometry
    - soma position and eligible independent labels
    - target prevalence target count and other cotargets
    - total axon morphology
    - atlas alignment clipping and reconstruction observability
  claim_limits:
    - a shared root is not evidence
    - reconstruction endpoints are not synapses
    - morphology does not identify synaptic partners number strength or causal wiring
  inference: >-
    group-level permutation or bootstrap with frozen matched references and a
    multiplicity rule
  group_interpretation: >-
    animal when verified, otherwise conservative specimen with a cross-group
    claim
  calibrated_by_target_set_99_null: false
  leakage_rule: a test neuron's realized path branch or terminal tree cannot enter M0 M1 or M2

shared_target_question:
  status: inactive_under_active_v3_because_zeros_cannot_define_B_or_C_negativity
  role: conditional secondary endpoint
  contrast: neurons arborizing in A under development-chosen A+B versus A+C definitions
  activate_only_when:
    - the target combination is already chosen in grouped development
    - both contexts have adequate development-group and common-position support
    - coordinates and terminal profiles within A are repeatable
  measurement_development:
    context_labels: B and C blinded
    permitted: >-
      choose the most reliable option from a prespecified set of coordinates
      or profile summaries
    forbidden: use the A+B versus A+C contrast to choose a coordinate metric or direction
  selection_rule: >-
    prespecify A B and C or choose them with the target-set controller in
    grouped development, never from within-A anatomy
  null_rule: replay controller-based A B and C selection in all 99 target-set null runs
  freeze_before_final_evaluation:
    - A B and C and any B-C exclusivity rule
    - treatment of K other targets and total arbor amount in A
    - target-intrinsic coordinate and primary normalized terminal-profile metric
    - predicted direction common-support rule and multiplicity rule
    - pooled-map estimator and pooling-discrepancy summary
    - pooling-discrepancy null useful margin and group-level uncertainty method
    - whether entry route is an alternative explanation or mediator
  report:
    - pooled A profile beside both context-specific profiles
    - total qualifying arbor in A separately from its normalized distribution
    - group-level effects and reconstruction-quality sensitivities
    - pooling discrepancy with its frozen null margin and uncertainty
  if_ineligible: omit the within-A claim without changing the target-set primary endpoint
  if_final_support_is_too_small: report the endpoint as inconclusive without reselection
  changes_primary_search_budget_or_nulls: false
  pooling_discrepancy_is_calibrated_by_target_set_99_null: false
  leakage_rule: >-
    within-A morphology cannot choose A, B, or C or enter the target-presence
    model; the A+B versus A+C contrast cannot choose the coordinate, metric, or
    direction

external_evaluation:
  status: inactive_under_active_v3_without_separately_frozen_evaluation_contract
  launch_requirement: false
  eligible_only_if: >-
    source, target, and detection rules are genuinely comparable and samples
    are independent
  choose_one_transfer_type:
    - frozen-parameter transport
    - marginal target-frequency recalibration with association structure fixed
  choice_timing: before external outcomes are inspected
  if_eligible: require frozen transfer for a Route A claim
  if_none_is_eligible: keep the claim internal and state why

objectives:
  primary: equal-group held-out conditional recorded-positive-pattern log-score gain of M2 over M1
  secondary: equal-group held-out conditional recorded-positive-pattern log-score gain of M1 over M0
  smallest_useful_primary_gain_bits_per_cell: 0.002
  smallest_useful_primary_gain_interpretation: exploratory bits per eligible cell, not a biological effect margin
  max_source_family_regression_bits_per_cell: 0.01
  secondary_can_rescue_failed_primary: false
  validity_requires:
    - adequate M1 calibration
    - exact probability normalization
    - no single-group dominance
    - no prespecified source family loses more than 0.01 bits per cell
    - calibrated full-search null

budgets:
  minimum_valid_trials: 40
  maximum_valid_trials: 88
  reference_trials_min: 8
  reference_trials_max: 16
  association_trials_min: 32
  association_trials_max: 72
  patience_valid_trials: 14
  patience_improvement_threshold_bits_per_cell: 0.002
  max_invalid_retries: 12
  cpu_core_hour_ceiling: 1800
  gpu_hour_ceiling: 0
  wall_clock_hour_ceiling: 144
  wall_clock_accounting_epoch: wall_reset_20261001
  wall_clock_reset_authorization: outputs/stage0/v3_wall_time_reset_authorization_20261001.json
  parallel_core_ceiling: 64
  memory_gb_ceiling: 512
  scratch_gb_ceiling: 1536

model_search_coverage:
  minimum_valid_anchor_trials: 16
  counted_within_total_valid_trials: true
  anchor_definition: >-
    a prespecified development trial testing an eligible model family or
    tuning boundary under the common M0 M1 and M2 specification
  must_cover:
    - sparse penalties and their declared tuning boundaries
    - every optional extension whose development trigger is met
    - ranks or complexity boundaries declared for each activated extension
  untriggered_extensions: record trigger not met and do not count them as anchors
  coverage_complete_when: >-
    at least 16 valid anchors cover every active family and its declared
    boundaries

full_search_null:
  replicates: 99
  generator: >-
    fitted active-v3 development M1 conditional on every fixed K_i_obs,
    conservative group, source, soma, eligible independent and technical
    covariates, and frozen mapping-quality state
  each_replicate_starts_with_empty_search_history: true
  rerun:
    - M0 and M1 development
    - M2 core, extension-trigger decisions, activated extensions, and model-search coverage
    - combination direction common support and applicability selection
    - active-v3 exploratory outcome classification and stopping decisions
  preserve:
    - biological groups group sizes and resource strata
    - soma position independent labels and technical covariates
    - frozen mapping-quality strata
    - fixed candidate panel T, label vocabulary, observation encoding, and every K_i_obs
  monte_carlo_p: (1 + null results at least as large as observed) / 100
  pass_threshold: 0.05
  rule: >-
    each null reruns every outcome-dependent choice with the active-v3 grammar,
    budgets, and stopping rules; the p value tests excess observation-pattern
    predictability, not biological co-projection

required_falsifiers:
  active_v3:
    - synthetic recovery for M0 M1 sparse M2 and every activated extension
    - >-
      conservative-group- and mapping-quality-stratum-preserving permutation of
      recorded-positive labels that preserves every K_i_obs
    - pair-feature identification and residualization checks
    - independent-label overlap confounding and ablation checks
    - capacity-matched noise interactions
    - leave-one-group pair resource and batch influence checks
    - source-position common-support checks
    - frozen target-boundary sensitivities for recorded-positive calls
  inactive_legacy_complete_set:
    status: inactive_under_active_v3
    checks:
      - matched branch path collateral and terminal-tree comparisons
      - frozen A+B versus A+C profile and its prespecified sensitivities

final_decision:
  active_v3:
    status: incomplete_search
    biological_candidate_promotion: inactive
    route_A: inactive
    route_B: inactive
    final_opening: forbidden_without_separately_frozen_v3_evaluation_contract
    permitted_result: observation-pattern evidence only
    completion_requirements:
      - at least 40 valid trials under one active-v3 M0 M1 and M2 specification
      - model-search coverage is complete under the 16-anchor rule
      - two adaptive successor cycles and two incumbent-challenger decisions
      - at least 40 percent of post-coverage trials devoted to active-v3 falsification
      - all 99 active-v3 full-search null reruns finish
      - reproducible refit and active-v3 required falsifiers pass
  legacy_complete_set_routes:
    status: inactive_under_active_v3
    route_A_residual_combination_with_anatomy:
      requires:
        - useful M2-over-M1 gain in final groups
        - a chosen combination that reproduces on common support
        - full-axon organization that survives matched structural comparisons
        - the within-A prediction also reproduces if that endpoint was activated
        - when a comparable independent resource exists its frozen transfer test supports the claim
    route_B_spatial_or_known_population_explanation:
      requires:
        - the combination phenomenon first reproduces in final groups
        - the spatial or independently labeled explanation reproduces and is calibrated
        - residual M2 value is bounded below the useful margin
        - synthetic recovery shows that useful residual effects were detectable
  predictive_gain_only: preliminary and not a candidate
  no_valid_comparison: no candidate

stopping:
  before_search: failed scientific measurability may lead to revise or stop
  after_search_begins_and_before_40_valid_trials: only for technical impossibility
  patience_starts_after: minimum valid trials and model-search coverage are complete
  patience_rule: >-
    use budgets.patience_valid_trials and
    budgets.patience_improvement_threshold_bits_per_cell
  resource_exhaustion: incomplete search
  budget_stop_is_success_or_negative_result: false

reporting:
  active_v3_show:
    - group position label coverage exclusions mapping quality and unknown-zero definition
    - K_i_obs and pair-informative support by conservative group
    - held-out M0 M1 and M2 recorded-positive-pattern prediction and calibration by group
    - selected recorded-positive combination contrasts across positions and applicability boundaries
    - independent-label contrasts and remaining confounding
    - active-v3 null and falsification results with observation-pattern interpretation
  inactive_legacy_complete_set_show:
    status: inactive_under_active_v3
    items:
      - branch shared-path collateral terminal-tree and boundary-reference results
      - pooled and context-specific shared-target profiles
      - external transfer or biological Route A or Route B claims
