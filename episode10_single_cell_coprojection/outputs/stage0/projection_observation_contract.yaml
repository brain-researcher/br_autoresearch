SWC_interpretation:
  columns: [node_id, node_type, x_um, y_um, z_um, radius_um, parent_id]
  comments_and_blank_lines: ignored
  columns_after_first_seven: ignored_and_counted_for_QC
  node_types:
    soma: [1]
    axon: [0, 2]
    excluded_dendrite: [3]
    ignored_markers: [10, 11, 12]
    any_other_type: global_unknown_and_exclusion
    release_specific_convention: >-
      Gao released CCFv3 SWCs use both type 0 and type 2 for axonal nodes;
      treating type 0 as axonal is release-specific and is not a generic SWC rule
  required_tree_checks:
    - all_coordinates_and_radii_are_finite
    - radii_are_nonnegative
    - node_IDs_are_unique_integers
    - exactly_one_root_has_parent_minus_one
    - the_unique_root_is_soma_type_1
    - exactly_one_soma_type_1_node_exists_and_it_is_the_unique_root
    - no_nonroot_soma_type_1_node_exists
    - every_nonroot_parent_exists
    - every_node_has_exactly_one_parent_path_to_the_root
    - no_cycle
    - at_least_one_positive_length_axon_edge_exists
  node_transition_rule:
    soma_1_to_axon_0_or_2: include_as_axon_edge
    soma_1_to_dendrite_3: allow_but_exclude_from_axon_analysis
    soma_1_to_marker_10_11_or_12: allow_terminal_marker_but_ignore_for_axon_analysis
    axon_0_or_2_to_axon_0_or_2: include_as_axon_edge
    axon_0_or_2_to_marker_10_11_or_12: allow_terminal_marker_but_ignore_for_axon_analysis
    dendrite_3_to_dendrite_3: allow_but_exclude_from_axon_analysis
    dendrite_3_to_marker_10_11_or_12: allow_terminal_marker_but_ignore_for_axon_analysis
    axon_0_or_2_to_dendrite_3: global_unknown_and_exclusion
    dendrite_3_to_axon_0_or_2: global_unknown_and_exclusion
    marker_10_11_or_12_with_any_child: global_unknown_and_exclusion
    any_transition_with_child_soma_1: global_unknown_and_exclusion
    any_transition_not_explicitly_allowed_above: global_unknown_and_exclusion
  axon_edge_rule:
    include_when_child_type_is_0_or_2_and_parent_type_is_0_1_or_2: true
    radius_is_used_for_target_calls: false
  rooted_axon_leaf: >-
    an axon type 0 or 2 node with no child of any node type after the complete
    transition rule passes; its incoming axon edge must have positive length to
    support a terminal-bearing detection

registration_and_complete_observation_eligibility:
  checks_are_frozen_before_outcomes: true
  required:
    - provider_hemisphere_agrees_with_registered_soma_side
    - registered_soma_is_in_bounds_and_maps_to_Allen_MOp_or_a_layer_descendant
    - every_positive_length_axon_subsegment_is_conserved_by_exact_atlas_allocation
    - every_nonzero_annotation_structure_ID_exists_in_the_pinned_ontology
    - no_positive_axon_length_is_outside_the_atlas_volume_or_in_annotation_zero
    - every_rooted_axon_leaf_maps_to_named_or_unclaimed_Allen_grey_matter
  terminal_leaf_in_fiber_tract_ventricle_groove_retina_or_other_nongrey: global_unknown_and_exclusion
  any_failed_required_check: all_coordinates_unknown_and_cell_excluded
  provider_reconstruction_label_alone_proves_biological_completeness: false
  eligible_call_interpretation: observed_in_the_eligible_released_reconstruction_only
  biological_absence_or_synaptic_absence_is_not_established: true

segment_allocation:
  method: exact_line_clipping_at_every_crossed_25um_voxel_and_ML_midline_plane
  do_not_assign_a_whole_edge_by_endpoint_or_midpoint: true
  each_positive_length_subsegment_uses_its_annotation_voxel_structure_ID: true
  laterality_reference: registered_soma_hemisphere
  midline_crossing_segments_are_split: true
  numerical_zero_tolerance_um: 1.0e-9
  recognized_QC_only_categories:
    - unclaimed_grey
    - fiber_tracts_structure_1009
    - ventricular_systems_structure_73
    - grooves_structure_1024
    - retina_structure_304325711
    - other_nongrey
    - annotation_zero
    - outside_volume

binary_target_observation:
  biological_quantity: reconstructed_terminal_bearing_axon_presence_in_a_fixed_target_and_side
  terminal_bearing_component: >-
    a connected set of positive-length clipped axon subsegments assigned to one
    target coordinate whose closure contains a rooted axon leaf and whose final
    positive-length incoming leaf-edge subsegment is assigned to that coordinate
  detected: at_least_one_terminal_bearing_component_exists
  passing_only: positive_attributed_axon_length_exists_but_no_terminal_bearing_component_exists
  not_observed_in_the_eligible_released_reconstruction: >-
    the cell passes global complete-observation eligibility and no
    terminal-bearing component exists; passing_only remains a separate flag
  descriptive_subcategories_with_binary_value_zero:
    - passing_only
    - no_occupancy
  zero_value_semantics: not_observed_in_the_eligible_released_reconstruction
  zero_is_biological_or_synaptic_absence: false
  unknown: any_global_tree_registration_or_complete_observation_failure
  unknown_is_zero: false
  passing_only_is_detected: false
  putative_terminal_leaf_is_a_synapse_or_bouton: false
  minimum_length_or_tip_count_threshold_selected_from_real_outcomes: forbidden
  provider_projection_class_or_regional_summary_used: false

complete_set_definition:
  cell_domain: >-
    development rows with primary_common_support=yes and
    primary_model_eligible=yes that also pass global observation eligibility
  frozen_development_support_domain_before_tree_QC: 200
  unsupported_development_rows_absent_from_acquisition_constructor_S_i_K_i_and_Omega_i: 9
  eligible_cell_V_i: all_16_primary_panel_coordinates
  S_i: all_detected_coordinates_in_V_i
  K_i: cardinality_of_S_i
  Omega_i: every_size_K_i_subset_of_V_i
  exact_normalization: required_for_every_model
  K_zero_and_K_one_are_valid_observations: true
  full_map_calls_outside_V_i_affect_S_i_or_K_i: false
  globally_unknown_cell_has_S_i_or_K_i: false
  same_cells_V_i_S_i_K_i_and_Omega_i_for_M0_M1_M2: true

target_boundary_sensitivity:
  primary: native_half_open_Allen_25um_target_masks
  sensitivity: one_voxel_internal_boundary_erosion
  erosion_definition: >-
    remove the one-voxel-thick 6-neighbor internal boundary layer from each
    named target mask, then reconstruct terminal-bearing calls without changing
    the vocabulary, panel, cell eligibility, or roles
  operation_order:
    - construct_each_bilateral_anatomical_target_mask_from_the_pinned_ontology
    - apply_six_neighbor_internal_erosion_before_laterality_assignment
    - split_retained_subsegments_at_the_frozen_ML_midline
    - assign_ipsilateral_or_contralateral_relative_to_the_registered_soma
  interior_voxel_rule: >-
    the voxel and all six axial neighbors must be in bounds and map to the same
    named anatomical target before laterality splitting
  boundary_neighbor_categories:
    - outside_volume
    - annotation_zero
    - non_grey
    - unclaimed_grey
    - any_other_named_target
  midline_is_an_erosion_boundary_before_laterality_split: false
  removed_boundary_voxels: excluded_from_the_eroded_sensitivity_not_reassigned
  voxel_width_um: 25
  sensitivity_is_primary_or_may_replace_primary: false
  use_to_choose_merge_or_drop_targets: forbidden
  report_call_changes_and_candidate_dependence: required
  execution_stage: sealed_post_candidate_only
  emitted_by_pre_candidate_constructor: false

branched_terminal_sensitivity:
  sensitivity: same_coordinate_branched_terminal
  detected: >-
    one coordinate component contains terminal incoming subsegments for at
    least two rooted axon leaves descended from one axon branch node with at
    least two axon children, with the connecting paths from that branch node
    to those leaves remaining within the same coordinate
  sensitivity_only: true
  sensitivity_is_primary_or_may_replace_primary: false
  use_to_choose_merge_drop_or_redefine_targets: forbidden
  report_call_changes_and_candidate_dependence: required
  execution_stage: sealed_post_candidate_only
  emitted_by_pre_candidate_constructor: false

pre_candidate_development_exposure:
  input_rows: exactly_200_primary_common_support_development_rows
  global_eligibility_QC_rows: exactly_those_200_rows
  primary_model_rows_before_global_tree_QC: 200
  unsupported_development_rows_not_downloaded_or_opened: 9
