    - cell_eligibility_qc.csv
    - aggregate_summary.json

role_and_access_boundary:
  role_assignment_precedes_target_outcomes: true
  development_constructor_input: development_role_only
  final_constructor_input: trusted_one_shot_evaluation_only_after_full_lock
  unassigned_units_enter_development_or_final: false
