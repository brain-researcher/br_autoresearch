interpretation_boundary:
  permitted: >-
    terminal-bearing targets observed in the eligible released reconstruction
    within the fixed motor-routing panel
  not_established:
    - synaptic_connectivity
    - bouton_presence_or_count
    - biological_absence
    - functional_coordination
    - causal_or_developmental_wiring_program
    - cross_animal_replication_without_an_author_certified_crosswalk
  full_tree_branch_and_terminal_anatomy: outcome_characterization_only_after_candidate_freeze
