revision_boundary:
  reason: >-
    V1 incorrectly treated provider custom node types 10, 11, and 12 as
    terminal-only markers; 141 of 200 frozen development files stopped at the
    first resulting transition or nonleaf-marker parser error.
  evidence_used:
    - v1_structural_failure_categories_and_first_failure_transitions
    - aggregate_topology_and_raw_type_counts_from_the_same_200_development_SWCs
    - public_INCF_SWC_specification
    - public_provider_pyswcloader_source_code
  candidate_target_prevalence_or_effect_used_to_choose_revision: false
  candidate_model_search_started: false
  v1_outputs_remain_failed_and_are_not_relabelled: true
  development_manifest_rows: 200
  development_groups_assigned: 12
  manifest_or_group_replacement: forbidden
  final_or_unassigned_morphology_access: forbidden

SWC_interpretation:
  mode: provider_native_topology_v2
  raw_types_are_rewritten: false
  topology_source: node_id_and_parent_id_only
  allowed_raw_types: [0, 1, 2, 3, 4, 10, 11, 12]
  provider_custom_types: [10, 11, 12]
  provider_custom_type_biological_meaning_assigned: false
  provider_axon_edge_rule: >-
    include edge (parent, child) exactly when neither endpoint raw type is 3 or 4
  provider_terminal_rule: >-
    a topology leaf whose raw type is neither 3 nor 4
  custom_type_code_does_not_by_itself_terminate_or_split_traversal: true
  type_1_parent_to_non_dendrite_child_edge_is_included: true
  retain_v1_tree_integrity_checks: true
  retain_v1_registration_and_complete_observation_checks: true
  provider_fidelity_caveat: >-
    the literal rule includes custom-to-custom edges even inside a custom
    component bounded by dendrite, while excluding its type-3/type-4 boundary
    edges; boundary relabelling is not introduced because it would be a new
    inferred rule
  primary_sources:
    INCF_custom_type_definition: >-
      https://github.com/INCF/swc-specification/blob/main/docs/source/swc.rst
    provider_edge_rule: >-
      https://github.com/txgxxx/pyswcloader/blob/bc64d464976dd4fad88619b64d91acd5999526fd/pyswcloader/projection.py#L14-L27
    provider_terminal_rule: >-
      https://github.com/txgxxx/pyswcloader/blob/bc64d464976dd4fad88619b64d91acd5999526fd/pyswcloader/projection.py#L108-L119

