scope:
  role: development_only
  final_or_unassigned_access: forbidden
  sole_numerical_change: >-
    After the unchanged v4 line search raises an all-finite zoom iteration
    ceiling or floating-point bracket-resolution failure, return the unchanged
    current iterate only when both the unchanged gradient tolerance and an
    upward-rounded conservative strong-convexity gap certificate pass.
  unchanged:
    - 194-cell 12-group development scope
    - 16-coordinate recorded-positive panel and unknown-zero semantics
    - 17-covariate by 15-target-contrast parameterization
    - exact fixed-K likelihood and analytic gradient
    - equal-group training weights
    - ridge penalty definition and 12-value lambda grid
    - descending strong-to-weak ridge path and preceding-lambda warm start
    - v4 deterministic expanding strong-Wolfe line search and predicate order
    - L-BFGS history size 255
    - per-fit maximum 2000 iterations
    - gradient infinity tolerance 1.0e-7
    - relative objective-accuracy tolerance 1.0e-10
    - no fallback optimizer

mathematical_certificate:
  objective: F(B) = conditional_fixed_K_NLL(B) + lambda * ||B||_2^2 / 2
  conditional_fixed_K_NLL_convex: true
  ridge_covers_every_parameter: true
  parameter_dimension: 255
  strong_convexity_modulus: lambda
  exact_bound: F(B) - F_star <= ||gradient F(B)||_2^2 / (2 * lambda)
  conservative_gate_bound: >-
    parameter_dimension * gradient_infinity_norm^2 / (2 * lambda)
  relative_scale: max(1, abs(F(B)))
  gate_arithmetic: >-
    Round every nonnegative multiplication and division result one binary64
    step toward positive infinity; reject every nonfinite intermediate.
  exact_l2_use: report_only
  conservative_dimension_times_infinity_norm_use: convergence_gate

solver:
  algorithm: deterministic_L_BFGS
  parameter_dimension: 255
  history_size: 255
  maximum_iterations: 2000
  line_search:
    implementation: unchanged_v4_byte_for_byte
    algorithm: deterministic_safeguarded_expanding_strong_Wolfe
    predicate_order: Armijo_then_curvature_then_bracketing_heuristics
    initial_step: 1.0
    armijo_c1: 1.0e-4
    curvature_c2: 0.9
    expansion_factor: 2.0
    maximum_step: 1048576.0
    maximum_evaluations: 80
    zoom:
      interpolation: deterministic_bisection
      bisection_fraction: 0.5
      maximum_iterations: 60
    acceptance_requires:
      - phi_alpha <= phi_0 + c1 * alpha * directional_derivative_0
      - abs(directional_derivative_alpha) <= c2 * abs(directional_derivative_0)
  convergence:
    gradient_infinity_tolerance: 1.0e-7
    relative_objective_tolerance: 1.0e-10
    ordinary_rule: gradient_pass AND successive_relative_change_pass
    certified_stall_rule: gradient_pass AND certified_relative_gap_pass
    certified_stall_eligible_failure_reasons:
      zoom_iteration_ceiling: strong-Wolfe zoom iteration ceiling reached
      bracket_floating_resolution: strong-Wolfe zoom bracket reached floating-point resolution
    eligible_failure_must_be_all_finite: true
    lambda_must_be_positive_finite: true
    objective_and_full_gradient_must_be_finite: true
    prior_successive_relative_change_is_not_overwritten: true
    certificate_returns_unchanged_iterate: true
    certificate_adds_accepted_step_or_history_pair: false
  curvature:
    floor_multiplier: 1.0e-14
    skipped_pair_action: continue_without_pair
  other_nonconvergence_or_line_search_failure: stop
  fallback_optimizer: forbidden

ridge_path:
  ordered_lambdas:
    - 1000.0
    - 100.0
    - 10.0
    - 1.0
    - 1.0e-1
    - 1.0e-2
    - 1.0e-3
    - 1.0e-4
    - 1.0e-5
    - 1.0e-6
    - 1.0e-7
    - 1.0e-8
  initialization:
    first_lambda: all_zero_coefficients
    later_lambdas: immediately_preceding_converged_coefficients
  auxiliary_lambdas: forbidden

