fixed_k_hessian:
  target_count: 16
  target_contrast_count: 15
  covariate_count: 17
  parameter_dimension: 255
  target_coding: orthonormal_Helmert
  exact_distribution: >-
    P(Y_i=y | K_i, eta_i) is proportional to exp(y transpose eta_i) over
    every binary size-K_i subset of the frozen 16-coordinate panel.
  eta: eta_i = x_i transpose B C transpose
  conditional_covariance: Sigma_i = Cov(Y_i | K_i, eta_i)
  contrast_covariance: A_i = C transpose Sigma_i C
  hessian_entry: >-
    H[(a,r),(b,s)] = sum_i w_i*x_i[a]*x_i[b]*A_i[r,s]
    + lambda*I[(a,r),(b,s)]
  positive_definiteness: >-
    For every nonzero U, inner(U,H[U]) is the weighted sum of conditional
    variances plus lambda times ||U||_F squared, and is therefore at least
    lambda times ||U||_F squared.
  pair_moments:
    diagonal: E[Y_t squared] = E[Y_t]
    off_diagonal: >-
      E[Y_t Y_u] = P(Y_t=1) times P(Y_u=1 | Y_t=1), where the conditional
      probability is computed by the same exact DP on the other 15 targets
      with fixed count K-1.
    implementation: sixteen_batched_exact_conditional_DPs
    K_0_or_16_covariance: exact_zero
    finite_arithmetic_symmetrization: average_both_conditional_pair_directions

solver:
  algorithm: deterministic_versioned_hybrid
  parameter_dimension: 255
  maximum_iterations: 2000
  branch:
    strong_grid:
      lambdas: [1000.0, 100.0, 10.0, 1.0, 1.0e-1, 1.0e-2, 1.0e-3, 1.0e-4, 1.0e-5]
      implementation: immutable_V5_bitwise_forward
    weak_grid:
      lambdas: [1.0e-6, 1.0e-7, 1.0e-8]
      implementation: exact_Hessian_line_search_Newton
  newton:
    factorization: deterministic_Cholesky
    initial_diagonal_shift: 0.0
    positive_shift_base: max(lambda, binary64_epsilon_times_max_1_or_H_infinity_norm)
    positive_shift_multiplier: 10.0
    maximum_shift_relative_to_H_scale: 1.0e-4
    maximum_positive_shift_attempts: 8
    iterative_refinement_steps: 2
    maximum_scaled_backward_error: 5.0e-11
    acceptance_requires:
      - finite symmetric exact Hessian
      - finite Cholesky solution
      - scaled backward error at or below 5e-11
      - strictly negative gradient-direction inner product
      - strictly positive quadratic predicted decrease under the undamped Hessian
    shift_interpretation: >-
      A positive diagonal shift changes only the optimization direction. The
      objective, gradient, ridge lambda, scoring, and convergence thresholds
      remain unchanged.
  line_search:
    implementation: unchanged_v4_byte_for_byte
    algorithm: deterministic_safeguarded_expanding_strong_Wolfe
    initial_step: 1.0
    armijo_c1: 1.0e-4
    curvature_c2: 0.9
    expansion_factor: 2.0
    maximum_step: 1048576.0
    maximum_evaluations: 80
    zoom:
      interpolation: deterministic_bisection
      bisection_fraction: 0.5
      maximum_iterations: 60
  convergence:
    gradient_infinity_tolerance: 1.0e-7
    relative_objective_tolerance: 1.0e-10
    ordinary_rule: gradient_pass AND successive_relative_change_pass
    certified_stall_rule: unchanged_V5_gradient_and_strong_convexity_gap_rule
  factorization_damping_or_line_search_failure: stop_unless_unchanged_V5_certificate_passes
  fallback_optimizer: forbidden

