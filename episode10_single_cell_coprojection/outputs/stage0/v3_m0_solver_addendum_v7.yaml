    - unchanged V4 exact strong-Wolfe line search
    - unchanged V5 eligible-stall certificate
    - 2000-iteration cap
    - gradient infinity tolerance 1e-7
    - relative objective-change tolerance 1e-10
    - no fallback optimizer

solver:
