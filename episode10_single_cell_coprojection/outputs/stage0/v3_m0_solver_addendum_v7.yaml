      - 1.0e-6
      - 1.0e-7
      - 1.0e-8
  exact_Hessian_implementation: unchanged_V6
  line_search: unchanged_V4_exact_strong_Wolfe
  eligible_stall_certificate: unchanged_V5
  convergence:
    gradient_infinity_tolerance: 1.0e-7
    relative_objective_tolerance: 1.0e-10
    ordinary_rule: gradient_pass AND successive_relative_change_pass
    certified_stall_rule: unchanged_V5_rule
  fallback_optimizer: forbidden

