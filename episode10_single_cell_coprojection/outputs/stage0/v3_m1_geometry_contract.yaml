atlas_anchor_construction:
  mask: annotation voxels whose ontology node is the anchor or its descendant
  physical_side_qc:
    required_for_every_anatomical_target: [left, right]
    retained_values:
      - voxel_count
      - AP_centroid_mm
      - DV_centroid_mm
      - ML_centroid_mm
    missing_or_empty_side: stop
  symmetric_numeric_anchor:
    AP_mm: arithmetic_mean_of_physical_left_and_right_AP_centroids
    DV_mm: arithmetic_mean_of_physical_left_and_right_DV_centroids
    lateral_depth_mm: >-
      arithmetic mean of midline minus left ML centroid and right ML centroid
      minus midline
    weighting: equal_physical_side_weight_not_voxel_or_sample_weight
    nonpositive_lateral_depth: stop
    nonfinite_value: stop
  canonical_relative_side:
    soma: mirror every physical soma to positive lateral depth
    ipsilateral_target: positive_symmetric_lateral_depth
    contralateral_target: negative_symmetric_lateral_depth
    rationale: >-
      use the same target anchor for left- and right-hemisphere somas so the
      158-right/36-left sample imbalance cannot select a different physical
      atlas centroid.

base_geometry:
  units: millimeters
  cell_target:
    rows: 3104
    definition: 194_cells_times_16_coordinates
    raw_reproducibility_values:
      - soma_AP_DV_ML
      - soma_lateral_depth
      - symmetric_target_AP_DV_lateral_depth
      - signed_canonical_target_lateral
      - delta_AP
      - delta_DV
      - delta_lateral
      - soma_target_Euclidean_distance
  target_pair:
    rows: 120
    definition: choose_16_2
    raw_reproducibility_values:
      - delta_AP
      - delta_DV
      - delta_lateral
      - target_pair_Euclidean_distance
      - cross_side_indicator
      - homotopic_indicator
  imputation_or_row_drop: forbidden
  missing_mask_side_or_nonfinite_geometry: stop

model_set_features:
  domain: every_subset_Omega_of_the_fixed_16_panel
  source: base_geometry_only
  outcome_or_realized_route_input: forbidden
  ordered_features:
    - mean_soma_target_distance_mm
    - sd_soma_target_distance_mm
    - mean_target_pair_distance_mm
    - cross_side_pair_fraction
    - homotopic_pair_fraction
    - mst_mean_edge_length_mm
  formulas:
    mean_soma_target_distance_mm: arithmetic_mean_over_targets_in_Omega
    sd_soma_target_distance_mm: population_SD_over_targets_in_Omega
    mean_target_pair_distance_mm: arithmetic_mean_over_unordered_pairs_in_Omega
    cross_side_pair_fraction: mean_cross_side_indicator_over_unordered_pairs
    homotopic_pair_fraction: mean_homotopic_indicator_over_unordered_pairs
    mst_mean_edge_length_mm: >-
      deterministic Kruskal minimum-spanning-tree total edge length divided by
      K minus 1, with ties ordered by coordinate indexes
  edge_cases:
    K_0:
      all_six_features: 0.0
    K_1:
      mean_soma_target_distance_mm: defined_single_target_distance
      sd_soma_target_distance_mm: 0.0
      mean_target_pair_distance_mm: 0.0
      cross_side_pair_fraction: 0.0
      homotopic_pair_fraction: 0.0
      mst_mean_edge_length_mm: 0.0
  downstream_standardization: training_fold_only_and_not_performed_here

required_outputs_on_execute:
  atlas_target_anchors.csv: 16_rows
  cell_target_geometry.csv: 3104_rows
  target_pair_geometry.csv: 120_rows
  geometry_summary.json: pass_or_stop_summary
  no_other_output: true

