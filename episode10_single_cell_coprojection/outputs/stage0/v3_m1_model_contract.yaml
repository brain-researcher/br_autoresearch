    rows_and_groups: exact_194_rows_and_12_conservative_groups
    frozen_group_order:
      - "212074"
      - "220187"
      - "220188"
      - "220190"
      - "221091"
      - "221225"
      - "221418"
      - "221514"
      - "221539"
      - "221588"
      - "221751"
      - "233281"
    rank_scenario: >-
      Number groups by zero-based ordinal g in frozen_group_order. Within each
      group sort rows by numeric provider_neuron_id, number them by zero-based
      j, and assign K = 1 + ((j + 7*g) modulo 15).
      This deterministic target-free schedule covers K 1 through 15 without
      reading any real K or target call.
    worst_case_throughput_scenario: K_equals_8_for_all_194_rows
    synthetic_observed_sets: >-
      Let zero-based global row ordinal r be the cumulative group-major order
      from frozen_group_order and numeric provider_neuron_id within group;
      choose lexicographic candidate index
      (104729 * r) modulo choose(16,K). The fixed step is coprime to every
      candidate count used here; no target outcome enters this choice.
    initial_Slurm_probe_request:
      partitions: [russpold, normal]
      wall_time: "08:00:00"
      cpus_per_task: 4
      memory: 16G
      GPU: none
      BLAS_threads: 4
    benchmark_operations:
      mixed_K_rank_scenario:
        - exhaustive_candidate_feature_cache_build_and_fold_scales
        - within_cell_joint_Gram_geometry_Schur_rank_and_condition
        - no_optimizer_or_observed_target_fit
      all_K8_throughput_scenario:
        - exhaustive_candidate_feature_cache_build_and_fold_scales
        - exact_objective_gradient_and_full_Hessian_evaluation
        - deterministic_Cholesky_factorization_and_Newton_solve
        - complete_12_lambda_warm_path
    frozen_work_projection:
      unique_training_sets:
        leave_two_groups_out: 66
        leave_one_group_out: 12
        full_development: 1
        total: 79
      uncached_production_path_equivalents_for_pass: >-
        132 ordered outer-inner 12-lambda paths plus 12 full-development
        tuning paths plus 12 selected outer refits and one full refit. Because
        a zero-start single-lambda refit is not guaranteed to cost at most the
        average lambda in a warm path, charge each of those 13 refits as one
        complete path. The conservative budget total is therefore 157 path
        equivalents.
      exact_training_set_reuse_report_only: >-
        Reusing mathematically identical leave-two-group training paths would
        require 66 leave-two paths plus 12 leave-one tuning paths, while the
        13 zero-start refits are each still charged as one complete path, for
        91 conservative path equivalents. Report this separately, but do not
        use it for the compute-budget pass decision.
    required_measurements:
      - elapsed_wall_seconds
      - candidate_sets_scored_per_second
      - objective_gradient_Hessian_seconds
      - factorization_seconds
      - Slurm_MaxRSS
    pass_rule: >-
      All values and derivatives are finite and deterministic, the run
      completes within 80 percent of its frozen initial Slurm time request,
      MaxRSS remains below 80 percent of its requested memory, and a projection
      of all frozen outer, inner, and full-refit work is individually
      compatible with the episode's total CPU, wall-clock, memory, parallelism,
      and Scratch ceilings. This probe may not claim remaining-budget
      compatibility because no frozen prior-usage ledger exists.
    remaining_budget_reconciliation: >-
      Required after the target-free job and before any actual-K gate or real
      M1 submission. Reconcile known EP10 Slurm use and durable/Scratch use
      against the policy ceilings, report the accounting basis, and stop if
      the conservative remaining budget cannot cover the production projection.
    production_resource_request_rule: >-
      Choose resources only after this benchmark and current sh_part discovery,
      retaining at least 25 percent headroom above measured elapsed time and
      MaxRSS; benchmark completion alone does not authorize real M1 execution.

