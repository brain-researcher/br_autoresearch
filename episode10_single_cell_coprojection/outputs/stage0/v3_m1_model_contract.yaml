      form any observed set and do not select features from candidate effects.
  deterministic_warm_vs_zero:
    data: deterministic_synthetic_only
    deterministic_seed: 20260928
    random_generator: numpy_Generator_PCG64
    rows: 68
    groups: 4_equal_groups_of_17_rows
    row_order: >-
      Synthetic groups are zero-based g=0..3, rows are zero-based j=0..16,
      and global row_index = 17*g+j; consume rows in increasing global order.
    K_schedule: K_equals_j_so_every_group_contains_each_K_0_through_16_exactly_once
    generator: >-
      Independently repeat the frozen synthetic anchors, covariate formulas,
      planted B, and planted gamma from target_free_synthetic_recovery. Using
      the warm-gate seed, first consume exactly three standard normals per row
      in global order; build transforms, exhaustive features, and the 68-row
      geometry scales; then consume exactly one categorical uniform per row in
      global order and draw its observed set from the planted exact softmax.
      No other random variates are permitted.
    exact_unique_candidate_states_per_objective: 262144
    exact_score_computations_per_two_pass_objective: 524288
    every_lambda_in_the_12_value_grid: true
    warm_path_repeats: 2
    repeat_objective_absolute_tolerance: 1.0e-12
    repeat_coefficient_max_absolute_tolerance: 1.0e-10
    repeat_probability_max_absolute_tolerance: 1.0e-10
    zero_start_objective_absolute_tolerance: >-
      max(1e-10, 1.1 * 261 * 1e-7^2 / (2 * lambda))
    zero_start_probability_max_absolute_tolerance: 1.0e-5
    zero_start_log_probability_max_absolute_tolerance: 1.0e-4
    every_fit_must_meet_the_frozen_convergence_witness: true
  target_free_real_shape_benchmark:
    permitted_real_inputs:
      - v3_model_interface.csv
      - atlas_target_anchors.csv
      - cell_target_geometry.csv
      - target_pair_geometry.csv
    forbidden_inputs:
