schema_version: episode10_v3_m1_model_v1
episode_id: ep10
recorded_date: "2026-09-27"
status: frozen_before_implementation_and_real_M1_execution
analysis_label: exploratory

design_timing:
  trigger: M0_production_mechanically_passed
  model_design_recommendation_formed: before_M0_production_reached_a_terminal_state
  durable_contract_written: after_M0_mechanical_PASS_was_reported
  freeze_basis: >-
    The pre-terminal recommendation chose this minimal global M1 from the
    prospectively frozen M0 model, target-blind atlas-geometry contract, active
    v3 policy, and computational requirements. Writing that recommendation
    into this durable contract after mechanical PASS does not reopen the
    choice or condition it on realized M0 scientific results.
  choice_independence: >-
    The M1 design must remain exactly the pre-terminal recommendation whether
    or not any M0 postflight quantities were separately observed for
    operational purposes; none may alter this contract choice.
  forbidden_design_inputs:
    - realized M0 cross-fitted scores or gains
    - realized M0 selected lambdas or boundary counts
    - realized M0 coefficients, predictions, residuals, or calibration
    - candidate target-pair or target-set effects
    - final or unassigned data
  M0_mechanical_completion_is_not_scientific_outcome_evidence: true

authority:
  active_policy: SEARCH_POLICY.yaml
  observation_contract: projection_observation_contract_v3.yaml
  model_interface_contract: v3_model_interface_contract.yaml
  M0_contract:
    path: v3_m0_model_contract.yaml
    required_schema_version: episode10_v3_m0_model_v1
  M0_numerical_reference:
    path: v3_m0_solver_addendum_v7.yaml
    required_schema_version: episode10_v3_m0_solver_addendum_v7
    role: gamma_zero_numerical_parity_and_existing_cross_fitted_comparator
    changes_M1_scientific_model: false
  geometry_contract:
    path: v3_m1_geometry_contract.yaml
    required_schema_version: episode10_v3_m1_geometry_v1
  scientific_authority: false

sealed_scope:
  role: development_only
  required_cells: 194
  required_groups: 12
  final_or_unassigned_access: forbidden
  observed_set: mapped_positive_terminal_observations_within_the_frozen_16_coordinate_panel
  target_zero_semantics: >-
    No mapped positive terminal observation was recorded for this coordinate;
    zero is unknown and is not a biological absence, verified non-detection,
    or negative label.
  model_estimand: >-
    Conditional distribution of recorded-positive label sets at the observed
    recorded-positive count K_i_obs, not a complete biological target set.
  permitted_interpretation: >-
    Geometry-associated recorded-positive observation-pattern structure beyond
    M0 within the development groups.
  forbidden_interpretations:
    - realized axon route or path-length prediction
    - biological target presence, absence, or exclusivity
    - synaptic connectivity
    - causal, energetic, or developmental routing mechanism
    - biological candidate promotion or final-group confirmation

required_inputs:
  exact_scratch_parent_below_SCRATCH: br_autoresearch/episode10_single_cell_coprojection
  target_root:
    required_basename: gao_mop_development_targets_v3_ep10_assets
    required_file: primary_16_target_calls.csv
    required_gate_summary: v3_gate_summary.json
    first_permitted_access: >-
      After all target-free gates pass, a sealed pre-fit check may read only
      provider_neuron_id and physical column K, whose semantic alias is
      K_i_obs, for the actual-K rank/condition gate.
      Realized set identity may be read only after that gate also passes.
  interface_root:
    required_basename: v3_model_interface_preflight_v1
    required_file: v3_model_interface.csv
    required_gate_summary: v3_model_interface_summary.json
  geometry_root:
    required_basename: v3_m1_geometry_v1
    required_files:
      - atlas_target_anchors.csv
      - cell_target_geometry.csv
      - target_pair_geometry.csv
      - geometry_summary.json
    required_summary_status: pass
    target_calls_or_realized_routes_used_to_construct_geometry: false
  M0_comparator_root:
    required_basename: v3_m0_fit_v7
    required_file: v3_m0_cross_fitted_predictions.csv
    required_score_column: M0_outer_cross_fitted_log2_probability
    required_join_columns: [provider_neuron_id, fMOST_brain_id]
    required_role: outer_cross_fitted_development_predictions_only
    full_development_refit_or_in_sample_score_as_comparator: forbidden
    access_timing: >-
      May be read only after every target-free gate and the actual-K-only gate
      have passed and after real M1 outer-cross-fitted predictions exist, for
      the mechanical paired M1-minus-M0 score calculation. It is forbidden to
      every target-free probe, the actual-K-only gate, M1 design, tuning,
      initialization, and fitting code.
  join:
    key: provider_neuron_id
    cardinality: one_to_one
    exact_identity_set_required: true
    exact_group_match_required: true
  expected_group_sizes:
    "212074": 6
    "220187": 35
    "220188": 25
    "220190": 16
    "221091": 33
    "221225": 39
    "221418": 12
    "221514": 5
    "221539": 1
    "221588": 7
    "221751": 13
    "233281": 2

fixed_panel:
  size: 16
  ordered_coordinate_ids:
    - allen_993_MOs__ipsilateral
    - allen_993_MOs__contralateral
    - allen_453_SS__ipsilateral
    - allen_453_SS__contralateral
    - allen_31_ACA__ipsilateral
    - allen_31_ACA__contralateral
    - allen_477_STR__ipsilateral
    - allen_477_STR__contralateral
    - allen_549_TH__ipsilateral
    - allen_549_TH__contralateral
    - allen_313_MB__ipsilateral
    - allen_313_MB__contralateral
    - allen_771_P__ipsilateral
    - allen_771_P__contralateral
    - allen_354_MY__ipsilateral
    - allen_354_MY__contralateral
  observed_count: K_i_obs
  candidate_space: every_size_K_i_obs_subset_of_the_fixed_panel
  candidate_order: lexicographic_by_ordered_coordinate_index
  outcome_dependent_replacement_shrinkage_or_reordering: forbidden

M0_block:
  inherited_without_deletion: true
  covariate_count: 17
  ordered_covariates: identical_to_v3_m0_model_contract
  target_coding: identical_orthonormal_Helmert_C_with_shape_16_by_15
  coefficient: B
  coefficient_shape: [17, 15]
  additive_target_score: eta_i = C (B^T x_i)
  fold_local_covariate_transforms: identical_to_v3_m0_model_contract
  production_M0_coefficients_used_as_offset_or_initialization: false

geometry_block:
  coefficient: gamma
  coefficient_shape: [6]
  sharing: one_global_vector_across_all_cells_groups_K_values_and_targets
  source: target_blind_base_geometry_from_v3_m1_geometry_contract_only
  ordered_raw_features:
    - mean_soma_target_distance_mm
    - sd_soma_target_distance_mm
    - mean_target_pair_distance_mm
    - cross_side_pair_fraction
    - homotopic_pair_fraction
    - mst_mean_edge_length_mm
  cell_candidate_centering:
    raw_vector: z_i(S)
    center: >-
      m_i = (1 / |Omega_i|) * sum over A in Omega_i of z_i(A), computed
      by exhaustive uniform enumeration using only cell geometry and K_i_obs.
    centered_vector: c_i(S) = z_i(S) - m_i
    performed_for_training_and_validation_cells: true
    learned_from_observed_P_i: false
    interpretation: >-
      Centering subtracts a cell-specific constant shared by every candidate
      and therefore cannot change that cell's conditional probabilities.
  training_fold_scaling:
    one_scale_per_feature: true
    formula: >-
      r_j(F) = sqrt((1 / G_F) * sum over training groups g of
      (1 / n_g) * sum over training cells i in g of
      (1 / |Omega_i|) * sum over A in Omega_i of c_ij(A)^2).
    weighting_order:
      - equal_weight_per_training_group
      - equal_weight_per_cell_within_training_group
      - equal_uniform_weight_per_candidate_within_cell
    scaled_vector: ztilde_ij(S) = c_ij(S) / r_j(F)
    validation_rule: >-
      Center within the validation cell's own Omega_i, then divide by the
      training-fold r_j(F) unchanged; validation cells never enter r_j(F).
    recompute_for_every_distinct_training_fold: true
    scale_by_K_group_or_target: false
    observed_candidate_receives_special_weight: false
    zero_negative_or_nonfinite_scale: stop
  K_edge_cases:
    K_0_or_16: singleton_Omega_and_all_six_centered_features_exactly_zero
    K_1: use_geometry_contract_raw_edge_case_then_center_over_all_16_singletons

model:
  name: M1_global_atlas_geometry
  family: exact_conditional_fixed_K_set_softmax
  candidate_score: >-
    q_i(S; B, gamma) = sum over t in S of eta_it(B)
    + gamma^T ztilde_i(S).
  probability: >-
    Pr(P_i = S | K_i_obs, x_i, geometry) equals exp(q_i(S)) divided by
    the sum of exp(q_i(A)) over every A in Omega_i.
  nesting:
    gamma_equals_zero: exact_M0_probability_model_for_the_same_B
    B_is_refit_jointly_with_gamma: true
    frozen_M0_offset_or_two_stage_residual_fit: forbidden
  parameterization:
    B_shape: [17, 15]
    gamma_shape: [6]
    total_dimension: 261
    one_shared_ridge_lambda_for_B_and_gamma: true
  exact_normalization:
    method: exhaustive_candidate_enumeration_and_stable_logsumexp
    arithmetic: binary64
    stable_logsumexp: subtract_exact_finite_candidate_score_maximum_before_exp_sum
    approximation_pruning_sampling_or_pseudolikelihood: forbidden
    nonfinite_candidate_score_or_normalizer: stop
  bounded_exact_representation:
    candidate_by_261_sufficient_statistic_materialization: forbidden
    single_cell_candidate_by_261_sufficient_statistic_materialization: forbidden
    all_cells_candidate_cache: forbidden
    fixed_candidate_batch_maximum: 4096
    permitted_reusable_cache: >-
      Lexicographically ordered candidate membership and 15-dimensional
      target-contrast sums for each K, plus exactly the four target-pair-only
      raw columns mean_target_pair_distance_mm, cross_side_pair_fraction,
      homotopic_pair_fraction, and mst_mean_edge_length_mm. These four columns
      are cell-independent and target-outcome-independent. The total candidate
      count over all K is exactly 65536; no soma-distance or cell-by-candidate
      feature cache is permitted.
    two_pass_per_cell_accumulation:
      pass_1: finite_maximum_candidate_score_over_all_batches
      pass_2: >-
        In fixed lexicographic batches, accumulate exp(score-max), the exact
        first moment, and the exact second moment of the 21-dimensional vector
        formed by the 15 target contrasts followed by six geometry features.
      approximation_or_candidate_drop: forbidden
    Hessian_expansion: >-
      Expand the B-by-B block from target-contrast covariance and x_i,
      the B-by-gamma block from exact target-contrast/geometry
      cross-covariance and x_i, and the gamma-by-gamma block from geometry
      covariance; this is algebraically identical to Cov(F_i) without a
      candidate-by-261 matrix.
    accumulation_order: fixed_cell_order_then_lexicographic_candidate_order_in_binary64

objective_and_derivatives:
  training_objective: >-
    Mean equal-group exact conditional NLL in nats plus
    lambda * (||B||_F^2 + ||gamma||_2^2) / 2.
  cell_weight_in_training_set: 1/(number_of_training_groups * cells_in_its_group)
  ridge_penalty_applies_to:
    - every_element_of_B_including_the_intercept_row
    - every_element_of_gamma
  unpenalized_parameter: none
  sufficient_statistic:
    target_contrast_sum: a_i(S) = C^T 1_S
    B_block: vectorize_row_major(x_i outer_product a_i(S))
    geometry_block: ztilde_i(S)
    joint_vector: concatenate_B_block_then_geometry_block
  exact_gradient: >-
    Equal-group weighted sum of model-expected joint sufficient statistic
    minus its observed value, plus lambda times the joint parameter vector.
  exact_Hessian: >-
    Equal-group weighted sum of the exact conditional covariance of the joint
    sufficient statistic under the exhaustive candidate probabilities, plus
    lambda times the 261-by-261 identity matrix.
  B_gamma_cross_block: exact_conditional_cross_covariance_not_zeroed_or_approximated
  strong_convexity: every_grid_lambda_is_positive_and_Hessian_is_at_least_lambda_I

estimation:
  lambda_grid:
    - 1.0e-8
    - 1.0e-7
    - 1.0e-6
    - 1.0e-5
    - 1.0e-4
    - 1.0e-3
    - 1.0e-2
    - 1.0e-1
    - 1.0
    - 10.0
    - 100.0
    - 1000.0
  ridge_path_order:
    - 1000.0
    - 100.0
    - 10.0
    - 1.0
    - 1.0e-1
    - 1.0e-2
    - 1.0e-3
    - 1.0e-4
    - 1.0e-5
    - 1.0e-6
    - 1.0e-7
    - 1.0e-8
  initialization:
    first_lambda: all_261_parameters_zero
    later_lambdas: immediately_preceding_converged_joint_B_and_gamma
    warm_start_across_distinct_training_folds: forbidden
    production_M0_fit_as_initialization: forbidden
  optimizer:
    algorithm: deterministic_exact_Hessian_line_search_Newton
    Hessian_factorization: deterministic_Cholesky
    Cholesky_direction:
      initial_diagonal_shift: 0.0
      positive_shift_base: max(lambda, binary64_epsilon_times_max_1_or_H_infinity_norm)
      positive_shift_multiplier: 10.0
      maximum_shift_relative_to_H_scale: 1.0e-4
      maximum_positive_shift_attempts: 8
      iterative_refinement_steps: 2
      maximum_scaled_backward_error: 5.0e-11
      interpretation: >-
        A positive shift changes only the proposed Newton direction; it never
        changes the objective, gradient, ridge lambda, score, or convergence
        thresholds.
    line_search: deterministic_safeguarded_expanding_strong_Wolfe
    initial_step: 1.0
    armijo_c1: 1.0e-4
    curvature_c2: 0.9
    expansion_factor: 2.0
    maximum_step: 1048576.0
    maximum_line_search_evaluations: 80
    zoom: deterministic_bisection
    maximum_zoom_iterations: 60
    maximum_optimizer_iterations: 2000
    gradient_infinity_tolerance: 1.0e-7
    relative_objective_tolerance: 1.0e-10
    convergence_requires_both_tolerances: true
    eligible_finite_precision_stall_certificate:
      eligible_failures:
        - strong_Wolfe_zoom_iteration_ceiling_reached_with_all_values_finite
        - strong_Wolfe_zoom_bracket_reached_binary64_resolution_with_all_values_finite
      gradient_infinity_must_not_exceed: 1.0e-7
      conservative_relative_gap_upper_bound: >-
        upward-rounded 261 * gradient_infinity^2 / (2 * lambda)
        divided by max(1, absolute_objective)
      maximum_conservative_relative_gap: 1.0e-10
      state_or_history_mutation_before_certificate: forbidden
      any_other_failure: stop
    fallback_optimizer: forbidden
    nonconvergence_factorization_or_line_search_failure: stop_before_real_M1_result

resampling:
  outer:
    method: leave_one_conservative_group_out
    folds: 12
    held_out_group_never_enters_covariate_transforms_geometry_scales_or_tuning: true
  inner:
    method: leave_one_remaining_group_out
    folds_per_outer_split: 11
  fold_fit:
    joint_refit_of_B_and_gamma: required
    training_only_M0_covariate_transforms: required
    training_only_geometry_RMS_scales: required
    same_12_lambda_grid_for_every_fold: true
    tuning_paths_use_descending_warm_starts: true
    selected_lambda_outer_refit_initialization: all_261_parameters_zero
  selection:
    criterion: minimum_equal_group_inner_validation_data_NLL_without_ridge_penalty
    standard_error: sample_SD_of_the_11_inner_group_mean_NLLs_divided_by_sqrt_11
    one_standard_error_rule: >-
      Select the largest lambda whose mean inner validation NLL is no more
      than the minimum mean plus the standard error at the minimum.
    ties: largest_lambda
    realized_M0_selected_lambda_used_by_M1: false
  boundary_review:
    boundary: smallest_or_largest_lambda_in_grid
    stop_if_boundary_selected_in_at_least_outer_folds: 6
  full_development_refit:
    tuning: 12_fold_leave_one_group_out
    standard_error: sample_SD_of_the_12_held_group_mean_NLLs_divided_by_sqrt_12
    selection: same_largest_lambda_one_SE_rule_and_largest_lambda_tie_break
    fit: joint_B_and_gamma_on_all_194_development_rows_at_the_selected_lambda
    initialization: all_261_parameters_zero
    purpose: coefficient_artifact_only_development_performance_remains_cross_fitted

scoring:
  cell_log_score: exact_log2_probability_of_the_observed_recorded_positive_set
  per_group: mean_cell_log2_probability
  aggregate: one_twelfth_sum_of_the_12_group_means
  secondary_gain: paired_cellwise_M1_minus_M0_exact_log2_probability
  aggregate_secondary_gain: equal_group_mean_of_paired_cellwise_gains
  M0_comparator: existing_v3_m0_fit_v7_outer_cross_fitted_log2_probability
  pairing_keys: [provider_neuron_id, fMOST_brain_id]
  pair_set_requirement: exact_same_194_cells_and_12_outer_folds
  full_refit_or_in_sample_M0_comparison: forbidden
  denominator: all_194_cells_including_K_i_obs_0_or_16
  degenerate_K_i_obs_0_or_16_gain: exactly_zero
  geometry_coefficients_as_biological_effects: forbidden

calibration:
  predictions: outer_cross_fitted_exact_inclusion_marginals_from_exhaustive_candidates
  group_by_target_residual: group_mean_of_observed_indicator_minus_exact_marginal
  per_group_marginal_Brier: mean_over_cells_and_16_targets_of_squared_observed_minus_exact_marginal
  bins: forbidden

required_outputs_on_execute:
  files:
    - v3_m1_cross_fitted_predictions.csv
    - v3_m1_fit_summary.json
    - v3_m1_full_refit.json
    - v3_m1_solver_telemetry.json
  interpretation: development_only_exploratory_observation_pattern_artifacts
  final_or_unassigned_content: forbidden
  full_refit_artifact_must_include:
    - ordered_target_contrast_definition
    - ordered_M0_covariates_and_full_development_transforms
    - ordered_six_geometry_features_and_full_development_RMS_scales
    - selected_lambda_and_12_group_one_SE_table
    - B_17_by_15
    - gamma_length_6

pre_real_M1_gates:
  general:
    every_target_free_gate_must_pass_before_first_target_file_access: true
    actual_K_gate_must_then_pass_before_any_fit_to_real_observed_P_i: true
    implementation_or_launcher_exists_at_contract_freeze: false
    observed_target_call_file_access_during_target_free_gates: forbidden
    M0_prediction_or_fit_artifact_access_during_all_pre_fit_gates: forbidden
    gate_failure_action: stop_and_freeze_a_reviewed_addendum_before_any_real_M1
  exact_enumeration_and_K_edges:
    require_every_K: every_integer_0_through_16
    candidate_count: exactly_choose_16_K
    K_0_or_16:
      probability_of_single_candidate: 1.0
      unpenalized_data_NLL_data_gradient_and_data_Hessian: exact_zero
      total_penalized_objective_gradient_and_Hessian: ridge_terms_remain
      all_centered_geometry_features: exact_zero
    K_1_raw_geometry: identical_to_v3_m1_geometry_contract
    stable_logsumexp_vs_independent_bruteforce_absolute_tolerance: 1.0e-12
  gamma_zero_M0_parity:
    same_B_same_rows_same_lambda_required: true
    candidate_score_maximum_absolute_difference: 1.0e-12
    probability_NLL_and_inclusion_marginal_maximum_absolute_difference: 1.0e-10
    B_gradient_maximum_absolute_difference: 1.0e-9
    B_by_B_Hessian_block_maximum_absolute_difference: 1.0e-8
    gamma_gradient_required_to_be_zero: false
  finite_difference_derivatives:
    all_261_gradient_coordinates: central_difference
    gradient_absolute_tolerance: 1.0e-6
    gradient_relative_tolerance: 1.0e-5
    Hessian_vector_directions: 8
    Hessian_vector_method: central_difference_of_analytic_gradient
    Hessian_vector_absolute_tolerance: 1.0e-5
    Hessian_vector_relative_tolerance: 1.0e-4
    exact_Hessian_symmetry_absolute_tolerance: 1.0e-12
    ridge_lower_eigenvalue_check: >-
      smallest eigenvalue of the symmetrized analytic Hessian must be at least
      lambda minus 1e-10 times max(1, Hessian spectral norm)
  target_free_synthetic_recovery:
    deterministic_seed: 20260927
    random_generator: numpy_Generator_PCG64
    synthetic_rows: 544
    groups: 16_equal_groups_of_34_rows
    row_and_RNG_order: >-
      Synthetic groups are zero-based g=0..15; rows within each group are
      zero-based j=0..33; global row_index = 34*g+j. Use one PCG64 generator.
      First draw and store exactly three standard normals for each row in
      increasing global row_index order. After every design transform and
      candidate feature/scale is built, draw and immediately consume exactly
      one categorical uniform for each row in the same increasing order. No
      other random variate may be consumed between or within those two blocks.
    K_schedule: >-
      Within each synthetic group, local row index modulo 17; every group
      contains exactly two rows at every K from 0 through 16.
    exact_unique_candidate_states_per_objective: 2097152
    exact_score_computations_per_two_pass_objective: 4194304
    real_target_calls_or_real_K_i_obs: forbidden
    generator_order:
      - >-
        For pair index h=0..7, set synthetic target AP=1.2+0.65*h,
        DV=0.7+0.22*((3*h) modulo 8), and lateral depth=0.8+0.17*h;
        emit ipsilateral then contralateral signed lateral coordinates.
      - >-
        Draw exactly three independent standard normals per row; set soma
        AP=3.0+0.7*N1, DV=2.5+0.5*N2, and positive lateral
        depth=0.75+0.5*abs(N3).
      - >-
        Assign layer by row_index modulo 4, physical hemisphere by row_index
        modulo 2, and segment_unmapped=1 exactly when row_index modulo 5 is 0.
      - >-
        Build the frozen 17-column M0 design and all six candidate-set
        geometry features with the contract transforms, then draw one
        categorical set per row from the exact planted softmax using the next
        PCG64 uniform variate.
    synthetic_geometry: same_six_formulas_as_v3_m1_geometry_contract
    planted_B: >-
      B[a,r] is proportional to
      0.08*sin((a+1)*(r+1)) + 0.04*cos((a+2)*(r+1)), then the complete
      17-by-15 matrix is rescaled to Frobenius norm 1.5.
    planted_gamma: [0.45, -0.35, 0.30, 0.25, -0.20, 0.40]
    recovery_fit_lambda: 1.0e-6
    lambda_tuning_or_nested_resampling: forbidden_for_this_recovery_gate
    observed_set_generation: exact_categorical_draw_from_exhaustive_set_softmax
    requirements:
      - nonzero_planted_B_and_nonzero_planted_gamma
      - every_K_0_through_16_represented
      - full_rank_joint_candidate_contrast_design
      - exact_generation_from_the_same_fixed_K_set_softmax
    mean_conditional_KL_maximum_bits: 0.01
    exact_inclusion_marginal_MAE_maximum: 0.02
    planted_vs_recovered_gamma_cosine_similarity_minimum: 0.90
  rank_and_condition:
    status: unverified_pending_target_free_probe
    role: >-
      Conservative pre-outcome evidence that geometry contributes six
      numerically distinct directions beyond the frozen M0 block; it is not a
      mathematical requirement for a unique penalized fit because every
      lambda is positive and already makes the penalized Hessian positive
      definite.
    candidate_contrast_Gram_definition: >-
      G_F = sum over training cells i of w_i times
      Cov_{A uniformly distributed on Omega_i}[F_i(A)], where
      w_i = 1/(G_F_groups * n_group_i), F_i(A) is the transformed
      261-dimensional joint sufficient statistic, and each covariance is
      formed within that cell before the weighted sum. A pooled covariance
      over all cell-candidate rows is forbidden because cellwise constants
      cancel from the conditional likelihood.
    geometry_beyond_M0_check: >-
      In addition to the full Gram, compute the six-dimensional Schur
      complement of the B block, or an algebraically equivalent weighted
      residualization of geometry against the B sufficient-statistic span.
    geometry_block_numerical_rank_required: 6
    joint_numerical_rank_required: 261
    numerical_rank_tolerance: max_matrix_dimension_times_binary64_epsilon_times_largest_singular_value
    maximum_joint_condition_number_2: 1.0e+10
    required_for:
      - the_single_full_544_row_synthetic_recovery_training_set
      - every_target_free_real_shape_mixed_K_training_fold
    failure_action: >-
      Stop before real M1 and revise only from target-free evidence under a
      newly frozen contract; do not drop, merge, or select geometry features
      after inspecting observed target outcomes.
  actual_K_pre_fit_rank_and_condition:
    timing: >-
      First sealed development-target access after every target-free gate has
      passed and before any realized set identity, candidate score, model fit,
      residual, or association is inspected.
    permitted_target_fields:
