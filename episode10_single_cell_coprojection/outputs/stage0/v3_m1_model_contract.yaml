      - K
    semantic_alias: K_is_K_i_obs
    realized_positive_set_membership: forbidden
    folds: every_actual_outer_inner_and_full_development_training_fold
    transform_and_Gram: identical_to_the_within_cell_rank_and_condition_definition_above
    geometry_residual_rank_required: 6
    joint_numerical_rank_required: 261
    maximum_joint_condition_number_2: 1.0e+10
    failure_action: >-
      Stop before fitting M1 and revise only from this non-association design
