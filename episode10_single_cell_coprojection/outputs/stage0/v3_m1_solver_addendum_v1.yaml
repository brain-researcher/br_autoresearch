  - initial step, expansion factor, maximum step, evaluation cap, and zoom cap
  - every accepted step must satisfy both exact strong-Wolfe inequalities
  - gradient infinity tolerance of 1e-7
  - relative objective tolerance of 1e-10
  - ordinary convergence requires both frozen predicates
  - >-
    eligible finite-precision stall certificate requires gradient infinity at
    most 1e-7 and certified relative objective gap at most 1e-10
  - prior successive objective change is report-only inside that certificate
  - no fallback optimizer
  - recovery, warm-versus-zero, rank, condition, and benchmark gates
  - target-free 8-hour 4-CPU 16-GB complete-probe request
  - actual-K, target-call, M0-artifact, SWC, final, and unassigned seals

required_conformance_checks:
  - >-
    Direct line differences agree with independently evaluated ordinary-sized
    objective differences where subtraction is well resolved.
  - >-
    Small-increment and general likelihood-ratio forms agree on an overlapping
    finite test domain; the exact 0.5 boundary uses the small form and the next
    binary64 value above 0.5 uses the general form; both return exact zero for
    h equal to zero.
  - >-
    A cancellation regression has distinct mathematical trial differences
    whose separately rounded total objectives are equal; the stable evaluator
    preserves the correct Armijo decision without slack.
  - >-
    Direct trial directional derivatives agree with the analytic full-gradient
    dot direction where that dot product is well resolved, and the direct form
    is used at alpha=0 as well as at every trial.
  - >-
    Singleton K=0/16 rows and candidate-constant score increments have exactly
    zero data difference and data directional derivative. Ridge-only and
    active population-linear-correction examples equal their closed forms.
  - >-
    Nonfinite inputs, nonfinite intermediates, and an invalid log1p domain fail
    closed; no tolerance, ULP tie, acceptance slack, or fallback is added.
  - >-
    An adversarial general-branch case in which a baseline exponential
    underflows but the same candidate is revived by r agrees with independent
    two-normalizer logsumexp and remains finite.
  - >-
    Existing expansion, zoom, nonfinite, certificate, derivative, population,
    sealing, and deterministic regressions continue to pass.
  - >-
    Candidate absolute objective and full gradient returned for an accepted
    trial remain the unchanged evaluator outputs.

