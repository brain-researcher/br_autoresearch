stable_line_identity:
  notation:
    theta: current_261_parameter_vector
    p: unchanged_Newton_search_direction
    alpha: unchanged_trial_step
    h: alpha_times_p
    F_i_A: joint_261_sufficient_statistic_for_candidate_A
    O_i: observed_synthetic_candidate_for_row_i
    p_theta_i_A: exact_exhaustive_conditional_probability_at_theta
    r_i_A: h_transpose_times_F_i_A_minus_F_i_O_i
  per_cell_exact_NLL_difference: >-
    delta_i = log(sum over A in Omega_i of
    p_theta_i_A * exp(r_i_A)).
  small_increment_binary64_form: >-
    When max_A absolute(r_i_A) is at most 0.5, compute delta_i as
    log1p(sum_A p_theta_i_A * expm1(r_i_A)).
  general_binary64_form: >-
    Otherwise compute the same quantity as
    logsumexp(q_theta_i_A + h^T F_i_A) -
    logsumexp(q_theta_i_A) - h^T F_i_O_i, equivalently
    logsumexp(q_theta_i_A + r_i_A) - logsumexp(q_theta_i_A), using separate
    exhaustive maxima and shifted normalizers for the combined and baseline
    scores, explicit observed-increment centering, lexicographic candidate
    order, and the frozen candidate batch maximum. Do not multiply a rounded
    normalized baseline probability by exp(r_i_A): a baseline-underflow
    candidate can be revived by a large r.
  full_objective_difference: >-
    delta_F = sum_i w_i*delta_i
    + lambda*(theta^T h + ||h||_2^2/2)
    + linear_correction^T h when the frozen population evaluator is active.
  trial_directional_derivative: >-
    Sum w_i times the exact trial-distribution expectation of
    p^T(F_i(A)-F_i(O_i)), then add
    lambda*(theta+h)^T p and linear_correction^T p when active.
    Use the same direct analytic form at alpha=0 for the initial descent and
    strong-Wolfe reference derivative; do not obtain either derivative by
    dotting a separately accumulated full gradient with p.
  accepted_step_relative_objective_change: >-
    absolute(delta_F) divided by
    max(1, absolute(F_old), absolute(F_new)).
  branch_boundary:
    small_form_includes: max_A_absolute_r_i_A_less_than_or_equal_to_0.5
    general_form_begins: max_A_absolute_r_i_A_greater_than_0.5
    exact_boundary_and_nextafter_above_boundary_must_be_tested: true
  singleton_K_0_or_16_data_terms: exact_zero
  arithmetic: binary64
  scalar_summation: >-
    math.fsum within each fixed lexicographic candidate batch, math.fsum over
    those batch results for a cell, and math.fsum over fixed-order cell,
    ridge, and optional correction contributions
  nonfinite_or_invalid_log1p_domain: fail_closed

unchanged:
