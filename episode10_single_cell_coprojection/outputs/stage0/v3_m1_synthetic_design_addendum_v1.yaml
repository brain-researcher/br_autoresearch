    Set hemisphere_index = (row_index // 4) modulo 2. Use left when the index
    is 0 and right when it is 1. Construct the synthetic physical soma ML
    coordinate with the corresponding frozen 5.7 minus or plus depth rule.
  motivation: >-
    Consecutive blocks of four retain the same deterministic, outcome-free
    balance while preventing hemisphere from being an exact function of the
    four-level layer schedule.
  consumes_random_variates: false

