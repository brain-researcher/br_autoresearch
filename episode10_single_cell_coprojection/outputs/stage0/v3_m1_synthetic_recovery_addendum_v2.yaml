target_free_diagnosis:
  parameter_dimension: 261
  sampled_rows: 544
  equal_sized_groups: 16
  one_hot_draws_per_row: 1
  first_order_regular_MLE_expected_KL_bits: 0.3460876890367826
  formula: parameter_dimension / (2 * sampled_rows * ln(2))
  observed_to_first_order_ratio: 0.9637687664163513
  interpretation: >-
    A fit to one categorical draw from each of 544 conditional distributions
    is a finite-sample estimator, not the planted population distribution.
    Its observed 0.33355-bit conditional KL is quantitatively consistent with
    the approximately 0.34609-bit first-order estimation scale for 261
    parameters. The 0.01-bit gate was therefore misapplied to categorical
    sampling error; the evidence does not support relaxing it to the observed
    value and does not identify a model, optimizer, rank, or geometry failure.
  first_order_rows_for_0_01_bits: 18827.17028360097
  row_count_interpretation: >-
    This asymptotic calculation is diagnostic only. It does not create a new
    sample-size gate, authorize more synthetic rows, or claim that 194 real
    development cells are adequate for M1 estimation, cross-validation,
    calibration, M2 search, or any scientific inference.

sole_change:
  applies_only_to: full_544_row_target_free_planted_recovery_hard_acceptance
  old_hard_acceptance_reference: >-
    A ridge fit to one PCG64 categorical realization per synthetic row.
  new_hard_acceptance_reference: >-
    A ridge fit from zero to the exact planted population cross-entropy,
    computed by exhaustive conditional expectations over every candidate in
    each row's frozen Omega_i.
  numeric_recovery_thresholds_changed: false
  sampled_categorical_generation_changed: false
  sampled_fit_retained: true
  sampled_fit_role: descriptive_finite_sample_diagnostic_only
  sampled_fit_solver_requirement: >-
    Use the unchanged lambda, zero initialization, and deterministic solver,
    and require its existing convergence witness. Report the same sampled
    recovery metrics, but do not compare their sampling error with the hard
    population-recovery thresholds.

exact_population_definition:
  notation:
    theta: row_major_vectorization_of_B_followed_by_gamma
    theta_star: frozen_planted_B_and_planted_gamma
    F_i_S: frozen_261_dimensional_joint_sufficient_statistic_for_candidate_S
    p_i_star_S: >-
      exp(theta_star^T F_i(S)) divided by the exact exhaustive sum over
      A in Omega_i of exp(theta_star^T F_i(A)).
    mu_i_star: exact sum over S in Omega_i of p_i_star(S) times F_i(S)
    p_i_theta_S: same exact softmax evaluated at theta
    mu_i_theta: exact sum over S in Omega_i of p_i_theta(S) times F_i(S)
    cell_weight: 1 / (16 * 34)
  objective_nats: >-
    L_pop(theta) = sum_i w_i * [log Z_i(theta) -
    theta^T mu_i_star] + lambda * ||theta||_2^2 / 2.
  gradient: >-
    grad L_pop(theta) = sum_i w_i * [mu_i_theta - mu_i_star]
    + lambda * theta.
  Hessian: >-
    Hessian L_pop(theta) = sum_i w_i *
    Cov_{p_i_theta}[F_i(S)] + lambda * I_261.
  exact_population_KL_nats: >-
    sum_i w_i * sum over S in Omega_i of p_i_star(S) times
    log[p_i_star(S) / p_i_theta(S)].
  exact_population_KL_bits: exact_population_KL_nats / ln(2)
  computation:
    candidate_enumeration: exhaustive_in_frozen_lexicographic_order
    arithmetic: binary64
    candidate_batch_maximum: 4096
    accumulation: same_streamed_21_dimensional_moments_and_261_expansion
    stochastic_or_sampled_expectation: forbidden
    singleton_K_0_or_16: exact_zero_data_KL_gradient_and_Hessian_contribution

prospective_implementation_consistency_witness:
  role: >-
    Contract-derived check that the exact population evaluator, ridge fit, and
    frozen convergence witness agree. It is not a new scientific threshold or
    evidence of real-sample adequacy.
  planted_parameter_norm_components:
    planted_B_Frobenius_norm_squared: 2.25
    planted_gamma_norm_squared: 0.6775
    theta_star_norm_squared: 2.9275
  frozen_lambda: 1.0e-6
  planted_ridge_penalty_nats: 1.46375e-6
  frozen_parameter_dimension: 261
  frozen_gradient_infinity_tolerance: 1.0e-7
  worst_case_solver_objective_gap_bound_nats: 1.305e-6
  solver_bound_formula: >-
    parameter_dimension * gradient_infinity_tolerance^2 / (2 * lambda).
  raw_population_KL_upper_bound_nats: 2.76875e-6
  raw_population_KL_upper_bound_bits: 3.9944618944613175e-6
  derivation: >-
    The recovered penalized objective is at most its optimum plus the solver
    gap, the optimum is no greater than the objective at theta_star, and the
    recovered ridge penalty is nonnegative. Therefore its exact population
    data KL is at most lambda*||theta_star||^2/2 plus the solver gap.
  pre_frozen_numerical_headroom_fraction: 0.10
  implementation_witness_ceiling_nats: 3.045625e-6
  implementation_witness_ceiling_bits: 4.3939080839074494e-6
  witness_pass_rule: >-
    The directly enumerated exact population KL must not exceed the
    implementation witness ceiling. This check supplements but does not
    replace or redefine the unchanged recovery acceptance thresholds.
  Pinsker_report_only_implication:
    raw_mean_inclusion_marginal_MAE_upper_bound: 0.0011765946625750094
    with_headroom_mean_inclusion_marginal_MAE_upper_bound: 0.0012340228928184437
    formula: sqrt(population_KL_upper_bound_nats / 2)
    role: report_only_no_additional_MAE_gate

