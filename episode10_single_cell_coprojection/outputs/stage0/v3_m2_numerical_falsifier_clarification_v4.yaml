    - stale_copied_serialized_forged_mutated_or_dead_producer
    - duplicate_commit_or_capability_replay
  resume: >-
    Persist atomic numeric artifacts and attempt/commit records, but rebuild
    controller history and issue fresh live process-local capabilities after a
    restart. Never serialize an authority token.

specificity_and_resource_completion:
  Rademacher_specificity_gate: >-
    The selected real nonfalsifier incumbent gain must exceed the maximum valid
    gain among the exact seven Rademacher references by at least 0.002 bits per
    eligible cell. Equality at the boundary passes. Missing or invalid required
    Rademacher results block completion.
  permutation_selector_and_incumbent_eligible: false
  required_incremental_target_free_timing_units:
    - Rademacher_core
    - Rademacher_low_rank
    - Rademacher_hybrid_including_internal_precursor
    - one_outer_only_permutation_M1_plus_configured_M2_fit
  conservative_maximum_permutation_counts_at_valid_trial_cap_80:
    coverage_length_16: 43
    coverage_length_24: 35
    coverage_length_28: 31
  minimum_schedule_permutation_count: 3
  earliest_patience_stop_total_permutation_count: 9
  existing_core_optional_scale_report: >-
    Remains a valid measured baseline but is not final falsifier-inclusive
    resource authorization. Combine it with the measured incremental falsifier
    supplement without rerunning valid heavy units absent a numerical reason.
  first_real_M2_access: >-
    Remains blocked until the named adapters, exact production authorities,
    target-free qualification, and falsifier-inclusive resource projection pass.

