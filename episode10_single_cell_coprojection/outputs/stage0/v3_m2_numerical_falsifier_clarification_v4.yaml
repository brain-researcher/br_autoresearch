    - exact_session_cache_owner_mode_null_replicate_and_attempt_ordinal
    - exact_physical_transform_source_or_permutation_M1_cache
    - exact_optional_initializer_receipt_when_applicable
  consumption: consume_before_solver_entry_and_burn_on_every_BaseException
  retry: fresh_capability_same_frozen_trial_and_same_dictionary_or_mapping
  detailed_execution_record_requires:
    - exact_trial_and_adapter_provenance
    - all_12_fold_results_and_fits
    - all_194_unique_cell_scores
    - exact_M1_identities
    - exact_dictionary_seed_route_or_194_recipient_to_donor_mapping
    - exact_transforms_and_configuration
    - derived_controller_TrialResult
  ordinary_external_TrialResult_only_receipt: insufficient
  invalid:
