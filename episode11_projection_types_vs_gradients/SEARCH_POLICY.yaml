objectives:
  primary: animal_equal_common_support_heldout_log_predictive_density_H_minus_C
  comparisons:
    primary: H_minus_C
    secondary: [P_minus_B, C_minus_P, H_minus_D]
    descriptive: [D_minus_C]
  interpretation:
    P_minus_B: continuous_projection_organization_added_by_soma_position_and_depth
    C_minus_P: continuous_residual_heterogeneity_among_nearby_position_cells
    H_minus_C: incremental_value_of_reusable_groups_beyond_qualified_continuum
    H_minus_D: continuous_organization_remaining_within_groups

  family_reference_selection:
    equal_admissible_search_budget_and_configuration_coverage_for_each_family: true
    P_ref: qualified_P_with_maximum_animal_equal_development_log_predictive_density
    B_pair_for_P_ref: B_from_the_same_complete_trial_with_shared_nuisance_noise_and_tuning_treatment_as_P_ref
    C_ref: qualified_C_with_maximum_animal_equal_development_log_predictive_density
    P_pair_for_C_ref: P_from_the_same_complete_trial_with_shared_nuisance_noise_and_tuning_treatment_as_C_ref
    H_ref: qualified_H_with_maximum_animal_equal_development_log_predictive_density
    D_pair_for_H_ref: D_from_the_same_complete_trial_K_label_signature_rule_and_group_parameterization_as_H_ref
    deterministic_family_tie_breaks: [minimum_effective_degrees_of_freedom, ascending_canonical_configuration_tuple]
    primary_statistic: H_ref_minus_C_ref
    same_backbone_C_for_each_H_is_a_pair_qualification_check_not_the_scientific_C_reference: true
    selection_of_C_ref_cannot_depend_on_H_minus_C: true
    all_family_selection_replayed_in_every_full_search_null_replicate: true

  # A complete comparison first becomes eligible for provisional selection.
  # The selected statistic can then seed the full-search null without a cycle.
  trial_pre_null_eligibility:
    all_required:
      - selected_source_passes_all_frozen_source_specific_support_thresholds_including_12_development_and_8_audit_animals
      - common_position_and_depth_support_is_frozen
      - outcome_blind_fixed_primary_outcome_and_common_observation_likelihood_and_density_measure
      - complete_B_P_C_D_H_set_scored_on_identical_cells_folds_and_weights
      - each_paired_C_H_trial_has_exactly_matched_continuous_backbone_hyperparameter_options_and_tuning_treatment
      - shared_continuous_backbone_capacity_is_fair_and_C_is_qualified
      - shared_animal_dependence_model_is_qualified_and_new_animal_effect_is_integrated_without_heldout_outcome_conditioning
      - model_calibration_and_numerical_checks_pass
      - synthetic_continuous_and_group_regime_qualification_passes
      - deterministic_replay_passes

  pre_null_package_eligibility:
    all_required:
      - development_search_reaches_a_frozen_stop_with_required_trial_and_branch_coverage
      - trial_pre_null_archive_is_nonempty
      - P_ref_C_ref_and_H_ref_are_independently_selected_by_absolute_family_predictive_score_under_equal_search_budgets
      - B_pair_for_P_ref_P_pair_for_C_ref_and_D_pair_for_H_ref_are_attached_and_valid
      - family_selection_and_tie_break_replay_is_deterministic
      - observed_H_ref_minus_C_ref_statistic_is_frozen

  # Null completion converts the frozen pre-null selection into a valid
  # comparison; the null p-value affects only the positive grouping claim.
  comparison_validity:
    all_required:
      - pre_null_package_eligibility_passes
      - complete_full_search_null_program_finishes
    real_data_H_loss_invalidates_comparison: false
    weak_group_separation_or_prevalence_invalidates_comparison: false
    full_search_null_p_value_failure_invalidates_comparison: false
    continuous_model_development_win_invalidates_comparison: false

  # These additional conditions are required only to support reusable groups.
  reusable_group_support:
    all_required:
      - valid_final_comparison
      - animal_level_one_sided_lower_bound_for_H_minus_C_exceeds_meaningful_margin_on_audit
      - full_search_null_monte_carlo_p_passes
      - heldout_separation_and_effective_membership_pass
      - every_claimed_fixed_label_has_multi_animal_development_support
      - every_claimed_fixed_label_recurs_in_at_least_three_eligible_audit_animals
      - every_claimed_fixed_label_recurs_within_harmonized_SSp_tr_overlapping_neighborhoods_and_does_not_decode_resource_cre_line_layer_or_lab
      - similar_named_target_distribution_under_fixed_labels_standardized_to_the_same_soma_position_and_depth_support
      - local_soma_position_overlap_supports_nearby_cell_comparison
      - group_membership_not_explained_by_animal_batch_QC_reconstruction_territory_sex_age_strain_genotype_cre_line_labeling_modality_hemisphere_or_lab
      - no_single_animal_or_spatial_territory_dominates_gain
      - singleton_animals_are_not_counted_as_evidence_for_within_animal_coexistence_prevalence_gradient_group_recurrence_or_H_minus_D
      - named_target_allocation_rule_reproduces_in_audit
      - influence_and_selection_controls_pass

  continuous_adequacy:
    all_required:
      - valid_final_comparison
      - qualified_P_or_C_is_calibrated
      - upper_bound_on_H_minus_C_is_below_meaningful_margin
      - synthetic_sensitivity_can_detect_groups_at_or_above_margin
      - named_continuous_target_allocation_rule_reproduces_in_audit
    null_p_value_pass_for_groups_required: false
    nonsignificance_alone_is_adequacy: false

  pareto:
    maximize: [predictive_density, calibration, cross_animal_fixed_label_reuse, target_allocation_interpretability]
    minimize: [effective_capacity, animal_influence, technical_decodability]

decision_rules:
  threshold_freeze_timing: after_outcome_blind_precision_and_synthetic_qualification_before_real_candidate_discriminating_search
  meaningful_H_minus_C_gain:
    value: null
    unit: nats_per_neuron_on_frozen_outcome_measure
    must_be_nonnull_before_real_search: true
  meaningful_P_minus_B_C_minus_P_and_H_minus_D_gains:
    values: null
    units: nats_per_neuron_on_frozen_outcome_measure
    must_be_nonnull_before_real_search: true
  reusable_group_minimums:
    minimum_position_standardized_prevalence: 0.15
    development_animals_per_claimed_group: 4
    audit_animals_per_claimed_group: 3
    effective_membership_definition:
      cell_ESS: square_sum_responsibility_divided_by_sum_squared_responsibility
      animal_ESS: square_sum_position_standardized_animal_membership_divided_by_sum_squared_membership
    development_effective_membership_per_group:
      cell_ESS_minimum: 20
      animal_ESS_minimum: 4
      multi_cell_animals_with_effective_presence_minimum: 4
      maximum_single_animal_membership_fraction: 0.35
    development_LOO_effective_membership_per_group:
      cell_ESS_minimum: 15
      remaining_animals_minimum: 3
    audit_effective_membership_per_group:
      cell_ESS_minimum: 10
      animal_ESS_minimum: 3
      multi_cell_animals_with_recurrence_minimum: 3
      maximum_single_animal_membership_fraction: 0.50
    same_harmonized_source_locality_per_claimed_group:
      overlapping_development_animals_minimum: 3
      overlapping_audit_animals_minimum: 2
    H_minus_D_interpretation_per_group:
      supported_position_depth_ranges_minimum: 2
      development_animal_ESS_minimum: 4
      audit_animal_ESS_minimum: 3
    standardized_target_signature_similarity: null
    heldout_separation: null
    calibration: null
    technical_decoding_ceiling: null
    maximum_single_animal_or_territory_gain_fraction: null
    local_overlap_rule: null
    singleton_animals_count_toward_structural_minimums: false
    nonnull_before_real_search: true
  uncertainty:
    unit: verified_independent_animal
    interval_and_simultaneity_rule_frozen_before_real_search: true
    positive_reusable_group_rule: one_sided_lower_confidence_bound_for_H_minus_C_exceeds_meaningful_margin
    positive_within_group_continuum_rule: one_sided_lower_confidence_bound_for_H_minus_D_exceeds_meaningful_margin
    no_supported_within_group_continuum_rule: one_sided_upper_confidence_bound_for_H_minus_D_is_below_meaningful_margin
    continuous_adequacy_rule: one_sided_upper_confidence_bound_for_H_minus_C_is_below_meaningful_margin
    multiplicity_scope_includes_H_minus_C_H_minus_D_and_named_target_allocation_claims: true
  continuous_and_mixture_models_can_approximate_each_other: true
  conclusion_basis: predictive_usefulness_stability_and_interpretability_among_qualified_descriptions

