      - acquisition_registration_reconstruction_version_and_prospectively_validated_QC
    source_defining_strata_are_fixed: true
    harmonized_SSp_tr_is_one_fixed_source_population_in_B_P_C_D_H: true
    provider_layer_suffix_is_not_a_projection_group_or_discrete_source_stratum: true
    soma_coordinates_depth_and_layer: source_definition_or_P_never_B
    dendritic_morphometric_or_other_biological_features: excluded_unless_separately_preregistered_in_a_redesigned_question
    axon_projection_class_outcome_derived_or_unregistered_morphology_predictors: forbidden
    whitelist_identical_in_every_pair_and_final_lock: true
  nested_relationships:
    P_reduces_to_B_when_position_terms_are_zero: true
    C_reduces_to_P_when_continuous_latent_variation_is_zero: true
    H_reduces_to_D_when_all_continuous_position_and_latent_outcome_terms_beyond_B_are_zero: true
    H_reduces_to_C_when_all_group_specific_signatures_and_trajectories_coincide: true
    D_and_H_share_K_canonical_label_rule_and_group_signature_parameterization: true
    D_and_H_share_B_adjustment_animal_nuisance_group_gating_and_observation_contract: true
    nestedness_is_defined_by_parameter_restriction_not_elementwise_identity_of_independently_fitted_coefficients: true
    C_coefficients_fitted_without_groups_are_frozen_inside_H: false
    D_coefficients_fitted_without_continuous_terms_are_frozen_inside_H: false
    each_family_optimizes_its_own_likelihood_under_matched_capacity_folds_starts_and_budget: true
  position_basis: [linear, tensor_spline_df4, tensor_spline_df8, low_rank_smooth_rank8]
  continuous_latent:
    dimension: [1, 2]
    support: connected
    map_basis: [linear, spline_df4, spline_df8]
    density: [uniform, positive_log_spline_df4, positive_log_spline_df8]
    permits_nonuniform_and_multipeaked_marginal_density: true
    same_dimension_smoothness_and_density_options_in_C_and_H: true
    paired_C_H_trial_uses_identical_dimension_basis_smoothness_density_noise_covariance_regularization_and_tuning_budget: true
  residual_noise:
    family: [heteroskedastic_gaussian, student_t_location_scale]
    covariance: [diagonal, shrinkage, low_rank_plus_diagonal]
    covariance_rank: [2, 4, 8]
  shared_animal_dependence:
    primary_estimand: expected_per_neuron_log_predictive_density_for_an_equal_weight_new_animal
    not_joint_density_of_all_cells_in_a_heldout_animal: true
    nuisance_structure: shared_hierarchical_animal_level_random_effect_on_frozen_outcome_coordinates
    structure_and_rank: null
    structure_rank_and_prior_frozen_from_outcome_blind_synthetic_qualification: true
    same_random_effect_structure_and_training_rule_in_B_P_C_D_H: true
    unseen_animal_effect: integrate_over_development_fitted_population_distribution
    condition_on_other_heldout_animal_outcomes_or_refit_empirical_Bayes_effect: false
    residual_dependence_within_animal_included_in_simulation_and_null_generation: true
    uncertainty_resampling_unit: verified_independent_animal
  component_count: [2, 3, 4]
  group_gating: [constant, smooth_soma_position_and_depth]
  regularization_strength: [0.001, 0.01, 0.1, 1.0, 10.0, 100.0]
  capacity_control:
    estimator: frozen_effective_degrees_of_freedom
    hard_support_or_gate_predictor_clipping_allowed: false
    conditional_nonempty_support_normalizer_requires_stable_log_domain_evaluation: true
    raw_predictor_magnitudes_reported_for_numerical_diagnostics: true
    shared_backbone_absolute_tolerance: null
    shared_backbone_relative_tolerance: null
    tolerances_nonnull_before_real_search: true
    tolerance_derivation: outcome_blind_synthetic_qualification
    C_gets_every_continuous_capacity_available_to_H: true
    tolerance_applies_to_shared_continuous_backbone_excluding_the_tested_finite_group_terms: true
    C_H_pair_contract_includes_cells_folds_B_whitelist_predictors_outcome_observation_contract_backbone_hyperparameters_inner_data_and_optimizer_effort: true
    paired_families_share_parameterization_and_budget_not_smaller_family_coefficient_estimates: true
    optimizer_effort_rule: null
    optimizer_effort_rule_nonnull_before_real_search: true
    one_sided_failure_or_nonconvergence_invalidates_the_pair: true
    paired_complete_model_set_per_trial: true
  heldout_group_application:
    definitions_fit_on_training_development_animals_only: true
    fixed_canonical_label_rule: true
    continuous_latent_integrated_for_predictive_score: true
    score_integrates_over_latent_group: true
    oracle_posterior_label_or_outcome_fitted_latent_coordinate_as_predictor: false
    posterior_membership_and_latent_coordinate_after_scoring_are_post_score_evidence_only_and_cannot_adapt_models: true
    heldout_refit_recluster_label_rematch_or_prevalence_recalibration: false
  ensemble:
    maximum_members: 1
    adjudicative_predictive_density_averaging: false
    nonadjudicative_benchmark_may_determine_terminal: false
  forbidden:
    - released_projection_class
    - outcome_derived_predictors
