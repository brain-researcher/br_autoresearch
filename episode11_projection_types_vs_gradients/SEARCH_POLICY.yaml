    P_position_driven_continuous: exactly_B_plus_smooth_projection_change_with_soma_coordinates_continuous_depth_and_registered_cortical_layer
    C_position_plus_continuous_latent: P_plus_connected_low_dimensional_continuous_residual_coordinate_without_finite_group
    D_reusable_groups_with_position_gating: B_shared_nonposition_adjustment_and_animal_nuisance_plus_finite_fixed_projection_signatures_with_smooth_position_dependent_prevalence_and_no_within_group_position_or_latent_outcome_trajectory
    H_continuous_plus_reusable_groups: D_shared_adjustment_nuisance_groups_and_gating_plus_C_position_and_continuous_latent_outcome_backbone_within_groups
