decision_boundary: >-
  Passing this tool is necessary evidence that the 56-coordinate mixed-support
  score and a fixed B/P/C/D/H subset can exercise both comparison directions.
  The subset cannot itself support either biological conclusion. It is not
  sufficient to launch outcome-bearing search; every item above that is
  required by SEARCH_POLICY.yaml remains a blocker.

