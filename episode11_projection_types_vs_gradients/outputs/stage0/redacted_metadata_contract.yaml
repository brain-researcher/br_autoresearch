schema_version: ep11.redacted_metadata_contract.v2
episode_id: ep11
purpose: assess_source_support_without_showing_projection_outcomes_or_audit_identities

trusted_boundary:
  raw_mixed_role_sources_candidate_visible: false
  trusted_process_may:
    - validate_table_shape
    - join_authenticated_animal_identity
    - resolve_duplicates
    - apply_allow_list
    - assign_whole_animal_roles
    - emit_aggregate_source_support
  trusted_process_must_not_emit:
    - projection_derived_values_or_diagnostics
    - raw_forbidden_columns
    - audit_cell_or_animal_identifiers

allow_list:
  identity:
    - stable_cell_id
    - provider_cell_id
    - provider_brain_id_proxy
    - authenticated_independent_animal_id
    - specimen_id_if_distinct
    - duplicate_family_id
  soma_and_source:
    - source_region
    - source_subregion_if_preregistered
    - raw_soma_x
    - raw_soma_y
    - raw_soma_z
    - ccf_soma_x
    - ccf_soma_y
    - ccf_soma_z
    - cortical_layer
    - preregistered_depth
  design_factors:
    - sex
    - age
    - strain
    - genotype_or_cre_line
    - labeling_strategy
    - imaging_modality
    - hemisphere
    - source_laboratory
    - acquisition_batch
    - registration_batch
    - reconstruction_version
  outcome_blind_qc:
    - manual_check_status
    - complete_axon_reconstruction_flag_with_independent_basis
    - registration_qc_flag_with_independent_basis
    - metadata_missingness_flags
  eligibility:
    - eligible_under_frozen_metadata_rule
    - exclusion_reason

forbidden:
  exact_fields:
    - Projection class
  semantic_classes:
    - axon_or_projection_class
    - target_region_presence_mass_length_terminal_count_or_proportion
    - axon_embedding_cluster_or_latent_coordinate
    - axonal_path_topology_or_arbor_feature
    - development_or_audit_projection_score
  unknown_columns: fail_closed_until_reviewed

role_safe_outputs:
  candidate_readiness_aggregate:
    contains:
      - source_by_role_animal_counts
      - cells_per_animal_distribution
      - position_depth_layer_coverage_and_overlap
      - experimental_stratum_coverage_and_missingness
      - exclusions_and_unsampled_gaps
    excludes:
      - audit_cell_or_animal_identifiers
      - row_level_audit_coordinates
      - projection_outcomes
  development_view:
    contains: allowed_fields_and_development_cells_only
    candidate_visible: true
  audit_view:
    contains: allowed_fields_and_audit_cells_only
    candidate_visible: false

identity_and_role_rules:
  provider_brain_ID_is_not_assumed_to_equal_independent_animal: true
  whole_animal_roles: [development, audit_sealed, excluded]
  one_animal_may_have_only_one_role: true
  unresolved_or_linked_IDs: collapse_or_exclude_by_frozen_rule
  shared_EP09_EP10_EP11_assignment_required: true
  prior_sibling_episode_outcome_exposure_must_be_checked: true

completion_rule:
  current_12_development_8_audit_minimum_is_design_specific: true
  counts_must_be_independent_animals_within_one_source_and_common_support: true
  overlap_missingness_precision_and_stratum_rules_must_also_pass: true
  retained_cell_direct_development_animal_neighbors_minimum: 2
  support_must_be_within_same_exact_provider_label_stratum: true
  geometry_invalid_cells_are_excluded_before_retention_denominators: true
  scored_exact_provider_label_minimum_geometry_eligible_animals_before_roles: 5
  scored_exact_provider_label_minimum_development_animals_with_retained_cells: 3
  scored_exact_provider_label_minimum_audit_animals_with_retained_cells: 2
  final_geometry_must_separate_cortical_tangential_position_and_depth: true
  singleton_animal_cannot_establish_within_animal_or_group_recurrence_claims: true
  failure_means_current_data_design_mismatch_not_absence_of_groups: true

terminal_state:
  status: closed_insufficient_source_support
  outcome_bearing_search_started: false
  audit_open_count: 0
