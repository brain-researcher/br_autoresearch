schema_version: autoresearch.adaptive_search_policy.v1
policy_id: ep12_malecns_type_sufficiency_adaptive
episode_id: ep12
common_protocol_ref: ../ADAPTIVE_SEARCH_PROTOCOL.md
evidence_mode: adaptive_search

# Planning metadata for a possible follow-up.
# It does not implement or start that controller.
# The executable scientific contract in this file remains the outgoing round.
research_program:
  paper_question: when_does_a_cell_type_average_hide_input_output_pathway_organization
  plan_ref: outputs/paper_plan.md
  primary_round: reciprocal_outgoing_T_U_M_comparison
  primary_endpoint_and_terminal_mapping_unchanged: true
  followup:
    state: proposed_not_configured_or_run
    evidence_mode: proposed_fixed_comparison
    purpose: test_circuit_consequences_of_within_type_wiring_organization
    starts_after_outgoing_conclusion_is_fixed: true
    automatically_launched_by_this_policy: false
    outgoing_terminal_may_be_overwritten: false
    candidate_source: previously_assigned_development_types
    final_types_may_select_followup_cases: false
    discovery_features: outgoing_profiles_only
    prediction_target: incoming_partner_composition
    input_output_views_are_independent_biological_replicates: false
    primary_followup_score: neuron_equal_incoming_composition_brier_improvement
    contrasts:
      groups: versus_development_selected_best_fair_template_anatomy_or_continuous
      continuous: versus_development_selected_best_fair_template_or_anatomy
      selection_and_multiplicity_fixed_before_external_access: true
    circuit_readout: neuron_equal_input_output_pair_mass_total_variation_error
    external_evaluation:
      source_manifest: null
      matching_and_scope_fixed_before_external_connectivity_access: true
      first_access_record_required: true
      same_specimen_or_new_release_is_independent_replication: false
      cross_sex_transfer_is_same_sex_replication: false
      target_side_fitting_or_component_alignment_from_incoming: false
    separate_contract_required:
      - candidate_and_partner_selection_with_multiplicity
      - source_and_exposure_manifest_with_edge_ownership
      - common_vocabulary_missingness_and_anatomical_support
      - fixed_models_capacity_and_target_side_inference
      - meaningful_margins_and_uncertainty
      - synthetic_recovery_and_conditional_pairing_null
      - compute_budget_and_stop_rules
      - one_shot_external_evaluation_and_result_table
    inherits_primary_budget_or_null_calibration: false
    candidate_ready_implies_paper_claim_established: false

# Data are split by whole annotated type before connectivity outcomes are used.
dataset_roles:
  assignment_unit: whole_provider_type
  assignment_source: annotation_only_fields_before_connectivity_access
  split:
    development_fraction: 0.80
    final_fraction: 0.20
    deterministic_seed_required: true
  development:
    evaluation: reciprocal_cross_side_transfer
    graph_rows: development_focal_sources_only
  final_evaluation:
    name: final_types
    access: trusted_evaluator_once_after_outgoing_lock
    directions: [left_to_right, right_to_left]
    fit_on_transfer_source_side: true
    score_target_side_without_fit_or_refit: true
    report_every_assigned_type: true
  replication_scope: single_male_internal_only

# Every trial compares the complete T/U/M triplet.
grammar:
  execution: declarative_config_trusted_evaluator
  mandatory_model_triplet: [T_type_template, U_flexible_unimodal, M_residual_modes]
  partner_vocabulary:
    - development_frequency_pooling
    - explicit_unknown_untyped_fragment_and_proofreading_bins
    - bounded_hierarchical_partner_categories
  partner_minimum_development_type_count: [2, 4, 8]
  rare_partner_pooling_mass_fraction: [0.01, 0.025, 0.05]
  partner_hierarchy_depth: [1, 2]
  representation:
    - count_aware_log_ratio
    - low_rank_composition
    - low_rank_count_model
  rank: [2, 4, 8, 16]
  composition_pseudocount: [0.1, 0.5, 1.0]
  nuisance:
    - connection_strength_exposure
    - reconstruction_and_status
    - prespecified_anatomical_effects
  nuisance_spline_df: [0, 3, 5]
  covariance: [diagonal, shrinkage, low_rank]
  covariance_rank: [2, 4, 8]
  component_count: [2, 3]
  regularization: [0.001, 0.01, 0.1, 1.0, 10.0, 100.0]
  forbidden:
    - provider_group_for_search
    - provider_instance_as_partner_category
    - silent_typed_partner_renormalization
    - neuron_edge_or_synapse_role_splits
    - final_type_outcome_dependent_choices
    - arbitrary_candidate_code

objectives:
  primary: type_equal_direction_equal_heldout_log_predictive_density_M_minus_C
  reference: best_fair_development_selected_T_or_U
  aggregation:
    neuron_weighting_within_type_direction: equal
    type_weighting: equal
    direction_weighting: equal
    synapses_or_edges_are_biological_replicates: false

  explanatory_readout:
    comparison: T_type_template_vs_U_flexible_unimodal
    purpose: distinguish_one_average_profile_from_continuous_heterogeneity
    may_replace_primary_M_vs_C_comparison: false
    may_create_new_cell_type_claim: false
    anatomical_contribution_and_adjusted_residual_reported_separately: true
    followup_may_not_replace_primary: true

  # These conditions decide whether a comparison is usable.
  comparison_validity:
    all_required:
      - data_roles_and_quality_pass
      - complete_T_U_M_triplet_computed_under_fixed_rules
      - T_U_M_capacity_comparison_is_fair
      - T_U_M_calibration_qualified
      - numerical_unimodality_for_U
      - endpoint_mass_preserved
      - synthetic_qualification_passed
      - deterministic_replay_passed
      - full_search_null_completed_when_required
    real_data_M_loss_invalidates_comparison: false
    weak_or_continuous_fitted_structure_invalidates_comparison: false

  # These additional conditions decide whether the result supports M.
  residual_modes_support:
    all_required:
      - material_M_gain_over_C_in_both_transfer_directions
      - separated_and_prevalent_modes
      - differentiating_downstream_partner_preferences_identified
      - cross_side_partner_preference_structure_matches
      - full_search_null_monte_carlo_p_passes
      - anatomical_and_technical_controls_pass
      - gain_not_concentrated_in_few_types_or_high_strength_neurons
      - selection_and_influence_controls_pass

  pareto:
    maximize: [bilateral_predictive_gain, cross_side_component_matching, calibration]
    minimize: [model_complexity, type_influence, strength_concentration]

decision_rules:
  meaningful_margin:
    value: 0.02
    unit: nats_per_eligible_outgoing_synapse
    simultaneous_interval_method: whole_type_paired_simultaneous_95_percent_intervals
    scope: both_transfer_directions_and_prespecified_type_aggregate
    must_be_set_before_candidate_discriminating_development: true
  adequacy_sensitivity:
    acceptance_rule: prespecified_synthetic_tests_show_sensitivity_at_or_above_margin_and_guard_against_false_adequacy
    scenarios:
      - adequate_single_template
      - continuous_unimodal_variation
      - true_residual_groups
      - weak_signal
      - side_artifact
    cover_all_eligible_data_sizes: true
    missing_or_failed_rule_outcome: closed_unresolved
  nonsignificance_alone_supports_adequacy: false

real_data_diagnostics:
  allowed_types: assigned_development_types_only
  selection_rule_fixed_before_connectivity_access: true
  allowed_outputs_fixed_before_connectivity_access: true
  exposure_record_fixed_before_connectivity_access: true

budgets:
  minimum_valid_trials: 36
  maximum_valid_trials: 96
  valid_trials_min: 36
  valid_trials_max: 96
  patience_valid_trials: 16
  patience_active_after_trial: 36
  cpu_core_hour_ceiling: 1000
  cpu_core_hours_max: 1000
  cpu_cores_per_trial_max: 32
  memory_gib_per_trial_max: 192
  wall_hours_per_trial_max: 12
  wall_clock_hour_ceiling: 120
  gpu_hour_ceiling: 0
  gpu_count: 0
  includes_observed_search_and_99_null_searches: true
  minimum_model_family_fits_when_null_is_required: 10800
  minimum_fit_count_is_protocol_scale_not_measured_runtime: true

full_search_null:
  controller_operation: run_full_search_null
  fitted_generator: development_selected_best_fair_T_or_U_reference
  generator_selection_rule: development_only_best_supported_fair_T_or_U_with_U_preferred_when_comparably_supported
  generator_rule_must_be_set_before_candidate_discriminating_development: true
  run_if_any_complete_comparison_reaches_null_eligibility: true
  skip_if_no_complete_comparison_reaches_null_eligibility: true
  replicates: 99
  seed_manifest_frozen: true
  initial_ledger_each_replicate: empty
  rerun_complete_controller: true
  rerun_complete_T_U_M_search_and_selection: true
  null_replicate_does_not_launch_another_null_calibration: true
  preserves_development_sample_sizes_strength_missingness_and_side_structure: true
  observed_and_null_statistic: development_M_minus_best_fair_T_or_U_after_frozen_selection
  older_selection_program_null_calibration_reusable: false
  identical_grammar_budgets_stop_and_promotion: true
  deterministic_controller_replay_required: true
  proposal_model_version_prompt_sampling_and_seed_frozen: true
  completion_is_required_for_comparison_validity: true
  p_value_pass_is_required_for_residual_modes_support: true
  p_value_pass_is_not_required_to_evaluate_T_or_U: true
  monte_carlo_p: (1_plus_count_null_ge_observed)_divided_by_(replicates_plus_1)
  pass_threshold: 0.05
  profiling_must_fit_total_cpu_ceiling_before_outcome_access: true
  profiling_must_fit_total_cpu_ceiling_before_connectivity_outcome_access: true

branch_coverage:
  required: true
  minimum_valid_trials: 18
  rule: balanced_covering_array_over_vocabulary_representation_covariance_K_and_complete_T_U_M_triplets
  readiness_rejection_must_be_logged: true

required_falsifiers:
  - fitted_T_U_null_full_revised_search_rerun
  - strength_and_margin_preserving_graph_randomization
  - cross_side_component_alignment_permutation
  - shuffled_partner_and_valid_side_controls
  - binary_weighted_vocabulary_and_rank_sensitivities
  - nuisance_and_partner_block_ablations
  - capacity_matched_noise_controls
  - leave_one_development_type_and_partner_family_influence
  - few_type_and_high_strength_neuron_concentration_check
  - status_endpoint_anatomy_and_missingness_checks
  - forbidden_group_instance_post_result_novelty_audit

promotion:
  incumbent_is_terminal: false
  minimum_adaptive_successor_cycles: 2
  minimum_incumbent_challenger_decisions: 2
  post_coverage_falsifier_fraction_min: 0.40
  every_trial_requires_complete_triplet: true
  coverage_required: all_families_and_pairwise_interactions_in_frozen_balanced_covering_array
  archive:
    accepts: every_valid_complete_T_U_M_comparison
    M_development_win_required: false
    invalid_comparison_reason_required: true
  selection:
    source: valid_comparison_archive
    rule: development_only_bilateral_predictive_quality_and_robustness
    uses_development_only: true
    must_resolve_ties: true
    must_be_set_before_candidate_discriminating_development: true
    M_development_win_required: false
    final_type_information_allowed: false
  lock_one_complete_comparison: true
  freeze:
    - whole_type_roles
    - comparison_validity_and_selection
    - vocabulary_representation_and_capacity
    - meaningful_margin_and_uncertainty_method
    - adequacy_sensitivity
    - null_generator_selection
    - controls_and_outcome_table
    - main_figure_example_selection

stop:
  patience_starts_after_minimum: true
  after_minimum:
    - patience_exhausted
    - valid_trials_max_reached
    - cpu_budget_exhausted
    - admissible_configuration_space_exhausted
  completed_search_with_valid_comparison: choose_one_then_open_final_once
  completed_search_without_valid_comparison: closed_no_valid_comparison
  stopped_before_required_search_completion: incomplete_search
  corrupt_mismatched_leaked_or_integrity_invalid_input: technical_failure
  budget_stop_is_scientific_success: false

audit:
  mode: one_shot_single_transaction
  configuration_lock_required: true
  lock_hash_required: true
  maximum_open_count: 1
  audit_updates_search: false
  unit: final_whole_types
  owner: trusted_evaluator
  candidate_label_access: false
  reciprocal_directions_required: true
  source_side_fit_uses_locked_procedure: true
  target_side_fit_or_refit: false
  report_every_assigned_final_type: true
  retuning_after_open: false
  incoming_result_can_change_outgoing_terminal: false
  population_replication_claim: false

terminal_decision:
  detailed_outcomes:
    candidate_ready_residual_modes:
      when: valid_final_and_every_residual_modes_support_condition_passes
    closed_single_population_adequate_within_margin:
      when: valid_final_and_both_direction_upper_bounds_below_margin_and_sensitivity_qualified
    closed_unresolved:
      when: valid_final_but_intervals_wide_directions_disagree_or_structure_ambiguous
    closed_no_valid_comparison:
      when: development_completed_but_no_valid_complete_comparison_can_continue
      final_evaluation_completed: false
    incomplete_search:
      when: stopped_before_protocol_required_search_completion
      final_evaluation_completed: false
    technical_failure:
      when: unrecoverable_execution_input_role_or_final_evaluation_failure
      final_evaluation_valid: false

terminal_mapping:
  candidate_ready_residual_modes: candidate_ready
  closed_single_population_adequate_within_margin: closed_no_candidate
  closed_unresolved: closed_no_candidate
  closed_no_valid_comparison: closed_no_candidate
  incomplete_search: closed_no_candidate
  technical_failure: technical_failure

reporting:
  scientific_scope:
    primary_round_and_circuit_followup_reported_separately: true
    all_followup_candidates_and_failures_reported: true
    local_case_may_replace_type_aggregate_result: false
    paper_claim_requires_evidence_beyond_primary_terminal: true
  main_figure:
    illustrative_type_selection_rule: development_only_with_rationale_recorded_before_final_open
    uses_development_only: true
    selection_rationale_recorded_before_final_open: true
    final_type_outcomes_may_select_examples: false
    quantitative_summary_reports_every_assigned_final_type: true
