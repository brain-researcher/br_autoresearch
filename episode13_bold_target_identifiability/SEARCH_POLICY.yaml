policy_id: ep13_bold_target_identifiability_exact_theorem
episode_id: ep13
evidence_mode: exact_theorem_and_certificate_replay

authority:
  local_episode_only: true
  canonical_scientific_acceptance: false
  empirical_outcome_access: none

domain:
  field: rational
  dimensions:
    T: positive_integer
    Q: positive_integer
    V: positive_integer
    K: positive_integer
  known:
    A: T_by_V
    P: Q_by_K
    c: K_vector
    s: V_vector
  latent:
    X: V_by_K
    admissible_set: all_rational_V_by_K_matrices
  observation: Y_equals_A_X_P_transpose
  target: tau_equals_s_transpose_X_c

application_model:
  optional_factorization: A_equals_R_S_H
  R_shape: T_by_T
  R_idempotent_when_factorization_is_invoked: true
  R_symmetric_required: false
  factorization_needed_by_theorem: false

vectorization:
  order: column_major
  latent_vector: x_equals_vec_X
  observation_vector: y_equals_vec_Y
  operator: M_equals_P_kron_A
  target_vector: ell_equals_c_kron_s
  identities_required:
    - y_equals_M_x
    - tau_equals_ell_transpose_x
  boolean_label_only_check_is_sufficient: false

theorem:
  universal_quantifier: every_admissible_X
  equivalent_criteria:
    - tau_constant_on_every_observation_fiber
    - ell_in_row_M
    - kernel_M_subset_kernel_ell_transpose
    - rank_M_with_ell_row_equals_rank_M
    - exact_w_exists_with_M_transpose_w_equals_ell
  separable_reduction:
    rule: c_zero_or_s_zero_or_both_component_row_conditions
    nonzero_branch:
      - c_in_row_P
      - s_in_row_A
    zero_branch:
      target_is_identically_zero: true
      readout: zero

proof_obligations:
  - vectorization_identities
  - observation_fiber_kernel_equivalence
  - kernel_row_space_duality
  - rank_augmentation_equivalence
  - exact_readout_equivalence
  - pure_tensor_membership_for_nonzero_factors
  - explicit_zero_factor_partition
  - constructive_positive_certificate
  - constructive_negative_certificate

positive_certificate:
  component_equations:
    - P_transpose_u_equals_c
    - A_transpose_v_equals_s
  scalar_readout: tau_equals_v_transpose_Y_u
  vectorized_readout: w_equals_u_kron_v
  nonunique_readouts_allowed: true
  zero_target_readout: zero

negative_certificate:
  form: rank_one_Delta_X_equals_z_d_transpose
  requirements:
    - A_Delta_X_P_transpose_equals_zero
    - s_transpose_Delta_X_c_equals_one
  implication: same_Y_different_tau
  exact_normalization_required: true

fixed_regression_suite:
  epistemic_role: implementation_and_orientation_audit_only
  cases:
    - rank_deficient_operator_identifiable_nonzero_target
    - temporal_loss_only
    - spatial_loss_only
    - simultaneous_temporal_and_spatial_loss
    - c_zero
    - s_zero
    - both_target_factors_zero
    - realized_tau_zero_but_nonidentifiable
    - non_square_asymmetric_kronecker_orientation
    - non_symmetric_idempotent_R_transpose_trap
    - nonunique_valid_readout
    - normalized_null_witness
  invalid_inputs:
    - incompatible_shapes
    - malformed_rationals
    - zero_dimensions
    - non_square_R_when_application_factorization_is_invoked
    - non_idempotent_R_when_application_factorization_is_invoked
  direct_replay_required:
    - observation_identity
    - target_identity
    - readout_value
    - null_witness_value

independence:
  checker_authored_separately: true
  forbidden_checker_inputs:
    - historical_evaluator_code
    - historical_constants
    - expected_labels
    - precomputed_certificates
  finite_replay_establishes_universal_theorem: false
  replay_failure_action: invalidate_package_and_repair

workflow:
  ordered_stages:
    - freeze_statement_and_domain
    - write_proof_package
    - author_independent_exact_checker
    - replay_fixed_orientation_and_edge_cases
    - freeze_review_package
  adaptive_conjecture_trials_required: false
  minimum_trial_count: 0
  patience_rule: none
  large_compute_budget: none

completion:
  theorem_verified:
    requires:
      - every_proof_obligation_discharged
      - zero_branches_explicit
      - exact_readout_certificates_replay
      - exact_null_certificates_replay
      - actual_vectorization_identities_replay
      - independent_checker_agrees
  theorem_refuted_and_repaired:
    requires:
      - exact_counterexample_to_proposed_statement
      - corrected_statement_exactly_proved
      - corrected_certificates_replay
  closed_unresolved:
    when: proof_or_independent_replay_remains_incomplete
  technical_failure:
    when: domain_vectorization_or_checker_independence_is_ill_defined

claim_limits:
  - no_numerical_stability_claim
  - no_noise_efficiency_claim
  - no_uncertain_operator_claim
  - no_HRF_validity_claim
  - no_biological_or_causal_claim
  - no_full_latent_recovery_claim
  - no_restricted_latent_family_claim
  - no_shared_latent_multi_run_claim

terminal_mapping:
  theorem_verified: candidate_ready
  theorem_refuted_and_repaired: candidate_ready
  closed_unresolved: closed_no_candidate
  technical_failure: technical_failure
