policy_id: ep15_mdtb_topography_vs_geometry
episode_id: ep15
evidence_mode: development_then_one_shot_participant_audit

scientific_question:
  primary: >-
    Are stable individual differences in cerebellar task maps adequately
    explained by personalized parcel boundaries, one smooth relocation,
    a geometry-preserving correspondence, or a bounded geometry-changing
    correspondence?
  target_input: audit_participant_anatomy_plus_Task_A_only
  sealed_target: 18_Task_B_only_condition_maps
  deeper_prediction: >-
    Task_A_predicts_the_signed_participant_specific_deviation_of_the_full_Task_B_only_condition_geometry_matrix
  strongest_permitted_claim: >-
    One constrained explanation is uniquely supported for stable individual
    organization within the MDTB release.
  prohibited_claims:
    - task_dependence_separate_from_session
    - external_replication
    - new_participant_or_cross_site_generalization
    - universal_cognitive_coordinate_system
    - literal_or_unique_parcel_ontology
    - causal_or_behavioral_relevance

data:
  source:
    dataset: Functional_Fusion_MDTB
    release: v1.0
    record: Zenodo_16788784
    participants: 24
    primary_space: cerebellum_only
    evidence_status: publication_exposed_internal_procedure_sealed

  roles:
    assignment_unit: whole_participant
    development:
      participants: 12
      access: anatomy_Task_A_and_Task_B
      evaluation: leave_one_participant_out_pseudo_target
    audit:
      participants: 12
      calibration_access_after_panel_lock: anatomy_and_Task_A_only
      evaluator_access_after_prediction_lock: Task_B_only
      replacement: prohibited
      reduced_n_primary_analysis: prohibited
    status: not_yet_instantiated

  role_assignment:
    Task_B_blind: true
    exhaustive_12_12_balance_search: true
    balance_inputs:
      - sex
      - age
      - native_English_status
      - optional_rest_session_status
      - Task_A_only_reliability
    Task_A_only_reliability:
      statistic: >-
        median_centered_spatial_correlation_across_all_noninstruction_Task_A_conditions
      halves: [runs_1_to_8, runs_9_to_16]
      used_for_exclusion: false
    ordered_objective:
      - maximum_categorical_level_count_imbalance
      - sum_categorical_level_count_imbalance
      - standardized_age_mean_difference
      - standardized_age_Wasserstein_distance
      - standardized_Task_A_reliability_mean_difference
      - standardized_Task_A_reliability_Wasserstein_distance
    exact_tie: lexicographically_first_sorted_audit_ID_tuple
    missing_categorical_value: explicit_level
    missing_age_or_reliability: block_assignment
    outcome_blind_12_12_decision_simulation_required: true
    changing_split_requires_explicit_preoutcome_amendment: true

  endpoint:
    conditions: 18_Task_B_only
    domains:
      CPRO: [CPRO]
      prediction: [Prediction, PredictViol, PredictScram]
      spatial_map: [SpatialMapEasy, SpatialMapMed, SpatialMedDiff]
      movie: [NatureMovie, RomanceMovie, LandscapeMovie]
      mental_rotation: [MentalRotEasy, MentalRotMed, MentalRotDiff]
      emotion_processing: [BodyMotionIntact, BodyMotionScram]
      response_alternation: [RespAltEasy, RespAltMed, RespAltDiff]
    domain_weight: one_seventh_each
    condition_weight_within_domain: equal
    conditions_remain_separate_for_geometry: true
    shared_A_B_conditions_including_rest: postdecision_diagnostic_only

access_boundary:
  mixed_audit_archives_visible_to_search_worker: false
  handoffs:
    development:
      contents: anatomy_Task_A_and_Task_B_for_development_participants
      reader: development_worker
    audit_calibration:
      contents: anatomy_and_Task_A_for_audit_participants
      reader: calibrator_after_panel_lock
    sealed_audit:
      contents: Task_B_for_audit_participants
      reader: trusted_evaluator_after_prediction_lock
      maximum_open_count: 1
  audit_Task_A_may_update_shared_parameters: false
  audit_Task_B_may_change_QC_support_threshold_gain_retry_or_model: false
  published_MDTB_fitted_numeric_artifacts_allowed: false
  algorithms_equations_and_anatomy_only_templates_allowed: true
  implicit_downloads_and_exposed_caches: prohibited

response_and_space:
  common_across_all_classes:
    - authenticated_registration_route
    - common_cerebellar_gray_matter_support
    - interpolation_and_voxel_order
    - finite_value_and_coverage_rules
    - equal_voxel_weights
    - spatial_centering
    - arithmetic_condition_map_construction
    - Task_B_source_maps
    - seven_domain_weights
  prohibited_response_changes:
    - outcome_adaptive_smoothing
    - outcome_adaptive_whitening
    - target_Task_B_derived_scaling
    - candidate_specific_support_or_interpolation
  global_gain:
    form: one_positive_participant_scalar
    source: target_Task_A_only
    applied_uniformly_across_all_voxels_and_Task_B_conditions: true
    available_identically_to_every_class: true
    condition_domain_or_voxel_specific_gain: prohibited
  map_halves:
    first: runs_1_to_8
    second: runs_9_to_16
  geometry_partitions:
    - runs_1_to_4
    - runs_5_to_8
    - runs_9_to_12
    - runs_13_to_16
  primary_geometry_replicates:
    - partition_1_cross_partition_2
    - partition_3_cross_partition_4
  independent_error_assumption_checked_before_candidate_scores: true

fitting_contract:
  development_pseudo_target:
    shared_prior_basis_profiles_source_maps_thresholds_and_normalization: >-
      fit_without_pseudo_target_Task_B
    target_specific_inputs: [anatomy, Task_A]
    target_Task_B_fit_access: prohibited
  audit:
    shared_quantities_refit_on: all_development_participants_only
    target_specific_inputs: [anatomy, Task_A]
    one_target_rule_predicts_all_18_Task_B_conditions: true
    target_Task_B_refit_or_retuning: prohibited
  target_specific_condition_domain_or_voxel_gain: prohibited

controls:
  M0a:
    name: anatomical_group_mean
    target_specific_input: none
  M0b:
    name: development_fit_group_functional_prediction
    target_specific_input: none
    role: individual_residual_origin
    condition_maps: G_c
  negative:
    - reliability_stratified_Task_A_condition_permutation
    - participant_identity_derangement
    - capacity_and_smoothness_matched_random_local_basis
    - capacity_displacement_and_smoothness_matched_random_warp

model_classes:
  nonnested_interpretation: M1_M2_and_M3_are_competing_sufficient_explanations
  scalar_leaderboard_across_classes: prohibited

  M1_personalized_parcels:
    shared: parcel_response_profiles
    target_specific: parcel_membership_probabilities_or_boundaries_from_Task_A
    required_variants:
      assignment: [probabilistic, hard]
      granularity: [coarse, reference, fine]
    native_signature:
      boundary_neighborhoods_frozen_before_scores: true
      boundary_and_interior_voxels_matched_on_calibration_reliability: true
      recovery_enriched_near_boundaries: required
      reliable_parcel_interior_residual_is_adequate: required
    contradiction: gain_confined_to_interiors_or_explained_by_reliability

  M2_smooth_relocation:
    target_specific: one_Task_A_fit_bounded_diffeomorphic_field
    same_field_applied_to_every_Task_B_condition: true
    required_certificates:
      - displacement_bound
      - Jacobian_bound
      - inverse_consistency
      - interpolation_stability
    native_signature:
      - field_repeats_across_Task_A_halves
      - local_B_only_residual_direction_matches_source_map_gradient_under_the_field
      - gain_exceeds_matched_random_warp
    condition_or_domain_specific_fields: prohibited

  M3_shared_geometry:
    operator: Q_equals_I_plus_B_times_O_minus_I_times_B_transpose
    basis:
      - development_fixed
      - centered_and_orthonormal
      - bounded_dimension_and_effective_degrees_of_freedom
      - identity_on_canonical_complement
    certificate:
      - Q_transpose_Q_and_Q_Q_transpose_equal_identity
      - Q_times_constant_vector_equals_constant_vector
      - Task_A_active_subspace_has_full_design_rank
      - solution_unique_under_frozen_sign_order_and_tie_rule
      - unidentified_active_directions_removed_or_fixed_to_identity
      - final_operator_meets_frozen_locality_and_numerical_tolerance
    numerical_tolerance: null
    required_interpretive_signature:
      - map_adequacy
      - individual_geometry_within_equivalence_margin
      - paired_M4_increment_below_materiality
    weighted_operator_averaging_without_reprojection_and_recertification: prohibited

  M4_stable_geometry_change:
    operator: L_equals_Q_times_matrix_exponential_of_S
    paired_anchor:
      same_Q_basis_support_preprocessing_and_fit_rule_as_M3: true
      S_zero_reproduces_paired_M3_within_frozen_tolerance: true
    S:
      form: B_times_C_times_B_transpose
      C_symmetric: true
      C_trace_zero: true
      S_times_constant_vector_equals_zero: true
      rank_bound: null
      spectral_norm_bound: null
      effective_degrees_of_freedom_bound: null
      final_operator_locality_bound: null
    Task_A_identifiability:
      active_modes_have_full_design_rank: required
      solution_unique_under_frozen_sign_order_and_tie_rule: required
      unidentified_stretch_or_shear_modes: remove_or_fix_to_zero
    required_subfamilies:
      - centered_basis_anisotropic_stretch
      - localized_low_rank_stretch
      - localized_low_rank_stretch_and_shear
    native_signature:
      - Task_A_half_to_half_mode_stability
      - full_signed_18_by_18_geometry_deviation_prediction
      - mode_ablation_selectively_removes_predicted_geometry_pattern
      - matched_output_smoothness_null_rejected
    scientific_credit_requires:
      - map_adequacy
      - geometry_signal_present_and_geometry_adequacy
      - material_map_gain_over_M1_M2_and_paired_M3
      - material_geometry_gain_over_M1_M2_and_paired_M3
      - every_identifiability_and_stability_check_passes

estimands:
  inferential_unit: participant
  not_independent_units:
    - voxels
    - conditions
    - domains
    - condition_pairs
    - run_partitions
  group_reference: M0b

  map_signal:
    residual: spatially_centered_observed_map_minus_G_c
    statistic: >-
      seven_domain_weighted_cross_half_inner_product_of_pairwise_participant_residual_differences_scaled_to_participant_variance
    name: V_map
  map_remaining:
    residual: map_signal_residual_minus_model_predicted_individual_residual
    statistic: same_cross_half_pairwise_statistic
    name: R_map_m
  map_recovery_fraction:
    formula: one_minus_R_map_m_divided_by_V_map
    report_only_after_positive_signal_gate: true
    participant_specific_ratios: prohibited
    clipping: prohibited

  geometry:
    participant_matrix: symmetric_crossvalidated_18_by_18_condition_second_moment
    source_geometry_K0: actual_development_only_geometry_used_by_M3
    K0_may_not_be_replaced_by_raw_group_mean_Gram: true
    global_gain_removal: fixed_linear_projection_parallel_to_K0
    normalization_by_random_matrix_trace: prohibited
    signal_name: V_geom
    remaining_name: R_geom_m
    statistic: >-
      domain_pair_balanced_cross_replicate_inner_product_of_pairwise_participant_geometry_differences
    M4_prediction_target: full_signed_participant_specific_matrix_deviation_from_K0
    selected_condition_pairs_as_primary_target: prohibited
    condition_geometry_is_only_a_necessary_isometry_invariant: true
    M1_and_M2_can_change_voxel_weighted_geometry: true

  signal_gates:
    map_present: simultaneous_lower_bound_of_V_map_minus_tau_signal_times_S_map_above_zero
    map_negligible: simultaneous_upper_bound_of_same_contrast_below_zero
    map_otherwise: unresolved
    geometry_present: simultaneous_lower_bound_of_V_geom_minus_tau_geometry_times_S_geom_above_zero
    geometry_equivalent: simultaneous_upper_bound_of_same_contrast_below_zero
    geometry_otherwise: unresolved

  scientific_margins:
    tau_signal: null
    tau_remaining: null
    tau_increment: null
    tau_geometry: null
    scale_definitions:
      tau_signal: fraction_of_positive_development_crossvalidated_source_map_energy
      tau_remaining: fraction_of_reliable_between_participant_variation
      tau_increment: dimensionless_map_or_geometry_recovery_fraction
      tau_geometry: individual_geometry_variation_relative_to_K0_energy
    scientist_approval_before_candidate_scores: required
    synthetic_qualification_may_choose_or_widen_margin: false

  native_signature_margins:
    M1_boundary_enrichment: null
    M2_gradient_alignment_advantage: null
    M4_mode_ablation_observed_geometry_gain: null
    values_directions_and_simultaneous_bounds_fixed_before_candidate_scores: true

  native_signature_decisions:
    common:
      inferential_unit: participant
      equal_participant_weight: true
      included_in_branch_intersection_union_claim: true
    M1_boundary_enrichment:
      masks: development_frozen_boundary_neighborhoods_and_interiors
      matching_variables:
        - target_Task_A_measurement_reliability
        - development_only_crossvalidated_Task_B_residual_signal_opportunity
        - development_source_map_gradient_magnitude
      statistic: >-
        normalized_reliable_residual_recovery_in_boundary_voxels_minus_matched_interior_voxels
      normalization: positive_development_only_signal_opportunity_within_each_mask
      required_direction: positive
      pass: simultaneous_lower_bound_above_M1_boundary_enrichment_margin
    M2_gradient_alignment:
      predicted_pattern: source_map_under_fitted_field_minus_unwarped_source_map
      observed_pattern: audit_B_half_map_minus_group_functional_map
      statistic: >-
        seven_domain_weighted_spatial_inner_product_alignment_averaged_over_the_two_B_halves_minus_matched_random_warp_alignment
      required_direction: positive
      pass: simultaneous_lower_bound_above_M2_gradient_alignment_advantage_margin
    M4_mode_ablation:
      mode_geometry_projectors: frozen_from_development_before_audit
      observed_targets: both_independent_Task_B_geometry_replicates
      statistic: >-
        projected_observed_geometry_squared_error_of_mode_ablated_prediction_minus_full_M4_prediction
      required_direction: positive_for_each_predeclared_mode_and_both_replicates
      pass: >-
        simultaneous_lower_bound_above_M4_mode_ablation_observed_geometry_gain_margin
      changing_only_the_models_own_predicted_matrix_is_evidence: false

  decisions:
    adequacy: upper_bound_of_R_minus_tau_remaining_times_V_below_zero
    material_increment: lower_bound_of_R_reference_minus_R_model_minus_tau_increment_times_V_above_zero
    no_material_increment: corresponding_upper_bound_below_zero
    nonsignificance_is_adequacy_or_equivalence: false
    crossing_a_decision_boundary: unresolved

  uncertainty:
    participant_pair_statistic_variance: delete_one_participant_jackknife_pseudovalues
    branch_claim: intersection_union_of_every_required_component
    class_family_control: Holm_inverted_one_sided_bounds_across_M1_M2_M3_M4
    exact_contrast_list_direction_and_implementation: null
    fixed_and_simulation_tested_before_candidate_scores: true

trial_and_search:
  valid_trial: >-
    one_frozen_model_or_falsifier_scored_for_all_12_development_pseudo_targets_all_18_conditions_map_halves_geometry_replicates_endpoints_and_native_signatures
  folds_conditions_domains_partitions_seeds_metrics_or_scheduler_jobs_are_not_trials: true
  engineering_retry_counts_as_new_trial: false
  scientific_signature_failure_invalidates_execution: false
  certificate_or_role_failure_invalidates_execution: true

  initial_coverage:
    valid_trials: 20
    M1:
      - reference_probabilistic
      - hard_assignment
      - coarse_granularity
      - fine_granularity
    M2:
      - reference_diffeomorphism
      - tight_regularity
      - loose_regularity
      - displacement_stress
    M3:
      - reference_local_isometry
      - tight_locality
      - broad_locality
      - active_subspace_stress
    M4:
      - anisotropic_stretch
      - localized_low_rank_stretch
      - localized_low_rank_stretch_and_shear
      - rank_or_spectral_bound_stress
    controls:
      - Task_A_condition_permutation
      - participant_identity_derangement
      - random_local_basis
      - matched_random_warp
    frozen_before_first_development_score: true
    missing_mandatory_branch_blocks_audit: true

  successors:
    evidence_source: development_only
    maximum_changed_scientific_operators: 1
    requires:
      - scored_parent
      - directional_prediction
      - competing_explanation
      - branch_native_falsifier
      - unchanged_operators
      - expected_information_gain_and_cost
      - retirement_condition
    minimum_adaptive_cycles: 2
    minimum_distinct_branches_with_successors: 2

  retirement:
    one_failed_configuration_can_retire_branch: false
    coverage_complete_before_retirement: true
    native_postcoverage_falsifiers_per_branch_minimum: 2
    nonexecutable_mandatory_branch_blocks_audit: true

  limits:
    minimum_valid_trials: 40
    maximum_valid_trials: 96
    patience_after_minimum_and_complete_coverage: 16
    postcoverage_falsifier_or_ablation_fraction_minimum: 0.40
    CPU_core_hours: 1200
    wall_clock_hours: 120
    CPU_cores_per_trial: 32
    memory_GiB_per_trial: 128
    GPU_hours: 0
    scratch_GiB: null
    scratch_limit_required_before_launch: true

synthetic_qualification:
  runs_before_candidate_discriminating_scores: true
  purpose: decision_code_and_operating_characteristics_not_margin_selection
  seeds_per_world: 100
  worlds:
    - group_only
    - parcel_only
    - smooth_warp_only
    - exact_isometry
    - stable_nonisometry
    - Task_A_B_specific_geometry
    - reliability_only_null
  correct_class_rate_for_stable_identifiable_worlds_minimum: 0.90
  false_promotion_rate_for_null_maximum: 0.05
  Task_specific_world_false_stable_nonisometry_maximum: 0.05
  ambiguous_worlds_follow_predeclared_abstention_rule: true
  full_12_12_selection_and_decision_simulation_required: true

qualification_before_candidate_scores:
  required:
    - common_registration_route_and_support_for_all_24_participants
    - Task_B_blind_12_12_roles_and_balance_report
    - role_filtered_handoffs_and_permissions
    - fixed_map_halves_geometry_partitions_and_error_independence_support
    - seven_domain_condition_and_pair_weights
    - actual_M3_source_geometry_K0_and_positive_scales
    - fixed_M1_M2_M3_M4_capacities_and_native_signatures
    - M3_and_M4_identifiability_locality_and_numerical_certificates
    - scientist_approved_margins_and_exact_inference_implementation
    - fixed_scratch_limit_and_outcome_blind_cost_pilot
    - synthetic_classification_and_abstention_qualification
    - published_parameter_cache_and_EP03_exposure_review
    - audit_prediction_dry_run_with_audit_Task_B_unavailable
  failure: readiness_block_not_scientific_result

panel_lock:
  members:
    - one_certified_M1
    - one_certified_M2
    - one_certified_M3
    - one_M4_paired_to_that_M3
    - M0a
    - M0b
    - frozen_negative_controls
  selection_source: development_only
  cross_branch_scalar_winner: prohibited
  all_four_branches_executable: required
  freeze:
    - participant_roles_and_exposure_review
    - source_maps_K0_support_and_map_construction
    - all_model_parameters_capacities_certificates_and_pairings
    - scientific_margins_contrasts_and_uncertainty
    - synthetic_qualification_result
    - audit_prediction_bundle_and_retry_rule

audit:
  mode: one_shot_participant_holdout
  participants_required: 12
  sequence:
    - refit_shared_quantities_on_all_development_participants
    - calibrate_each_audit_participant_from_anatomy_and_Task_A_only
    - write_every_panel_prediction_with_audit_Task_B_unavailable
    - freeze_predictions_and_panel
    - trusted_evaluator_opens_audit_Task_B_once
    - compute_signal_adequacy_signature_increment_and_equivalence_components
    - write_one_primary_decision
    - emit_nonrescuing_diagnostics
  rerun_refit_retune_threshold_change_branch_replacement_or_rescue: prohibited
  audit_result_updates_search: false

  class_support:
    M1:
      - map_adequate
      - reliability_matched_boundary_enrichment_passes
      - parcel_interiors_adequate
      - geometry_gate_resolved
      - geometry_adequate_if_geometry_signal_is_present
      - every_competing_class_status_resolved
    M2:
      - map_adequate
      - Task_A_half_field_stability_passes
      - source_gradient_residual_direction_prediction_passes
      - warp_certificates_and_matched_random_control_pass
      - geometry_gate_resolved
      - geometry_adequate_if_geometry_signal_is_present
      - every_competing_class_status_resolved
    M3:
      - map_adequate
      - exact_operator_certificate_passes
      - condition_geometry_within_tau_geometry
      - paired_M4_increment_below_tau_increment
      - every_competing_class_status_resolved
    M4:
      - map_and_geometry_adequate
      - material_map_and_geometry_increment_over_M1_M2_and_paired_M3
      - Task_A_half_stability_and_mode_ablation_pass
      - matched_smoothness_null_rejected
      - every_identifiability_certificate_passes
      - every_nonnested_competitor_status_resolved

  outcomes:
    precedence:
      - integrity_or_access_failure
      - map_signal_gate
      - any_required_component_indeterminate
      - number_of_fully_supported_classes
      - any_map_adequate_without_supported_mechanism
      - no_map_adequate
    exactly_one_supported_M1: parcel_sufficiency
    exactly_one_supported_M2: smooth_relocation
    exactly_one_supported_M3: shared_condition_geometry
    exactly_one_supported_M4: stable_geometry_change
    two_or_more_nonnested_classes_supported: multiple_adequate_explanations
    at_least_one_map_adequate_and_all_mechanism_claims_decisively_fail: adequate_prediction_without_supported_mechanism
    map_signal_present_no_class_map_adequate: reliable_but_nontransportable
    map_signal_below_margin: no_resolvable_individual_signal
    any_required_component_indeterminate: unresolved

  postdecision_diagnostics:
    - shared_Task_B_nonrest_conditions
    - shared_Task_B_rest_condition
    - within_session_Task_B_half_to_half_oracle_for_each_locked_recipe
    - leave_one_audit_participant_influence
    - condition_domain_and_geometry_tables
  diagnostics_may_change_primary_decision: false

forbidden:
  - audit_Task_B_candidate_or_controller_access
  - audit_Task_B_based_QC_mask_support_replacement_or_exclusion
  - audit_Task_A_based_panel_selection_or_shared_refit
  - target_Task_B_estimated_transform_gain_or_normalization
  - audit_participant_Task_B_in_source_templates_or_priors
  - released_MDTB_fitted_atlas_basis_prior_profile_map_or_checkpoint
  - participant_condition_domain_voxel_or_pair_as_independent_sample
  - whole_brain_or_cortical_primary_endpoint
  - unbounded_dense_operator
  - M4_mode_not_identified_from_Task_A
  - geometry_normalization_by_random_matrix_trace
  - postaudit_tuning_retry_or_rescue

terminal_outcomes:
  parcel_sufficiency: candidate_ready
  smooth_relocation: candidate_ready
  shared_condition_geometry: candidate_ready
  stable_geometry_change: candidate_ready
  multiple_adequate_explanations: closed_no_candidate
  adequate_prediction_without_supported_mechanism: closed_no_candidate
  reliable_but_nontransportable: closed_no_candidate
  no_resolvable_individual_signal: closed_no_candidate
  unresolved: closed_no_candidate
  technical_failure: technical_failure
