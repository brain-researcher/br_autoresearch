estimands:
  inferential_unit: participant
  not_independent_units:
    - voxels
    - conditions
    - domains
    - condition_pairs
    - run_partitions
  group_reference: M0b

  map_signal:
    residual: spatially_centered_observed_map_minus_G_c
    statistic: >-
      seven_domain_weighted_cross_half_inner_product_of_pairwise_participant_residual_differences_scaled_to_participant_variance
    name: V_map
  map_remaining:
    residual: map_signal_residual_minus_model_predicted_individual_residual
    statistic: same_cross_half_pairwise_statistic
    name: R_map_m
  map_recovery_fraction:
    formula: one_minus_R_map_m_divided_by_V_map
    report_only_after_positive_signal_gate: true
    participant_specific_ratios: prohibited
    clipping: prohibited

  geometry:
    participant_matrix: symmetric_crossvalidated_18_by_18_condition_second_moment
    source_geometry_K0: actual_development_only_geometry_used_by_M3
    K0_may_not_be_replaced_by_raw_group_mean_Gram: true
    global_gain_removal: fixed_linear_projection_parallel_to_K0
    normalization_by_random_matrix_trace: prohibited
    signal_name: V_geom
    remaining_name: R_geom_m
    statistic: >-
      domain_pair_balanced_cross_replicate_inner_product_of_pairwise_participant_geometry_differences
    M4_prediction_target: full_signed_participant_specific_matrix_deviation_from_K0
    selected_condition_pairs_as_primary_target: prohibited
    condition_geometry_is_only_a_necessary_isometry_invariant: true
    M1_and_M2_can_change_voxel_weighted_geometry: true

  signal_gates:
    scope: original_formal_route_not_applied_to_exploratory_point_summaries
    map_present: simultaneous_lower_bound_of_V_map_minus_tau_signal_times_S_map_above_zero
    map_negligible: simultaneous_upper_bound_of_same_contrast_below_zero
    map_otherwise: unresolved
    geometry_present: simultaneous_lower_bound_of_V_geom_minus_tau_geometry_times_S_geom_above_zero
    geometry_equivalent: simultaneous_upper_bound_of_same_contrast_below_zero
    geometry_otherwise: unresolved

  scientific_margins:
    tau_signal: null
    tau_remaining: 0.20
    tau_increment: 0.05
    tau_geometry: null
    scale_definitions:
      tau_signal: fraction_of_positive_development_crossvalidated_source_map_energy
      tau_remaining: fraction_of_reliable_between_participant_variation
      tau_increment: dimensionless_map_or_geometry_recovery_fraction
      tau_geometry: individual_geometry_variation_relative_to_K0_energy
    scientist_approval_before_candidate_scores: required
    approval_scope: formal_class_decision_route_except_two_intended_standards_adopted_20261006
    synthetic_qualification_may_choose_or_widen_margin: false

  native_signature_margins:
    scope: original_formal_route_remaining_values_not_required_for_exploratory_point_summaries
    M1_boundary_enrichment: null
    M2_gradient_alignment_advantage: null
    M4_mode_ablation_observed_geometry_gain: null
    values_directions_and_simultaneous_bounds_fixed_before_candidate_scores: true

  native_signature_decisions:
    common:
      inferential_unit: participant
      equal_participant_weight: true
      included_in_branch_intersection_union_claim: true
    M1_boundary_enrichment:
      masks: development_frozen_boundary_neighborhoods_and_interiors
      matching_variables:
        - target_Task_A_measurement_reliability
        - development_only_crossvalidated_Task_B_residual_signal_opportunity
        - development_source_map_gradient_magnitude
      statistic: >-
        normalized_reliable_residual_recovery_in_boundary_voxels_minus_matched_interior_voxels
      normalization: positive_development_only_signal_opportunity_within_each_mask
      required_direction: positive
      pass: simultaneous_lower_bound_above_M1_boundary_enrichment_margin
    M2_gradient_alignment:
      predicted_pattern: source_map_under_fitted_field_minus_unwarped_source_map
      observed_pattern: audit_B_half_map_minus_group_functional_map
      statistic: >-
        seven_domain_weighted_spatial_inner_product_alignment_averaged_over_the_two_B_halves_minus_matched_random_warp_alignment
      required_direction: positive
      pass: simultaneous_lower_bound_above_M2_gradient_alignment_advantage_margin
    M4_mode_ablation:
      mode_geometry_projectors: frozen_from_development_before_audit
      observed_targets: both_independent_Task_B_geometry_replicates
      statistic: >-
        projected_observed_geometry_squared_error_of_mode_ablated_prediction_minus_full_M4_prediction
      required_direction: positive_for_each_predeclared_mode_and_both_replicates
      pass: >-
        simultaneous_lower_bound_above_M4_mode_ablation_observed_geometry_gain_margin
      changing_only_the_models_own_predicted_matrix_is_evidence: false

  decisions:
    adequacy: upper_bound_of_R_minus_tau_remaining_times_V_below_zero
    material_increment: lower_bound_of_R_reference_minus_R_model_minus_tau_increment_times_V_above_zero
    no_material_increment: corresponding_upper_bound_below_zero
    nonsignificance_is_adequacy_or_equivalence: false
    crossing_a_decision_boundary: unresolved

  uncertainty:
    scope: original_formal_route_not_yet_qualified_not_applied_to_exploratory_point_reporting
    participant_pair_statistic_variance: delete_one_participant_jackknife_pseudovalues
    branch_claim: intersection_union_of_every_required_component
    class_family_control: Holm_inverted_one_sided_bounds_across_M1_M2_M3_M4
    exact_contrast_list_direction_and_implementation: null
    fixed_and_simulation_tested_before_candidate_scores: true

