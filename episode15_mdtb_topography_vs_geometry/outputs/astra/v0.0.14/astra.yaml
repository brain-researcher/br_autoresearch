- id: participant_jackknife_tests
  type: data
  description: Direct paired-deletion comparisons, signed three-participant known answers, axis and order preservation, and invalid-input refusal.
  source: outputs/tests/test_participant_jackknife_pseudovalues.py
- id: registered_endpoint_code
  type: data
  description: Array-only selected map and full signed geometry metrics, K0 projection, participant covariance contractions and 18+2Q oriented point contrasts.
  source: outputs/tools/registered_endpoint_metrics.py
- id: registered_endpoint_tests
  type: data
  description: Seven deterministic arithmetic checks of complete weights, signed replicate geometry, fold-specific projection, covariance normalization and oriented contrasts.
  source: outputs/tests/test_registered_endpoint_metrics.py
- id: registered_endpoint_specification
  type: data
  description: Existing paper plan with the October5 selected metric, projection and signed contrast conventions; unresolved inference and margins remain explicit.
  source: outputs/paper_plan.md
- id: anatomical_support_code
