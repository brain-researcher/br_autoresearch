  implementation_qualification:
    name: Certify scientific operators and the full decision procedure
    description: >-
      For the original formal class-decision route, freeze scientist-approved
      scientific/signature margins, exact contrasts,
      capacities, scratch bound and numerical tolerances before candidate
      scores. Certify M3 isometry and TaskA identification and paired M4's
      zero-stretch reduction. Test the complete12/12 selection and decision
      in the registered seven synthetic worlds with100seeds each. Do not tune
      margins to pass; ambiguous cases must abstain. Consume the fixed metadata
      condition-partition plan without treating its role labels as physical
      handoffs, reader isolation or authorization for scoring. The array-only
      M3/M4 algebra prerequisite has its own engineering transcript and does
