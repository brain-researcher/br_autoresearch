  description: Sequential all24 anatomical intersection without beta or individual anatomy exports.
  source: outputs/tools/build_anatomical_support.py
- id: anatomical_support_specification
  type: data
  description: Prospectively adopted absolute-XYZ pull, SUIT-derived stride3 lattice and strict finite stencils.
  source: outputs/anatomical_support_specification.md
- id: task_a_mapping_pilot_code
  type: data
  description: First-participant Task-A mapping with unchanged support and operational-only output.
  source: outputs/tools/pilot_task_a_mapping.py
- id: completed_anatomical_support
  type: data
  description: Completed all24 support report and immutable 208-location common-support array.
  source: outputs/runs/source_qualification/anatomical_support001
- id: task_a_mapping_pilot_specification
  type: data
  description: Adopted exact Task-A member scope, strict sampling, arithmetic halves and bounded cost pilot.
