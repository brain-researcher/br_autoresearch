version: 0.0.14
id: episode15_mdtb_topography_vs_geometry
name: Why do people have different cerebellar task maps?
description: >-
  EP15 experiment program under its frozen Task-A-to-Task-B comparison.
  Source qualification and permission-separated roles precede candidate scores.
  The adopted exploratory branch reports development point summaries while
  original formal margins and mechanism qualification remain deferred. The
  separately adopted observed-map audit tests predictive transport only.
  This program does not itself grant outcome access or scientific acceptance.
tags:
- brain-researcher
- autoresearch
- projection
- plan
- non-authoritative
inputs:
- id: goal
  type: data
  description: Episode research goal contract.
  source: GOAL.md
- id: datasets
  type: data
  description: Episode dataset and access contract.
  source: DATASETS.md
- id: search_policy
  type: data
