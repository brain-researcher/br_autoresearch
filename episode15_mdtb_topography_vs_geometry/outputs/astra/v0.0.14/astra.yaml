decisions:
  declared_search_policy:
    id: declared_search_policy
    label: Declared episode search policy
    rationale: policy_id=ep15_mdtb_topography_vs_geometry; evidence_mode=development_then_one_shot_participant_audit
    default: use_declared_policy
    options:
      use_declared_policy:
        id: use_declared_policy
        label: Use declared policy
outputs:
- id: planned_episode_result
  from: final_report.study_report
findings: {}
analyses:
  source_qualification:
    name: Authenticate common cerebellar registration and source support
    description: >-
      Verify a common route for all24 participants from anatomical metadata,
      anatomy and TaskA only. Qualify transform direction, reference grid,
      interpolation, gray-matter support, map partitions and error independence.
      Review published-parameter and EP03 exposure; no TaskB values are needed
      for source or split preparation. Join all24 ZIP indexes and48 design
      tables, aggregate demographic completeness and one TaskA beta header
      per participant. These metadata recipes do not establish numeric common
      support, private TaskA reliability, or participant roles. The separate
      anatomical recipe freezes the all24 intersection on the source-derived
      zero-based stride3 lattice, with scaled GMc at least0.5 and every positive
      trilinear corner inside the native cerebellar mask. No beta values,
      TaskA reliability, participant roles or scientific margins are activated.
    inputs:
    - {id: datasets, from: ../datasets}
    - {id: policy, from: ../search_policy}
    - {id: metadata_code, from: ../metadata_join_code}
    - {id: header_reader, from: ../nifti_header_reader}
    - {id: prior_anatomy, from: ../prior_anatomical_headers}
    - {id: completed_metadata, from: ../completed_metadata_join}
    - {id: support_code, from: ../anatomical_support_code}
    - {id: support_specification, from: ../anatomical_support_specification}
    - {id: task_a_pilot_code, from: ../task_a_mapping_pilot_code}
    - {id: completed_support, from: ../completed_anatomical_support}
    - {id: task_a_pilot_specification, from: ../task_a_mapping_pilot_specification}
    outputs:
    - id: anatomical_header_report
      type: report
      format: json
      inputs: [datasets, policy]
      recipe:
        command: python3 outputs/tools/inspect_registration_headers.py
    - id: metadata_join_report
      type: report
      format: json
      inputs: [datasets, policy, metadata_code, header_reader, prior_anatomy]
      recipe:
        command: >-
          python3 outputs/tools/join_source_metadata.py
          --output-dir outputs/runs/source_qualification/metadata_join001
          --max-seconds 540
        resources: {cpus: 1, memory: 2Gi, time_limit: 10m}
    - id: anatomical_support
      type: data
      format: directory
      inputs: [datasets, policy, header_reader, prior_anatomy, completed_metadata, support_code, support_specification]
      recipe:
        command: >-
          python3 outputs/tools/build_anatomical_support.py
          --output-dir outputs/runs/source_qualification/anatomical_support001
          --max-seconds 540
        resources: {cpus: 1, memory: 2Gi, time_limit: 10m}
    - id: task_a_mapping_pilot
      type: report
      format: json
      inputs: [datasets, policy, header_reader, prior_anatomy, completed_metadata, completed_support, support_code, support_specification, task_a_pilot_code, task_a_pilot_specification]
      recipe:
        command: >-
          python3 outputs/tools/pilot_task_a_mapping.py
          --output-dir outputs/runs/source_qualification/task_a_mapping_pilot001
          --max-seconds 540
        resources: {cpus: 1, memory: 4Gi, time_limit: 10m}
    - {id: source_report, type: report, format: json, inputs: [datasets, policy]}
  private_task_a_reliability:
    name: Prepare all24 private Task-A reliability scalars
    description: >-
      After the first-person mapping pilot, reuse the exact all24 metadata,
      fixed208 support, scaled NIfTI reader and strict trilinear sampling.
      Read each person's forward transform and noninstruction TaskA betas
      only. Average regressors within run and then equal runs1-8 and9-16;
      take the median of29 centered spatial Pearson correlations with no
      clipping, correction or variance floor. Any missing, constant or
      nonfinite condition blocks the whole cohort without exclusion or
      support changes. Publish only the complete24 median scalars privately;
      coordinator and candidate workers do not read that artifact. Restrictive
      permissions reduce accidental disclosure but do not separate same-UID
      readers. No TaskB, roles, candidate scores or margins are activated.
    inputs:
    - {id: datasets, from: ../datasets}
    - {id: policy, from: ../search_policy}
    - {id: mapping_pilot, from: ../source_qualification.task_a_mapping_pilot}
    - {id: header_reader, from: ../nifti_header_reader}
    - {id: prior_anatomy, from: ../prior_anatomical_headers}
    - {id: completed_metadata, from: ../completed_metadata_join}
    - {id: completed_support, from: ../completed_anatomical_support}
    - {id: support_code, from: ../anatomical_support_code}
    - {id: mapping_code, from: ../task_a_mapping_pilot_code}
    - {id: reliability_code, from: ../private_task_a_reliability_code}
    - {id: specification, from: ../private_task_a_reliability_specification}
    outputs:
    - id: operational_report
      type: report
      format: json
      description: >-
        outputs/runs/source_qualification/private_task_a001/private_task_a_reliability_report.json
        contains operational counts, finite-computability flags, bytes, time,
        peak RSS and the private artifact path. No reliability values, signs,
        extrema or ranks are exported. This single recipe also publishes the
        private_reliability handoff after all24 participants succeed.
      inputs: [datasets, policy, mapping_pilot, header_reader, prior_anatomy, completed_metadata, completed_support, support_code, mapping_code, reliability_code, specification]
      recipe:
        command: >-
          python3 outputs/tools/build_private_task_a_reliability.py
          --output-dir outputs/runs/source_qualification/private_task_a001
          --private-dir outputs/cache/task_a_private_reliability/attempt001
          --max-seconds 540
        resources: {cpus: 1, memory: 4Gi, time_limit: 10m}
    - id: private_reliability
      type: data
      format: csv
      description: >-
        Private steward handoff at
        outputs/cache/task_a_private_reliability/attempt001/task_a_reliability.csv,
        produced by the operational_report recipe in a fresh0700 directory
        with0600 file creation and no-overwrite complete-cohort publication.
        Contains only24 participant IDs and their median centered spatial
        correlations. Only the future trusted role assigner may consume it;
        coordinator and candidate workers must not inspect its contents.
      inputs: [datasets, policy, mapping_pilot, header_reader, prior_anatomy, completed_metadata, completed_support, support_code, mapping_code, reliability_code, specification]
  role_assignment:
    name: Task-B-blind twelve/twelve participant roles and separate handoffs
    description: >-
      The adopted numerical implementation visits all2704156 twelve-person
      audit-ID tuples, including complementary assignments, and minimizes the
      frozen lexicographic objective: maximum and sum categorical-level count
      imbalance, absolute standardized age mean difference and empirical
      equal-weight1-Wasserstein distance, then the same two TaskA reliability
      components. Parse serialized decimals exactly as rationals and compare
      common-scaled integers; all24 population SD and group-size factors are
      constant across assignments, with zero-spread components exactly zero.
      Exact ties select the lexicographically first sorted audit-ID tuple.
      Keep all24 people; missing/nonfinite age or reliability blocks assignment,
      while missing categorical values form explicit levels. Before reading
      demographics or private reliability, require an explicit documentary
      attestation of the existing EP03/MDTB lineage review and a unique nonempty
      named section in the episode log. The documented comparison treats
      EP03/EP15 exposure as potentially correlated with unknown extent. The
      partial EP03 inventory does not prove absent overlap, complete inventory
      coverage or independence. Exclude EP03 functional maps, fitted parameters,
      priors and descendants from assignment, model initialization, support or
      selection. Later source information updates the exposure assessment,
      never the frozen participant split. Only the trusted assigner consumes the
      private handoff; only complete roles and aggregate balance may be published,
      atomically without overwrite after exhaustive completion. No partial best
      split or participant numeric values are released. Same-UID stewardship is
      not an OS seal. Development, audit-calibration and sealed-audit physical
      handoffs remain separately required; roles alone authorize no mount,
      TaskB access, candidate scoring or scientific margin activation.
    inputs:
    - {id: datasets, from: ../datasets}
    - {id: policy, from: ../search_policy}
    - {id: source_report, from: ../source_qualification.source_report}
    - {id: completed_metadata, from: ../completed_metadata_join}
    - {id: reliability_report, from: ../private_task_a_reliability.operational_report}
    - {id: private_reliability, from: ../private_task_a_reliability.private_reliability}
    - {id: assignment_code, from: ../role_assignment_code}
    - {id: specification, from: ../role_assignment_specification}
    - {id: lineage_review, from: ../role_lineage_review_record}
    outputs:
    - id: roles
      type: report
      format: json
      description: >-
        outputs/runs/role_assignment/attempt001/participant_roles.json contains
        the complete twelve/twelve ID partition and aggregate balance only.
        This single recipe also writes role_assignment_report.json with
        operational completion, counts, bytes, time and peak RSS. Neither file
        releases participant ages, categorical rows or reliability values.
        The internal deadline is540seconds and external envelope600seconds;
        incomplete enumeration publishes no roles and triggers no automatic retry.
      inputs: [datasets, policy, source_report, completed_metadata, reliability_report, private_reliability, assignment_code, specification, lineage_review]
      recipe:
        command: >-
          timeout --signal=TERM 600s python3 outputs/tools/assign_participant_roles.py
          --output-dir outputs/runs/role_assignment/attempt001
          --lineage-review-complete
          --lineage-review-section '2026-10-04 21:23 UTC — EP15 pre-role lineage review'
          --max-seconds 540
        resources: {cpus: 1, memory: 2Gi, time_limit: 10m}
    - id: operational_report
      type: report
      format: json
      description: >-
        outputs/runs/role_assignment/attempt001/role_assignment_report.json,
        produced by the roles recipe. Operational facts and fixed failure
        categories only; no private inputs or partial best assignment.
      inputs: [datasets, policy, source_report, completed_metadata, reliability_report, private_reliability, assignment_code, specification, lineage_review]
  condition_partition_plan:
    name: Compile fixed condition partitions and planned role members
    description: >-
      Read only the completed source-metadata JSON, its regressor-members TSV,
      and the complete role-assignment roles and operational report. Preserve
      all 36,480 literal members across 24 participants and 48 sessions, including
      instruction rows with zero map weight. Keep 29 Task A conditions, 32 Task B
      conditions, 14 shared conditions and 18 Task-B-only conditions; shared Task B
      conditions remain post-decision diagnostics. Average repeated regressors
      within each condition and run, then give equal weight to runs 1-8 and 9-16
      for map halves and four runs in each of the fixed geometry quarters.
      Preserve primary geometry pairs 1/2 and 3/4 and exact one-seventh domain
      weights with equal conditions within each domain. Conditions remain
      separate. Label planned development, audit-calibration and sealed-audit
      members without opening source archives or images or reading private
      participant values. Numeric geometry-pair weights, sensitivity pairings,
      error-independence qualification and anatomy manifests remain separate
      work. These labels establish neither physical handoffs nor reader
      isolation and activate no audit calibration, Task B access, scientific
      margins or candidate scoring. Partial publication or a deadline leaves
      the plan incomplete; both files require the complete terminal report.
