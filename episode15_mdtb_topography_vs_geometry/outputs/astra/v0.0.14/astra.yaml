      description: >-
        Fixed descriptive assessment of twelve development people, sixteen
        Task-A runs,29 conditions and208 locations. Spatially centered four-run
        partition maps give signed voxel-mean S=U(P1-P3,P2-P4) and
        N=U(P1-P2,P3-P4), plus descriptive delete-one-person ranges for all
        conditions. No p-value, equivalence threshold or automatic admission.
        Session signal changes and measurement nuisance are not separable;
        common-across-session nuisance is invisible and Task-B validity is
        not established. Actual release and resources are selected separately.
    - id: spatial_operator_algebra_checks
      type: report
      format: text
      description: >-
        Focused source-free arithmetic transcript for row-wise XQ and XL,
        active order O exp(C), inverse exp(-C) O transpose and the exact zero-C
        route to M3. Raw residuals do not select numerical, locality, rank,
        capacity or scientific acceptance thresholds. The fixture comparison
        tolerance is not a fitted-operator tolerance. Run as a one-CPU step
        within a shared substantive allocation, with no separate Slurm job.
        No functional inputs, reader activation or scientific audit access.
      inputs: [policy, operator_code, operator_tests]
      recipe:
        command: >-
          timeout --signal=TERM --kill-after=10s 50s python3.12 -B
          -m unittest discover -s outputs/tests
          -p test_spatial_deformation_operators.py -v > {output} 2>&1
        resources: {cpus: 1, memory: 2Gi, time_limit: 1m}
    - id: m3_task_a_fit_checks
      type: report
      format: text
      description: >-
        Five deterministic source-free checks of weighted row-wise Procrustes,
        optional one-positive-global-gain fitting, source/cross-product rank,
        unique polar solution and input preservation. No selected basis,
        locality/capacity/tolerance default, source construction or reader release.
        Run briefly inside the coordinator's substantive allocation, not a new job.
      inputs: [policy, operator_code, m3_fit_code, m3_fit_tests]
      recipe:
        command: >-
          env OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1
          timeout --signal=TERM --kill-after=5s 110s python3.12 -B
          -m unittest discover -s outputs/tests
          -p test_fit_m3_task_a.py -v > {output} 2>&1
        resources: {cpus: 1, memory: 2Gi, time_limit: 2m}
    - id: m4_task_a_fit_checks
      type: report
      format: text
      description: >-
        Seven bounded array-only checks of the paired stretch optimizer and its
        Frechet derivative. Fixed caller inputs preserve Q, B and the one common
        positive gain. Rank and spectral constraints are imposed during fitting,
        without repairing a fitted result. Numerical convergence does not
        establish global optimality, a unique solution, locality, a selected
        empirical recipe or reader authorization. Run inside the coordinator's
        substantive allocation; no standalone checking job or synthetic sweep.
      inputs: [policy, operator_code, m3_fit_code, m4_fit_code, m4_fit_tests]
      recipe:
        command: >-
          env OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1
          timeout --signal=TERM --kill-after=5s 110s python3.12 -B
          -m unittest discover -s outputs/tests
          -p test_fit_m4_task_a.py -v > {output} 2>&1
        resources: {cpus: 1, memory: 2Gi, time_limit: 2m}
    - id: participant_covariance_algebra_checks
      type: report
      format: text
      description: >-
        Coordinatewise participant-centered cross-products divided by n minus1,
        equal to unordered pair products divided by n times n minus1. Retain
        all feature coordinates and negative values. Shape agreement does not
        prove identity matching or error independence. No feature weighting,
        geometry convention, uncertainty procedure, margin or certificate.
        Short checks share an existing substantive allocation without a new job.
      inputs: [policy, covariance_code, covariance_tests]
      recipe:
        command: >-
          timeout --signal=TERM --kill-after=5s 10s python3.12 -B
          -m unittest discover -s outputs/tests
          -p test_participant_cross_replicate_covariance.py -v > {output} 2>&1
        resources: {cpus: 1, memory: 2Gi, time_limit: 1m}
    - id: participant_jackknife_arithmetic_checks
      type: report
      format: text
      description: >-
        Paired delete-one covariance and participant pseudovalues for at least
        three matched participants. Preserve participant order, feature axes
        and negative estimates. These checks do not decide nuisance refitting,
        interval distributions, feature weights, Holm inversion or margins,
        and do not qualify scientific inference. No source reader or model fit.
        Bundle the short transcript with a substantive coordinated allocation.
      inputs: [policy, covariance_code, jackknife_code, jackknife_tests]
      recipe:
        command: >-
          timeout --signal=TERM --kill-after=5s 10s python3.12 -B
          -m unittest discover -s outputs/tests
          -p test_participant_jackknife_pseudovalues.py -v > {output} 2>&1
        resources: {cpus: 1, memory: 2Gi, time_limit: 1m}
    - id: registered_endpoint_arithmetic_checks
      type: report
      format: text
      description: >-
        Seven deterministic checks implement the already selected equal-domain
        map metric, all171 signed geometry entries in28 equally weighted blocks,
        supplied fold-specific K0 projection, participant-variance contraction
        and all18+2Q oriented point contrasts. Required native-signature estimates,
        complete mode identities and source-only scales remain caller inputs.
        This is no confidence-bound construction, class decision, margin adoption,
        seven-world qualification or reader authorization. Reuse passing covariance
        and jackknife evidence. Run with one numerical thread inside the
        coordinator's substantive allocation; no separate short job.
      inputs: [policy, endpoint_specification, covariance_code, endpoint_code, endpoint_tests]
      recipe:
        command: >-
          env OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1
          timeout --signal=TERM --kill-after=5s 50s python3.12 -B
          -m unittest discover -s outputs/tests
          -p test_registered_endpoint_metrics.py -v > {output} 2>&1
        resources: {cpus: 1, memory: 2Gi, time_limit: 1m}
    - id: development_lopo_checks
      type: report
      format: text
      description: >-
        Focused checks cover affected LOPO/source integration, M1, M2,
        matched-warp, M3-variant, M4, M0a, random-basis and the two
        Task-A calibration falsifiers and the retained-fit M2 alignment statistic.
        All twelve targets and 132 nested refits preserve source exclusions,
        common Task-A gain and fold-specific geometry. Four initial M1 variants
        retain all 208 locations and eighteen B conditions, source-A-only
        temperature, explicit hard ties and actual four-source-map geometry.
        M2 adds exact-node cardinal derivatives, bounded global pull fields,
        inverse consistency, raw versus centered interpolation amplification,
        one nonzero nonlinear fit and four-partition predictions. Nested M2
        dataflow uses a cheap callback fixture, not hundreds of nonlinear fits.
        Matched warps reuse existing fits, keep all eight separate control draws
        per variant, and average residual statistics after evaluating each draw.
        This conditional direction falsifier is not an omnibus capacity test,
        calibrated p-value or certified average operator.
        M3 variants preserve the one reference source and gain, reuse the
        reference fit, certify actual operator locality and geometry, and
        distinguish the tight variant's sixteen discrete signs from continuous
        flexibility. No rank-failing variant drops directions or changes source.
        M4 tests use analytic curvature and linear-support gap oracles, retain
        noncommuting reference rotation/stretch order, and refuse unverified
        certificates without changing modes or bounds. Numerical acceptance
        does not assert an exact optimizer or an interval-arithmetic proof.
        M0a preserves exact fold exclusion before reading raw partitions, uses
        no target A or B, and retains the separately defined M0b residual origin.
        Random-basis checks distinguish a vacuous within-span rotation from
        a changed subspace, preserve the maximum Rayleigh ceiling, handle
        actual boundary ties and retain each draw before residual averaging.
        Average roughness, full spectrum and M4 output roughness are not matched.
        Calibration falsifiers use genuine Task-A half packets, current-source
        reliability strata and one fixed condition/identity cycle. Target B
        enters only after predictions. Identity true/donor arms exclude both
        people from one matched source and keep their reduced-source estimand
        separate from ordinary LOPO. All sixteen variants share each packet's
        refitted gain; donor/condition mappings and source exclusions follow
        the complete deletion procedure. One draw supplies no permutation
        p-value, and M3's projected geometry contrast remains algebraically zero.
        M2 alignment removes common gain before subtracting G, preserving the
        literal source-map change and equal participant weights. It retains
        both B halves and all eight controls per variant, with seven equal
        domain weights; each control is scored before averaging. Its three
        checks do not certify half-field stability or a native threshold.
        Reuse previously passing unchanged anatomy/source/operator checks.
        Callback arguments do not enforce OS isolation. These checks do not
        certify native signatures, class adequacy, uncertainty or reader release.
        Run serially in a coordinator-owned substantive allocation, with no
        separate short job or additional compute reservation.
      inputs: [policy, m3_fit_code, m4_fit_code, endpoint_code, lopo_code, lopo_tests, local_basis_code, functional_source_code, functional_source_tests, parcel_code, parcel_tests, cardinal_code, relocation_code, relocation_tests, matched_warp_code, matched_warp_tests, isometry_variants_code, isometry_variants_tests, stretch_variants_code, stretch_variants_tests, anatomical_baseline_code, anatomical_baseline_tests, random_basis_code, random_basis_tests, calibration_falsifier_code, calibration_falsifier_tests, m2_alignment_code, m2_alignment_tests]
      recipe:
        command: >-
          env OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1
          timeout --signal=TERM --kill-after=5s 120s bash -c
          'cd outputs/tests && exec python3.12 -B -m unittest -v
          test_development_lopo test_local_parcel_prediction
          test_smooth_relocation test_matched_random_warp
          test_local_isometry_variants test_paired_stretch_variants
          test_anatomical_group_baseline test_matched_random_basis
          test_local_functional_source test_calibration_falsifiers
          test_m2_alignment_signature' > {output} 2>&1
        resources: {cpus: 1, memory: 7Gi, time_limit: 3m}
    - id: development_handoff_adapter_checks
      type: report
      format: text
      description: >-
        Nine focused source-free reader and point-panel checks cover complete twelve-person/208-location
        assembly, equal regressor then equal run arithmetic, genuine A halves
        and four B-only partitions, role/condition/member rejection before
        sampling, real scaled NIfTI and strict trilinear beta integration,
        closed diagnostic/instruction streams, all-participant header preflight,
        fixed support/absolute pull and late failure without a partial cohort.
        Three panel integration checks bind all A/B views before fitting, connect
        all16 fixed model variants and existing controls, and refuse partial
        scoring on failure. Reuse the existing in-memory NIfTI fixtures and passing mapping/model
        components. No real B decoding, source discovery, fitting or scoring
        occurs. Explicit release bindings and callback restrictions do not
        establish isolation or authorize access; actual enforced development
        reader deployment and release remain required before numeric mapping.
        Run only these two selected modules serially inside a coordinator-owned substantive
        allocation. No separate short job, expanded simulation program or
        automatic empirical successor is selected.
      inputs: [policy, development_reader_code, development_reader_tests, development_panel_code, development_panel_tests, support_code, mapping_code, header_reader, metadata_code, handoff_preparation_code, support_test_fixtures, mapping_test_fixtures, lopo_code, functional_source_code, calibration_falsifier_code, endpoint_code, local_basis_code, parcel_code, relocation_code, matched_warp_code, isometry_variants_code, stretch_variants_code, anatomical_baseline_code, random_basis_code, random_basis_tests, calibration_falsifier_tests, m2_alignment_code]
      recipe:
        command: >-
          env OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1
          NUMEXPR_NUM_THREADS=1 VECLIB_MAXIMUM_THREADS=1 BLIS_NUM_THREADS=1
          timeout --signal=TERM --kill-after=5s 120s bash -c
          'cd outputs/tests && python3.12 -B -m unittest -v
          test_development_handoff_reader test_development_point_panel' > {output} 2>&1
        resources: {cpus: 1, memory: 2Gi, time_limit: 3m}
