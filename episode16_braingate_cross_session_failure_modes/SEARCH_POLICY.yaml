version: 2
episode: EP16
question: Why does a human iBCI mapping work in one session but not another?

data:
  source:
    name: BrainGate long-term array performance release
    doi: 10.5061/dryad.x0k6djj1h
    release: 6
    provider_version: 462702
  biological_unit: participant
  decoding_participants: 9
  development_participants: 6
  held_out_participants: 3
  initial_development: [T5, T10, T11]
  initial_held_out_candidates: [T2, T3, T6, T7, T8, T9]
  keep_all_sessions_and_arrays_from_one_participant_together: true
  participant_roles_chosen_without_neural_scores: true
  held_out_participant_replacement_after_results: false

session_pairs:
  required_same_participant: true
  required_same_physical_array_set: true
  required_same_observed_target_schedule: true
  near_gap_days: [1, 30]
  descriptive_mid_gap_days: [31, 179]
  long_gap_days_minimum: 180
  near_pairs_per_held_out_participant_minimum: 6
  long_pairs_per_held_out_participant_minimum: 6
  near_and_long_pairs_must_share_a_schedule_group: true
  primary_direction: chronological_earlier_source_to_later_target_only
  reciprocal_direction_role: required_transport_asymmetry_sensitivity_only
  reciprocal_pairs_enter_primary_adjusted_or_local_signal_estimands: false
  alternate_gap_sensitivity_days: [14, 365]
  alternate_gap_sensitivity_can_replace_primary: false
  schedule_matching:
    translation_invariant: true
    isotropic_scale_invariant: true
    rotation_invariant: false
    reflection_invariant: false
    task_identity_claimed: false
    exclude_multiple_or_unstable_layouts: true
    exclude_conflicting_transition_patterns: true
    exclude_size_dependent_schedules_without_target_size: true
    coordinate_tolerance: null

trial_packet:
  trials_per_session: 128
  outer_sides: 2
  trials_per_side: 64
  split_by_whole_blocks: true
  reverse_fit_and_evaluation_sides: true
  nested_recalibration_trials: [16, 32, 64]
  primary_recalibration_trials: 32
  exclude_start_positions_within_fraction_of_median_target_spacing: 0.05
  random_10ms_bin_splitting: false

prediction:
  primary_feature: sbp
  required_feature_sensitivity: tx_4_5
  window_ms: 300
  onset_offset_ms: null
  onset_offset_shared_across_all_participants_and_sessions: true
  label: cursor_to_target_unit_vector_at_window_start
  label_is_direct_intention: false
  model: capacity_matched_multioutput_ridge
  direction_octants_receive_equal_total_weight: true
  primary_score: direction_balanced_negative_2d_mean_squared_error
  higher_score_is_better: true
  secondary_scores: [multivariate_R2, angular_error]
  channel_axis: physical_array_and_electrode_identity
  missing_target_channel: source_center_after_source_scaling

same_trial_benchmarks:
  - direction_balanced_null
  - model_trained_inside_later_session
  - earlier_session_model_applied_unchanged
  - recalibrated_earlier_session_model

primary_long_gap_test:
  score_symbols:
    B_target: direction_balanced_null_score_on_target_evaluation_trials
    L_target: target_local_model_score_on_the_same_target_evaluation_trials
    F_source_target: unchanged_source_model_score_on_the_same_target_evaluation_trials
  fold_aggregation: average_each_score_equally_over_the_two_reversed_outer_folds_before_any_subtraction_or_ratio
  quantity: "R_source_target = (L_target - F_source_target) / (L_target - B_target)"
  interpretation: fraction_of_target_locally_recoverable_above_null_performance_lost_in_transport
  denominator_readiness:
    requirement: L_target_minus_B_target_must_be_finite_and_exceed_predeclared_readiness_minimum
    failure: pair_and_registered_connected_component_unresolved_pair_not_dropped
    epsilon_replacement: prohibited
  clipping: prohibited_values_below_zero_or_above_one_are_retained
  primary_pairs: chronological_earlier_source_to_later_target_only
  reciprocal_pairs: sensitivity_only_not_in_primary_or_local_signal_estimands
  comparison: long_gap_minus_near_gap
  adjusted_model: normalized_transport_loss_equals_component_intercept_plus_source_session_effect_plus_target_session_effect_plus_long_gap_effect
  fit_separately_within: connected_participant_by_observed_schedule_component
  adjusted_contrast: coefficient_on_long_gap_indicator
  source_and_target_effect_constraints: sum_to_zero_within_component
  adjust_for_source_session_difficulty: true
  adjust_for_target_session_difficulty: true
  weight_each_target_session_equally: true
  component_identifiability:
    both_near_and_long_pairs_required: true
    full_constrained_design_rank_required: true
    condition_number_maximum: null
    residualized_long_indicator_norm_minimum: null
    maximum_session_node_leverage: null
    numeric_limits_set_before_neural_scores: true
    all_claim_contributing_components_must_pass: true
    failed_gate: unresolved_support_failure
    pairs_may_be_dropped_to_restore_rank: false
  component_aggregation: equal_schedule_group_then_equal_connected_component
  uncertainty:
    method: session_node_bootstrap_with_nested_whole_block_trial_resampling
    draws: 9999
    confidence_level: 0.95
    session_nodes_sampled_with_replacement_per_participant: same_count_as_observed
    rebuild_all_induced_source_target_pairs: true
    account_for_sessions_used_as_source_and_target: true
    resample_pairs_as_independent_observations: false
    simultaneous_family:
      - adjusted_normalized_long_gap_contrast
      - target_balanced_robust_median_contrast
      - fractional_local_signal_contrast
      - raw_transported_above_null_contrast
    simultaneous_method: one_sided_Bonferroni_bootstrap_percentile_bounds
    familywise_alpha_within_participant: 0.05
    repeated_node_rule: >-
      Give every sampled occurrence of a session its own bootstrap-node identity,
      rebuild every eligible chronological primary pair implied by the sampled
      endpoint occurrences, and resample whole blocks and trials within each
      occurrence.
    nonestimable_draw_rule: >-
      Never redraw or silently omit a replicate whose fixed-effect design loses
      rank or whose required denominator fails. Treat it as minus infinity for
      a lower bound and plus infinity for an upper bound; if this makes a required
      95 percent bound infinite, that participant's conclusion is unresolved.
  robust_check:
    within_target_and_lag: median_R_across_eligible_chronological_sources
    within_component_and_lag: median_across_target_level_medians
    component_contrast: long_minus_near
    participant_aggregation: equal_schedule_group_then_equal_connected_component
  both_primary_and_robust_check_must_clear_margin: true
  participant_is_inferential_unit: true
  session_pairs_are_not_independent_participants: true

diagnostic_questions:
  locally_weaker_signal:
    may_be_supported_without_extra_normalized_transport_loss: true
    local_score_J_session: session_local_model_score_minus_same_session_null_score
    source_readiness: source_J_must_clear_the_predeclared_readiness_minimum
    session_scores_aggregated_equally_over_outer_folds_before_differences_or_ratios: true
    pair_direction: chronological_earlier_source_to_later_target_only
    reciprocal_pairs_enter_contrast: false
    pair_fractional_local_change: (J_target_minus_J_source)_divided_by_J_source
    pair_transported_above_null: transported_source_to_target_score_minus_target_null_score
    pair_weighting: >-
      Within each lag class and connected schedule component, give every target
      session equal total weight and divide that target's weight equally among
      its eligible source sessions.
    component_fractional_contrast: long_mean_pair_fractional_local_change_minus_near_mean
    component_raw_transport_contrast: long_mean_pair_transported_above_null_minus_near_mean
    participant_aggregation: equal_schedule_group_then_equal_connected_component
    support_set: >-
      Use the identical connected components for the fractional and raw
      contrasts, and require both near and long pairs in every component.
    uncertainty: same_session_node_bootstrap_and_simultaneous_family_as_primary
    decision: >-
      The simultaneous upper bounds for both contrasts must be below their
      negative margins in each held-out participant.
    fractional_reduction_anchor: -0.15
    raw_score_decline_margin: null
  observable_recording_change_sufficient:
    label_blind_inputs:
      - electrode_identity_and_availability
      - finite_value_rates
      - prespecified_marginal_channel_quality
      - same_day_yield_and_impedance_when_available
    allowed_changes: [drop_channels, attenuate_signal, add_noise]
    forbidden_changes: [invent_missing_channels, amplify_information]
    transition_requires_later_recording_no_better_in_both_outer_sides: true
    near_transitions_per_participant_minimum: 6
    long_transitions_per_participant_minimum: 6
    must_reproduce:
      - near_and_long_change_in_later_session_score_above_null
      - near_and_long_normalized_transport_loss
      - extra_long_gap_loss_on_the_same_eligible_transitions
    normalized_error_anchor_maximum: 0.10
    matched_random_channel_control_required: true
  low_budget_remapping:
    labels: 32
    gap_recovery_fraction_anchor_minimum: 0.50
    improvement_relative_to_later_session_above_null_anchor_minimum: 0.10
    selected_method_form_same_for_all_held_out_participants: true
    report_16_32_64_curve: true

numeric_values_required_before_neural_scoring:
  harmful_long_gap_margin:
    proposed_anchor: 0.10
    final_value: null
  robust_median_margin: null
  local_signal_fractional_reduction_margin:
    proposed_anchor: -0.15
    final_value: null
  transported_raw_score_decline_margin: null
  gap_recovery_fraction_margin:
    proposed_anchor: 0.50
    final_value: null
  relative_recovery_gain_margin:
    proposed_anchor: 0.10
    final_value: null
  recording_change_normalized_error_margin:
    proposed_anchor: 0.10
    final_value: null
  recording_change_extra_loss_margin: null
  matched_random_separation_margin: null
  later_session_above_null_readiness_minimum: null
  raw_transport_gap_readiness_minimum: null
  long_gap_design_condition_number_maximum: null
  long_gap_residualized_indicator_norm_minimum: null
  long_gap_maximum_session_node_leverage: null
  schedule_coordinate_tolerance: null
  onset_offset_ms: null
  channel_quality_cutoffs: null
  adaptation_rank_and_complexity_limits: null
  transformation_stability_limit: null
  uncertainty_rule: null
  equality_at_a_margin: unresolved
  synthetic_checks_may_choose_or_relax_scientific_margins: false

recalibration_families:
  no_target_data:
    - unchanged_earlier_session_mapping
  unlabelled_later_session_activity:
    - past_only_mean_and_scale
    - bounded_covariance_adjustment
    - orthogonal_alignment
  thirty_two_labels:
    - output_gain_bias_and_rotation
    - orthogonal_remapping
    - low_rank_remapping
    - bounded_supervised_alignment
  sixty_four_labels:
    - later_session_ridge_benchmark
    - capacity_matched_latent_model
    - one_development_selected_ceiling_model
  whole_session_normalization_role: descriptive_upper_bound_only
  evaluation_trials_may_tune_a_method: false
  target_labels_may_enter_unlabelled_methods: false
  shuffled_target_control_for_every_supervised_method: true

initial_coverage_panels:
  count: 20
  entries:
    - unchanged_earlier_session_reference
    - past_only_normalization_lower_setting
    - past_only_normalization_upper_setting
    - covariance_adjustment_lower_shrinkage
    - covariance_adjustment_upper_shrinkage
    - orthogonal_unlabelled_alignment
    - output_gain_and_bias
    - output_rotation
    - low_rank_remapping_lower_rank
    - low_rank_remapping_upper_rank
    - bounded_supervised_alignment
    - capacity_matched_later_session_latent_model
    - development_selected_ceiling_model
    - identity_aware_channel_dropout_emulation
    - identity_aware_channel_dropout_and_noise_emulation
    - matched_random_channel_degradation
    - survivor_electrode_analysis
    - tx_4_5_feature_sensitivity
    - reciprocal_and_source_target_difficulty_controls
    - fold_null_missingness_and_gap_sensitivities

