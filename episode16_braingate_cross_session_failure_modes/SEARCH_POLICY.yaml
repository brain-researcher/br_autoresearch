    - output_gain_bias_or_rotation_mismatch
    - orthogonal_or_low_rank_remappable_mismatch
    - identity_specific_channel_dropout_and_noise
    - count_matched_random_channel_degradation
    - later_session_signal_reduction
    - multiple_coexisting_signatures
    - participant_patterns_that_do_not_repeat
    - deliberate_random_bin_and_target_label_leakage
  must_check:
    - whole_block_64_64_split_and_nested_16_32_64_packets
    - physical_channel_identity_and_missing_channel_rule
    - score_direction_and_fold_aggregation
    - denominator_failures_remain_unresolved
    - expected_explanation_is_recovered
