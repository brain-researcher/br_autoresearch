policy_id: ep17_cneuromod_model_ranking_stability
episode_id: ep17
evidence_mode: development_then_one_shot_concept_audit

paper_focus:
  milestone: "2026-10-02"
  status: pre_score_design_nomination_not_execution_lock
  lead_pair: official_DINO_ResNet50_vs_Torchvision_ResNet50_IMAGENET1K_V1
  supporting_pair_nominations:
    - official_standard_width_SwAV_ResNet50_800_epochs_vs_same_supervised_backbone
    - same_DINO_vs_same_SwAV_backbones
  pair_control_and_exposure_eligibility: claim_specific_measurement_comparison_checkpoint_and_exposure_qualification_open
  nominated_ROIs: [DK_ctx_lh_fusiform_1007, DK_ctx_rh_fusiform_2007]
  anatomical_ROI_not_functional_FFA: true
  headline_edge: D_stage_A_N_to_R_N
  forecast: development_advantage_reaggregated_under_frozen_calibration_support_weights
  unconditional_self_supervised_winner: not_assumed
  operative_three_pair_five_edge_coverage_budget_margins_and_audit: unchanged
  new_execution_or_access_authority: false

scientific_question:
  primary: >-
    For a controlled pair of visual models, is the held-out fMRI relation
    stable across isolated beta, voxel-support, and ceiling-weighting choices,
    or does one operation produce a genuine reversal?
  explanatory: >-
    Can alignment between the voxelwise model-advantage map and an
    independently defined measurement-operator map predict the direction and
    magnitude of that change on sealed concepts?
  primary_score: raw_heldout_voxelwise_R2
  strongest_permitted_claim: >-
    A controlled model relation is stable or changes for a predictable
    measurement reason on new concepts in the same four participants.
  prohibited_claims:
    - new_participant_or_population_generalization
    - cross_dataset_transport
    - universal_model_ranking
    - causal_superiority_of_architecture_objective_or_training_diet

data_roles:
  source:
    dataset: CNeuroMod_THINGS
    release: 1.0.1
    participants: [sub-01, sub-02, sub-03, sub-06]
    participants_required: 4
    participant_replacement: prohibited

  development:
    concepts: 480
    unit: whole_concept_across_images_repetitions_participants_and_stages
    use:
      - nested_model_fitting
      - measurement_edge_comparison
      - operator_advantage_modeling
      - finalist_selection

  support_calibration:
    concepts: 120
    unit: whole_concept_across_images_repetitions_participants_and_stages
    use:
      - repeat_reliability
      - reliability_change_maps
      - voxel_support_selection
      - stage_specific_noise_ceilings
    candidate_model_fit_or_score: prohibited
    raw_neural_reader: trusted_builder_only

  audit:
    concepts: 120
    unit: whole_concept_across_images_repetitions_participants_and_stages
    use: one_shot_same_participant_concept_disjoint_replication
    reader: trusted_evaluator_only_after_final_freeze
    readout_refit_or_retuning: prohibited
    maximum_open_count: 1

  uncertainty_units:
    participants: 4
    development_concept_blocks: 24
    audit_concept_blocks: 12
  not_independent_replicates:
    - voxels
    - images
    - repetitions
    - folds
    - measurement_contracts

access_boundary:
  mixed_source_visible_to_search_worker: false
  required_handoffs:
    metadata_only:
      contents: IDs_roles_folds_blocks_repeat_stage_and_geometry_mappings
      neural_and_behavioral_outcomes: absent
    calibration_neural:
      reader: trusted_builder_only
    development:
      contents: >-
        development_neural_IDs_folds_role_safe_model_features_plus_frozen_calibration_artifacts
      reader: search_worker
    sealed_audit:
      contents: >-
        audit_neural_IDs_blocks_and_frozen_model_features_for_the_locked_predictor
      reader: trusted_evaluator_only
      candidate_embeddings_visible_to_search_worker_before_lock: false
  materialized_role_filtered_files_required: true
  links_back_to_mixed_source: prohibited
  candidate_scoring_before_role_separation: prohibited

eligibility_and_assignment:
  common_universe: exact_image_ID_intersection_across_all_four_participants
  expected_concepts: 720
  eligibility_requires:
    - identical_image_and_concept_IDs
    - fixed_repeat_completeness_in_every_participant
    - identical_B_C_D_trial_mapping
    - structural_compatibility_only
  eligibility_may_not_use:
    - neural_values
    - behavior_outcomes
    - candidate_features
    - model_scores
  count_other_than_720: revise_or_stop_before_neural_access

  assignment:
    method: deterministic_metadata_only_balance
    role_counts: {development: 480, support_calibration: 120, sealed_audit: 120}
    balance_fields:
      - frozen_external_taxonomy
      - five_vs_six_exemplar_status
      - session_and_acquisition_order
      - repetition_lag
    freeze_before_assignment:
      - taxonomy_release_and_concept_crosswalk
      - unmapped_and_multilabel_rules
      - group_merging_and_minimum_cell_size
      - balance_objective_tolerances_and_tie_break
    every_exemplar_repeat_participant_and_stage_inherits_concept_role: true

  development_outer_folds:
    count: 6
    concepts_per_fold: 80
  development_uncertainty_blocks:
    count: 24
    concepts_per_block: 20
    independent_of_outer_fold_labels: true
  audit_blocks:
    count: 12
    concepts_per_block: 10

response:
  neural_products:
    B: fitted_HRF_without_GLMdenoise_or_response_ridge
    C: fitted_HRF_plus_GLMdenoise
    D: fitted_HRF_plus_GLMdenoise_plus_response_ridge
  B_C_D_must_share_trial_response_voxel_and_geometry_mapping: true
  primary_unit: unique_image_within_participant_stage_and_voxel
  repetition_aggregation: equal_mean_of_retained_trialwise_betas
  fitting_and_scoring_weight: equal_per_unique_image
  trialwise_or_inverse_variance_endpoints: sensitivity_only
  voxel_eligibility:
    determined_before_candidate_model_outputs: true
    requires_finite_response_and_nondegenerate_variance_at_every_edge_endpoint: true
    numerical_variance_threshold: null
    threshold_must_be_frozen_before_scores: true
    one_common_voxel_set_per_edge: true
    pairwise_complete_deletion: prohibited
    model_specific_missing_voxel_image_prediction_or_score: invalid_whole_paired_trial

model_pairs:
  promotion_pairs_required: 3
  promotion_pairs_maximum: 4
  eligibility_amendment_date: "2026-10-02"
  permitted_primary_claim: measurement_conditional_comparison_of_two_fixed_representations
  each_pair_requires:
    - named_fixed_checkpoints_unchanged_across_measurement_edge
    - disclosed_architecture_objective_corpus_and_training_recipe_differences
    - matched_neural_readout_selection_budget_and_scoring
    - checkpoint_and_image_exposure_qualification
  single_property_training_intervention_required_for_measurement_question: false
  causal_training_property_attribution: prohibited
  isolated_factor: measurement_operation_not_training_recipe
  trained_vs_deterministically_initialized_random_pair:
    required: true
    promotion_eligible: false
  checkpoint_record_requires:
    - named_model_and_version
    - architecture_objective_and_parameter_count
    - training_data_lineage
    - license
    - image_preprocessing_and_feature_shape
    - eligible_layers
    - THINGS_and_target_image_exposure_status
  known_exact_or_near_duplicate_exposure: control_only
  unknown_exposure: cannot_support_clean_exposure_claim
  fixed_before_candidate_discriminating_scores: true

linking_model:
  primary: voxelwise_ridge_encoding
  learned_inside_development_training_concepts:
    - feature_centering
    - PCA
    - layer_selection
    - PCA_rank_selection
    - ridge_selection
  same_folds_images_weights_and_selection_budget_within_pair: true
  outer_heldout_concepts_choose_hyperparameters: false
  grids_layers_and_tie_rule_fixed_before_scores: true
  beta_edge_common_hyperparameter_selection:
    performed_separately_for_each_model: true
    one_layer_rank_and_ridge_setting_shared_across_B_C_D: true
    objective: >-
      mean_inner_validation_raw_R2_across_B_C_D_after_voxel_within_ROI_equal_ROI_and_equal_participant_aggregation
    tie_order:
      - shallower_registered_layer
      - smaller_PCA_rank
      - larger_ridge_penalty
    endpoint_specific_voxel_coefficient_banks_locked_for_audit: true
  final_voxel_coefficients_fit_on: all_development_concepts_only
  audit_refit: prohibited

scores:
  primary_raw_R2:
    formula: 1_minus_heldout_SSE_over_SST_around_development_training_mean
    retain_negative_values: true
    voxel_pair_advantage: d_s_r_v_equals_R2_model_A_minus_R2_model_B
    aggregation: >-
      mean_voxel_within_participant_ROI_then_equal_ROI_if_applicable_then_equal_mean_four_participants

  ceiling_normalized_R2:
    formula_per_voxel: raw_R2_divided_by_max_stage_specific_NC_and_tau
    identical_voxels_predictions_and_raw_scores: required
    aggregate: mean_of_voxelwise_ratios
    ratio_of_ROI_means: prohibited
    clipping_negative_or_above_one_values: prohibited
    role: paired_reweighting_analysis

  heldout_correlation:
    transform: Fisher_z
    role: sensitivity_only
    cannot_replace_primary_R2: true

  linear_CKA:
    model_features: frozen_layer_and_common_fixed_PCA_rank
    response_images_and_support: same_as_compared_encoding_relation
    role: secondary_linking_falsifier
    own_margin_and_scale: true

  practical_margins:
    raw_R2: null
    ceiling_normalized_R2: null
    heldout_correlation: null
    linear_CKA: null
    beta_high_minus_low_gain: null
    each_fixed_before_candidate_scores: true
    component_uses_margin_on_its_own_scale: true

  pooling_R2_correlation_normalized_R2_or_CKA_scales: prohibited

measurement_contracts:
  indexing_and_aggregation:
    maps_and_weights_defined_within: participant_x_visual_ROI
    native_voxels_pooled_across_participants: false
    endpoint_order:
      - average_voxels_within_participant_ROI
      - equal_average_declared_ROIs_if_more_than_one
      - equal_average_four_participants

  common_anatomical_support:
    name: A_all
    source: frozen_visual_ROI_crosswalk
    finite_across_B_C_D_before_model_scores: true

  beta_edges:
    edges: [B_to_C, C_to_D]
    support: A_all
    score: raw_R2
    fixed:
      - image_IDs_and_concept_folds
      - voxel_identity
      - model_features
      - layer_PCA_rank_and_ridge_selection
      - score_and_weights
    allowed_change: response_stage_and_stage_fitted_voxel_coefficients
    common_hyperparameter_rule_selected_jointly_across_B_C_D: true
    stage_specific_retuning: sensitivity_only
    pure_edge_interpretation: beta_stage_can_change_voxelwise_d_v

  support_edges:
    primary_edge: A_N_to_R_N
    size_control: A_all_to_A_N
    stage: D
    A_all: all_common_finite_anatomical_ROI_voxels
    A_N: mean_over_fixed_bank_of_anatomical_subsets_within_participant_ROI
    R_N: top_D_stage_calibration_reliability_voxels_within_participant_ROI
    fixed:
      - one_common_out_of_fold_prediction_bank
      - per_voxel_scores
      - N
      - subparcel_and_spatial_bin_quotas
    N_bank_size_spatial_bins_quotas_and_seed_fixed_before_scores: true
    support_specific_layer_rank_penalty_or_prediction_fit: prohibited
    quota_mismatch: composite_not_support_only
    pure_edge_interpretation: membership_changes_while_each_d_v_is_fixed

  ceiling_edge:
    edge: raw_R2_to_ceiling_normalized_R2
    stage: D
    support: V_NC
    V_NC: >-
      D_stage_A_all_voxels_passing_the_preoutcome_response_variance_rule_with_a_finite_calibration_noise_ceiling_before_flooring
    fixed:
      - images
      - response_stage
      - predictions
      - voxel_identity
      - raw_voxelwise_R2
    noise_ceiling_source: support_calibration_concepts_only
    stage_specific_estimates_required_for_diagnostics: [B, C, D]
    eligibility_threshold_fixed_before_scores: true
    floor_tau_fixed_before_scores: true
    public_D_ceiling: postfreeze_positive_control_only
    pure_edge_interpretation: positive_weights_change_but_each_voxel_sign_is_fixed

  fixed_initial_edges_per_pair:
    - B_to_C
    - C_to_D
    - A_all_to_A_N
    - A_N_to_R_N
    - raw_to_ceiling_normalized
  A_all_to_A_N_role: required_size_control_not_headline_mechanism

  eligible_terminal_contract_family:
    frozen_before_first_candidate_discriminating_score: true
    enumerates_exact_endpoints_edges_signed_components_ROIs_and_score_scales: true
    includes_every_endpoint_of_the_five_fixed_initial_edges_where_defined: true
    inapplicability_only_for_prespecified_structural_or_calibration_failure: true
    exclusion_reason_retained: true
    exact_development_to_audit_homolog_for_every_endpoint: required
    postscore_add_drop_relabel_or_favorable_replacement: prohibited

calibration_estimators:
  repeat_halves:
    construction: >-
      within_each_image_sort_retained_presentations_by_acquisition_order_and_assign_alternating_presentations_to_half_1_and_half_2
    each_image_requires_both_halves: true
    half_response: equal_mean_of_presentations_in_that_half
  repeat_reliability:
    statistic: Pearson_correlation_across_calibration_images_between_the_two_half_responses
    beta_operator_scale: Fisher_z
    atanh_boundary_tolerance: null
    boundary_tolerance_fixed_before_scores: true
    stage_change: Fisher_z_later_stage_minus_Fisher_z_earlier_stage
    R_N_ranking_stage: D
    finite_value_required: true
  noise_ceiling:
    estimator: null
    stage_specific_for: [B, C, D]
    floor_tau_by_stage: null
    V_NC_quality_threshold: null
    estimator_floor_thresholds_fixed_before_scores: true
    calibration_concepts_only: true

operator_advantage_prediction:
  indexing:
    advantage: d_s_r_v
    operator_map: g_s_r_v
    every_calculation_first_within: participant_x_ROI
    voxel_count_used_as_inferential_sample_size: false
  calibration_maps:
    B_to_C: repeat_reliability_C_minus_B
    C_to_D: repeat_reliability_D_minus_C
    A_N_to_R_N: R_N_inclusion_weight_minus_mean_A_N_bank_inclusion_weight
    raw_to_normalized: one_over_max_NC_and_tau
  calibration_maps_use_candidate_model_scores: false

  support_development_attribution:
    input: development_d_s_r_v_and_fixed_support_weight_vectors
    exact_within_development_only: true
    edge_change: weighted_mean_d_R_N_minus_mean_bank_weighted_mean_d_A_N
    fitted_explanatory_regression: none

  ceiling_development_attribution:
    input: development_d_s_r_v_and_fixed_positive_ceiling_weights
    exact_within_development_only: true
    edge_change: mean_d_over_max_NC_tau_minus_mean_d_on_identical_V_NC
    fitted_explanatory_regression: none
    individual_voxel_sign_change_possible: false

  support_and_ceiling_audit_forecast:
    forecast_input: development_d_s_r_v_only
    forecast_uses_frozen_calibration_weights: true
    audit_d_s_r_v_may_enter_forecast: false
    observed_audit_change: reaggregate_audit_d_s_r_v_under_the_same_frozen_weights
    claim: prospective_empirical_forecast_not_exact_identity
    fixed_weight_forecast_equals_development_edge: true
    audit_success_interpretation: new_concept_repeatability_not_independent_mechanistic_prediction
    error_metric: absolute_observed_audit_edge_change_minus_frozen_development_forecast

  beta_reliability_hypothesis:
    target: blockwise_change_in_d_s_r_v_across_stage_edge
    predictors:
      - standardized_calibration_repeat_reliability_change
      - frozen_spatial_bin_intercepts
    fit_separately_within_each_participant_ROI: true
    functional_form: ordinary_least_squares_without_tuned_penalty
    calibration_standardization: within_participant_ROI_mean_zero_unit_variance
    development_crossfit:
      unit: concept_block
      complementary_halves: >-
        first_12_and_last_12_blocks_under_the_frozen_metadata_only_block_order
      fit_one_half_predict_other_then_reverse: true
      training_target: mean_voxelwise_stage_change_across_the_12_training_blocks
      scoring_rows: participant_x_heldout_concept_block
      voxel_rows_as_independent_scoring_units: false
      crossfit_error: absolute_observed_minus_predicted_aggregate_stage_change
    final_refit: same_model_on_all_24_development_blocks
    audit_prediction: block_mean_stage_change_from_final_development_fit_and_calibration_gain_map
    observed_audit_target: equal_mean_of_twelve_audit_block_raw_R2_stage_changes
    block_scores_use: frozen_development_training_mean_and_predictor_then_registered_voxel_ROI_participant_aggregation
    primary_beta_edge_and_high_low_scores: unchanged_pooled_image_R2_separate_from_forecast_companion
    fitted_aggregate_identity: equals_mean_training_target_due_to_spatial_bin_intercepts_on_same_support
    aggregate_agreement_interpretation: repeatability_not_incremental_gain_map_explanation
    high_low_interpretation: descriptive_reliability_association_not_gain_over_bin_only_predictor
    block_mean_score_equals_pooled_image_score: not_assumed
    high_low_strata:
      definition: upper_vs_lower_half_of_gain_map_within_participant_ROI
      threshold: calibration_median
      median_tie_rule_fixed_before_scores: true
      required_component: signed_high_minus_low_stage_change
    inapplicable_if:
      - rank_deficient_spatial_bin_design
      - residual_gain_variance_below_frozen_threshold

  freeze_before_audit:
    - selected_relation_and_edge
    - edge_specific_forecast_target_beta_block_mean_or_support_ceiling_aggregate_edge
    - operator_map_and_voxel_set
    - development_only_signed_audit_forecast
    - edge_specific_absolute_prediction_error_margin
    - high_low_operator_strata
    - aggregation_and_uncertainty_rule
  audit_explanation_pass:
    - forecast_and_declared_observed_target_have_same_direction_beta_block_mean_or_support_ceiling_aggregate_edge
    - absolute_prediction_error_within_edge_specific_fixed_margin
    - beta_high_minus_low_component_crosses_its_signed_margin_if_beta_is_selected
  may_rescue_failed_primary_relation: false
  failed_explanation_label: unexplained_response_geometry_or_readout_sensitivity

uncertainty:
  draws: 10000
  resampling:
    - four_participants_with_equal_weight
    - 24_development_or_12_audit_concept_blocks
  keep_all_images_and_repetitions_of_concept_together: true
  simultaneous_bounds:
    ordinary_relation: max_t_over_all_signed_components_on_that_score_scale
    raw_to_normalized_relation: >-
      one_max_t_family_over_studentized_raw_and_normalized_components_with_each_effect_and_margin_retained_on_its_own_scale
  exact_studentization_quantile_seed_and_degenerate_rules_fixed_before_scores: true
  voxelwise_rows_create_inferential_degrees_of_freedom: false
  full_selection_refit_bootstrap: nonterminal_sensitivity
  population_inference_from_four_participants: prohibited

decision_rules:
  stable_positive: every_eligible_contract_simultaneous_lower_bound_above_its_component_margin
  stable_negative: every_eligible_contract_simultaneous_upper_bound_below_its_negative_component_margin
  genuine_reversal: both_endpoints_of_one_isolated_edge_cross_opposite_component_margins
  practical_equivalence: every_component_interval_inside_its_own_equivalence_region
  underidentified: bounds_overlap_decision_and_equivalence_or_null_regions
  point_estimate_sign_flip_is_reversal: false
  nonsignificance_is_equivalence: false
  operator_explanation_requires_primary_relation_and_prediction_pass: true

secondary_science:
  preregistered_ROI_or_semantic_specialization:
    taxonomy_and_strata_fixed_before_scores: true
    requires: interaction_and_both_within_stratum_effects_cross_margins
  linking_dependence:
    requires: encoding_and_CKA_cross_opposite_margins_on_same_data_contract
  either_secondary_can_rescue_failed_primary: false
  independent_candidate_ready_terminal: false

development_search:
  trial_atom: one_model_pair_x_one_directed_measurement_edge_x_all_four_participants
  cannot_split_trial_count_by:
    - participant
    - ROI
    - concept_block
    - image
    - voxel
    - fold
    - subset_bank_member
    - score_scale
  required_initial_coverage:
    pairs: 3
    edges_per_pair: 5
    valid_trials: 15
  successor_changes_exactly_one_scientific_operator: true
  successor_requires:
    - scored_parent
    - directional_prediction
    - competing_explanation
    - native_falsifier
    - expected_information_gain_and_cost
    - retirement_condition
  branch_retirement_requires:
    minimum_valid_configurations: 2
    direct_falsifier_or_replication: true

  minimum_valid_trials: 32
  maximum_valid_trials: 72
  minimum_adaptive_successor_cycles: 2
  minimum_incumbent_challenger_decisions: 2
  postcoverage_falsifier_fraction_minimum: 0.40
  patience_after_complete_coverage_and_trial_32: 12

resource_limits:
  CPU_core_hours: 6000
  GPU_hours: 256
  wall_clock_hours: 240
  scratch_TiB: 4
  outcome_blind_cost_pilot_required: true
  increase_after_candidate_scores: prohibited

qualification_before_neural_scores:
  required:
    - exact_event_image_join_and_720_concept_universe
    - fixed_repeat_completeness_and_480_120_120_roles
    - role_filtered_handoffs_and_permissions
    - aligned_B_C_D_trial_response_geometry_and_voxel_axes
    - frozen_ROI_crosswalk_N_subset_bank_spatial_bins_and_quotas
    - calibration_reliability_maps_and_stage_specific_noise_ceilings
    - fixed_repeat_half_estimator_atanh_tolerance_and_gain_variance_threshold
    - common_prediction_bank_implementation_for_support_edges
    - common_hyperparameter_objective_and_tie_rule_for_beta_edges
    - named_controlled_model_pairs_and_exposure_records
    - fixed_layers_PCA_ridge_grids_and_component_specific_margins
    - fixed_prediction_error_margins_and_audit_adequacy_widths_by_score_scale
    - frozen_eligible_contract_family_with_exact_audit_homologs
    - response_variance_and_degenerate_score_rules
    - synthetic_recovery_of_stable_reversal_and_null_patterns
    - deliberately_composite_or_leaky_edges_are_rejected
    - EP17_EP18_exposure_decision
    - outcome_free_evaluator_dry_run
  failure_before_neural_access: readiness_block_not_scientific_null

audit:
  mode: one_shot_same_participant_concept_disjoint
  primary_relations: 1
  secondary_checks_maximum: 2
  frozen_before_open:
    - model_pair_and_exposure_status
    - development_fitted_feature_transform_and_voxel_coefficients
    - measurement_edge_and_common_prediction_bank
    - operator_map_and_development_only_audit_forecast
    - response_score_voxel_support_and_ceiling_floor
    - practical_effect_and_prediction_error_margins
    - concept_blocks_uncertainty_and_evaluator
    - eligible_contract_family_and_exact_development_to_audit_mapping
    - adequacy_width_threshold_by_score_scale
  direct_application_of_development_coefficients: true
  audit_readout_refit_or_retuning: prohibited
  audit_results_update_search: false
  maximum_open_count: 1

  relation_specific_components:
    contract_robust_relation: every_frozen_eligible_contract_endpoint
    predicted_measurement_reversal:
      - both_endpoints_cross_opposite_component_margins
      - development_only_forecast_passes_sign_and_absolute_error
      - beta_high_minus_low_component_passes_if_beta_edge
    secondary_conditionality: interaction_and_both_within_stratum_effects
    secondary_linking_dependence: encoding_and_CKA_components

  common_pass:
    - every_required_signed_component_simultaneous_bound_crosses_its_margin
    - same_intersection_of_at_least_three_participants_clears_every_signed_component
    - every_leave_one_participant_mean_retains_direction
    - every_leave_one_audit_block_mean_retains_direction
    - exact_role_score_response_predictor_and_contract_mapping_passes

  explanation_pass: operator_advantage_prediction.audit_explanation_pass

  negative_classification:
    heldout_nonreplication_requires_adequate_fixed_width: true
    adequacy_width_thresholds:
      raw_R2: null
      ceiling_normalized_R2: null
      heldout_correlation: null
      linear_CKA: null
    numeric_thresholds_frozen_before_candidate_scores: true
    adequate_patterns:
      - practical_equivalence
      - opposite_margin_crossing
      - stable_participant_or_concept_block_heterogeneity
    wide_bounds: audit_underidentified

forbidden:
  - arbitrary_model_zoo_expansion_after_scores
  - candidate_model_defined_roles_strata_or_split
  - model_specific_concept_folds_or_image_weights
  - beta_stage_specific_voxel_identity_on_pure_beta_edge
  - beta_stage_specific_hyperparameter_retuning_for_primary_edge
  - support_specific_prediction_fit_or_hyperparameters
  - public_D_ceiling_used_as_B_or_C_ceiling
  - clipping_negative_R2_or_normalized_values_above_one
  - ratio_of_ROI_means_for_ceiling_normalization
  - pooling_R2_correlation_normalized_R2_or_CKA_scales
  - treating_voxels_images_or_contracts_as_biological_replicates
  - mixed_neural_source_mounted_to_search_worker
  - audit_outcome_or_partial_metric_access_before_final_freeze
  - audit_refit_subset_rescue_margin_change_or_rerun
  - audit_advantage_values_used_to_construct_the_forecast
  - postscore_contract_family_shrink_expand_or_relabel

terminal_outcomes:
  contract_robust_relation: candidate_ready
  predicted_measurement_reversal: candidate_ready
  stable_scientific_conditionality: disclosed_secondary_only
  linking_criterion_dependence: disclosed_secondary_only
  unexplained_measurement_reversal: closed_no_candidate
  no_isolated_relation: closed_no_candidate
  heldout_concept_nonreplication: closed_no_candidate
  underidentified: closed_no_candidate
  audit_underidentified: closed_no_candidate
  audit_pool_incommensurate: closed_no_candidate
  technical_failure: technical_failure
