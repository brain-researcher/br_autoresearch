version: "0.0.14"
name: "EP17: reliable-voxel sampling and a controlled visual-model relation"
description: >-
  Planned scientific worklist for the existing three-pair, five-edge contract.
  Concrete paper nominations are not a qualified registry or execution lock.
  Design-metadata preparation, the bounded released-event metadata pilot and
  the separately bounded retained-roster follow-up are executable before
  completing source roles. Other stages remain
  planned; no scientific finding is asserted.
inputs:
  - {id: goal, type: data, source: GOAL.md}
  - {id: datasets, type: data, source: DATASETS.md}
  - {id: policy, type: data, source: SEARCH_POLICY.yaml}
outputs:
  - {id: episode_report, from: one_shot_audit.audit_report}
analyses:
  source_metadata:
    name: Reconstruct presentation identity from provider design metadata
    description: >-
      Steward-only preparation from original image-index JSON, sparse design
      coordinates, runlist and the pinned stimulus identity CSV. Describe B/C/D
      modelmd axes and fixed NIfTI mask headers without neural, mask, image or
      behavioral values. Preserve source ordering, report repeat structure and
      missing raw-event reconciliation. Do not assign eligibility, roles or folds,
      infer numerical assignment rules, or complete source_roles from this output.
    inputs:
      - {id: goal, from: ../goal}
      - {id: datasets, from: ../datasets}
      - {id: policy, from: ../policy}
    outputs:
      - id: metadata_report
        type: report
        format: json
        inputs: [goal, datasets, policy]
        recipe:
          command: >-
            python3 outputs/tools/source_metadata.py
            --source "$OAK/users/zijiao/br_autoresearch_data/restricted/cneuromod-things-1.0.1-restricted-raw"
            --stimulus-metadata-csv "$OAK/users/zijiao/br_autoresearch_data/steward_acquisition/cneuromod_images_fmri_pinned_f8f5162_20260922/provider_git/image_paths_fmri.csv"
            --out outputs/runs/source_metadata/attempt003
          resources: {cpus: 1, memory: 4Gi, time_limit: 10m}
      - id: presentation_identity
        type: data
        format: csv
        inputs: [goal, datasets, policy]
      - id: image_repeat_summary
        type: data
        format: csv
        inputs: [goal, datasets, policy]
      - id: run_metadata
        type: data
        format: csv
        inputs: [goal, datasets, policy]
  released_event_reconciliation:
    name: Reconcile retained presentations with pinned released events
    description: >-
      Trusted-builder pilot for sub-01 session 01 runs 01-03 only, from the
      exact source-release gitlinks and the public CONP annex objects. Project
      stimulus identifiers, timing and schedule metadata in memory; never export
      mixed event files or behavioral responses. Compare all 180 retained rows
      with source_metadata presentation identity and the provider's fixed
      int((onset-3.0)/1.49) transformation. Preserve unknown schedule metadata;
      do not exclude rows, assign roles or access neural, pixel or model values.
      One GET per object, no retry or redirect, 20-second request timeout and
      540-second internal deadline. The separate full-roster recipe first
      resolves exact pinned annex pointers, then reconciles only the 833 retained
      runs/49980 presentations while reusing the 180 pilot rows. A complete
      retained-roster result does not establish the eligible 720-concept universe
      or complete source_roles. The combined batch has 1 CPU/4 GiB/40 minutes;
      each sequential phase retains its 1080-second internal deadline and
      1140-second outer envelope, with no retry, renewal or extra source scope.
    inputs:
      - {id: goal, from: ../goal}
      - {id: datasets, from: ../datasets}
      - {id: policy, from: ../policy}
      - {id: specification, type: data, source: outputs/event_metadata_reconciliation_specification.md}
      - {id: full_specification, type: data, source: outputs/full_event_metadata_reconciliation_specification.md}
      - {id: projection_runner, type: data, source: outputs/tools/reconcile_released_events.py}
      - {id: manifest_runner, type: data, source: outputs/tools/prepare_released_event_manifest.py}
      - {id: retained_runner, type: data, source: outputs/tools/reconcile_retained_events.py}
      - {id: retained_batch_runner, type: data, source: outputs/tools/run_retained_event_reconciliation.sbatch}
      - {id: retained_tests, type: data, source: outputs/tests/test_retained_events.py}
      - {id: metadata_report, from: ../source_metadata.metadata_report}
      - {id: presentation_identity, from: ../source_metadata.presentation_identity}
      - {id: run_metadata, from: ../source_metadata.run_metadata}
      - id: event_run01
        type: data
        source: https://sftp.conp.ca/users/cneuromod/ria-conp/515/1ad3c-321e-4111-abf0-95fee0dcbb90/annex/objects/W5/2J/MD5E-s41689--6bd1c67c8fb1c35739090756ca5827a3.tsv/MD5E-s41689--6bd1c67c8fb1c35739090756ca5827a3.tsv
      - id: event_run02
        type: data
        source: https://sftp.conp.ca/users/cneuromod/ria-conp/515/1ad3c-321e-4111-abf0-95fee0dcbb90/annex/objects/08/W9/MD5E-s42672--b89843ef07db10d7e6c5f30f94249834.tsv/MD5E-s42672--b89843ef07db10d7e6c5f30f94249834.tsv
      - id: event_run03
        type: data
        source: https://sftp.conp.ca/users/cneuromod/ria-conp/515/1ad3c-321e-4111-abf0-95fee0dcbb90/annex/objects/66/24/MD5E-s43414--32b057f64d9622449095c6f147166736.tsv/MD5E-s43414--32b057f64d9622449095c6f147166736.tsv
    outputs:
      - id: pilot_report
        type: report
        format: json
        inputs: [goal, datasets, policy, specification, metadata_report, presentation_identity, run_metadata, event_run01, event_run02, event_run03]
        recipe:
          command: >-
            python3 outputs/tools/reconcile_released_events.py
            --out outputs/runs/released_event_reconciliation/pilot001
          resources: {cpus: 1, memory: 4Gi, time_limit: 10m}
      - id: event_metadata
        type: data
        format: csv
        inputs: [goal, datasets, policy, specification, metadata_report, presentation_identity, run_metadata, event_run01, event_run02, event_run03]
      - id: annex_manifest
        type: report
        format: json
        inputs: [goal, datasets, policy, specification, full_specification, projection_runner, manifest_runner, retained_batch_runner, retained_tests, metadata_report, run_metadata, pilot_report]
        description: >-
          Exact 833-run retained roster from source_metadata attempt003:
          sub-01/sub-02/sub-03 each 213 runs and sub-06 with 194 runs, preserving
          all original run identities and order. Resolve the pinned things
          commit b17d3697171824c198ebc6f15fe7ceee9a1f526f through one root and
          four participant Git trees. Require nontruncated trees and mode 120000
          symlinks before requesting their bytes. Reconstruct the three pilot
          pointers and request at most 830 other pointers, each at most 512 bytes;
          verify the pinned blob length/identity and strict repeated MD5E key.
          No event-body request belongs to this phase. Root/participant tree
          caps are 512 KiB/8 MiB, plus one byte solely for oversize detection;
          at most 835 serial requests use 20-second timeouts and no redirects,
          authentication or retries. The fresh attempt001 manifest records
          exact annex sizes/digests and pilot reuse; partial entries do not
          authorize event reconciliation. Its downstream consumer rechecks
          complete exact-roster coverage and 128 KiB-per-object/64 MiB-total caps
          before any new event body. The batch proceeds only after this phase
          exits successfully, and no phase renews its allocation.
        recipe:
          command: >-
            timeout --signal=TERM --kill-after=10s 1140s
            python3.12 -B outputs/tools/prepare_released_event_manifest.py
            --out outputs/runs/released_event_manifest/attempt001
          resources: {cpus: 1, memory: 4Gi, time_limit: 20m}
      - id: retained_report
        type: report
        format: json
        inputs: [goal, datasets, policy, specification, full_specification, projection_runner, manifest_runner, retained_runner, retained_batch_runner, retained_tests, metadata_report, presentation_identity, run_metadata, pilot_report, event_metadata, annex_manifest]
        description: >-
          Conditional on the complete exact-roster pinned manifest and fixed
          byte caps, reconcile all 833 retained runs/49980 presentations. Reuse
          exactly the 180 verified pilot projection rows and their identity
          evidence; request only 830 new CONP objects, once each, with original
          exact length/annex-MD5 checks and no redirects or retry. Mixed event
          bytes stay in trusted-builder memory. Reuse the explicit identity,
          onset and schedule projection, numeric participant/session/run checks,
          provider order and int((onset-3.0)/1.49) rule; behavioral responses,
          raw TSVs, neural values, pixels and model features are not exported.
          Unknown schedule values remain unknown and source repetition is not
          equated with the retained-design count. The first mismatch, denial,
          transfer failure or deadline stops the stage. A partial CSV may
          include the first mismatched run and is diagnostic only; missing or
          incomplete terminal report forbids downstream use. Completion requires
          every retained run matched and all 49980 rows, with the explicit
          retained_roster_event_reconciliation_complete flag true. This does
          not claim reconciliation of all acquired/excluded events, establish
          eligibility, assign roles/folds or open audit/scoring. The fresh
          retained001 attempt preserves source_metadata attempt003 and pilot001.
        recipe:
          command: >-
            timeout --signal=TERM --kill-after=10s 1140s
            python3.12 -B outputs/tools/reconcile_retained_events.py
            --manifest outputs/runs/released_event_manifest/attempt001/annex_manifest.json
            --out outputs/runs/released_event_reconciliation/retained001
          resources: {cpus: 1, memory: 4Gi, time_limit: 20m}
      - id: retained_event_metadata
        type: data
        format: csv
        inputs: [full_specification, projection_runner, retained_runner, presentation_identity, run_metadata, pilot_report, event_metadata, annex_manifest, retained_report]
        description: >-
          Allowed metadata projection in exact retained order. It is usable
          as reconciled input only with a complete successful retained_report
          covering all 833 runs/49980 rows. Never infer completion from CSV
          existence or reuse a stopped partial projection as a reduced roster.
  source_eligibility:
    name: Qualify retained common images and the pinned concept taxonomy
    description: >-
      Metadata-only prerequisite for concept roles. No role optimizer,
      global chronology, repeat-half assignment, neural values or model scores.
    inputs:
      - {id: datasets, from: ../datasets}
      - {id: policy, from: ../policy}
      - {id: specification, type: data, source: outputs/source_roles_proposal.md}
      - {id: runner, type: data, source: outputs/tools/qualify_source_roles.py}
      - {id: fixtures, type: data, source: outputs/tests/test_source_roles.py}
      - {id: metadata_report, from: ../source_metadata.metadata_report}
      - {id: presentation_identity, from: ../source_metadata.presentation_identity}
      - {id: run_metadata, from: ../source_metadata.run_metadata}
      - {id: retained_report, from: ../released_event_reconciliation.retained_report}
      - {id: retained_events, from: ../released_event_reconciliation.retained_event_metadata}
    outputs:
      - id: eligibility_report
        type: report
        format: directory
        inputs: [datasets, policy, specification, runner, fixtures, metadata_report, presentation_identity, run_metadata, retained_report, retained_events]
        description: >-
          Fresh source_qualification/attempt002 publishes qualification_report.json,
          image/concept qualification, taxonomy crosswalk and presentation CSVs.
          Require every retained B/C/D identity and833-run/49980-row coordinate.
          The fixed selected roster is entirely experimental; another condition
          is changed source scope, not a new image exclusion. Require at least
          two retained presentations per common image in each of the four
          participants and at least one qualified image per eligible concept.
          Preserve all valid repeats, five/six source status and failed-image
          reasons. Exact720 eligible concepts is mandatory; no rescue universe.
          Fetch only the two pinned taxonomy TSVs,724963 bytes total, checking
          their existing annex lengths/MD5 identities; no redirects or retries.
          Provider annotation code authenticates the one-based concept-row
          bridge to category53; concepts join by exact uniqueID with equal key sets.
          Exact source concept/folder equality and binary53-label membership are
          required. Retain multilabel/unmapped metadata; discard unrelated
          normative table columns from the selected output. Every existing
          CSV has32MiB cap; request bound20s. Internal120s/external180s,
          one CPU4GiB, no GPU. Only completed terminal report with both explicit
          eligibility flags true authorizes reuse; partial CSVs are diagnostic.
          Roles, chronology, halves, neural units, reader isolation and scoring
          remain unqualified even if this metadata stage succeeds.
        recipe:
          command: >-
            timeout --signal=TERM --kill-after=10s 180s python3.12 -B
            outputs/tools/qualify_source_roles.py
            --out outputs/runs/source_qualification/attempt002
          resources: {cpus: 1, memory: 4Gi, time_limit: 4m}
  source_chronology:
    name: Qualify actual acquisition order and retained repeat halves
    description: >-
      Metadata-only exact integer constraints from the provider's cumulative
      repetition ordinals and full-history trial gaps. No new retrieval,
      numeric-run fallback, exclusions, role assignment or neural values.
    inputs:
      - {id: datasets, from: ../datasets}
      - {id: policy, from: ../policy}
      - {id: specification, type: data, source: outputs/source_chronology_specification.md}
      - {id: runner, type: data, source: outputs/tools/qualify_source_chronology.py}
      - {id: fixtures, type: data, source: outputs/tests/test_source_chronology.py}
      - {id: metadata_report, from: ../source_metadata.metadata_report}
      - {id: presentation_identity, from: ../source_metadata.presentation_identity}
      - {id: run_metadata, from: ../source_metadata.run_metadata}
      - {id: retained_report, from: ../released_event_reconciliation.retained_report}
      - {id: retained_events, from: ../released_event_reconciliation.retained_event_metadata}
      - {id: eligibility_report, from: ../source_eligibility.eligibility_report}
    outputs:
      - id: chronology_report
        type: report
        format: directory
        inputs: [datasets, policy, specification, runner, fixtures, metadata_report, presentation_identity, run_metadata, retained_report, retained_events, eligibility_report]
        description: >-
          Fresh source_chronology/attempt001 contains chronology_report.json,
          presentation_chronology.csv and run_chronology.csv. Preserve all49980
          retained rows and833 runs. Positive unique cumulative ordinals define
          within-image retained rank; eligible images receive alternating halves
          by retained rank, never source ordinal parity. Source-history gaps at
          consecutive cumulative ordinals constrain integer run-start offsets.
          Global qualification needs cycle consistency, one connected component
          per participant, nonoverlapping60-trial run intervals, all image order
          checks and the documented sub01/session17 order1,2,3,5,6,4. Unknown,
          disconnected or contradictory chronology stays unresolved with rows
          retained; component-local positions are not asserted global ranks.
          Distinguish retained-half, global and overall completion flags. Require
          a successful terminal report before downstream reuse. Existing CSVs
          capped32MiB each;120s internal/180s external plus10s termination;
          one CPU4GiB. No role, outcome, scientific claim or reader-isolation
          authorization follows from metadata completion.
        recipe:
          command: >-
            timeout --signal=TERM --kill-after=10s 180s python3.12 -B
            outputs/tools/qualify_source_chronology.py
            --out outputs/runs/source_chronology/attempt001
          resources: {cpus: 1, memory: 4Gi, time_limit: 4m}
  concept_role_assignment:
    name: Balance fixed concept roles folds and uncertainty blocks from metadata
    description: >-
      Metadata-only deterministic integer-objective assignment within the
      adopted finite eight-sweep procedure. The pilot builds features and
      benchmarks exact Gram/cache deltas without accepting source swaps or
      publishing roles. Full execution reuses complete exact pilot features
      and runs all four assignments under the unchanged finite procedure.
      Reader qualification is separate; metadata assignments cannot complete
      source_roles or open neural/model/audit outcomes.
    inputs:
      - {id: datasets, from: ../datasets}
      - {id: policy, from: ../policy}
      - {id: specification, type: data, source: outputs/concept_role_assignment_specification.md}
      - {id: core, type: data, source: outputs/tools/concept_role_assignment.py}
      - {id: runner, type: data, source: outputs/tools/run_concept_role_assignment.py}
      - {id: batch_runner, type: data, source: outputs/tools/run_concept_role_assignment.sbatch}
      - {id: fixtures, type: data, source: outputs/tests/test_concept_role_assignment.py}
      - {id: metadata_report, from: ../source_metadata.metadata_report}
      - {id: presentation_identity, from: ../source_metadata.presentation_identity}
      - {id: run_metadata, from: ../source_metadata.run_metadata}
      - {id: retained_report, from: ../released_event_reconciliation.retained_report}
      - {id: retained_events, from: ../released_event_reconciliation.retained_event_metadata}
      - {id: eligibility_report, from: ../source_eligibility.eligibility_report}
      - {id: chronology_report, from: ../source_chronology.chronology_report}
    outputs:
