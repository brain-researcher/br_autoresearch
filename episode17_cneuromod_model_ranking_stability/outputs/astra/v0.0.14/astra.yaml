      - id: assignment_report
        type: report
        format: directory
        inputs: [datasets, policy, specification, core, runner, batch_runner, fixtures, pilot_report, eligibility_report, chronology_report]
        description: >-
          Fresh concept_role_assignment/full001 reuses the exact pilot Decimal
          feature strings, missing masks and rational weights. One SHA256
          initialization and at most eight complete strict-improvement integer
          swap sweeps for720 concepts480/120/120, development6x80 folds,
          separate development24x20 blocks and audit12x10 blocks. Recompute
          parent scaling/imputation; block construction does not receive fold
          labels. All four maps and inherited image/presentation metadata must
          finish before metadata_assignments_complete becomes true. Preserve
          IDs, eligibility, chronology and all rows, including ineligible images.
          Report balance and exact objectives/termination without claiming
          global optimality. source_roles_complete stays false pending physical
          handoffs and reader qualification. No new fetch or outcome access.
          The4096-check pilot measured237 fields/292064KiB and projected
          all3,967,200 pair visits plus2,380,665,600 worst-case cache updates;
          doubled planning estimate plus60s is1485.703214s. Selected1800s
          internal/1860s external plus10s termination,1CPU6GiB/35minutes.
          Interrupted assignments do not publish a complete authoritative map.
        recipe:
          command: >-
            timeout --signal=TERM --kill-after=10s 1860s python3.12 -B
            outputs/tools/run_concept_role_assignment.py --mode full
            --out outputs/runs/concept_role_assignment/full001
          resources: {cpus: 1, memory: 6Gi, time_limit: 35m}
  role_materialization:
    name: Copy fixed source response rows into private role-filtered products
    description: >-
      Trusted-builder literal copying, no response estimator or scoring.
      Preserve all original rows, eligibility, dtype, columns and bit patterns.
      Outputs remain builder-private ordinary files, never mixed-source links.
