        type: report
        format: directory
        inputs: [datasets, policy, specification, core, runner, fixtures, metadata_report, presentation_identity, run_metadata, retained_report, retained_events, eligibility_report, chronology_report]
        description: >-
          Fresh concept_role_assignment/pilot001 contains raw_metadata_features.csv,
          feature_definition.json and pilot_report.json. Exactly720 concept
          features preserve taxonomy, equal-image/equal-repeat acquisition and
          lag summaries, missingness and the original exemplar stratum.
          Decimal80 and exact rational features precede parent-specific
          standardization/10000-scale integer rounding. Benchmark4096 initially
          cross-group deltas against direct feature sums without accepting swaps.
          Measure preparation, Gram, direct checks and temporary cache updates;
          include all four assignments and worst-case cache updates in any
          later resource decision. No published initialization or role map,
          no new source retrieval; existing CSV cap32MiB. Internal300s and
          external360s plus10s termination, one CPU6GiB. A deadline or mismatch
