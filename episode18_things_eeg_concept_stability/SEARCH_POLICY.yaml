      postcoverage_requirement: at_least_10_valid_trials_after_first_complete_branch_coverage_with_at_least_0.40_predeclared_falsifier_trials
      baseline_lock_timing: only_after_a_qualified_stop_with_minimum_trials_branch_coverage_postcoverage_requirement_and_at_least_one_lock_eligible_trial
