    - abstract_semantic_amodal_or_visual_independence_claim
    - shared_template_transport_terminal_claim_in_round_one

objectives:
  primary:
    metric: equal_participant_mean_outer_fold_prediction_loss_of_M_label_cap
    panel: expanded_image_panel
    direction: minimize
    eligible_pool: lock_eligible_baseline_trials_only
    trial_vector: one_outer_CV_participant_loss_per_each_of_30_development_participants
    selection_rule: choose_the_lowest_30_participant_mean_then_retain_trials_with_mean_at_most_that_mean_plus_its_sample_SD_over_sqrt_30_then_lower_effective_df_rank_stronger_penalty_and_hash
