      exact_source_hash_and_concept_crosswalk_required: true
      multilabel_rule: leave_category_out_removes_every_concept_tagged_with_that_category
      terminal_rule: every_leave_one_category_primary_and_minimum_partition_point_estimate_positive

  temporal_and_sequence_controls:
