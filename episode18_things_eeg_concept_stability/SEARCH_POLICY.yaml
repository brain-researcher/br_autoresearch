    counted_trial_requires_complete_hash_verified_merge_of_every_shard: true
    sealed_scientific_failure_record_with_complete_M_label_cap_output_remains_a_valid_baseline_phase_trial: true
    unique_key: complete_scientific_configuration_hash
    parent_trial_and_visible_ledger_prefix_hash_required: true
    byte_identical_engineering_retry_may_reuse_trial_ID: true

  successor_grammar:
