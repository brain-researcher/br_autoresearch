    noncircular_within_sequence_label_shift_offsets_in_events: [37, 73, 109]
    shift_wrap_across_sequence_boundary: prohibited
    prestimulus_concept_control_is_negative_lag_endpoint_above: true
    target_response_position_drift_ablations:
      required: true
      role: diagnostic_and_influence_only
      may_rescue_or_define_terminal_artifact_without_negative_control_bound: false
    target_and_response_window_censoring_sensitivity:
