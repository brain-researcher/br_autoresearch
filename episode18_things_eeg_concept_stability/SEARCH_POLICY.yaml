  development_feedback_firewall:
    baseline_recipe_phase:
      minimum_valid_trials: 19
      valid_trial_definition: structural_input_fit_and_M_label_cap_score_succeeds_without_using_any_withheld_concept_dependent_status
      lock_eligible_trial_definition: valid_trial_and_all_baseline_phase_constraints_pass
      branch_coverage: at_least_three_valid_trials_in_each_of_temporal_overlap_image_feature_sufficiency_and_label_readout_capacity
