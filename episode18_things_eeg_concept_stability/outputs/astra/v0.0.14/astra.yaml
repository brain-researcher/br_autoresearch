- id: development_eeg_preparation_code
  type: data
  source: outputs/code/run_development_eeg_preprocessing.py
- id: development_eeg_cache_code
  type: data
  source: outputs/code/continuous_eeg_cache.py
- id: development_eeg_cache_checks
  type: data
  source: outputs/code/test_continuous_eeg_cache.py
- id: development_eeg_batch
  type: data
  source: outputs/code/run_development_eeg_preprocessing_001.sbatch
- id: recorded_channel_order_release
  type: data
  source: outputs/runs/feature_preparation/recorded_channel_order_release001.json
- id: image_cost_pilot_code
  type: data
