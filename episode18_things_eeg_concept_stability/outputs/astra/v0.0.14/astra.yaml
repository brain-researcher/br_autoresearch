    account procedural separation, never OS isolation or blinded evaluation.
  source: outputs/code/image_pixel_worker.py
- id: full_image_delivery_code
  type: data
  description: Trusted one-pass archive delivery into bounded metadata-free RGB packs for all 22448 frozen opaque IDs.
  source: outputs/code/prepare_image_feature_shards.py
- id: full_image_worker_code
  type: data
  description: One qualified CPU model per complete assigned image range; no source crosswalk, credentials, EEG or automatic retries.
  source: outputs/code/run_image_feature_shard.py
- id: full_image_assembly_code
  type: data
  description: Requires all 26 selected tasks and exact six-family coverage before publishing complete arrays.
  source: outputs/code/assemble_image_features.py
- id: full_image_resource_selection
  type: data
  description: Pilot-based finite CPU, memory, storage, task ranges and absolute execution deadline; no scientific-model changes.
  source: outputs/config/full_image_extraction_20261012_001.json
- id: full_image_job_wrapper
  type: data
  description: Qualified runtime, clean process environment and phase deadlines for separately submitted builder, worker arrays and assembler.
  source: outputs/code/run_full_image_features_001.sbatch
- id: training_transform_code
  type: data
  description: >-
    Registered training-only population scaling/PCA retaining every feature
    family, fixed 62-to-61 Helmert sensor coordinates, and explicitly parameterized
    training-nuisance covariance whitening. No held-out statistics, automatic
    shrinkage choice, data reader or access seal.
  source: outputs/code/training_transforms.py
- id: slot_capacity_code
  type: data
  description: >-
    Exact dense spectral added-term EDF with incremental full-model EDF
    reported separately, common weighted base and explicit numerical rank
    tolerance. Lists admissible pairs on the existing thirteen penalties;
    no penalty selection, RBF construction, data reader or capacity release.
  source: outputs/code/slot_capacity.py
- id: selected_design_diagnostics
  type: data
  description: Exact conditional-design singular spectrum and full joint weighted-smoother leverage for all eight frozen slots in all six folds; explicitly selected prospective metric definitions and unchanged tolerances.
  source: outputs/code/selected_design_diagnostics.py
- id: selected_design_diagnostic_checks
  type: data
  source: outputs/code/test_selected_design_diagnostics.py
- id: false_partition_input_builder
  type: data
  description: Explicit development-only event/UUID bridge for all30 people and all six complete image families; no EEG, partition generation or acceptance claim.
  source: outputs/code/prepare_false_partition_inputs.py
- id: false_partition_search_code
  type: data
  description: Exact two-group swap updates, full image/context acceptance and bounded manual checkpoint continuation; empirical recipe and resources are separate selections.
  source: outputs/code/false_partition_search.py
- id: false_partition_search_checks
  type: data
  source: outputs/code/test_false_partition_search.py
- id: false_partition_development_release
  type: data
  description: >-
    Literal four-field release of the completed22448-image/six-family bank,
    existing private UUID routing, development manifest and all30 exact source
    event paths. Main-event structural fields and unchanged target/button flags
    only; no RT, accuracy, captions, pixels, audit data or EEG amplitudes.
  source: outputs/config/false_partition_release_20261012_001.json
- id: false_partition_production_selection
  type: data
  description: >-
    Complete first-development-participant production cache/search selection,
    original actual-E3 spans,128-past/0-future context support,72GiB cache,
    64MiB segment allowance and unchanged absolute October13 deadline.
    Processing sub-07 first does not select a scientific participant subset.
  source: outputs/config/false_partition_sub07_20261012_001.json
- id: false_partition_production_wrapper
  type: data
  description: >-
    One finite normal13-CPU/96-GiB/four-hour request after existing assembler
    success. Observed site memory normalization increased the earlier12-CPU
    request to13. Permit actual allocation13..16CPUs, record actual CPUs and
    four-hour reservation52..64CPUh, and run one worker/numerical thread only.
    All30 input binding, complete first
    production cache and one bounded search segment; no retry or successor.
  source: outputs/code/run_false_partition_cost_001.sbatch
- id: label_rbf_code
  type: data
  description: >-
    Registered median-distance RBF kernel on the unchanged three-family label
    panel; training U sqrt(d) and evaluation K U/sqrt(d) preserve ridge geometry.
    Explicit numerical rank/reconstruction tolerances, no held-out fitting,
    identifier features, penalty selection, EDF acceptance or data reader.
  source: outputs/code/label_rbf.py
- id: label_geometry_preparation_code
  type: data
  description: >-
    Finite label-only PCA/RBF cache preparation with all requested branch aliases,
    no repeated equivalent kernels, and the first necessary kernel retained as
    the outcome-blind cost pilot. Prepared only; no standalone allocation selected.
  source: outputs/code/prepare_label_geometry.py
- id: cross_episode_exposure_record
  type: data
  description: Current shared-stimulus and access-history decision; no independent stimulus-family claim or access seal.
  source: outputs/config/ep17_ep18_exposure_record.json
- id: qualified_ep17_exposure_handoff
  type: data
