    - id: complete_development_main_geometry
      type: report
      format: json
      inputs: [search_policy, development_geometry_manifest, recorded_channel_order_release, development_geometry_binding_code, brainvision_reader_code]
      description: >-
        Complete30-person,72-main-sequence-per-person binding of original source
        events, frozen development event-image join, E1/E3 markers, recording
        segments and original frozen62-channel order. Preserve actual variable
        cue gaps. Raw extent is actual E3 through last image+800ms inclusive;
        common score window is first image-800ms through last image+800ms
        inclusive, with the fixed causal128-past/0-future support and original
        recording-grid phase0. No EEG amplitudes, image values, behavioral
        fields or audit inputs; no fitting or scientific comparison. Stream
        the frozen role join once and retain counts only. At most300seconds,
        2GiB softRSS and8MiB durable output inside a substantive allocation.
      recipe:
        command: >-
          timeout --signal=TERM --kill-after=5s 300s python -B
          outputs/code/bind_development_sequence_geometry.py
          --development-manifest "$OAK/users/zijiao/br_autoresearch/episode18_things_eeg_concept_stability/outputs/runs/input_role_preparation/20261003-freeze_metadata01/development_manifest.json"
          --bids-root "$OAK/data/br_autoresearch_data/things_eeg1/openneuro-ds003825-v1.2.0/source"
          --frozen-channel-order "$OAK/users/zijiao/br_autoresearch/episode18_things_eeg_concept_stability/outputs/runs/feature_preparation/recorded_channel_order_release001.json"
          --output {output} --deadline "$EP18_GEOMETRY_DEADLINE"
          --rss-byte-cap 2147483648
        resources: {cpus: 1, memory: 2Gi, time_limit: 305s}
    - id: structural_input_report
      type: report
      format: json
      inputs: [goal, datasets, search_policy]
      recipe:
        command: >-
          python outputs/code/qualify_structural_inputs.py
          --bids-root "$EP18_BIDS_ROOT"
          --metadata-root "$EP18_METADATA_ROOT"
          --image-archive "$EP18_IMAGE_ARCHIVE"
          --working-dir "$EP18_WORKING_DIR"
          --output-dir {output}
        resources: {cpus: 1, memory: 2Gi, time_limit: 10m}
    - id: frozen_inputs_and_roles
      type: report
      format: json
      description: >-
        Deterministic whole-participant roles and qualified event metadata join,
        with source-only EP17/18 overlap. This does not verify runtime isolation
        or authorize EEG candidate comparison.
      inputs: [goal, datasets, search_policy]
      recipe:
        command: >-
          python outputs/code/freeze_metadata_views.py
          --normalization-report outputs/runs/input_role_preparation/20261003-sample_origin01/sample_origin_report.json
          --role-proposal outputs/runs/input_role_preparation/20261003-role_proposal01/role_proposal.json
          --clock-report outputs/runs/input_role_preparation/20261003-clock01/clock_segment_report.json
          --cneuromod-image-csv "$EP17_SOURCE_IMAGE_CSV"
          --things-image-paths "$EP18_THINGS_IMAGE_PATHS"
          --exposure-record outputs/config/ep17_ep18_exposure_record.json
          --output-dir {output}
        resources: {cpus: 1, memory: 2Gi, time_limit: 10m}
    - id: metadata_and_fir
      type: report
      format: json
      inputs: [frozen_inputs_and_roles, development_geometry_manifest, sequence_geometry_fir_code, brainvision_reader_code, search_policy]
      description: >-
        Prospective serial companion inside the next substantive allocation,
        never a separate tiny job. Reads only the exact thirty development
        participants' header/marker leaves and stats their EEG binary lengths;
        no EEG amplitudes, event TSV, private join, behavior values or audit
        inputs. Retains every E3-delimited interval, including empty intervals;
        only nonempty intervals contribute to support conjunctions. A known
        failure dominates unknown, and missing observations cannot pass.
        The single 129-tap causal 100-Hz Kaiser-beta8.6 coefficient response
        reports 64-ms delay and measured passband/stopband bounds. This report
        does not adopt that filter/span recipe, infer the main72 sequence
        identities, prepare EEG or satisfy scientific release. One CPU,
        threads1, 2-GiB soft RSS, 180-second execution plus5-second kill grace,
        16-MiB durable allowance; coordinator deadline also respects the parent
        allocation. Header/marker bounds are8MiB/128MiB, one person at a time.
        The fresh output directory retains settings, metadata_and_fir.json
        and categorical operational status; incomplete execution cannot pass.
      recipe:
        command: >-
          env OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1
          NUMEXPR_NUM_THREADS=1 VECLIB_MAXIMUM_THREADS=1 BLIS_NUM_THREADS=1
          timeout --signal=TERM --kill-after=5s 180s
          "$GROUP_HOME/users/zijiao/ep18_model_runtime_cpu241_py312_46842156/bin/python"
          outputs/code/inspect_sequence_geometry_and_fir.py
          --development-manifest "$OAK/users/zijiao/br_autoresearch/episode18_things_eeg_concept_stability/outputs/runs/input_role_preparation/20261003-freeze_metadata01/development_manifest.json"
          --bids-root "$OAK/data/br_autoresearch_data/things_eeg1/openneuro-ds003825-v1.2.0/source"
          --output {output}
          --deadline "$EP18_GEOMETRY_DEADLINE"
          --rss-byte-cap 2147483648
        resources: {cpus: 1, memory: 2Gi, time_limit: 185s}
