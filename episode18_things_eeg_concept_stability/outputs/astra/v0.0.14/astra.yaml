version: 0.0.14
id: episode18_things_eeg_concept_stability
name: Do different pictures of the same concept share an EEG pattern?
description: 'Brain Researcher autoresearch episode projection. This ASTRA document
  is non-authoritative: it records a workspace plan or result but grants no execution
  authority, scientific acceptance, reward, or Landscape transition.'
tags:
- brain-researcher
- autoresearch
- projection
- plan
- non-authoritative
inputs:
- id: goal
  type: data
  description: Episode research goal contract.
  source: GOAL.md
- id: datasets
  type: data
  description: Episode dataset and access contract.
  source: DATASETS.md
- id: search_policy
  type: data
  description: Episode search and stopping policy.
  source: SEARCH_POLICY.yaml
- id: prospective_feature_recipe
  type: data
  description: Selected outcome-blind image and label recipes; not evidence of qualified extraction or an access seal.
  source: outputs/config/feature_registry.json
- id: selected_model_asset_map
  type: data
  description: Exact official asset revisions/files and prospectively selected ftfy runtime; not acquired weights or a qualified feature record.
  source: outputs/config/model_runtime_asset_map_proposal.json
- id: model_runtime_setup_code
  type: data
  description: Fresh private GROUP_HOME CPU-wheel environment with every selected release; preserves the stopped prior environment.
  source: outputs/code/prepare_exact_cpu_runtime.sh
- id: model_runtime_requirements
  type: data
  description: Exact CPU releases, unchanged feature-registry versions and previously selected text dependencies.
  source: outputs/config/cpu_runtime_requirements.txt
- id: model_provisioning_wrapper
  type: data
  description: Single finite one-CPU/7-GiB/two-hour provisioning allocation; no feature inference or EEG access.
  source: outputs/code/provision_exact_cpu_runtime_001.sbatch
- id: model_runtime_qualification_code
  type: data
  description: Sequential offline CPU loading and selected-layer checks; no forward pass, images, prompts or EEG.
  source: outputs/code/qualify_model_runtime.py
- id: model_asset_transfer_code
  type: data
  description: Bounded public HTTPS acquisition of exact files on Slurm compute; no DTN login, credential handling or retries.
  source: outputs/code/acquire_model_assets.py
- id: name_text_pilot_code
  type: data
  description: Fixed first64 prepared-name resource pilot using the qualified local CLIP text model; no image/EEG access or bulk mode.
  source: outputs/code/run_name_text_pilot.py
- id: all_name_text_code
  type: data
  description: Conditional separate all1854 label-only driver; requires a completed feasible pilot and explicit coordinator invocation, not activated by preparation.
  source: outputs/code/run_all_name_text_features.py
- id: continuous_model_code
  type: data
  description: >-
    Matrix-free sequence-local event expansion, direct joint nuisance/feature
    ridge fit and post-fit event-contribution ablation. Caller supplies exact
    timing, selected temporal basis, sample weights and column penalties;
    no data reader, preprocessing choice, score release or access seal.
  source: outputs/code/continuous_sequence_model.py
- id: continuous_fold_code
  type: data
  description: >-
    Complete six-outer/five-inner split composition over explicitly supplied
    continuous sequences, training-only preparation, common nuisance-residual
    whitening and original-EEG joint fits. Returns paired per-sequence errors;
    no raw reader, unselected normalization convention or scientific release.
  source: outputs/code/continuous_fold_runner.py
- id: continuous_preparation_code
  type: data
  description: >-
    Explicit72-sequence metadata/marker/span join and sequence-local FIR,
    detrending and250Hz sampling with full filter-support masks. Caller owns
    authentic spans, voltage-scaled reader, recipe and resource admission.
  source: outputs/code/prepare_continuous_eeg.py
- id: continuous_preparation_checks
  type: data
  source: outputs/code/test_prepare_continuous_eeg.py
- id: continuous_tuning_code
  type: data
  description: >-
    Prepare each of36 nested splits once, scan all13 penalties, retain exact
    fold-local EDF matches, select using baseline-only losses and rematch on
    outer training. All empirical recipe and dense-memory choices are explicit.
  source: outputs/code/continuous_tuning.py
- id: continuous_tuning_checks
  type: data
  source: outputs/code/test_continuous_tuning.py
- id: brainvision_reader_code
  type: data
  description: >-
    Explicit development-manifest binding, header voltage scaling, recorded
    E3/segment spans and lazy interval reading after metadata validation.
    Caller supplies the preprocessing recipe and actual EEG-access selection.
  source: outputs/code/brainvision_sequence_reader.py
- id: brainvision_reader_checks
  type: data
  source: outputs/code/test_brainvision_sequence_reader.py
- id: sequence_geometry_fir_code
  type: data
  description: >-
    Development header/marker inspection with EEG binary stat only, and one
    prospective FIR coefficient response. Preserves every recorded E3 interval;
    does not read EEG amplitudes, adopt a recipe or release main-sequence identities.
  source: outputs/code/inspect_sequence_geometry_and_fir.py
- id: development_geometry_manifest
  type: data
  description: Existing explicit thirty-participant development role binding; no audit view or mixed-role lookup.
  source: outputs/runs/input_role_preparation/20261003-freeze_metadata01/development_manifest.json
- id: development_geometry_binding_code
  type: data
  source: outputs/code/bind_development_sequence_geometry.py
- id: development_eeg_release
  type: data
