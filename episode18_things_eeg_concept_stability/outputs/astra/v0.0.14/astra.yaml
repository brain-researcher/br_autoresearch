      inputs: [frozen_inputs_and_roles, search_policy, prospective_feature_recipe]
      recipe:
        command: >-
          python outputs/code/prepare_feature_metadata.py
          --frozen-record outputs/runs/input_role_preparation/20261003-freeze_metadata01/frozen_inputs_and_roles.json
          --human-report outputs/runs/feature_preparation/20261003-human_metadata01/human_metadata_report.json
          --registry outputs/config/feature_registry.json
          --output-dir {output}
        resources: {cpus: 1, memory: 1Gi, time_limit: 1m}
    - id: runtime_environment
      type: data
      format: directory
      description: >-
        Fresh private CPU-wheel installation and exact-version import report.
