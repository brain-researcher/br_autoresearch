      description: >-
        Final all-required-participant bank only after all eight frozen members
        meet image/context, diversity and exact selected-design spectrum,
        leverage and term-EDF tolerances in every required fold. The production
        cost wrapper does not emit this accepted-bank report or grant EEG
        comparison access; a completed first-person candidate is insufficient.
    - id: real_image_context_production_cost
      type: data
      format: directory
      inputs: [complete_image_feature_arrays, complete_development_main_geometry, development_release, production_selection, production_wrapper, input_builder, search_code, search_checks, search_policy]
      description: >-
        Actual-image/context production cost stage after assembler47551339
        succeeds and complete22448-ID/all-six-family coverage is checked.
        Prepare all30 development records once in
        outputs/runs/false_partition_preparation/inputs_20261012_001, within
        300seconds,2GiB softRSS cap and128MiB durable output. Use sub-07 solely
        as the first production participant, preserving all22248 main images,
        six folds and six feature families. Build its complete pair/context
        cache in outputs/cache/false_partition_sub07_20261012_001 within3hours
        and72GiB; incomplete preparation stops before search. Only a completed
        cache enters a search segment of at most1hour, with80GiB array admission,
        90GiB softRSS cap and64MiB segment storage. The one normal allocation
        requests13CPUs/52CPUh, accepts site allocation rounding through16CPUs,
        records four hours times actual CPUs as the52..64CPUh upper reservation,
        runs one worker/thread, and stops by the minimum of actual
        start+4hours-60seconds, scheduler end-60seconds and2026-10-13T21:30:00Z.
        Preserve seed20261012,8members,64starts/member,100000legal swaps/start,
        all tolerance checks and consumed logical counters. Context uses signed
        20ms bins over928ms each side, actual-E3 spans, unchanged binary target
        flags and a coarse button flag at the flagged stimulus onset, never RT.
        No EEG amplitudes, accuracy, audit data or candidate-discriminating scores.
        Operational stages are under
        outputs/runs/false_partition_preparation/false_partition_operations_20261012_001/initial_JOBID.
        A resource stop preserves a search checkpoint only if one was written;
        loading can stop before the first checkpoint. Partial preparation and
        completed outputs remain for separate reviewed continuation. No tests
        are repeated, no search budget resets, no automatic retries/successors,
        and no final false-bank qualification are selected by this cost stage.
      recipe:
        command: bash outputs/code/run_false_partition_cost_001.sbatch
        resources: {cpus: 13, memory: 96Gi, time_limit: 4h}
    - id: provisional_image_context_bank
      type: data
      format: npz
      inputs: [search_policy, real_image_context_production_cost, input_builder, search_code, search_checks]
      description: >-
        Explicitly selected outcome-free search retains all eight members,
        64 starts and100000 legal proposals per start, every fold and feature
        family, exact distribution tolerances and ARI diversity. A saved
        resource-incomplete state preserves assignments, RNG and counters;
        no automatic restart occurs. This provisional bank still requires
        the unchanged selected-design/EDF checks and cannot be regenerated
        from EEG. The selected first-person cost step can emit a candidate
        only after all eight image/context matches finish; resource-incomplete
        checkpoints and exhausted-search reports are not candidate banks.
        Completing that step does not claim complete participant coverage or
        establish full-scale selected-design feasibility.
    - id: selected_design_match_report
      type: report
      format: json
      inputs: [search_policy, provisional_image_context_bank, slot_capacity_code, selected_design_diagnostics, selected_design_checks]
      description: >-
        Prospective definition: singular values of F=[(I-H0)Za;sqrt(P0)B]
        define the conditional design spectrum; squared singular values are
        retained separately. Leverage is the diagonal of the full joint
        weighted-data smoother at the selected penalties, using the same base,
        weights and training rows. Both distributions pass the existing
        standardized mean/W1/five-quantile bounds and the additional .10
        relative quantile bound; the true sample SD scales discrepancies and
        zero reference scales/quantiles use absolute equality within1e-12.
        Added-term EDF remains primary with the existing .05 capacity bound.
        All eight identical frozen partitions must pass in all six outer folds;
        failure cannot regenerate partitions from EEG or relax tolerances.
        Dense-array memory estimates exclude native workspaces and do not
        establish full-scale feasibility. Resource refusal is incomplete
        execution, not an observed scientific matching failure.
