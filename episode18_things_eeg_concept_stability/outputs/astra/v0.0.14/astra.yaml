          outputs/code/qualify_model_runtime.py
          --asset-map outputs/config/model_runtime_asset_map_proposal.json
          --output-dir {output} --max-seconds 1200
        resources: {cpus: 1, memory: 7Gi, time_limit: 21m}
    - id: name_text_cost_pilot
      type: data
      format: directory
      description: >-
        A separate source-metadata label process encodes only the first64
        uniqueID-sorted prepared prompts, preserving their verbatim text.
        Records CPU time, peak RSS, token truncation, float32 unit-normalized
        512-vectors and first4 singleton batch consistency. Requires the
        completed allocation46842156 asset/runtime qualification; no source
        image routing, pixels, events or EEG input. A cost projection does not
        release all1854 names or establish a complete feature record or seal.
