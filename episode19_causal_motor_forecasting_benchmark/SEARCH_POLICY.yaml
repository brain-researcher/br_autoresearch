version: 2
episode: EP19
question: Does past EEG add information about movement onset 300 to 600 ms ahead?

meaning_of_causal:
  definition: every prediction uses only information available at or before decision time
  causal_inference_claim: false
  biological_mechanism_claim: false

data:
  way_eeg_gal:
    doi: 10.6084/m9.figshare.c.988376.v2
    participants: 12
    fit_and_inner_selection_series: [1, 2, 3, 4, 5, 6]
    aggregate_development_feedback_series: 7
    held_out_series: [8, 9]
    weights_fit_separately_per_participant: true
    model_recipe_shared_across_participants: true
    final_refit_series: [1, 2, 3, 4, 5, 6, 7]
    cross_participant_weight_pooling_is_primary: false
  self_paced:
    doi: 10.6084/m9.figshare.28632599.v1
    development_participants:
      - sub-02
      - sub-03
      - sub-04
      - sub-06
      - sub-08
      - sub-09
      - sub-11
      - sub-12
      - sub-14
      - sub-15
      - sub-17
      - sub-18
      - sub-20
      - sub-21
      - sub-22
    held_out_participants:
      - sub-01
      - sub-05
      - sub-07
      - sub-10
      - sub-13
      - sub-16
      - sub-19
      - sub-23
    development_participant_count: 15
    held_out_participant_count: 8
    development_folds: 5
    whole_participant_splits: true
    final_group_model_fit_uses_all_15_development_people: true
    held_out_people_may_enter_encoder_or_onset_training: false
  historical_kaggle:
    role: implementation_and_event_detection_compatibility_only
    six_event_mean_columnwise_AUROC: true
    approximate_event_label_half_width_ms: 150
    report_HandStart_separately: true
    pre_final_series_comparison: series_1_to_6_fit_series_7_test
    post_final_historical_comparison: series_1_to_8_fit_series_9_test
    private_series_10_claim: false
  ajile12:
    version: 10.48324/dandi.000055/0.220127.0436
    primary_study_role: none

prediction:
  decision_stride_ms: 50
  prediction_horizon_ms: 900
  onset_interval_count: 18
  interval_width_ms: 50
  extra_category: no_onset_within_900ms
  interval_edges: left_closed_right_open
  horizons_ms:
    near_event: [0, 300]
    primary_strict: [300, 600]
    longer_diagnostic: [600, 900]
  output: probability_distribution_over_19_categories
  primary_score: natural_prevalence_binary_log_score_for_300_to_600ms
  training_loss: censoring_aware_19_category_negative_log_likelihood
  score_only_when_status_observed_through_horizon_upper_edge: true
  administrative_censoring_uses_complete_50ms_intervals_only: true
  partially_observed_interval_is_not_labeled_negative: true
  outcome_dependent_truncation: false

onset_and_risk:
  onset_uses_EEG: false
  provider_event_is_primary: false
  raw_non_EEG_sensor_detector_required: true
  future_confirmation_may_confirm_label_only: true
  future_confirmation_may_enter_model_input: false
  future_confirmation_may_restore_intervening_decision_points: false
  risk_set: past_only_streaming_stillness
  exact_sensor_hierarchy: null
  threshold_and_dwell_rule: null
  ambiguity_rule: null
  synchronization_uncertainty_max_ms: null
  required_synchronization_bound_ms_maximum: 300
  detector_development_sources:
    WAY: series_1_to_7_only
    self_paced: 15_development_participants_only

preprocessing:
  one_sided_filters_only: true
  backward_derivatives_only: true
  training_or_accumulated_past_normalization_only: true
  reset_at_acquisition_gap_and_series_or_session_boundary: true
  centered_or_zero_phase_filtering: false
  bidirectional_recurrence: false
  future_padding: false
  whole_session_normalization: false
  windows_crossing_a_data_split: false
  historical_channel_count: 32
  scientific_channel_count: 29
  scientific_channels:
    - Fp1
    - Fp2
    - F7
    - F3
    - Fz
    - F4
    - F8
    - FC5
    - FC1
    - FC2
    - FC6
    - T7
    - C3
    - C4
    - T8
    - TP9
    - CP5
    - CP1
    - CP2
    - CP6
    - TP10
    - P7
    - P3
    - Pz
    - P4
    - P8
    - O1
    - Oz
    - O2

non_neural_baselines:
  one_selected_separately_for_each_source: true
  selected_before_candidate_EEG_scores: true
  candidate_families:
    - regularized_logistic_discrete_hazard
    - gradient_boosted_discrete_hazard
    - small_past_only_temporal_convolutional_discrete_hazard
  permitted_inputs:
    - cue_and_time_since_cue
    - causally_available_task_context_and_target
    - past_EMG_when_available
    - past_kinematics_force_or_accelerometry
    - past_EOG_when_available
    - posture_recent_motion_and_stillness_duration
    - session_time_and_missingness
  self_paced_forbidden_inputs:
    - completed_movement_target_identity
    - ultimately_chosen_object
  selection_metric: participant_macro_primary_horizon_log_score
  tie_breaks: [lower_19_category_loss, fewer_parameters, lower_latency, recipe_name]

matched_EEG_comparisons:
  models:
    - source_specific_non_neural_baseline
    - baseline_plus_real_EEG
    - baseline_plus_zero_EEG
    - baseline_plus_surrogate_EEG
  equal_architecture_context_optimization_seeds_and_calibration: true
  real_EEG_comparisons_reported_separately:
    - real_minus_non_neural
    - real_minus_zero_EEG
    - real_minus_strongest_surrogate_EEG
  full_surrogate_set:
    session_preserving_block_shifts: 4
    cross_channel_coherent_phase_randomizations: 4
    total: 8
  development_surrogate_count: 2
  final_surrogate_count: 8
  every_surrogate_model_trained_from_start: true
  participantwise_strongest_surrogate_used: true
  three_neural_comparisons_must_each_clear_own_margin: true
  non_neural_probability_floor: null

reference_model_order_question:
  families:
    - past_only_filterbank_bandpower_elastic_net
    - past_only_covariance_riemannian_tangent_model
    - past_only_compact_EEGNet
    - dilated_past_only_temporal_convolutional_network
    - small_one_directional_GRU
  configurations_per_family: 12
  seeds_per_configuration: 3
  same_19_category_fit_scored_at_both_horizons: true
  primary_data: WAY_series_8_and_9
  pairwise_states: [retained, collapsed, emergent, reversed, uncertain]
  all_pairs_share_one_simultaneous_uncertainty_rule: true
  newly_searched_model_may_join_reference_panel: false

secondary_new_model_search:
  role: improve_strict_forecast_without_redefining_reference_order
  starts_from: strongest_eligible_reference
  one_primary_operator_change_per_follow_up: true
  parameter_count_maximum: 2000000
  explicit_input_history_seconds_maximum: 2.0
  streaming_state_age_seconds_maximum: 8.0
  required_branches: [classical, temporal, representation, fusion]
  possible_triggered_branches: [montage_robustness, diagonal_state_space]
  result_is_primary_scientific_claim: false

self_paced_calibration:
  primary_condition: first_32_complete_events_per_person
  event_order: chronological
  calibration_prefix_excluded_from_scoring: true
  history_guard_excluded_from_scoring: true
  zero_label_and_32_label_conditions_share_scored_suffix: true
  free_parameters:
    global_positive_temperature: 1
    coarse_horizon_offsets: 3
  initial_values:
    global_temperature: 1.0
    each_coarse_horizon_offset: 0.0
  offset_groups_ms:
    - [0, 300]
    - [300, 600]
    - [600, 900]
  reference_group: over_900ms
  objective: natural_prevalence_weighted_censoring_aware_19_category_negative_log_likelihood
  encoder_update: false
  spatial_projection_update: false
  individual_50ms_category_bias_update: false
  fit_separately_for_each_scored_model: true
  same_packet_algorithm_and_parameter_budget_for_every_model: true
  values_required_before_use:
    regularization_strength: null
    parameter_bounds: null
    optimizer: null
    maximum_iterations: null
    convergence_tolerance: null
    deterministic_failure_rule: null
  zero_label_transfer_role: stricter_secondary_result
  full_local_refit:
    role: descriptive_upper_bound_only
    participants_require_complete_runs_minimum: 4
    fitting_prefix: earliest_half_of_complete_runs
    inner_train_validation_split: approximately_80_20_by_whole_run
    scored_suffix_may_select_epoch_or_parameters: false
    may_rescue_primary_32_event_result: false

margins_required_before_candidate_EEG_scores:
  real_minus_non_neural_primary_minimum: null
  real_minus_zero_EEG_primary_minimum: null
  real_minus_surrogate_primary_minimum: null
  real_minus_non_neural_near_minimum: null
  real_minus_zero_EEG_near_minimum: null
  real_minus_surrogate_near_minimum: null
  zero_EEG_noninferiority_margin: null
  near_event_readiness_minimum: null
  model_pair_margin_near: null
  model_pair_margin_primary: null
  calibration_tolerance: null
  longer_horizon_non_degradation_margin: null
  participant_robustness_rule: null
  synchronization_uncertainty_max_ms: null
  p95_inference_latency_ms_maximum: null
  development_new_model_improvement_margin: null
  final_new_model_improvement_margin: null
  synthetic_tests_may_choose_or_relax_a_scientific_margin: false

uncertainty:
  participant_is_the_resampling_unit: true
  keep_each_participants_sessions_trials_and_decision_points_together: true
  resample_participants_separately_within_each_source: true
  participants_receive_equal_weight: true
  draws: 10000
  confidence_level: 0.95
  three_EEG_comparisons_share_simultaneous_bounds: true
  all_reference_pairs_and_both_horizons_share_simultaneous_bounds: true
  point_estimates_alone_do_not_determine_a_model_order_state: true

initial_coverage:
  complete_trials: 12
  must_cover: [classical, temporal, representation, fusion]
  direct_control_for_each_branch: true
  zero_label_and_32_event_conditions_in_every_applicable_trial: true

synthetic_tests_before_real_EEG_scores:
  examples:
    - context_only_risk_with_no_EEG_increment
    - prospective_EEG_pattern_at_prespecified_signal_levels
    - near_event_only_movement_artifact
    - shifted_EEG_capacity_control
    - cue_only_timing_signal
    - participant_identity_only_signal
    - clock_offset_and_resampling_delay
    - series_boundary_state_leakage
    - centered_filter_and_future_normalization_leakage
    - deliberate_future_EMG_and_EEG_leak
  must_check:
    - target_bins_censoring_and_natural_prevalence_weights
    - future_samples_have_zero_effect_on_earlier_predictions
    - sample_chunk_and_batch_streaming_agree
    - onset_timing_and_ambiguity_rules
    - score_and_model_order_direction
    - calibration_and_latency_measurement
    - every_evidence_pattern_maps_to_one_plain_language_conclusion

required_controls:
  - mutate_future_input_and_require_unchanged_past_prediction
  - sample_chunk_and_batch_streaming_agreement
  - future_impulse_has_zero_past_effect
  - acquisition_gap_and_series_or_session_state_reset
  - reject_centered_filter_future_padding_and_whole_session_normalization
  - reject_windows_crossing_a_data_split
  - cue_stratified_label_shuffle
  - circular_and_block_shifted_EEG
  - eight_separately_trained_surrogate_EEG_models
  - participant_and_session_identity_only
  - detect_deliberate_future_signal_leak
  - recover_synthetic_prospective_EEG_pattern
  - legacy_near_event_positive_control
  - non_neural_baseline_vs_zero_EEG_model
  - pre_set_onset_sensitivity_range
  - raw_voltage_vs_past_only_filterbank_representation
  - receptive_field_and_low_frequency_ablation
  - leave_one_development_participant_and_series_out
  - zero_label_vs_identical_32_event_calibration_packet

development_requirements:
  valid_trials_minimum: 24
  valid_trials_maximum: 40
  initial_coverage_trials: 12
  follow_up_cycles_minimum: 2
  current_best_vs_new_proposal_decisions_minimum: 2
  challenge_control_fraction_after_coverage_minimum: 0.40
  patience_eligible_opportunities: 8
  patience_starts_after_valid_trial: 24
  aggregate_feedback_calls_maximum: 40
  repairable_engineering_failures_maximum: 12
  incomplete_or_partial_fold_feedback: false
  duplicate_or_engineering_retry_counts_as_new_trial: false

resources:
  cpu_core_hours_maximum: 2000
  gpu_hours_maximum: 480
  total_wall_hours_maximum: 240
  scratch_tib_maximum: 2
  nested_reference_fits_and_surrogate_models_are_charged: true
  reaching_a_limit_is_a_scientific_result: false

stopping:
  before_24_valid_trials:
    scientific_stop: false
    stop_only_for_invalid_data_timing_future_information_or_unrecoverable_execution: true
  after_minimum_evidence:
    - eight_eligible_opportunities_without_required_improvement
    - forty_valid_trials
    - forty_aggregate_feedback_calls
    - finite_allowed_model_changes_exhausted
    - cpu_gpu_wall_or_scratch_limit_reached
  first_positive_trial_stops_search: false
  first_negative_trial_stops_search: false
  reaching_a_limit_is_positive_or_negative_scientific_evidence: false

final_held_out_evaluation:
  number_of_evaluations: 1
  components_evaluated_together:
    - all_12_WAY_participants_series_8_and_9
    - all_8_self_paced_held_out_participants
  partial_results_returned_to_development: false
  participant_or_series_replacement: false
  results_may_change_models_onset_rules_horizons_margins_or_calibration: false
  required_WAY_evidence:
    - participant_macro_real_minus_non_neural_clears_margin
    - participant_macro_real_minus_zero_EEG_clears_margin
    - participant_macro_real_minus_strongest_surrogate_clears_margin
    - every_leave_one_participant_mean_has_positive_direction_for_all_three
  required_self_paced_evidence:
    - each_neural_comparison_positive_in_at_least_6_of_8_people
    - participant_macro_value_clears_margin_for_all_three
    - every_leave_one_participant_mean_has_positive_direction_for_all_three
  required_reliability:
    - all_past_only_information_checks_pass
    - primary_horizon_calibration_passes_in_both_sources
    - zero_EEG_model_is_noninferior_to_non_neural_baseline_in_both_sources
    - participant_robustness_rule_passes
    - longer_horizon_non_degradation_rule_passes
    - p95_latency_and_resource_limits_pass
  new_model_requirement:
    role: secondary
    must_exceed_best_eligible_reference_by_pre_set_final_margin: true
  model_order_summary:
    no_resolved_near_edges: no_initial_order_to_test
    any_uncertain_edge: ordering_uncertain
    any_reversed_collapsed_or_emergent_edge: ordering_changed
    otherwise_with_at_least_one_retained_edge: ordering_retained
  self_paced_claim_limited_to_before_accelerometer_detectable_motion: true
  self_paced_claim_before_any_peripheral_activation: false

possible_conclusions:
  - prospective_EEG_increment_with_model_order_retained
  - prospective_EEG_increment_with_model_order_changed
  - prospective_EEG_increment_with_model_order_uncertain
  - prospective_EEG_increment_without_an_initial_reference_order
  - near_event_signal_but_no_resolved_300_to_600ms_increment
  - no_resolved_EEG_increment_at_300_to_600ms
  - real_EEG_fails_zero_or_surrogate_specificity
  - forecast_fails_calibration_robustness_latency_or_longer_horizon_check
  - WAY_result_does_not_repeat_in_the_8_person_second_task
  - bounded_new_model_search_finds_no_improvement
  - required_comparison_remains_uncertain
  - data_timing_or_future_information_failure

claim_limits:
  - past_only_forecasting_not_causal_inference
  - no_conscious_intention_claim
  - no_causal_motor_preparation_claim
  - no_earliest_biological_command_claim
  - no_claim_before_unmeasured_peripheral_change
  - no_universal_model_order
  - no_zero_shot_new_task_claim
  - no_online_BCI_safety_or_clinical_benefit_claim
  - no_globally_untouched_independent_confirmation_claim

readiness:
  state: not_ready_for_signal_scoring
  remaining:
    - separated_development_and_held_out_data_views
    - direct_clock_channel_sampling_and_gap_checks
    - exact_onset_and_stillness_rules
    - executable_reference_models_and_source_specific_non_neural_baselines
    - complete_32_event_calibration_values
    - numeric_margins_listed_above
    - finite_allowed_model_changes
    - self_paced_development_fold_assignment
    - synthetic_tests
