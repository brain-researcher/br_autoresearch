    - delta_and_pairwise_rank_state_direction
    - calibration_and_latency_measurement
    - one_shot_terminal_decision_table
  may_set_scientific_margin: false

successor_policy:
  proposal_requires:
    - parent_scored_trial_and_configuration_hash
    - visible_ledger_prefix_hash
    - observed_development_failure_pattern
    - competing_explanation
    - exactly_one_primary_operator_change
    - directional_prediction_for_all_three_horizons
    - predicted_reference_or_incumbent_pair_effect
    - native_falsifier
    - unchanged_operator_manifest
    - parameter_latency_and_compute_estimate
    - code_and_environment_hash
    - retirement_condition
  trigger_routes:
    near_only_gain:
      prioritize: [shorter_receptive_field, high_frequency_artifact_control]
      onset_sensitivity_role: pre_frozen_nonpromoting_falsifier_never_a_target_changing_successor
    context_dominates:
      prioritize: [zero_neural_recalibration_twin, cue_stratified_evaluation, residual_neural_branch]
    real_equals_surrogate:
      prioritize: [block_shift_sensitivity, phase_randomization, participant_ID_and_session_state_controls]
    far_horizon_TCN_failure:
      prioritize: [diagonal_state_space_single_operator_successor]
    montage_or_participant_failure:
      prioritize: [geometry_aware_projection, channel_dropout, C0_vs_C32]
    calibration_failure:
      prioritize: [temperature_only_head, proper_loss_and_reliability_diagnostics]
    apparent_universal_win:
      prioritize: [component_ablation, shortened_history, leave_one_participant_influence, direct_replication]
  audit_trigger_has_successor: false

branch_retirement:
