stop:
  termination_precedence:
    - policy_violation
    - technical_failure
    - prelock_development_terminal_map
    - source_ordered_joint_audit_terminal_map
  candidate_specific_integrity_failure: invalidate_submission_without_assigning_prelock_scientific_terminal
  shared_evaluator_reference_or_locked_finalist_integrity_failure: technical_failure
  patience:
    starts_after_minimum: true
    qualified_opportunity: complete_adaptive_challenger_passing_all_noncomparative_integrity_and_eligibility_gates_and_able_to_replace_incumbent_except_for_score_comparison
    increment: qualified_opportunity_not_exceeding_incumbent_WAY_series_7_primary_log_score_by_signed_development_margin
    reset: qualified_opportunity_exceeding_that_margin
    consecutive_opportunities: 8
    noncounting_purposes:
      - coverage_panel
      - native_falsifier
      - ablation
      - influence
      - direct_replication
      - invalid_submission
      - exact_retry
    noncounting_work_still_consumes_declared_trial_feedback_and_resources: true
    requires_branch_coverage: true
    requires_postcoverage_falsifier_fraction: true
    requires_mandatory_prelock_falsifiers_complete: true
  before_minimum:
    scientific_stop: prohibited
    integrity_timing_leakage_exposure_support_or_evaluator_failure: technical_failure
    admissible_space_feedback_quota_or_compute_exhaustion: technical_failure
    engineering_failure_ceiling: technical_failure
  after_minimum:
    - qualified_patience_exhausted
    - maximum_valid_trials_reached
    - development_feedback_quota_reached
    - frozen_admissible_space_exhausted
    - cpu_gpu_wall_or_scratch_budget_exhausted
  after_minimum_exhaustion_action:
    requires_at_least_one_otherwise_valid_distinct_challenger: true
    ordered_candidate_set_reduction:
      - any_otherwise_valid_challenger_passes_all_eligibility_gates_and_clears_improvement_margin: proceed_to_configuration_lock
      - otherwise_any_challenger_eligibility_or_posteligibility_improvement_state_is_unresolved: closed_unresolved
      - otherwise_at_least_one_challenger_is_eligible_and_all_eligible_challengers_are_resolved_below_improvement_margin: closed_no_challenger_improvement
      - otherwise_all_otherwise_valid_challengers_have_a_resolved_eligibility_failure: closed_prelock_promotion_eligibility_failure
    reduction_is_mutually_exclusive_and_exhaustive_after_integrity_filtering: true
    candidate_specific_integrity_failure: invalidate_submission
    shared_evaluator_reference_or_locked_finalist_integrity_failure: technical_failure
  engineering_failure_ceiling_action: technical_failure
  budget_or_patience_stop_is_scientific_success: false
  no_valid_causal_onset_or_clock_certificate: technical_failure
  no_scorable_locked_evaluation_support: technical_failure
  unresolved_scientist_signed_margins: remain_launch_blocked

audit:
  mode: one_joint_campaign_sealed_WAY_and_second_task_participant_evaluation
  configuration_lock_required: true
  lock_hash_required: true
  maximum_open_count: 1
  audit_updates_search: false
  owner: trusted_evaluator
  network_egress: disabled
  components:
    way_series_8_and_9:
      participants: 12
      refit_source: same_participant_series_1_to_7
      role: no_feedback_lock_plus_additional_campaign_sealed_evaluation
    self_paced:
      participants: 8
      group_encoder_source: fifteen_self_paced_development_participants_only
      primary_regime: C32
      secondary_regime: C0
      diagnostic_regime: Cfull
      role: second_task_whole_participant_replication_in_development_exposed_domain
  all_components_opened_together: true
  partial_results_or_QC_feedback: prohibited
  participant_or_series_replacement: prohibited
  post_lock_change_to_model_baseline_onset_horizon_margin_C32_algorithm_or_C32_budget: prohibited
  audited_model_specific_C32_parameter_fit_under_frozen_algorithm_and_budget: permitted
  exact_success_rule:
    status: launch_blocked_pending_scientist_signed_margins
    terminal_gate_source_order: [WAY, global_latency_resource, self_paced, challenger_improvement, reference_rank]
    required_elements:
      - WAY_participant_macro_delta_fixed_G_zero_and_C_surrogate_final_each_clear_own_margin
