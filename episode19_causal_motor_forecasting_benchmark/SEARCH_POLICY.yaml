grammar:
  execution: containerized_streaming_submission_with_trusted_builder_and_evaluator
  scientific_object: near_to_strict_forecast_rank_transition_and_neural_increment
  leaderboard_object: bounded_predictive_model_improvement_on_frozen_forecast_task
  streaming_interface:
    trusted_builder:
      fit_inputs: role_filtered_training_stream_neural_transform_handle_and_seed
      freeze_output: immutable_model_hash
      candidate_controls_neural_transform: false
      transforms: [real_EEG, zero_EEG, hidden_surrogate_EEG]
    reset:
      input: random_stream_token_regime_and_minimal_structural_metadata
      token_may_encode_participant_session_date_or_filename: false
      state_reset_required: true
    predict:
      input: one_current_causal_observation_packet
      output: nineteen_category_time_to_onset_distribution
      future_access: prohibited
    observe_unscored:
      use: causal_state_warmup_without_label
      output_scored: false
    calibrate:
      available_only_in: [C32, Cfull_diagnostic]
      label_and_state_update_budget_enforced_by_evaluator: true
      calibration_targets_visible_only_during_audited_pre_score_call: true
      scored_targets_or_masks_visible: false
      permitted_supervised_C32_parameters:
        - one_global_temperature
        - three_free_coarse_horizon_logit_offsets_with_fourth_group_as_reference
      prohibited_C32_updates:
        - encoder
        - spatial_projection
        - nineteen_free_category_biases
      C32_contract:
        transform_order: nineteen_logits_divided_by_positive_temperature_then_four_group_offsets_then_softmax
        temperature_initial_value: 1.0
        temperature_positive_parameterization: null
        group_offsets_initial_value: 0.0
        groups:
          offset_1: 0_to_300ms
          offset_2: 300_to_600ms
          offset_3: 600_to_900ms
          fixed_reference: over_900ms
        objective: natural_prevalence_weighted_IPW_censoring_aware_nineteen_category_NLL
        regularization_strength: null
        parameter_bounds: null
        optimizer: null
        maximum_iterations: null
        convergence_tolerance: null
        deterministic_tie_and_failure_rule: null
        fit_separately_to_isolated_copy_of_each_scored_model: true
        includes_standalone_B_star_real_zero_and_every_surrogate_reference_and_challenger: true
        fitted_calibration_parameters_shared_across_models: false
        same_packet_algorithm_budget_and_failure_rule_across_models: true
        self_paced_delta_G_C_and_zero_noninferiority_use_separately_C32_calibrated_copies: true
        canonical_checkpoints_or_model_weights_mutated: false
        launch_requires_complete_algorithm_freeze: true
      permitted_Cfull_updates: all_otherwise_trainable_parameters_in_isolated_diagnostic_copies_initialized_from_locked_baseline_real_zero_and_surrogate_checkpoints
      canonical_B_star_or_C0_C32_artifact_mutated_by_Cfull: false
      Cfull_input: earliest_half_complete_valid_run_prefix_only
      Cfull_scored_suffix_visible_during_refit: false
    on_done:
      input: acquisition_gap_run_or_session_boundary_only
      outcome_derived_movement_or_trial_boundary_exposed: false
      reset_policy_frozen: true
    normalized_latency_recorded: true
    falcon_code_or_data_dependency_required: false
    falcon_interface_mechanics_are_precedent_only: true
    falcon_precedent_release: v1.0.2
    falcon_precedent_commit: 770c9b9597b8f58bf67b5a9ec6401ef705a2cb0f
    falcon_precedent_license: MIT
    submission_form: OCI_container_or_reproducible_training_recipe
    arbitrary_prediction_file_submission: prohibited
    runtime_network_egress: disabled
    scored_targets_onsets_and_evaluation_mask_visible_to_container: false
    fixed_CPU_GPU_RAM_wall_and_scratch_meter_required: true
    scorer_process_separate_from_prediction_process: true
  time_and_risk_contract:
    decision_stride_ms: 50
    prediction_horizon_ms: 900
    onset_interval_bins: 18
    no_onset_within_900ms_bin: true
    bin_width_ms: 50
    interval_edge_convention: left_closed_right_open
    interval_formula: I_k_equals_[50_times_k_minus_1_comma_50_times_k)_ms
    endpoint_bins_ms:
      near_event: [0, 300]
      primary_strict: [300, 600]
      longer_strict: [600, 900]
    endpoint_score: binary_log_score_from_sum_of_six_interval_masses
    endpoint_anchor_requires_status_observed_through_endpoint_upper_edge_regardless_of_earlier_onset: true
    administratively_censored_anchor_role: compatible_mass_categorical_training_likelihood_only
    administrative_censor_snap: floor_to_last_complete_50ms_boundary
    partial_straddling_bin_information_used: false
    compatible_mass_rule: sum_bins_with_lower_edge_at_or_after_snapped_boundary_plus_over_900
    censor_before_first_complete_bin_contributes_neutral_likelihood_one: true
    input_history: at_or_before_decision_time_only
    risk_eligibility: past_only_streaming_stillness
    onset_uses_EEG: false
    provider_onset_primary: false
    future_confirmation_may_define_label_only: true
    future_confirmation_may_define_risk_set_or_input: false
    provisional_crossing_state: pending_and_no_scored_anchors
    failed_crossing_rearm: prospective_only_without_reinstating_intervening_anchors
    anchor_subsampling_requires_inclusion_probability: true
    natural_risk_distribution_restored_by_weighting: true
    complete_900ms_followup_uses_categorical_log_loss: true
    earlier_noncandidate_censoring_uses_sum_of_compatible_probability_mass: true
    outcome_dependent_truncation: ineligible
    safety_bound_must_be_below_primary_lower_edge: true
    exact_onset_threshold_dwell_and_ambiguity_rule: null
    launch_requires_exact_detector_freeze: true
    detector_parameter_sources:
      WAY: series_1_to_7_only
      self_paced: fifteen_development_participants_only
    C32_may_update_detector_threshold_dwell_clock_or_ambiguity: false
  preprocessing:
    one_sided_filters_only: true
    backward_derivatives_only: true
    training_or_past_only_normalization: true
    development_initialized_sample_by_sample_unlabeled_normalization_state_in_C0_C32: allowed
    C0_learned_parameter_update: prohibited
    gap_and_series_state_reset: true
    centered_or_zero_phase_filtering: prohibited
    bidirectional_recurrence: prohibited
    future_same_padding: prohibited
    whole_session_normalization: prohibited
    split_crossing_windows: prohibited
    track_A_historical_montage_channels: 32
    track_B_and_C_scientific_common_channels: 29
    primary_common_channels: 29
    primary_common_channel_names:
      - Fp1
      - Fp2
      - F7
      - F3
      - Fz
      - F4
      - F8
      - FC5
      - FC1
      - FC2
      - FC6
      - T7
      - C3
      - C4
      - T8
      - TP9
      - CP5
      - CP1
      - CP2
      - CP6
      - TP10
      - P7
      - P3
      - Pz
      - P4
      - P8
      - O1
      - Oz
      - O2
  non_neural_baseline:
    symbols: [B_star_WAY, B_star_SP]
    selection_protocol_shared_across_sources: true
    instances_fit_separately_on_source_development_data: true
    selected_before_candidate_EEG_scores: true
    candidate_families:
      - regularized_logistic_discrete_hazard
      - gradient_boosted_discrete_hazard
      - small_causal_TCN_discrete_hazard
    permitted_inputs:
      - cue_and_time_since_cue
      - task_context_and_target_only_if_causally_disclosed_at_t
      - past_EMG_when_available
      - past_kinematics_force_or_accelerometry_when_available
      - past_EOG_when_available
      - posture_recent_motion_and_stillness_duration
      - session_time_and_missingness
    EEG_access: prohibited
    self_paced_forbidden_inputs:
      - completed_movement_TgtID
      - ultimately_chosen_cup
    immutable_after_lock: true
    common_recipe_selection:
      eligibility: frozen_causal_and_calibration_gates_pass
      primary_metric: maximize_participant_macro_natural_prevalence_binary_log_score_at_300_to_600ms
      deterministic_tie_break_order:
        - lower_censor_aware_nineteen_category_NLL
        - lower_parameter_count
        - lower_measured_latency
        - lexicographically_smaller_configuration_hash
      WAY_support: participant_local_series_1_to_6_inner_predictions
      WAY_fold_aggregation: pool_complete_series_out_of_fold_eligible_anchors_by_natural_time_within_participant_then_macro_average_participants
      WAY_weight_fit: separate_weights_per_participant
      self_paced_support: frozen_whole_participant_development_folds
      self_paced_fold_aggregation: score_each_held_out_participant_then_macro_average_all_fifteen_out_of_fold_scores
      self_paced_final_weight_fit: one_group_model_on_all_fifteen_development_participants_after_recipe_lock
    source_inputs:
      WAY: [cue, causal_context, past_EMG, past_kinematics, past_force, posture, session_time, missingness]
      self_paced: [cue_or_start_state, causal_context, past_accelerometry, past_EOG, posture, session_time, missingness]
  submission_contract:
    complete_panel_required:
      - frozen_source_specific_B_star
      - zero_neural_recalibration_twin
      - source_specific_B_star_plus_real_N
      - two_development_source_specific_B_star_plus_surrogate_N_twins
      - EEG_only_diagnostic
      - peripheral_only_positive_control
    trusted_builder_twins_require:
      - same_architecture_family
      - same_non_neural_inputs
      - same_temporal_context
      - same_optimization_and_selection_budget
      - same_folds_seeds_and_calibration_packet
    residual_primary:
      baseline_probability_sanitizer: normalize_elementwise_max_probability_and_epsilon
      same_sanitizer_applied_to_standalone_B_star_scoring: true
      baseline_logit_equation: centered_log_of_sanitized_B_star_category_probabilities
      equation: p_real_equals_softmax_z_B_star_d_plus_r_theta_over_19_categories
      final_residual_layer_initialization: exact_zero
      epoch_zero_is_eligible_early_stopping_checkpoint: true
      baseline_logit_epsilon: null
      launch_requires_baseline_logit_epsilon_freeze: true
      neural_branch_may_reread_full_behavior_history: false
    zero_twin_role: training_and_recalibration_stability_not_capacity_matched_neural_null
    zero_twin_noninferior_to_source_B_star_required: true
    surrogate_bank:
      generated_by: trusted_evaluator
      transformations_hidden_from_submitter: true
      session_preserving_block_shift_count: 4
      block_shift_minimum: exceeds_explicit_input_state_history_horizon_and_boundary_guard
      cross_channel_coherent_phase_randomization_count: 4
      development_trial_bank: same_one_hidden_shift_and_one_hidden_phase_for_every_candidate
      full_eight_bank_runs_for: [five_locked_references, locked_finalist]
      retrain_each_twin_from_scratch_on_transformed_training_stream: true
      paired_initialization_seeds_and_optimizer: true
      development_gate_comparator: participantwise_best_of_two_hidden_development_surrogates
      final_gate_comparator: participantwise_best_of_eight_hidden_surrogate_twins
      development_C_bank_size: 2
      final_C_bank_size: 8
      participantwise_max_is_part_of_each_C_estimand: true
      participantwise_max_computed_before_participant_bootstrap: true
      second_surrogate_bank_multiplicity_family: not_applicable
    full_multimodal_interaction:
      leaderboard_practical_allowed: true
      primary_neural_increment_claim_allowed: false
  leaderboards:
    practical_forecasting:
      quantity: participant_macro_natural_prevalence_log_score_of_source_B_star_plus_real_N
      primary_horizon_ms: [300, 600]
      calibration_gate_required: true
      scientific_terminal_driver: false
    neural_increment:
      quantities:
        delta_fixed: score_real_minus_source_specific_B_star
        G_zero: score_real_minus_zero_neural_recalibration_twin
        C_surrogate_development: score_real_minus_participantwise_best_of_two_hidden_development_surrogates
        C_surrogate_final: score_real_minus_participantwise_best_of_eight_surrogate_twins
      delta_G_and_C_are_separate_gates_with_separate_horizon_specific_margins: true
      development_and_final_C_use_same_margin_unless_a_distinct_pair_is_presigned: true
      development_table_order: none_gate_then_rank_by_absolute_WAY_primary_log_score
      raw_components_always_reported: true
      display_scale: cumulative_delta_fixed_log_score_gain_bits_per_eligible_minute_not_mutual_information
      primary_horizon_ms: [300, 600]
      scientific_terminal_driver: true
    leaderboard_separation:
      development_board_repeatable: true
      WAY_series_7_feedback: rate_limited_aggregate_only
      aggregate_feedback_count_max: 40
      one_scientific_trial_returns_one_joint_development_feedback_packet: true
      feedback_count_includes:
        - every_reference_or_challenger_query_that_returns_any_WAY_series_7_or_self_paced_CV_outcome
        - every_score_bearing_invalid_or_partial_submission
      feedback_count_excludes:
        - B_star_selection_on_series_1_to_6_without_series_7_query
        - nested_reference_tuning_on_series_1_to_6
        - failure_before_any_outcome_is_returned
        - byte_identical_evaluator_retry_after_certified_infrastructure_failure
      feedback_returns: source_by_horizon_fold_complete_aggregate_gates_and_WAY_selection_score
      feedback_omits: [participant, fold, null_bank_member, file_order, calibration_packet]
      WAY_series_8_and_9_joint_submission_count_max: 1
      audit_board_public: false
      audit_score_reuse_for_search: prohibited
  legacy_compatibility:
    official_six_event_mean_AUROC: required
    HandStart_AUROC_separate: required
    historical_winner_repository:
      url: https://github.com/alexandrebarachant/Grasp-and-lift-EEG-challenge
      role: reproducibility_positive_control
      exact_commit_hash: 36fe555d523c3ca3f201e765b1b1004dc5383dd2
      preferred_reproduction: Safe1
      original_YOLO_private_AUROC_context_only: 0.98109
      original_Safe1_private_AUROC_context_only: 0.98095
      native_Python2_Theano_or_semantic_port_must_be_labeled: true
    exact_legacy_behavior_may_cross_series_state: post_audit_compatibility_only
    exact_series_1_to_8_then_9_run_before_joint_evaluation: prohibited
    forecast_track_must_reset_series_state: true
  reference_panel:
    freeze_before_forecast_scores: true
    membership:
      - causal_filterbank_bandpower_elastic_net_time_to_onset
      - causal_covariance_riemannian_tangent_time_to_onset
      - causalized_EEGNet
      - dilated_causal_TCN
      - small_unidirectional_GRU
    code_version_preprocessing_and_parameter_tier_required: true
    equal_inner_search_credits: 12
    frozen_seeds: 3
    adaptive_challenger_can_join_reference_panel: false
    primary_comparison_mode: same_joint_nineteen_category_fit_scored_at_both_endpoints
    primary_terminal_dataset: WAY_joint_series_8_and_9
    secondary_comparison_modes:
      - legacy_encoder_frozen_equal_budget_forecast_head
      - self_paced_reference_ranking
    all_reference_pairs_and_both_tasks_share_one_simultaneous_bound: true
  new_model_grammar:
    seed_incumbent: best_eligible_frozen_reference_recipe
    distinct_challenger_requires_failure_justified_one_operator_successor: true
    parameter_max: 2000000
    explicit_input_window_seconds_max: 2.0
    streaming_state_age_seconds_max: 8.0
    truncated_BPTT_and_state_detach_rule_freeze_required: true
    state_cleared_at_acquisition_gap_run_series_and_session_boundary: true
    update_interval_ms: 50
    p95_inference_latency_ms_max: null
    launch_requires_latency_freeze: true
    external_foundation_weights: prohibited
    development_only_self_supervised_pretraining: eligible_declared_operator
    allowed_augmentations:
      - causal_crop
      - amplitude_perturbation
      - channel_dropout
    one_primary_operator_change_per_successor: true
    branches:
      classic_causal:
        operators:
          - linear_FIR_hazard
          - bandpower_linear_hazard
          - covariance_riemannian_hazard
          - compact_EEGNet
      temporal_architecture:
        operators:
          - dilated_depthwise_TCN
          - unidirectional_GRU
          - diagonal_state_space
          - small_causal_transformer
        SSM_requires_named_long_memory_failure: true
        transformer_not_mandatory_coverage: true
      representation:
        operators:
          - raw_voltage
          - frozen_causal_filter_bank
          - causal_bandpower
          - causal_covariance
          - development_only_self_supervised_encoder
          - learned_multiscale_causal_filters
      fusion:
        operators:
          - frozen_baseline_residual
          - late_fusion
          - gated_fusion
          - behavior_conditioned_neural_encoder
        non_residual_primary_increment_eligible: false
      adaptation:
        regimes:
          C0: no_target_labels_past_only_unlabeled_normalization
          C32: earliest_32_complete_events_per_participant_four_supervised_degrees_of_freedom
          Cfull_diagnostic: earliest_half_of_complete_valid_runs_refit_later_runs_scored_nonpromoting
      montage_robustness:
        operators:
          - fixed_common_channel_projection
          - geometry_aware_projection
        geometry_aware_requires_declared_successor: true
  training_contract:
    loss: censoring_aware_categorical_time_to_onset_negative_log_likelihood
    AUROC_as_training_objective: prohibited
    class_balanced_evaluation: prohibited
    continuous_split_unit: complete_series_or_session
    boundary_guard: max_filter_resampler_receptive_field_and_state_history
    inner_search:
      design: outcome_blind_Sobol
      configurations_per_family: 12
      seeds: 3
      same_credits_all_families: true
      applies_to: frozen_reference_families_only_on_WAY_series_1_to_6
      common_configuration_per_family: true
      selection_metric: minimize_participant_macro_censor_aware_nineteen_category_NLL_after_within_participant_arithmetic_mean_over_three_seed_scores
      fold_aggregation: pool_complete_series_out_of_fold_eligible_anchors_by_natural_time_within_participant_then_macro_average_participants
      deterministic_tie_break_order:
        - lower_parameter_count
        - lower_measured_latency
        - lexicographically_smaller_configuration_hash
      WAY_weight_fit_after_selection: separate_weights_per_participant
      per_participant_configuration_selection: prohibited
      nested_subfits_count_as_one_selected_reference_panel_scientific_trial: true
      subfit_outcomes_visible_to_adaptive_controller: false
    adaptive_successor_hyperparameters: one_exact_configuration_per_scientific_trial
    early_stopping:
      allowed_on_inner_training_side_only: true
      metric: survival_negative_log_likelihood
      outer_partial_result_pruning: prohibited
    refit_after_epoch_selection: frozen_rule_required
    identical_calibration_packet_across_models: true
    C32_packet_unit: earliest_32_complete_eligible_reaches_independently_per_participant
    C32_packet_contents: full_causal_history_all_eligible_risk_anchor_and_censoring_targets_and_onsets
    C0_and_C32_score_support: identical_suffix_after_participant_specific_C32_prefix_and_guard
    calibration_packet_and_full_history_guard_excluded_from_scoring: true
    C32_calibrated_parameters_persist_across_participant_sessions: true
    filter_and_recurrent_state_reset_each_session: true
    C0_C32_Cfull_use_isolated_model_copies: true
    Cfull:
      role: nonpromoting_upper_bound_diagnostic
      participant_minimum_complete_valid_runs: 4
      local_refit_prefix: earliest_floor_half_complete_valid_runs
      scored_support: all_later_complete_valid_runs
      inner_epoch_selection: chronological_complete_run_split_closest_to_80_20_with_at_least_one_run_each
      inner_selection_changes_only: epoch_count
      inner_fit_start: isolated_copy_of_locked_checkpoint_with_frozen_stochastic_seed_schedule
      final_refit: reset_isolated_copy_to_same_locked_checkpoint_then_finetune_entire_prefix_for_selected_epoch_count
      frozen:
        - architecture
        - preprocessing_graph
        - loss
        - optimizer
        - hyperparameters
        - twin_construction
        - random_seeds
      update_mask: all_otherwise_trainable_parameters_in_isolated_diagnostic_copies_of_source_baseline_and_real_zero_surrogate_twins
      copies_initialized_from_locked_checkpoints: true
      canonical_B_star_or_C0_C32_artifact_mutated: false
      suffix_label_or_signal_derived_statistic_visible_to_refit: false
      insufficient_support_action: report_missing_diagnostic_without_repair_or_promotion
      score_support_labeled_separately: true
    all_frozen_reference_models_run_joint_evaluation: true
    probability_floor_or_clipping_rule: null
    launch_requires_probability_rule_freeze: true
    audit_participant_EEG_self_supervised_pretraining: prohibited
  ranking_estimand:
    unit: participant
    primary_mode: same_joint_nineteen_category_fit_scored_at_both_endpoints
    primary_source_and_support: WAY_joint_series_8_and_9
    ranked_branch: source_specific_B_star_plus_real_EEG_twin
    zero_or_surrogate_twins_ranked: false
    seed_count: 3
    seed_aggregation: arithmetic_mean_of_participant_endpoint_scores
    seed_probability_ensemble_for_primary_rank: false
    bootstrap_input: participant_values_after_fixed_seed_score_mean
    secondary_nonterminal_modes: [frozen_encoder_transfer, self_paced_reference_ranking]
    pairwise_effect: participant_macro_score_a_minus_score_b
    participant_score: IPW_sum_of_anchor_binary_log_scores_divided_by_IPW_eligible_exposure
    within_participant_weighting: natural_eligible_time_not_equal_trial_or_session
    session_and_trial_role: nested_observations_kept_with_participant_not_resampled_as_units
    training_loss: censoring_aware_nineteen_category_NLL
    endpoint_score: binary_log_score_of_summed_six_bin_probability
    tasks:
      - common_score_near_event_0_to_300ms
      - strict_forecast_300_to_600ms
    official_AUROC_scale_kept_separate: true
    endpoint_interval_state_map:
      positive: simultaneous_lower_bound_strictly_greater_than_positive_practical_margin
      negative: simultaneous_upper_bound_strictly_less_than_negative_practical_margin
      equivalent: entire_simultaneous_interval_within_closed_negative_to_positive_practical_margin_band
      unresolved: all_other_interval_configurations
      point_estimate_alone_determines_state: false
    states:
      retained: both_tasks_cross_same_direction_practical_margins
      reversed: tasks_cross_opposite_direction_practical_margins
      collapsed: near_identifiable_forecast_practically_equivalent
      emergent: near_equivalent_forecast_identifiable
      stable_equivalent: both_tasks_practically_equivalent
      unresolved: interval_too_wide
    point_sign_flip_is_reversal: false
    Kendall_or_Spearman_is_primary: false
    simultaneous_pairwise_bounds_required_across_all_pairs_and_both_tasks: true
  score_aggregation:
    stochastic_branches: [real, zero, reference, challenger, surrogate]
    paired_frozen_seed_count: 3
    order:
      - compute_participant_endpoint_score_separately_for_each_seed_and_branch
      - take_arithmetic_mean_of_three_scores_within_participant_and_branch
      - form_delta_and_G_from_paired_branch_seed_means
      - for_C_development_take_participantwise_max_over_two_separately_seed_meaned_development_surrogate_scores
      - for_C_final_take_participantwise_max_over_eight_separately_seed_meaned_locked_surrogate_scores
      - form_final_challenger_vs_each_reference_from_branch_seed_means
    probability_ensemble_before_scoring: prohibited
    bootstrap_input: fixed_participant_level_seed_mean_scores
  uncertainty:
    bootstrap_draws: 10000
    confidence_level: 0.95
    resampling: participant_only_with_all_nested_sessions_trials_and_anchors_kept_together
    cross_source_resampling: independently_resample_participants_within_each_source_per_joint_bootstrap_draw
    participants_equal_weight: true
    risk_anchors_are_independent_units: false
    reference_rank_simultaneous_method: participant_bootstrap_max_t_across_all_frozen_reference_pairs_and_both_tasks
    neural_gate_simultaneous_family: delta_fixed_G_zero_and_C_surrogate_final_in_both_sources_at_primary_horizon_plus_WAY_delta_fixed_G_zero_and_C_surrogate_final_at_near_horizon
    neural_gate_simultaneous_method: participant_bootstrap_max_t_simultaneous_lower_and_upper_bounds
    positive_gate_pass_rule: lower_bound_clears_signed_margin
    resolved_failure_rule: upper_bound_below_signed_margin
    otherwise: unresolved
    neural_gate_terminal_routing:
      WAY_primary_and_near: WAY_neural_stages
      self_paced_primary: second_task_participant_replication_stage
    final_challenger_family: locked_challenger_minus_each_of_five_eligible_frozen_references_on_joint_WAY_primary_score
    final_challenger_simultaneous_method: participant_bootstrap_max_t_simultaneous_lower_and_upper_bounds
    final_challenger_pass_rule: every_lower_bound_clears_same_signed_final_margin
    final_challenger_resolved_failure_rule: any_upper_bound_below_signed_final_margin
    final_challenger_family_is_separate_from_neural_and_reference_rank_families: true
    reliability_estimands:
      Z_zero_noninferiority: participant_macro_primary_score_zero_minus_source_specific_B_star
      L_longer_horizon_non_degradation: delta_fixed_at_600_to_900ms
      sources: [WAY, self_paced]
      simultaneous_family: all_four_source_by_estimand_contrasts
      method: participant_bootstrap_max_t_simultaneous_lower_and_upper_bounds
      pass_rule: lower_bound_strictly_greater_than_negative_frozen_margin
      resolved_failure_rule: upper_bound_strictly_less_than_negative_frozen_margin
      otherwise: unresolved
      terminal_routing:
        WAY_Z_and_L: WAY_candidate_reliability_stage
        self_paced_Z_and_L: second_task_participant_replication_stage
    participant_robustness:
      prelock_development:
        contrasts: [delta_fixed, G_zero, C_surrogate_development]
        WAY_series_7: each_named_contrast_positive_in_at_least_nine_of_twelve_and_every_leave_one_participant_out_macro_mean_positive
        self_paced_five_fold_OOF: each_named_contrast_positive_in_at_least_twelve_of_fifteen_and_every_leave_one_participant_out_macro_mean_positive
        role: promotion_qualification_not_confirmatory_inference
      joint_audit:
        contrasts: [delta_fixed, G_zero, C_surrogate_final]
        WAY: every_leave_one_participant_out_mean_for_each_named_contrast_retains_positive_direction
        self_paced: each_named_contrast_positive_in_at_least_six_of_eight_and_every_leave_one_participant_out_mean_positive
      terminal_routing:
        prelock_development: prelock_promotion_eligibility_stage
        WAY: WAY_candidate_reliability_stage
        self_paced: second_task_participant_replication_stage
    calibration_contract:
      terminal_model: locked_real_EEG_branch
      horizon_ms: [300, 600]
      participant_residual: per_seed_IPW_natural_time_mean_of_binary_outcome_minus_predicted_endpoint_probability
      seed_aggregation: arithmetic_mean_of_three_per_seed_absolute_participant_residuals_without_probability_ensemble
      source_estimand: participant_macro_mean_of_seed_mean_absolute_calibration_in_the_large_residual
      WAY_support: pooled_series_8_and_9_fully_observed_primary_endpoint_anchors
      self_paced_support: C32_scored_suffix_fully_observed_primary_endpoint_anchors
      simultaneous_family: both_source_estimands
      method: participant_bootstrap_max_t_simultaneous_lower_and_upper_bounds
      per_source_pass_rule: that_source_upper_bound_strictly_below_frozen_calibration_tolerance
      per_source_resolved_failure_rule: that_source_lower_bound_strictly_above_frozen_calibration_tolerance
      per_source_otherwise: unresolved
      joint_success_requires_both_sources_pass: true
      terminal_routing:
        WAY_calibration: WAY_candidate_reliability_stage
        self_paced_calibration: second_task_participant_replication_stage
      near_and_longer_horizon_role: reported_nonterminal
      reference_recipe_qualification: same_metric_and_tolerance_on_permitted_development_predictions
      frozen_reference_removed_after_audit_failure: false
      claim_scope: marginal_not_conditional_calibration
    development_bounds_are_postadaptive_descriptive: true
  forbidden:
    - post_score_onset_or_horizon_change
    - candidate_specific_negative_sampling_or_risk_set
    - deliberately_weak_zero_neural_twin
    - unequal_input_label_or_compute_budget
    - future_confirmed_risk_eligibility
    - centered_filter_bidirectional_RNN_or_future_padding
    - whole_session_future_fitted_or_audit_parameter_fitted_normalization
    - participant_horizon_seed_or_fold_cherry_picking
    - reference_panel_expansion_after_forecast_scores
    - optimization_for_rank_reversal_magnitude
    - audit_score_driven_successor
    - post_lock_ensemble_or_runner_up_substitution
    - transductive_test_or_audit_self_supervision
    - external_pretraining_with_unknown_WAY_or_audit_exposure
    - C32_or_Cfull_called_zero_shot
    - residual_prediction_called_conscious_intention_or_causal_preparation

trial_contract:
  counted_atom: one_complete_model_policy_panel
  includes:
    - all_required_WAY_development_participants_and_series
    - all_fifteen_self_paced_development_participants
    - all_three_horizons
    - both_source_specific_B_star_instances
    - zero_real_and_two_hidden_development_surrogate_branches
    - joint_multi_horizon_fit
    - all_frozen_seeds
    - C0_and_C32_development_emulation_when_applicable
    - all_causality_leakage_calibration_and_latency_tests
  finalist_only_outputs:
    - full_eight_surrogate_bank
    - Cfull_diagnostic
    - reference_panel_representation_transfer
  unique_key: scientific_configuration_hash
  one_trial_cannot_be_split_by:
    - participant
    - series_session_or_run
    - horizon
    - branch
    - seed
    - calibration_regime
    - metric
    - scheduler_job
  does_not_count_as_new_trial:
    - byte_identical_engineering_retry
    - duplicate_configuration
    - score_replay
    - metadata_inventory
    - synthetic_only_qualification
    - audit_evaluation
  valid_when:
    - complete_panel_and_all_required_controls_finish
    - causal_and_split_integrity_tests_pass
    - natural_prevalence_weights_and_lineage_are_complete
    - resource_and_latency_records_are_complete
  trial_purpose:
    required_enum:
      - coverage_panel
      - adaptive_challenger
      - native_falsifier
      - ablation
      - influence
      - direct_replication
    exactly_one_primary_purpose: true
    commit_before_execution: true

objectives:
  scientific_primary: quantify_strict_neural_increment_and_near_to_strict_horizon_rank_transition
  leaderboard_practical: maximize_primary_horizon_absolute_forecast_log_score_after_calibration_gate
  leaderboard_neural_diagnostic: report_separate_delta_fixed_G_zero_and_C_surrogate_development_before_lock_and_C_surrogate_final_at_locked_evaluation
  challenger_selection_after_gates: maximize_WAY_series_7_absolute_primary_horizon_forecast_log_score
  self_paced_development_role: eligibility_and_replication_procedure_gate_not_pooled_selection_score
  search_must_not_optimize:
    - official_legacy_AUROC_only
    - rank_reversal_magnitude
    - audit_score
    - preferred_terminal_story
  incumbent_order:
    - all_causal_timing_state_and_split_tests_pass
    - source_specific_delta_fixed_G_zero_and_C_surrogate_development_clear_separate_margins
    - calibration_tolerance_passes
    - participant_robustness_and_longer_horizon_non_degradation_pass
    - better_primary_horizon_log_score_than_best_eligible_reference
    - lower_parameter_count_latency_and_compute
  margins:
    status: launch_blocked_pending_scientist_signed_record
    required_before_candidate_EEG_scores:
      - delta_fixed_primary_min
      - G_zero_primary_min
      - C_surrogate_primary_min
      - delta_fixed_near_min
      - G_zero_near_min
      - C_surrogate_near_min
      - zero_twin_noninferiority_to_source_B_star_margin
      - near_event_denominator_readiness_min
      - practical_pairwise_margin_near
      - practical_pairwise_margin_forecast
      - calibration_tolerance
      - longer_horizon_non_degradation_margin
      - participant_robustness_rule
      - synchronization_and_detector_uncertainty_max_ms
      - p95_inference_latency_ms_max
      - development_meaningful_improvement_margin_log_score
      - final_WAY_challenger_improvement_margin_log_score
    default_C_surrogate_margin_shared_between_development_and_final: true
    separate_development_and_final_C_margins_permitted_only_if_both_scientist_signed_before_any_candidate_EEG_score: true
    synthetic_qualification_may_choose_margin: false

budgets:
