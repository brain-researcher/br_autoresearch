# Source metadata recipe is executable; scientific outputs remain planned.
# Secondary factorial report availability does not require factorial success.
version: "0.0.14"
name: EP19 prospective EEG forecasting experiment program
inputs:
  - {id: goal, type: data, source: ../../../GOAL.md}
  - {id: datasets, type: data, source: ../../../DATASETS.md}
  - {id: policy, type: data, source: ../../../SEARCH_POLICY.yaml}
  - {id: components, type: data, source: ../../component_details.md}
  - {id: finite_model_recipes, type: data, source: ../../model_recipe_registry.json}
outputs:
  - id: final_report
    from: scientific_report.final_report
analyses:
  component_specification:
    name: Specify sensor risk states, EEG blocks, baselines and four-parameter calibration
    inputs:
      - {id: goal, from: ../goal}
      - {id: policy, from: ../policy}
      - {id: components, from: ../components}
    outputs:
      - {id: component_design, type: report, format: markdown}
  source_views_and_timing:
    name: Prepare role-separated views and assess development clocks, gaps, sensors and onset timing
    inputs:
      - {id: datasets, from: ../datasets}
      - {id: component_design, from: ../component_specification.component_design}
      - {id: inventory_code, type: data, source: ../../code/inventory_source_members.py}
      - {id: header_code, type: data, source: ../../code/inspect_development_headers.py}
      - {id: acquisition_header_code, type: data, source: ../../code/inspect_development_acquisition.py}
      - {id: acquisition_header_tests, type: data, source: ../../tests/test_development_acquisition.py}
      - {id: stream_layout_code, type: data, source: ../../tools/development_stream_layout.py}
      - {id: stream_layout_tests, type: data, source: ../../tests/test_development_stream_layout.py}
      - {id: completed_development_headers, type: data, source: ../../runs/source_views_and_timing/job_46425841_headers/development_headers.json}
      - {id: builder_code, type: data, source: ../../code/prepare_development_views.py}
      - {id: development_member_plan, type: data, source: ../../development_member_plan.json}
      - {id: structure_code, type: data, source: ../../code/inspect_way_development_structure.py}
      - {id: peripheral_pilot_code, type: data, source: ../../code/pilot_way_peripheral_onset.py}
      - {id: peripheral_detector_code, type: data, source: ../../code/peripheral_onset.py}
      - {id: peripheral_detector_tests, type: data, source: ../../tests/test_peripheral_onset.py}
      - {id: completed_return_code, type: data, source: ../../code/way_completed_return.py}
      - {id: completed_return_tests, type: data, source: ../../tests/test_way_completed_return.py}
      - {id: way_risk_stream_code, type: data, source: ../../code/way_risk_stream.py}
      - {id: way_risk_stream_tests, type: data, source: ../../tests/test_way_risk_stream.py}
      - {id: forecast_label_projection, type: data, source: ../../code/forecast_labels.py}
      - {id: rest_support_panel_code, type: data, source: ../../code/check_way_rest_support_panel.py}
      - {id: p2_support_trace_code, type: data, source: ../../code/run_way_p2_support_trace.py}
      - {id: remaining_s1_support_code, type: data, source: ../../code/run_way_remaining_s1_support.py}
      - {id: completed_p1_peripheral_pilot, type: data, source: ../../runs/source_views_and_timing/20261003-peripheral-pilot02/peripheral_pilot_report.json}
      - {id: completed_p2_support_trace, type: data, source: ../../runs/source_views_and_timing/20261005-P2-support-46658777/p2_support_trace.json}
      - {id: completed_development_view, type: data, source: ../../runs/source_views_and_timing/job_46425841_development_view/development_view.json}
      - {id: led_diagnostic_code, type: data, source: ../../code/inspect_way_led_levels.py}
      - {id: cue_metadata_reader, type: data, source: ../../code/read_way_cue_metadata.py}
      - {id: cue_polarity_code, type: data, source: ../../code/check_way_cue_polarity.py}
      - {id: cue_metadata_tests, type: data, source: ../../tests/test_way_cue_metadata.py}
      - {id: way_information_reader, type: data, source: ../../code/read_way_information_page01.sh}
      - {id: source_timing_handoff, type: data, source: ../../source_timing_handoff.md}
    outputs:
      - id: development_stream_layout
        type: report
        format: directory
        inputs: [datasets, stream_layout_code, stream_layout_tests, completed_development_headers, completed_development_view, development_member_plan, source_timing_handoff]
        description: >-
          Exact155 self-paced development runs only. Reuse completed header and
          materialization declarations; stat declared binary files without
          opening samples and read only NewSegment marker metadata for declared
          segment positions and optional timestamps. No stimulus descriptions,
          labels, EEG/peripheral arrays, WAY, held-out or archive payloads.
          Unsupported binary conventions and missing segment information stay
          unresolved. Preserve original embedded-reference verification and
          discrepancies separately from the explicitly selected publisher
          same-entity filename correspondence over unique frozen triplets.
          Known competing references to another extant identified run remain
          unresolved; no aliases, source rewrite or cohort exclusions.
          Declared segments do not prove all acquisition gaps are
          known; no physical calibration, delay bound, valid-run eligibility,
          onset rule or forecasting readiness follows. Focused fixture checks
          run within the same coordinated allocation before metadata extraction.
        recipe:
          command: >-
            timeout --signal=TERM --kill-after=5s 75s python3.12 -u -B
            outputs/tools/development_stream_layout.py --output-dir {output}
            --max-seconds 60 --mapping-basis publisher_same_entity_filename_contract
          resources: {cpus: 1, memory: 1Gi, time_limit: 2m}
      - id: completed_return_checks
        type: report
        format: text
        inputs: [component_design, completed_return_code, completed_return_tests]
        description: >-
          Focused array-only checks of the already selected WAY completed-return
          predicate: exact250-tick prestart support on the native500-Hz grid,
          both digit clearances, all eight low paths, separate object and plate
          tolerances, initial/after-reach cue chronology, history resets and
          unknown prerequisites. No reader, calibration, onset integration,
          empirical replay or full timing qualification. Run serially inside a
          future substantive allocation; no separate short job. This recipe is
          outside the unchanged pending EP21 companion proposal.
        recipe:
          command: >-
            env PYTHONPATH=outputs/code OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1
            NUMEXPR_NUM_THREADS=1 VECLIB_MAXIMUM_THREADS=1 BLIS_NUM_THREADS=1
            timeout --signal=TERM --kill-after=5s 30s python3.12 -B
            -m unittest discover -s outputs/tests -p test_way_completed_return.py -v
          resources: {cpus: 1, memory: 1Gi, time_limit: 1m}
      - id: way_risk_stream_checks
        type: report
        format: text
        inputs: [component_design, completed_return_code, forecast_label_projection, way_risk_stream_code, way_risk_stream_tests]
        description: >-
          Six focused sequential-trace checks of exact-start return arming,
          same-tick crossing suspension, all-path detection during pending and
          fresh250-tick stillness requalification, first accepted onset identity,
          immutable prefix evidence, one reach per cue, and exclusive end/gap
          closure. Bind labels to the same stream and cue with independent
          follow-up coverage; no future restoration or cross-cue label joins.
          These are small software traces, not physiological recovery evidence
          or empirical labels. Source calibration, timing, cue meaning and the
          self-paced detector remain unresolved. Run in a future substantive
          allocation, outside the unchanged EP21 companion; no separate short
          job or source replay is selected.
        recipe:
          command: >-
            env PYTHONPATH=outputs/code OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 MKL_NUM_THREADS=1
            NUMEXPR_NUM_THREADS=1 VECLIB_MAXIMUM_THREADS=1 BLIS_NUM_THREADS=1
            timeout --signal=TERM --kill-after=5s 30s python3.12 -B
            -m unittest discover -s outputs/tests -p test_way_risk_stream.py -v
          resources: {cpus: 1, memory: 1Gi, time_limit: 1m}
      - id: development_acquisition_metadata
        type: report
        format: directory
        inputs: [datasets, header_code, acquisition_header_code, acquisition_header_tests, completed_development_headers, completed_development_view]
        description: >-
          Extract recorded amplifier/channel hardware cutoff and software-filter
          settings omitted by the earlier header parser. Read exactly the same
          155 materialized development .vhdr files, bound to both completed
          reports and all 15 development people. No archive, signal, marker,
          event or held-out header read. Preserve unknown or unsupported fields;
          recorded settings do not authenticate physical accelerometer calibration,
          filter transfer/group delay or the full onset timing bound. Keep the
          original header report unchanged. Run the four focused text/access
          fixtures inside the shared substantive allocation, with no extra job.
        recipe:
          command: >-
            timeout --signal=TERM --kill-after=5s 75s
            python3.12 -u -B outputs/code/inspect_development_acquisition.py
            --output-dir {output} --max-seconds 60
          resources: {cpus: 1, memory: 1Gi, time_limit: 2m}
      - id: way_information_page01
        type: report
        format: directory
        inputs: [datasets, way_information_reader, source_timing_handoff]
        description: >-
          One bounded retrieval of the exact193612-byte public WAY supplementary
          PDF identified by the official article XML. Preserve source links/PDF
          and extract page1 only with the existing Poppler module; participant
          and held-series note pages remain unread. This is source documentation,
          not sensor calibration, timing qualification or forecasting. Run within
          the already-reserved shared allocation, with separate status and one
          parent charge; no separate short job, automatic retry or fallback URL.
        recipe:
          command: >-
            timeout --signal=TERM --kill-after=10s 90s
            bash outputs/code/read_way_information_page01.sh
          resources: {cpus: 1, memory: 4Gi, time_limit: 2m}
      - id: development_views
        type: data
        format: directory
        inputs: [datasets, builder_code, development_member_plan]
        description: >-
          Development-only continuous raw member projection; source timing,
          onset and scoring readiness remain separate unresolved requirements.
        recipe:
          command: >-
            python outputs/code/prepare_development_views.py
            --source-root /oak/stanford/groups/russpold/users/zijiao/br_autoresearch_data/steward_acquisition/ep19_public_sources
            --member-plan outputs/development_member_plan.json
            --output-root {output}
          resources: {cpus: 1, memory: 2Gi, time_limit: 20m}
      - {id: source_report, type: report, format: json}
      - id: p2_support_trace_report
        type: report
        format: directory
        inputs: [datasets, p2_support_trace_code, rest_support_panel_code, peripheral_detector_code, peripheral_pilot_code, completed_development_view]
        description: >-
          Exact fitting HS_P2_S1 source-only trace through the original one_file
          function and unchanged PilotSettings, with support_only true. Durable
          stage progress and returned support survive interruption. The whole-HS
          load incidentally decodes EEG before discarding it; no EEG features,
          thresholds, onset/risk labels or forecast scores. No P1 or other
          participant reread. Cue polarity, return phase and timing stay conditional.
        recipe:
          command: >-
            timeout --signal=TERM --kill-after=10s 190s
            python3.12 -u -B outputs/code/run_way_p2_support_trace.py
            --development-view $SCRATCH/br_autoresearch/episode19_causal_motor_forecasting_benchmark/development_view_job_46425841
            --output-dir {output} --max-seconds 180
          resources: {cpus: 1, memory: 4Gi, time_limit: 4m}
      - id: remaining_s1_support_report
        type: report
        format: directory
        inputs: [datasets, remaining_s1_support_code, p2_support_trace_code, rest_support_panel_code, peripheral_detector_code, peripheral_pilot_code, completed_development_view, completed_p1_peripheral_pilot, completed_p2_support_trace]
        description: >-
          Complete only the fixed remaining P3 through P12 S1 support panel,
          sequentially, after exact admission of all ten original fitting-role
          manifest identities, paths and sizes. Reuse original one_file,
          PilotSettings and support_only true, with the P2 tracing bindings.
          P1/P2 are preserved references, not reread inputs or repeated payloads.
          Retain every participant outcome and per-file stages in
          remaining_s1_support.json and P3_S1 through P12_S1/support_trace.json;
          uncompleted participants remain unknown. No successful-subset selection,
          noise thresholds, onset/risk labels, EEG features/scores, feedback or
          held-out access. Whole-HS incidental EEG decoding remains disclosed.
          One CPU and all six numerical thread limits one; whole-process 600-second
          cap, external 620 seconds plus 10-second grace. No automatic retry or
          follow-on dispatch. The coordinator accounts the shared parent once.
        recipe:
          command: >-
            timeout --signal=TERM --kill-after=10s 620s
            python3.12 -u -B outputs/code/run_way_remaining_s1_support.py
            --development-view $SCRATCH/br_autoresearch/episode19_causal_motor_forecasting_benchmark/development_view_job_46425841
            --output-dir {output} --max-seconds 600
          resources: {cpus: 1, memory: 4Gi, time_limit: 11m}
      - id: rest_support_panel_report
        type: report
        format: directory
        inputs: [datasets, rest_support_panel_code, peripheral_detector_code, peripheral_pilot_code, peripheral_detector_tests, completed_p1_peripheral_pilot, completed_development_view]
        description: >-
          Fixed S1 panel across all12 WAY participants, all in fitting roles.
          Reuse P1_S1 and read only the other11 exact fitting files. Keep every
          file and window result with unchanged candidate-rest rules. A support-only
          branch returns before noise-threshold estimation; no onset/risk labels,
          successful-subset selection or EEG features/scores. Cue interpretation
          remains conditional, return unknown and total onset bound null.
        recipe:
          command: >-
            python outputs/code/check_way_rest_support_panel.py
            --development-view $SCRATCH/br_autoresearch/episode19_causal_motor_forecasting_benchmark/development_view_job_46425841
            --output-dir {output} --max-seconds 240
          resources: {cpus: 1, memory: 2Gi, time_limit: 5m}
      - id: cue_polarity_report
        type: report
        format: directory
        inputs: [datasets, cue_metadata_reader, cue_polarity_code, cue_metadata_tests, peripheral_pilot_code]
        description: >-
          Compare official fitting-only WS_P1_S1 scalar LED timing metadata with
          continuous HS_P1_S1 LED crossings. Skip windowed waveform matrix
          payloads without decoding them; compression-byte access is disclosed.
          Source-semantic comparison only, never predictor/event-label input,
          return qualification or a total onset timing bound.
        recipe:
          command: >-
            python outputs/code/check_way_cue_polarity.py
            --development-view $SCRATCH/br_autoresearch/episode19_causal_motor_forecasting_benchmark/development_view_job_46425841
            --output-dir {output}
          resources: {cpus: 1, memory: 2Gi, time_limit: 4m}
      - id: led_diagnostic_report
        type: report
        format: directory
        inputs: [datasets, led_diagnostic_code, peripheral_pilot_code]
        description: >-
          One fitting-file ParticipantLED distribution and retrospective
          threshold-crossing sensitivity. No cue decoder is selected; polarity,
          completed return and total onset timing remain unauthenticated.
          Nested non-LED modalities are incidentally decoded then discarded.
        recipe:
          command: >-
            python outputs/code/inspect_way_led_levels.py
            --development-view $SCRATCH/br_autoresearch/episode19_causal_motor_forecasting_benchmark/development_view_job_46425841
            --output-dir {output}
          resources: {cpus: 1, memory: 2Gi, time_limit: 3m}
      - id: peripheral_pilot_report
        type: report
        format: directory
        inputs: [datasets, component_design, peripheral_pilot_code, peripheral_detector_code, peripheral_detector_tests]
        description: >-
          One fitting HS_P1_S1 peripheral detector pilot with prospectively
          selected rest support, all five EMG and three hand paths, and seven
          component tests. Fixed0.5 raw cue threshold follows the fitting-file
          distribution and all34 illumination-duration matches. Absolute
          provider annotation origin and completed end/return remain unresolved.
          No WS timestamps enter this pilot. Incidental nested EEG decoding is
          disclosed; no EEG features or scores. Any replay gives conditional
          candidate risk only, never qualified scientific labels. Unknown
          timing components stay unknown.
        recipe:
          command: >-
            python outputs/code/pilot_way_peripheral_onset.py
            --development-view $SCRATCH/br_autoresearch/episode19_causal_motor_forecasting_benchmark/development_view_job_46425841
            --output-dir {output} --max-seconds 540
          resources: {cpus: 1, memory: 2Gi, time_limit: 10m}
      - id: archive_inventory
        type: report
        format: directory
        inputs: [datasets, inventory_code]
        description: ZIP central-directory metadata only; no source payload or timing qualification.
        recipe:
          command: >-
            python outputs/code/inventory_source_members.py
            --source-root /oak/stanford/groups/russpold/users/zijiao/br_autoresearch_data/steward_acquisition/ep19_public_sources
            --output-root {output}
          resources: {cpus: 1, memory: 2Gi, time_limit: 10m}
      - id: development_header_report
        type: report
        format: directory
        inputs: [datasets, header_code]
        description: Development BrainVision text headers and selected source documents; no signal or held-out header access.
        recipe:
          command: >-
            python outputs/code/inspect_development_headers.py
            --archive /oak/stanford/groups/russpold/users/zijiao/br_autoresearch_data/steward_acquisition/ep19_public_sources/archives/freewill/Freewill_EEG_Reaching_Grasping.zip
            --output-root {output}
          resources: {cpus: 1, memory: 2Gi, time_limit: 10m}
      - id: selected_way_structure_report
        type: report
        format: directory
        inputs: [datasets, structure_code]
        description: >-
          Explicit development HS_P1_S1.mat modality/rate/shape inspection;
          nested arrays are deserialized but no signal values or scores emitted.
          Invoke the reader with the selected materialized development-view path.
  development_specification:
    name: Set required pre-score margins, finite model ranges, reference recipes and participant folds
    inputs:
      - {id: policy, from: ../policy}
      - {id: component_design, from: ../component_specification.component_design}
      - {id: source_report, from: ../source_views_and_timing.source_report}
      - {id: finite_model_recipes, from: ../finite_model_recipes}
    outputs:
      # Finite recipes/folds are prepared; this future complete output still
      # requires qualified source semantics, actual backends and all margins.
      - {id: method_settings, type: report, format: json}
  past_only_controls:
    name: Run required streaming, known-signal, leakage, censoring and calibration checks
    inputs:
      - {id: policy, from: ../policy}
      - {id: method_settings, from: ../development_specification.method_settings}
      - {id: source_report, from: ../source_views_and_timing.source_report}
      - {id: finite_model_recipes, from: ../finite_model_recipes}
      - {id: component_code, type: data, source: ../../code/forecast_components.py}
      - {id: classical_backend_code, type: data, source: ../../code/classical_forecast_backend.py}
      - {id: classical_backend_tests, type: data, source: ../../tests/test_classical_forecast_backend.py}
      - {id: non_neural_backend_code, type: data, source: ../../code/non_neural_forecast_backend.py}
      - {id: non_neural_backend_tests, type: data, source: ../../tests/test_non_neural_forecast_backend.py}
      - {id: boosted_backend_code, type: data, source: ../../code/boosted_hazard_backend.py}
      - {id: boosted_backend_tests, type: data, source: ../../tests/test_boosted_hazard_backend.py}
      - {id: temporal_backend_code, type: data, source: ../../code/temporal_hazard_backend.py}
      - {id: temporal_backend_tests, type: data, source: ../../tests/test_temporal_hazard_backend.py}
      - {id: gru_backend_code, type: data, source: ../../code/gru_forecast_backend.py}
      - {id: gru_backend_tests, type: data, source: ../../tests/test_gru_forecast_backend.py}
      - {id: tcn_backend_code, type: data, source: ../../code/tcn_forecast_backend.py}
      - {id: tcn_backend_tests, type: data, source: ../../tests/test_tcn_forecast_backend.py}
      - {id: eegnet_backend_code, type: data, source: ../../code/eegnet_forecast_backend.py}
      - {id: eegnet_backend_tests, type: data, source: ../../tests/test_eegnet_forecast_backend.py}
      - {id: ensemble_backend_code, type: data, source: ../../code/ensemble_forecast_backend.py}
      - {id: ensemble_backend_tests, type: data, source: ../../tests/test_ensemble_forecast_backend.py}
      - {id: forecast_scoring_code, type: data, source: ../../code/forecast_scoring.py}
      - {id: forecast_scoring_tests, type: data, source: ../../tests/test_forecast_scoring.py}
      - {id: forecast_labels_code, type: data, source: ../../code/forecast_labels.py}
      - {id: forecast_labels_tests, type: data, source: ../../tests/test_forecast_labels.py}
    outputs:
      - {id: control_report, type: report, format: json}
      - id: selected_component_report
        type: report
        format: directory
        inputs: [policy, component_code]
        description: Synthetic censoring/calibration/fixed-slot checks only; does not complete production past-only controls.
        recipe:
          command: python outputs/code/qualify_forecast_components.py --output-root {output}
          resources: {cpus: 1, memory: 2Gi, time_limit: 10m}
      - id: classical_backend_checks
        type: report
        format: text
        inputs: [policy, component_code, classical_backend_code, classical_backend_tests, non_neural_backend_code, non_neural_backend_tests]
        description: >-
          Planned small arithmetic and interface checks for censored classical
          corrections and logistic hazard, fitting-only feature geometry/scaling,
          whole-group roles, fixed-slot masks and timestamped past-only windows.
          Include the prepared-context logistic baseline interface, fixed schema,
          declared availability, participant routing and failed-fit handling.
          Prepared-vector checks do not verify raw source feature construction.
          Run only inside an authorized substantive allocation; no separate short
          job, physiological simulation program, source payload or forecast.
          Passing does not qualify source timing or complete production controls.
        recipe:
          command: >-
            ( cd outputs/tests && timeout --signal=TERM --kill-after=5s 120s
            python3.12 -B -m unittest -v test_classical_forecast_backend
            test_non_neural_forecast_backend ) > {output} 2>&1
          resources: {cpus: 1, memory: 2Gi, time_limit: 3m}
      - id: boosted_backend_checks
        type: report
        format: text
        inputs: [policy, classical_backend_code, non_neural_backend_code, non_neural_backend_tests, boosted_backend_code, boosted_backend_tests]
        description: >-
          Five focused checks for the registered boosted non-neural hazard
          comparator: conditional censoring masks, retained participant weights,
          unresolved single-class heads, one tiny exact 200-tree-per-head fit
          and canonical source/fold/past-only interfaces. Run inside a
          substantive allocation with the site NumPy, SciPy and scikit-learn
          modules. This is no empirical forecast or timing qualification.
        recipe:
          command: >-
            ( cd outputs/tests && timeout --signal=TERM --kill-after=5s 120s
            python3.12 -B -m unittest -v test_boosted_hazard_backend ) > {output} 2>&1
          resources: {cpus: 1, memory: 2Gi, time_limit: 3m}
      - id: temporal_backend_checks
        type: report
        format: text
        inputs: [policy, classical_backend_code, non_neural_backend_code, boosted_backend_code, temporal_backend_code, temporal_backend_tests]
        description: >-
          Five source-free checks of the selected small non-neural TCN:
          complete-window left-zero causality, censored loss and global minibatch
          weights, training-only grouped scaling/roles, unresolved heads/budget
          refusal, and one tiny exact 100-epoch CPU float32 fit with frozen
          19-category inference. No raw feature extraction, empirical fit or
          large-data memory qualification. Use one numerical thread inside the
          coordinator's substantive allocation; no separate short job.
        recipe:
          command: >-
            ( cd outputs/tests && timeout --signal=TERM --kill-after=5s 120s
            python3.12 -B -m unittest -v test_temporal_hazard_backend ) > {output} 2>&1
          resources: {cpus: 1, memory: 2Gi, time_limit: 3m}
      - id: ensemble_backend_checks
        type: report
        format: text
        inputs: [policy, component_code, classical_backend_code, non_neural_backend_code, finite_model_recipes, ensemble_backend_code, ensemble_backend_tests]
        description: >-
          Five focused checks of the existing fixed three-seed probability mean
          before four-parameter calibration, exact saved-row alignment, complete
          fitted members and canonical scopes/FIRs, shared reset suffix inference,
          and unchanged prefix censoring/weights/identity fallback. Includes tiny
          actual classical fits for interface compatibility. Prefix eligibility,
          first-32-event selection and the history guard remain upstream. Use
          one numerical thread inside a substantive allocation; no separate
          short job, source admission or empirical forecast is selected here.
        recipe:
          command: >-
            ( cd outputs/tests && timeout --signal=TERM --kill-after=5s 60s
            python3.12 -B -m unittest -v test_ensemble_forecast_backend ) > {output} 2>&1
          resources: {cpus: 1, memory: 1Gi, time_limit: 2m}
      - id: forecast_scoring_checks
        type: report
        format: text
        inputs: [policy, classical_backend_code, ensemble_backend_code, finite_model_recipes, forecast_scoring_code, forecast_scoring_tests]
        description: >-
          Five focused array-only checks of registered horizon boundaries,
          explicit full-upper-edge follow-up coverage, stable binary log scores,
          natural-prevalence pooling before equal participant weighting,
          complete canonical cohorts and matched rows, and participant-specific
          strongest surrogates selected separately for each horizon. No source
          reads, empirical prediction, bootstrap, margin or scientific decision.
