  non_neural_selection:
    name: Select a strong source-specific peripheral baseline before candidate EEG scores
    inputs:
      - {id: policy, from: ../policy}
      - {id: finite_model_recipes, from: ../finite_model_recipes}
      - {id: development_views, from: ../source_views_and_timing.development_views}
      - {id: method_settings, from: ../development_specification.method_settings}
      - {id: control_report, from: ../past_only_controls.control_report}
      - {id: logistic_hazard_backend, type: data, source: ../../code/classical_forecast_backend.py}
      - {id: logistic_hazard_model, type: data, source: ../../code/non_neural_forecast_backend.py}
      - {id: boosted_hazard_model, type: data, source: ../../code/boosted_hazard_backend.py}
      - {id: temporal_hazard_model, type: data, source: ../../code/temporal_hazard_backend.py}
      - {id: baseline_driver, type: data, source: ../../code/development_baseline_driver.py}
      - {id: baseline_driver_tests, type: data, source: ../../tests/test_development_baseline_driver.py}
      - {id: baseline_final_refit, type: data, source: ../../code/baseline_final_refit.py}
      - {id: baseline_final_refit_tests, type: data, source: ../../tests/test_baseline_final_refit.py}
      - {id: ensemble_cost_measurement, type: data, source: ../../code/baseline_ensemble_cost.py}
      - {id: ensemble_cost_tests, type: data, source: ../../tests/test_baseline_ensemble_cost.py}
      - {id: ensemble_backend, type: data, source: ../../code/ensemble_forecast_backend.py}
      - {id: horizon_scoring, type: data, source: ../../code/forecast_scoring.py}
    outputs:
      - id: baseline_recipe
        type: report
        format: json
        description: >-
          Complete source-specific selection over all nine registered baseline
          configurations and three seeds. WAY fits all72 person/series folds
          (1944 fits), pooling OOF rows within each person before equal-person
          scoring. Self-paced fits all five whole-person folds (135 fits),
          using each validation person's first32-event calibration as the fixed
          primary condition and no-label predictions on the identical guarded
          suffix as secondary. Requires caller-qualified source inputs, prefix
          truncation and history guards; this library does not establish them.
          Tie-breaks use primary-adaptation censored NLL, actual ensemble
          parameter count, latency and recipe name. The prepared measurement
          callback counts actual fitted inference coordinates and scaler values
          across all three seeds and measures nearest-rank p95 single-decision
          prediction plus probability averaging on fixed label-free fitting-fold
          probes shared across recipes. Warmup and pass counts are explicit;
          raw feature construction, resets, calibration and I/O are excluded.
          This is not end-to-end latency qualification. Costs are measured after
          each complete three-seed fit, before validation; retain every fold
          cost and take separate maxima
          across required folds. No partial ranking, final refit, source access
          or empirical method freeze is supplied. Production resources remain
          unmeasured; no empirical execution recipe is selected.
      - id: baseline_driver_checks
        type: report
        format: text
        inputs: [policy, finite_model_recipes, baseline_driver, baseline_driver_tests, logistic_hazard_backend, logistic_hazard_model, boosted_hazard_model, temporal_hazard_model, ensemble_backend, horizon_scoring]
        description: >-
          Five source-free composition fixtures exercise the complete registered
          scopes with instrumented fitting interfaces, unequal-series pooling,
          seed probability averaging, prefix-only calibration, shared suffix
          state, full-follow-up eligibility, measured cost tie-breaks and
          refusal of incomplete support or fits. Reuse the numerical backend
          evidence; these checks do not rerun backend qualification or establish
          real-data timing, calibration, production memory or forecast results.
          Run inside a suitable coordinator-owned substantive allocation.
        recipe:
          command: >-
            timeout --signal=TERM --kill-after=5s 120s
            python3.12 -B -m unittest discover -s outputs/tests
            -p test_development_baseline_driver.py -v > {output} 2>&1
          resources: {cpus: 1, memory: 2Gi, time_limit: 3m}
      - id: baseline_final_refit_checks
        type: report
        format: text
        description: >-
          Five focused composition checks plus four affected scope checks.
          Admit final WAY series1-7 separately for all12 people or one all15
          self-paced fit, retain three seeds and equal-person weights, and
          construct log-mean-probability training offsets before calibration.
          A separate existing-development-fold entrypoint excludes its outer
          validation roles. Training offsets are not OOF scores. Numerical
          fitting is instrumented; no empirical access or final evaluation.
        inputs: [policy, finite_model_recipes, baseline_final_refit, baseline_final_refit_tests, baseline_driver, logistic_hazard_backend, logistic_hazard_model, boosted_hazard_model, temporal_hazard_model, ensemble_backend]
        recipe:
          command: >-
            timeout --signal=TERM --kill-after=5s 175s bash -c
            'cd outputs/tests && python3.12 -B -m unittest -v -f
            test_baseline_final_refit
            test_non_neural_forecast_backend.NonNeuralWrapperTests.test_registered_roles_weights_and_scope_rejection_precede_fit
            test_boosted_hazard_backend.BoostedHazardTests.test_model_keeps_canonical_roles_fitting_weights_and_past_only_frozen_offsets
            test_temporal_hazard_backend.TemporalHazardTests.test_group_roles_and_training_only_channel_summary_scaling
            test_ensemble_forecast_backend.EnsembleForecastTests.test_fitted_seed_reports_bind_recipe_fold_grid_and_incomplete_members'
          resources: {cpus: 1, memory: 2Gi, time_limit: 3m}
      - id: ensemble_cost_checks
        type: report
        format: text
        inputs: [policy, finite_model_recipes, ensemble_cost_measurement, ensemble_cost_tests, baseline_driver, baseline_driver_tests, logistic_hazard_backend, logistic_hazard_model, boosted_hazard_model, temporal_hazard_model, ensemble_backend]
        description: >-
          Three focused checks of actual backend storage counting, single-decision
          seed probability averaging and timing, shared probe/reset behavior,
          fitting-role and seed refusals, and budget-failure cleanup. Uses
          explicit component fixtures without numerical model fitting. Does not
          establish empirical timing, source admission or production resources.
          Run serially inside a suitable coordinator-owned substantive allocation.
        recipe:
          command: >-
            timeout --signal=TERM --kill-after=5s 115s
            python3.12 -B -m unittest discover -s outputs/tests
            -p test_baseline_ensemble_cost.py -v > {output} 2>&1
          resources: {cpus: 1, memory: 2Gi, time_limit: 3m}
