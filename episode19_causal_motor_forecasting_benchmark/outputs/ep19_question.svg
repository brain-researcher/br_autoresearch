<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">EP19 scientific concept figure</title>
  <desc id="desc">Synthetic concept mockup distinguishing near-event detection from 300-to-600-millisecond forecasting, visualizing three real-EEG specificity increments, all ten horizon-dependent pairwise model edges, an eight-person independent repetition test, and bounded scientific interpretations.</desc>
  <defs>
    <style type="text/css">
      .bg{fill:#f7f9fc}.panel{fill:#fff;stroke:#94a3b8;stroke-width:1.5;rx:15}.card{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.3;rx:10}.bluebox{fill:#eff6ff;stroke:#60a5fa;stroke-width:1.5;rx:10}.orangebox{fill:#fff7ed;stroke:#fb923c;stroke-width:1.5;rx:10}.greenbox{fill:#ecfdf5;stroke:#34d399;stroke-width:1.5;rx:10}.purplebox{fill:#faf5ff;stroke:#c084fc;stroke-width:1.5;rx:10}.redbox{fill:#fef2f2;stroke:#f87171;stroke-width:1.5;rx:10}
      .title{font-family:Arial,sans-serif;font-size:25px;font-weight:700;fill:#0f172a}.head{font-family:Arial,sans-serif;font-size:20px;font-weight:700;fill:#0f172a}.sub{font-family:Arial,sans-serif;font-size:15px;font-weight:700;fill:#334155}.text{font-family:Arial,sans-serif;font-size:14px;fill:#334155}.small{font-family:Arial,sans-serif;font-size:13px;fill:#475569}.tiny{font-family:Arial,sans-serif;font-size:13px;fill:#64748b}
      .axis{stroke:#94a3b8;stroke-width:1.5;fill:none}.black{stroke:#0f172a;stroke-width:3;fill:none}.blue{stroke:#2563eb;stroke-width:3;fill:none}.orange{stroke:#ea580c;stroke-width:3;fill:none}.green{stroke:#059669;stroke-width:3;fill:none}.purple{stroke:#7e22ce;stroke-width:3;fill:none}.red{stroke:#dc2626;stroke-width:3;fill:none}.gray{stroke:#94a3b8;stroke-width:2.5;stroke-dasharray:6 5;fill:none}.arrow{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
  </defs>
  <rect class="bg" width="1500" height="900"/>
  <text x="750" y="38" text-anchor="middle" class="title">EP19 — Can past EEG forecast movement onset 300–600 ms ahead?</text>
  <rect x="560" y="49" width="380" height="29" rx="15" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="750" y="69" text-anchor="middle" class="small">CONCEPT MOCKUP · SYNTHETIC PATTERNS · NOT RESULTS</text>

  <rect x="20" y="92" width="455" height="600" class="panel"/>
  <text x="40" y="126" class="head">A  Forecast, or near-event detection?</text>
  <text x="40" y="151" class="small">Strict forecasts occur while past peripheral traces are flat.</text>
  <g transform="translate(42,180)">
    <text x="0" y="20" class="sub">EEG</text><line x1="70" y1="18" x2="390" y2="18" class="axis"/>
    <path d="M70 18 C92 -9 116 49 139 12 S184 -6 207 31 S251 46 274 6 S319 -5 344 29 S372 43 390 14" class="blue"/>
    <text x="0" y="89" class="sub">peripheral</text><line x1="70" y1="86" x2="390" y2="86" class="axis"/>
    <path d="M70 86 L275 86 C308 86 322 81 337 66 S366 33 390 24" class="orange"/>
    <text x="0" y="158" class="sub">onset label</text><line x1="70" y1="155" x2="390" y2="155" class="axis"/><line x1="350" y1="132" x2="350" y2="172" stroke="#0f172a" stroke-width="3"/>
    <text x="350" y="190" text-anchor="middle" class="small">movement onset</text>
  </g>
  <rect x="61" y="393" width="250" height="83" class="greenbox"/>
  <text x="186" y="418" text-anchor="middle" class="sub">Strict decision point</text>
  <line x1="112" y1="432" x2="112" y2="465" stroke="#059669" stroke-width="4"/><path d="M119 449L288 449" class="arrow"/>
  <text x="200" y="469" text-anchor="middle" class="small">onset remains 300–600 ms away</text>
  <rect x="61" y="493" width="250" height="83" class="orangebox"/>
  <text x="186" y="518" text-anchor="middle" class="sub">Near-event alarm</text>
  <line x1="241" y1="532" x2="241" y2="565" stroke="#ea580c" stroke-width="4"/><path d="M248 549L288 549" class="arrow"/>
  <text x="186" y="569" text-anchor="middle" class="small">peripheral change may already be visible</text>
  <rect x="42" y="600" width="390" height="55" class="redbox"/>
  <text x="237" y="624" text-anchor="middle" class="sub">Future samples may label onset</text><text x="237" y="645" text-anchor="middle" class="small">but never enter the prediction at decision time.</text>

  <rect x="490" y="92" width="485" height="600" class="panel"/>
  <text x="510" y="126" class="head">B  What else could create the score?</text>
  <text x="510" y="151" class="small">Matched comparisons share one higher-is-better held-out scale.</text>
  <g transform="translate(518,176)">
    <rect x="0" y="0" width="204" height="210" class="card"/>
    <text x="102" y="26" text-anchor="middle" class="sub">Non-neural</text><text x="102" y="47" text-anchor="middle" class="small">cue + context + peripherals</text>
    <line x1="34" y1="165" x2="172" y2="165" class="axis"/><rect x="55" y="104" width="38" height="61" fill="#94a3b8"/><rect x="119" y="78" width="38" height="87" fill="#34d399"/>
    <text x="74" y="182" text-anchor="middle" class="tiny">alt.</text><text x="138" y="182" text-anchor="middle" class="tiny">real</text>
    <text x="102" y="202" text-anchor="middle" class="tiny">Δ1 = real − non-neural</text>
    <rect x="220" y="0" width="204" height="210" class="bluebox"/>
    <text x="322" y="26" text-anchor="middle" class="sub">Zero EEG</text><text x="322" y="47" text-anchor="middle" class="small">matched capacity, EEG = 0</text>
    <line x1="254" y1="165" x2="392" y2="165" class="axis"/><rect x="275" y="106" width="38" height="59" fill="#60a5fa"/><rect x="339" y="78" width="38" height="87" fill="#34d399"/>
    <text x="294" y="182" text-anchor="middle" class="tiny">alt.</text><text x="358" y="182" text-anchor="middle" class="tiny">real</text>
    <text x="322" y="202" text-anchor="middle" class="tiny">Δ2 = real − zero EEG</text>
  </g>
  <g transform="translate(518,402)">
    <rect x="0" y="0" width="204" height="210" class="purplebox"/>
    <text x="102" y="26" text-anchor="middle" class="sub">Strongest surrogate</text><text x="102" y="47" text-anchor="middle" class="small">maximum of 8 matched nulls</text>
    <line x1="34" y1="165" x2="172" y2="165" class="axis"/><rect x="55" y="100" width="38" height="65" fill="#c084fc"/><rect x="119" y="78" width="38" height="87" fill="#34d399"/>
    <text x="74" y="182" text-anchor="middle" class="tiny">alt.</text><text x="138" y="182" text-anchor="middle" class="tiny">real</text>
    <text x="102" y="202" text-anchor="middle" class="tiny">Δ3 = real − max surrogate</text>
    <rect x="220" y="0" width="204" height="210" class="greenbox"/>
    <text x="322" y="26" text-anchor="middle" class="sub">Three-margin signature</text><text x="322" y="47" text-anchor="middle" class="small">three separately tested increments</text>
    <line x1="248" y1="145" x2="397" y2="145" class="axis"/>
    <rect x="264" y="104" width="26" height="41" fill="#34d399"/><rect x="309" y="91" width="26" height="54" fill="#34d399"/><rect x="354" y="111" width="26" height="34" fill="#34d399"/>
    <text x="277" y="163" text-anchor="middle" class="tiny">Δ1</text><text x="322" y="163" text-anchor="middle" class="tiny">Δ2</text><text x="367" y="163" text-anchor="middle" class="tiny">Δ3</text>
    <text x="322" y="190" text-anchor="middle" class="tiny">each clears its margin</text>
  </g>
  <text x="732" y="641" text-anchor="middle" class="sub">Real EEG must beat all three matched explanations</text>
  <text x="732" y="663" text-anchor="middle" class="small">at the strict horizon—not merely produce a high absolute score.</text>

  <rect x="990" y="92" width="490" height="600" class="panel"/>
  <text x="1010" y="126" class="head">C  Competing stories after the main test</text>
  <text x="1010" y="151" class="small">Edge changes and independent repetition separate the stories.</text>
  <rect x="1010" y="176" width="450" height="291" class="card"/>
  <text x="1026" y="202" class="sub">Ten simultaneous pairwise edges—not a total rank</text>
  <text x="1026" y="225" class="tiny">pair</text><text x="1125" y="225" text-anchor="middle" class="tiny">0–300</text><text x="1213" y="225" text-anchor="middle" class="tiny">300–600</text><text x="1353" y="225" text-anchor="middle" class="tiny">edge state</text>
  <g transform="translate(1026,238)" class="tiny">
    <g transform="translate(0,0)"><text x="0" y="13">F–C</text><rect x="70" y="0" width="58" height="17" class="greenbox"/><text x="99" y="13" text-anchor="middle">+</text><text x="143" y="13">→</text><rect x="158" y="0" width="58" height="17" class="greenbox"/><text x="187" y="13" text-anchor="middle">+</text><rect x="235" y="0" width="184" height="17" class="bluebox"/><text x="327" y="13" text-anchor="middle">retained</text></g>
    <g transform="translate(0,19)"><text x="0" y="13">F–E</text><rect x="70" y="0" width="58" height="17" class="greenbox"/><text x="99" y="13" text-anchor="middle">+</text><text x="143" y="13">→</text><rect x="158" y="0" width="58" height="17" class="card"/><text x="187" y="13" text-anchor="middle">0</text><rect x="235" y="0" width="184" height="17" class="card"/><text x="327" y="13" text-anchor="middle">collapsed</text></g>
    <g transform="translate(0,38)"><text x="0" y="13">F–T</text><rect x="70" y="0" width="58" height="17" class="card"/><text x="99" y="13" text-anchor="middle">0</text><text x="143" y="13">→</text><rect x="158" y="0" width="58" height="17" class="greenbox"/><text x="187" y="13" text-anchor="middle">+</text><rect x="235" y="0" width="184" height="17" class="greenbox"/><text x="327" y="13" text-anchor="middle">emergent</text></g>
    <g transform="translate(0,57)"><text x="0" y="13">F–G</text><rect x="70" y="0" width="58" height="17" class="greenbox"/><text x="99" y="13" text-anchor="middle">+</text><text x="143" y="13">→</text><rect x="158" y="0" width="58" height="17" class="orangebox"/><text x="187" y="13" text-anchor="middle">−</text><rect x="235" y="0" width="184" height="17" class="orangebox"/><text x="327" y="13" text-anchor="middle">reversed</text></g>
    <g transform="translate(0,76)"><text x="0" y="13">C–E</text><rect x="70" y="0" width="58" height="17" class="greenbox"/><text x="99" y="13" text-anchor="middle">+</text><text x="143" y="13">→</text><rect x="158" y="0" width="58" height="17" class="purplebox"/><text x="187" y="13" text-anchor="middle">?</text><rect x="235" y="0" width="184" height="17" class="purplebox"/><text x="327" y="13" text-anchor="middle">uncertain</text></g>
    <g transform="translate(0,95)"><text x="0" y="13">C–T</text><rect x="70" y="0" width="58" height="17" class="orangebox"/><text x="99" y="13" text-anchor="middle">−</text><text x="143" y="13">→</text><rect x="158" y="0" width="58" height="17" class="orangebox"/><text x="187" y="13" text-anchor="middle">−</text><rect x="235" y="0" width="184" height="17" class="bluebox"/><text x="327" y="13" text-anchor="middle">retained</text></g>
    <g transform="translate(0,114)"><text x="0" y="13">C–G</text><rect x="70" y="0" width="58" height="17" class="card"/><text x="99" y="13" text-anchor="middle">0</text><text x="143" y="13">→</text><rect x="158" y="0" width="58" height="17" class="purplebox"/><text x="187" y="13" text-anchor="middle">?</text><rect x="235" y="0" width="184" height="17" class="purplebox"/><text x="327" y="13" text-anchor="middle">uncertain</text></g>
    <g transform="translate(0,133)"><text x="0" y="13">E–T</text><rect x="70" y="0" width="58" height="17" class="orangebox"/><text x="99" y="13" text-anchor="middle">−</text><text x="143" y="13">→</text><rect x="158" y="0" width="58" height="17" class="greenbox"/><text x="187" y="13" text-anchor="middle">+</text><rect x="235" y="0" width="184" height="17" class="orangebox"/><text x="327" y="13" text-anchor="middle">reversed</text></g>
    <g transform="translate(0,152)"><text x="0" y="13">E–G</text><rect x="70" y="0" width="58" height="17" class="card"/><text x="99" y="13" text-anchor="middle">0</text><text x="143" y="13">→</text><rect x="158" y="0" width="58" height="17" class="orangebox"/><text x="187" y="13" text-anchor="middle">−</text><rect x="235" y="0" width="184" height="17" class="greenbox"/><text x="327" y="13" text-anchor="middle">emergent</text></g>
    <g transform="translate(0,171)"><text x="0" y="13">T–G</text><rect x="70" y="0" width="58" height="17" class="greenbox"/><text x="99" y="13" text-anchor="middle">+</text><text x="143" y="13">→</text><rect x="158" y="0" width="58" height="17" class="card"/><text x="187" y="13" text-anchor="middle">0</text><rect x="235" y="0" width="184" height="17" class="card"/><text x="327" y="13" text-anchor="middle">collapsed</text></g>
  </g>
  <text x="1235" y="446" text-anchor="middle" class="tiny">F filter bank · C covariance · E EEGNet · T TCN · G GRU</text>
  <text x="1235" y="462" text-anchor="middle" class="tiny">Horizon story: retained · changed · uncertain · no initial order</text>
  <rect x="1010" y="483" width="450" height="172" class="purplebox"/>
  <text x="1235" y="510" text-anchor="middle" class="sub">Generality story: repeat or task-specific?</text>
  <g fill="#60a5fa"><circle cx="1044" cy="535" r="7"/><circle cx="1066" cy="535" r="7"/><circle cx="1088" cy="535" r="7"/><circle cx="1110" cy="535" r="7"/><circle cx="1132" cy="535" r="7"/><circle cx="1154" cy="535" r="7"/><circle cx="1176" cy="535" r="7"/><circle cx="1198" cy="535" r="7"/></g><text x="1214" y="540" class="small">8 fully held-out people</text>
  <text x="1235" y="563" text-anchor="middle" class="small">First 32 movements: four-parameter calibration only.</text>
  <text x="1235" y="583" text-anchor="middle" class="small">Encoder + projection stay frozen; score the remaining suffix.</text>
  <text x="1235" y="605" text-anchor="middle" class="small">Pass: all 3 increments positive in ≥6/8, macro margins clear,</text>
  <text x="1235" y="623" text-anchor="middle" class="small">and every leave-one mean is positive.</text>
  <text x="1235" y="646" text-anchor="middle" class="tiny">Claim: before accelerometer-detectable wrist motion only (no EMG).</text>

  <rect x="20" y="708" width="1460" height="158" class="panel"/>
  <text x="40" y="742" class="head">D  Scientific interpretation</text>
  <rect x="42" y="758" width="220" height="72" class="greenbox"/><text x="152" y="783" text-anchor="middle" class="sub">Prospective EEG repeats</text><text x="152" y="804" text-anchor="middle" class="small">Strict gain repeats; pairwise</text><text x="152" y="821" text-anchor="middle" class="small">order is reported separately.</text>
  <rect x="276" y="758" width="220" height="72" class="orangebox"/><text x="386" y="783" text-anchor="middle" class="sub">Near-event only</text><text x="386" y="804" text-anchor="middle" class="small">EEG helps at 0–300 ms,</text><text x="386" y="821" text-anchor="middle" class="small">not at the strict horizon.</text>
  <rect x="510" y="758" width="220" height="72" class="redbox"/><text x="620" y="783" text-anchor="middle" class="sub">No strict EEG increment</text><text x="620" y="804" text-anchor="middle" class="small">Δ1 fails, or zero/surrogate</text><text x="620" y="821" text-anchor="middle" class="small">controls defeat Δ2 or Δ3.</text>
  <rect x="744" y="758" width="220" height="72" class="bluebox"/><text x="854" y="783" text-anchor="middle" class="sub">Does not repeat</text><text x="854" y="804" text-anchor="middle" class="small">WAY succeeds; the registered</text><text x="854" y="821" text-anchor="middle" class="small">second-task test fails.</text>
  <rect x="978" y="758" width="220" height="72" class="orangebox"/><text x="1088" y="783" text-anchor="middle" class="sub">Validity / reliability fails</text><text x="1088" y="804" text-anchor="middle" class="small">Past-only validity or zero-EEG</text><text x="1088" y="821" text-anchor="middle" class="small">parity—or another gate—fails.</text>
  <rect x="1212" y="758" width="244" height="72" class="purplebox"/><text x="1334" y="783" text-anchor="middle" class="sub">Unresolved</text><text x="1334" y="804" text-anchor="middle" class="small">A required comparison remains</text><text x="1334" y="821" text-anchor="middle" class="small">too imprecise to classify.</text>
  <text x="750" y="854" text-anchor="middle" class="tiny">Pairwise edge state is reported separately. “Causal” means past-only information flow—not causal inference, conscious intention, or proof EEG generates movement.</text>
</svg>
