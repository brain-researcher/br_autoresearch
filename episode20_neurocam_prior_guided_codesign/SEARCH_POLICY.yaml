  technical_reference_model_unqualified: technical_failure
  technical_audit_or_support_integrity_failure: technical_failure
  policy_violation: technical_failure
  technical_failure: technical_failure

terminal_discrimination:
  interval_family: multiplicity_adjusted_one_sided_95_percent_paired_intervals
  matched_control_equivalence_margin: 0.005
  eligible_D1_vs_same_mode_D0_macro_lcb_min_for_software_only_label: 0.0
  D2_vs_matched_D0_macro_lcb_min_for_hardware_only_label: 0.0
  every_rule_requires_no_higher_precedence_trigger: true
  rules:
    policy_violation:
      trigger: any_forbidden_action_audit_leak_or_post_outcome_contract_mutation
    technical_reference_model_unqualified:
      trigger: frozen_reference_qualification_attempted_and_failed_before_candidate_hardware_scores
    technical_audit_or_support_integrity_failure:
      trigger: lock_mismatch_duplicate_open_invalid_support_artifact_or_evaluator_integrity_failure
    technical_failure:
      trigger: unrecoverable_input_compiler_execution_deterministic_replay_failure_or_engineering_failure_count_above_12_not_classified_above
    incomplete_search:
      trigger: resource_ceiling_at_any_stage_or_other_authorized_stop_or_space_exhaustion_before_complete_minimum_evidence_without_exhaustive_D3_compiler_infeasibility_proof
    closed_resource_or_fabrication_constraint_failure:
      trigger: frozen_compiler_exhaustively_proves_every_D3_grammar_branch_infeasible_after_discrete_rounding
    closed_software_only_sufficient:
      all_required:
        - one_shot_audit_completed
        - at_least_one_eligible_D1_has_D3_vs_D1_superiority_lcb_below_0.005
        - that_D1_minus_D3_simultaneous_lcb_at_least_minus_0.005
        - that_D1_vs_its_same_mode_D0_macro_lcb_at_least_0.0
    closed_hardware_only_no_joint_gain:
      all_required:
        - one_shot_audit_completed
        - D3_vs_matched_D2_superiority_lcb_below_0.005
        - D2_minus_D3_simultaneous_lcb_at_least_minus_0.005
        - D2_vs_matched_D0_macro_lcb_at_least_0.0
    closed_heuristic_hardware_sufficient:
      all_required:
        - one_shot_audit_completed
        - at_least_one_eligible_D4_has_D3_vs_D4_superiority_lcb_below_0.005
        - that_D4_minus_D3_simultaneous_lcb_at_least_minus_0.005
    closed_robustness_or_transfer_failure:
      all_required:
        - one_shot_audit_completed
        - all_frontier_member_macro_and_matched_control_superiority_gates_pass
        - at_least_one_stratum_secondary_falsifier_or_empirical_plausibility_gate_fails
    closed_development_only_candidate:
      all_required:
        - candidate_met_every_explicit_development_lock_rule
        - one_shot_audit_completed
        - at_least_one_frontier_member_macro_or_matched_control_superiority_gate_fails
        - no_specific_control_equivalence_rule_above_is_satisfied
    closed_complete_incumbent_frontier_not_beaten:
      trigger: minimum_evidence_complete_and_finite_admissible_D3_space_exhausted_and_every_feasible_D3_fails_the_explicit_development_frontier_superiority_inequalities
    closed_unresolved:
      trigger: minimum_evidence_complete_but_no_positive_specific_negative_or_exhaustive_frontier_negative_rule_is_satisfied
    candidate_ready_virtual_codesign_specification:
      trigger: exactly_one_locked_D3_passes_every_promotion_constraint_falsifier_and_plausibility_gate_in_the_one_shot_audit
