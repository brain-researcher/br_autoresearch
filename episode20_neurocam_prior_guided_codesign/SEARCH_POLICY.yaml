version: 2
episode: EP20
question: Can a constrained NeuroCam redesign recover cortical voltage fields better?

documentary_reference:
  final_article_doi: 10.1016/j.scib.2025.11.030
  preprint_doi: 10.1101/2024.08.18.608446
  pubmed: PMID:41309324
  role: architecture_and_characterization_anchors_only
  reference_description: paper_derived_NeuroCam_model
  prohibited_descriptions:
    - exact_NeuroCam_twin
    - complete_NeuroCam_digital_twin
    - validated_physical_twin

reference_check:
  required_before_candidate_scores: true
  calibration_and_held_aside_anchors_are_disjoint: true
  at_least_one_operating_setting_or_curve_region_held_aside: true
  candidate_results_may_change_the_split_or_tolerances: false
  published_structure:
    lattice: 64x64
    pixels: 4096
    pitch_um: 150
    active_area_mm: [9.6, 9.6]
    gate_lines: 64
    source_lines: 64
    total_array_lines: 128
    reference_ground_guard_and_supply_costed_separately: true
  published_dynamic_settings:
    - name: 24_source_by_16_gate
      pixels: 384
      effective_rate_hz_per_pixel: 1000
      effective_pixel_samples_per_second: 384000
      approximate_raw_conversions_per_second: 2400000
      rms_noise_centre_uv: 8.8
      rms_noise_dispersion_uv: 4.2
    - name: 24_source_by_64_gate
      pixels: 1536
      effective_rate_hz_per_pixel: 250
      effective_pixel_samples_per_second: 384000
      approximate_raw_conversions_per_second: 2400000
      rms_noise_centre_uv: 12.6
      rms_noise_dispersion_uv: 8.4
    - name: 64_source_by_64_gate
      pixels: 4096
      effective_rate_hz_per_pixel: 250
      effective_pixel_samples_per_second: 1024000
      approximate_raw_conversions_per_second: 6400000
      rms_noise_centre_uv: 63.6
      rms_noise_dispersion_uv: 24.1
  planned_tolerances:
    counts_exact: true
    sample_rate_relative_error_maximum: 0.02
    throughput_relative_error_maximum: 0.02
    gain_centre_absolute_error_maximum: 0.05
    gain_dispersion_absolute_error_maximum: 0.03
    representative_cutoff_hz_minimum: 800
    noise_centre_relative_error_maximum: 0.20
    noise_dispersion_relative_error_maximum: 0.30
    nearest_neighbour_crosstalk_error_db_maximum: 3.0
    distant_crosstalk_db_maximum: -42.0
    source_direction_crosstalk_must_exceed_gate_direction_crosstalk: true
    setting_tradeoff_order_exact: true
    response_curve_tolerance: null
  additional_checks:
    - scan_timing_and_skew
    - history_dependent_settling
    - saturation
    - quantization
    - missing_and_dead_pixels
    - conditional_noise
    - rejection_of_illegal_designs
  tolerances_need_synthetic_calibration_and_scientist_approval: true
  failed_reference_check_means_codesign_question_not_tested: true

scientific_target:
  primary: cortical_surface_voltage_on_common_dense_grid
  primary_band_hz: [1, 100]
  descriptive_reduced_mode_band_hz: [100, 400]
  reduced_mode_may_rescue_primary_failure: false
  latent_source_recovery_role: descriptive_only
  downstream_task_role: secondary_transfer_check_only
  single_neuron_spike_claim: false

fixed_hardware:
  process: Ln_IZO_TFT
  substrate: flexible_polyimide
  active_area_mm: [9.6, 9.6]
  lattice: 64x64
  pitch_um: 150
  topology: one_TFT_row_column
  gate_lines_maximum: 64
  source_lines_maximum: 64
  total_array_lines_maximum: 128
  on_array_memory_or_compute: false
  ADC_and_front_end_family_unchanged: true

candidate_scope:
  geometry_families:
    - published_uniform
    - interleaved_two_scale_same_lattice
    - tiled_two_scale_same_lattice
  pad_classes_maximum: 3
  published_pad_um: [70, 135]
  alternative_pad_dimensions: null
  exact_clearances: null
  continuous_idealized_shape_is_final_candidate: false
  fabrication_rounded_design_required: true
  readout_families:
    - published_uniform_scan
    - fixed_heterogeneous_row_dwell_and_revisit
    - fixed_source_bank_precision_allocation
    - one_bounded_past_only_row_revisit_rule
  base_dwell_us: 62.5
  allowed_dwell_multipliers: [1, 2, 4]
  shorter_than_base_dwell: false
  row_action_targets_legal_gate_group_not_arbitrary_pixel: true
  future_field_or_ground_truth_access: false

software:
  conventional:
    description: past_only_linear_gaussian_state_space_or_kriging
  optimized_families:
    - physics_informed_linear_inverse
    - structured_low_rank_plus_local_state_space_inverse
    - compact_capacity_capped_past_only_nonlinear_inverse
  one_optimized_family_chosen_on_published_hardware_only: true
  every_published_hardware_optimized_result_remains_a_comparator: true
  uncertainty_output_required: true
  candidate_parameter_count_planning_maximum: 5000000
  exact_parameter_and_training_step_maximum: null
  same_capacity_optimizer_data_steps_attempts_and_seeds_for_D1_D3_D4: true
  train_each_hardware_operator_separately: true
  reuse_candidate_weights_for_comparators: false

five_way_comparison:
  D0_published_conventional:
    hardware: complete_published_NeuroCam_setting_frontier
    software: conventional
  D1_published_optimized:
    hardware: same_complete_published_frontier
    software: all_three_optimized_families_with_equal_allowance
  D2_candidate_conventional:
    hardware: candidate_design_after_fabrication_rounding
    software: conventional_with_compatible_adapter
  D3_candidate_codesign:
    hardware: same_candidate_design_as_D2
    software: optimized_family_chosen_from_D1_then_trained_separately
  D4_simple_controls:
    hardware: every_registered_resource_matched_simple_geometry_or_schedule
    software: same_optimized_family_and_allowance_as_D3
  all_D0_and_D1_results_set_before_using_D2_D3_or_D4_results: true
  one_weak_reference_setting_is_not_enough: true
  choose_reference_per_scene_after_results: false

design_legality_and_resource_parity:
  same_rules_for_candidates_and_controls: true
  apply_before_scoring: true
  repeat_after_fabrication_rounding: true
  unknown_cost_treated_as_zero: false
  required_dimensions:
    - active_area
    - array_gate_and_source_lines
    - reference_ground_guard_and_supply
    - active_front_end_and_ADC_channels
    - raw_ADC_conversions_per_second
    - effective_pixel_samples_per_second
    - output_bits_per_second
    - scan_latency_and_skew
    - gate_switches_per_second
    - modeled_power_and_thermal_burden
    - routing_area_and_loading
    - yield_dead_pixel_and_dead_line_burden
  prohibited_changes:
    - arbitrary_learned_analog_mixing
    - local_analog_aggregation
    - hierarchical_multiplexing_or_routing
    - tile_buffer_or_on_array_memory
    - new_ADC_or_front_end_family
    - unaccounted_variable_resolution_ADC
    - new_material_substrate_or_TFT_process
    - active_area_pitch_pixel_count_or_topology_change
    - more_than_128_array_lines

development_worlds:
  cortical_field_families:
    - broad_correlated_fields
    - focal_field_transients
    - translating_and_expanding_waves
    - multiscale_mixtures
    - interacting_sources
    - silent_region_surprises
    - line_reference_motion_gap_dropout_drift_and_saturation_nuisances
  source_to_surface_models:
    - analytic_homogeneous_or_layered
    - heterogeneous_or_anisotropic
  required_source_to_surface_variation:
    - distance
    - curvature
    - voltage_reference
    - contact_gap
    - conductivity
  coupled_device_variation:
    - pad_averaging
    - interface_impedance
    - source_loading
    - line_RC
    - settling_and_switching
    - crosstalk_and_noise
    - sampling_aggregation_and_quantization
    - drift_saturation_missing_pixels_and_contact_gaps
  all_designs_share_same_fields_device_draws_nuisances_and_masks: true
  regenerate_unfavourable_worlds: false

primary_measurement:
  metric: cortical_surface_field_R2
  band_hz: [1, 100]
  common_space_time_mask: true
  paired_on:
    - cortical_field_realization
    - source_to_surface_model
    - device_and_process_draw
    - nuisance_draw
    - evaluation_mask
    - resource_budget
  average_within_signal_by_device_condition_first: true
  equal_weight_device_conditions_within_signal_family: true
  equal_weight_signal_families: true
  pixels_and_timepoints_are_not_independent_replicates: true
  compare_D3_simultaneously_with_every_eligible_D0_and_D1_setting: true
  headline_gain_is_least_favourable_reference_comparison: true
  interval:
    sidedness: one_sided
    confidence_level: 0.95
    paired_cluster_resampling: true
    resampling_unit: independent_field_by_device_world
    planning_draws: 10000

promotion_margins:
  D3_vs_each_D0_D1_R2_lower_bound_minimum: 0.010
  D3_vs_matched_D1_R2_lower_bound_minimum: 0.005
  D3_vs_matched_D2_R2_lower_bound_minimum: 0.005
  D3_vs_each_D4_R2_lower_bound_minimum: 0.005
  every_condition_by_reference_R2_lower_bound_minimum: -0.005
  localization_error_noninferiority_mm: 0.15
  wave_direction_error_noninferiority_degrees: 5.0
  wave_speed_relative_error_noninferiority: 0.05
  transient_log_score_utility_noninferiority: 0.01
  uncertainty_calibration_error_noninferiority: 0.01
  downstream_normalized_utility_noninferiority: 0.01
  scientist_approval_required_before_scoring: true

secondary_measurements:
  required:
    - focal_event_localization_error
    - wave_direction_and_speed_error
    - transient_detection_proper_log_score_utility
    - uncertainty_coverage_sharpness_and_calibration
    - worst_signal_family_and_device_condition_gain
    - post_rounding_field_gain
    - latency_conversion_bitrate_power_thermal_routing_and_yield
    - preset_downstream_probe_transfer
  descriptive_only:
    - transient_AUROC
    - latent_source_recovery
    - 100_to_400Hz_reduced_mode
    - hardware_software_interaction_score

initial_coverage:
  valid_trials: 16
  arms:
    - D0_complete_published_frontier_with_conventional_software
    - D1_physics_informed_linear
    - D1_structured_state_space
    - D1_compact_past_only_nonlinear
    - D2_interleaved_two_scale_geometry
    - D2_tiled_two_scale_geometry
    - D2_fixed_rate_precision_allocation
    - D2_joint_geometry_and_readout
    - D3_interleaved_two_scale_geometry
    - D3_tiled_two_scale_geometry
    - D3_fixed_rate_precision_allocation
    - D3_joint_geometry_and_readout
    - D4_checkerboard_pad_rule
    - D4_tiled_pad_rule
    - D4_area_matched_random_geometry
    - D4_uniform_geometry_with_best_legal_schedule

required_challenge_tests:
  - complete_D0_D1_setting_sweep
  - spatial_spectrum_and_correlation_length_shift
  - silent_region_focal_event
  - unseen_propagation_speed_direction_and_curvature
  - broad_and_focal_mixture_shift
  - independent_source_to_surface_model
  - coupled_noise_crosstalk_RC_and_settling_misspecification
  - gain_impedance_drift_saturation_and_contact_gap_variation
  - random_and_clustered_dead_pixels_and_lines
  - matched_software_capacity_training_steps_and_selection_attempts
  - separate_training_for_D1_D3_and_D4
  - random_and_simple_geometry_controls
  - reverse_large_and_small_pad_assignment
  - geometry_schedule_software_and_uncertainty_ablations
  - pad_averaging_applied_once
  - fabrication_rounding_and_resource_recheck
  - leave_one_signal_family_out
  - leave_one_device_condition_out
  - mutate_future_input_for_past_only_scheduler
  - voltage_reference_and_common_mode_sensitivity
  - development_physical_signal_spectrum_amplitude_and_missingness_stress
  - common_draw_replication_of_current_best_and_comparator
  - independent_final_model_confirmation

development_requirements:
  valid_trials_minimum: 32
  valid_trials_maximum: 64
  initial_coverage_trials: 16
  follow_up_cycles_minimum: 2
  current_best_vs_new_proposal_decisions_minimum: 2
  challenge_test_fraction_after_coverage_minimum: 0.40
  patience_eligible_D3_opportunities: 12
  patience_starts_after_minimum_evidence: true
  patience_reset_R2_improvement: 0.010
  new_feasible_tradeoff_resets_patience: true
  first_positive_or_negative_trial_stops_search: false
  choose_exactly_one_candidate: true
  choice_order:
    - best_worst_condition_paired_gain
    - within_0.005_treat_as_tied
    - lower_modeled_conversion_energy
    - lower_scan_latency
    - earliest_preassigned_design_name

resources:
  repairable_engineering_failures_maximum: 12
  cpu_core_hours_maximum: 4000
  gpu_hours_maximum: 960
  total_wall_hours_maximum: 336
  parallel_GPUs_maximum: 8
  parallel_CPU_cores_maximum: 128
  total_memory_GB_maximum: 512
  memory_GB_per_trial_maximum: 128
  scratch_GB_maximum: 4096
  all_reference_training_challenge_and_final_work_is_charged: true
  reaching_a_limit_is_positive_or_negative_scientific_evidence: false

selection_requirements:
  - reference_check_passes
  - at_least_32_valid_trials_and_all_16_coverage_arms_complete
  - at_least_2_follow_up_cycles_and_2_current_best_new_proposal_decisions
  - post_coverage_challenge_fraction_at_least_0.40
  - D3_beats_every_eligible_D0_and_D1_setting_by_0.010
  - D3_beats_matched_D1_and_D2_by_0.005
  - D3_beats_every_eligible_D4_by_0.005
  - every_condition_by_reference_lower_bound_at_least_minus_0.005
  - every_secondary_noninferiority_margin_passes
  - all_hardware_and_resource_rules_pass_after_rounding
  - all_required_challenge_and_leave_one_group_checks_pass
  - development_physical_signal_or_phantom_stress_passes

stopping:
  before_minimum_evidence:
    scientific_stop: false
    stop_only_for_failed_reference_check_invalid_rules_unrecoverable_execution_resource_limit_or_all_designs_illegal: true
  after_minimum_evidence:
    - twelve_eligible_D3_opportunities_without_reset
    - sixty_four_valid_trials
    - finite_candidate_space_exhausted
    - resource_limit_reached
    - more_than_twelve_engineering_failures
    - every_candidate_family_illegal_after_rounding
  reaching_a_limit_is_a_scientific_result: false

independent_final_test:
  number_of_tests: 1
  development_results_may_change_final_models: false
  final_results_may_select_a_replacement_design: false
  final_results_may_change_metrics_margins_or_aggregation: false
  independently_implemented_components:
    - cortical_field_mechanisms
    - source_to_surface_model
    - electronics_scaling_or_coupling
    - altered_spatial_spectra_and_nonstationary_sources
    - unseen_noise_crosstalk_settling_drift_gap_saturation_and_dead_pixel_combinations
  same_development_implementation_with_new_random_draws_is_independent: false
  minimum_planning_support:
    hidden_signal_mechanisms: 3
    device_shift_conditions_per_mechanism: 4
    paired_field_realizations_per_condition: 64
    exact_counts_may_increase_after_interval_width_and_resource_calibration: true
  run_together_on_identical_worlds:
    - complete_D0_frontier
    - complete_D1_frontier
    - matched_D2_arm
    - selected_D3_candidate
    - every_eligible_D4_control
  separate_physical_signal_or_phantom_check_required: true
  catastrophic_plausibility_threshold: null
  physical_signal_or_phantom_data_may_rank_unbuilt_geometries: false

plain_language_result_rules:
  software_is_sufficient:
    D1_vs_same_setting_D0_lower_bound_minimum: 0.0
    D1_may_be_at_most_margin_worse_than_D3: 0.005
  hardware_alone_is_sufficient:
    D2_vs_matched_D0_lower_bound_minimum: 0.0
    D2_may_be_at_most_margin_worse_than_D3: 0.005
  simple_rule_is_sufficient:
    D4_may_be_at_most_margin_worse_than_D3: 0.005
  candidate_is_too_fragile:
    main_frontier_comparisons_pass_but_condition_secondary_rounding_or_plausibility_check_fails: true
  development_only_result:
    development_selection_passes_but_independent_final_comparison_fails: true
  complete_frontier_not_beaten:
    minimum_evidence_and_finite_space_exhaustion_required: true
  virtual_design_advances:
    every_primary_secondary_resource_challenge_plausibility_and_independent_final_requirement_passes: true

claim_limits:
  - paper_derived_virtual_model_study_only
  - selected_design_is_unfabricated
  - no_physical_superiority_claim
  - no_manufacturing_readiness_claim
  - no_chronic_safety_biocompatibility_reliability_or_lifetime_claim
  - no_in_vivo_performance_claim
  - no_single_neuron_spike_claim
  - no_causal_decomposition_of_hardware_and_software_gain

readiness:
  state: not_ready_for_candidate_scoring
  remaining:
    - source_use_and_rights_approval
    - calibration_and_held_aside_anchor_assignment
    - paper_derived_reference_and_successful_reference_check
    - finite_alternative_pad_catalogue_and_clearances
    - exact_software_capacity_and_training_limits
    - development_field_source_to_surface_and_device_models
    - design_legality_and_resource_rules
    - independent_final_models
    - separate_development_and_final_physical_signal_or_phantom_data
    - catastrophic_plausibility_threshold
