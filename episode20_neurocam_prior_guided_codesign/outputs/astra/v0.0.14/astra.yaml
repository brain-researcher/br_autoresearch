                 surface_to_contact_code, array_acquisition_code,
                 raw_input_hold_code, raw_input_hold_tests]
        recipe:
          command: >-
            timeout --signal=TERM --kill-after=5s 120s python3.12 -B
            outputs/tools/test_raw_input_hold.py -v
          resources: {cpus: 1, memory: 2Gi, time_limit: 3m}
      - id: raw_world_time_implementation_checks
        type: report
        format: text
        description: >-
          Six focused checks cover all28 native raw-driver replays on private
          spatial fixtures, analytic intersample values, event silence/overlap,
          M4 right-continuous switches, separate observation nuisances and the
          one-time immutable contact binding. Fixed numerical replay tolerance
          5e-12; no amplitude refit, primary-band acquisition input, hold
          convention, physical clock, electrical advance or candidate scoring.
        inputs: [raw_time_recipe, raw_world_time_code, raw_world_time_tests, surface_to_contact_code]
        recipe:
          command: >-
            timeout --signal=TERM --kill-after=5s 120s python3.12 -B
            outputs/tools/test_raw_world_time.py -v
          resources: {cpus: 1, memory: 1Gi, time_limit: 3m}
      - id: surface_to_contact_implementation_checks
        type: report
        format: text
        description: >-
          Six focused spatial bridge checks with explicit orientation, analytic
          Gaussian and directional wave pad integrals, bilinear raster averaging
          with constant outer half-cells, unchanged raw temporal amplitudes and
          one microvolt-to-volt conversion. Zero-gap development only; no temporal
          interpolation, DAQ, physical eligibility, reference fit or scoring.
        inputs: [component_design, starting_catalogue, surface_to_contact_code, surface_to_contact_tests]
        recipe:
          command: python3.12 -B outputs/tools/test_surface_to_contact.py -v
          resources: {cpus: 1, memory: 1Gi, time_limit: 2m}
      - id: development_field_implementation_checks
        type: report
        format: text
        description: >-
          Array-only checks of selected surface-field primitives with explicit
          caller grids, drivers, event draws and primary-band transforms.
          These do not select all development-world settings or qualify a
          source-to-surface model, calibrated reference or candidate score.
        inputs: [component_design, starting_catalogue, development_field_specification, development_field_code, development_field_tests]
        recipe:
          command: python3.12 -B outputs/tools/test_development_fields.py -v
          resources: {cpus: 1, memory: 1Gi, time_limit: 1m}
      - id: field_power_scale_implementation_checks
        type: report
        format: text
        description: >-
          Analytic checks of the prospectively specified rectangular-aperture
          cyclic-frequency periodogram estimator. Spatial common mode is
          retained; lambda uses 1-100 Hz truth and tau uses the time-demeaned
          full supplied truth. Irregular masks are unresolved and rejected.
          No reconstruction, reference fit or candidate scoring is executed.
        inputs: [component_design, field_power_scale_specification, field_power_scale_code, field_power_scale_tests]
        recipe:
          command: python3.12 -B outputs/tools/test_field_power_scales.py -v
          resources: {cpus: 1, memory: 1Gi, time_limit: 1m}
      - id: passive_contact_implementation_checks
        type: report
        format: text
        description: >-
          Analytic checks of the selected frequency-domain contact equations
          and equilibrium thermal PSD with explicit caller parameters. No
          fitted device values, causal CPE approximation, complete reference
          qualification or scientific candidate score is produced.
        inputs: [electrical_mechanisms_and_probes, passive_contact_code, passive_contact_tests]
        recipe:
          command: python3.12 -B outputs/tools/test_passive_contact.py -v
          resources: {cpus: 1, memory: 1Gi, time_limit: 5m}
      - id: switched_line_implementation_checks
        type: report
        format: text
        description: >-
          Analytic checks of the selected R1 persistent source-line equation,
          fixed-capacitance switch charge and causal interval readout. All
          parameters and time intervals are supplied explicitly. No fitted
          reference, actual ADC configuration or candidate score is produced.
        inputs: [electrical_mechanisms_and_probes, switched_line_code, switched_line_tests]
        recipe:
          command: python3.12 -B outputs/tools/test_switched_line.py -v
          resources: {cpus: 1, memory: 1Gi, time_limit: 5m}
      - id: source_documentary_lookup
        type: report
        format: json
        inputs: [dataset_contract]
        recipe:
          command: >-
            python3 outputs/tools/inspect_rat_map_archive_directory.py
            --out outputs/runs/model_specification/rat_map_directory_attempt001
          resources: {cpus: 1, memory: 4Gi, time_limit: 10m}
      - id: loaded_node_implementation_checks
        type: report
        format: text
        description: >-
          Analytic checks of the documented scalar loaded-node transfer and
          independent-source noise propagation. All impedances, spectra and
          temperature are explicit; no physical noise regime, cross-site
          independence, sampling aperture or calibrated reference is selected.
        inputs: [electrical_mechanisms_and_probes, passive_contact_code, loaded_node_code, loaded_node_tests]
        recipe:
          command: python3.12 -B outputs/tools/test_loaded_node.py -v
          resources: {cpus: 1, memory: 1Gi, time_limit: 1m}
      - id: nested_source_documentary_lookup
        type: report
        format: json
        inputs: [dataset_contract]
        recipe:
          command: >-
            python3.12 outputs/tools/inspect_rat_map_nested_directories.py
            --outer-report outputs/runs/model_specification/rat_map_directory_attempt001/directory_lookup.json
            --out outputs/runs/model_specification/rat_map_nested_directory_attempt001
            --max-seconds 240 --max-transfer-bytes 20971520
          resources: {cpus: 1, memory: 1Gi, time_limit: 5m}
      - id: coupled_rc_implementation_checks
        type: report
        format: text
        description: >-
          Analytic checks of the selected R2 passive coupled RC equation in
          small networks, persistent unobserved states, exact constant-input
          interval means and capacitance-switch charge/energy accounting.
          Explicit caller matrices only; this dense kernel is limited to 64
          electrical states and supplies neither fitted parameters, complete
          switch power, full-array capacity nor a candidate comparison.
        inputs: [electrical_mechanisms_and_probes, switched_line_code, coupled_rc_code, coupled_rc_tests]
        recipe:
          command: python3.12 -B outputs/tools/test_coupled_rc.py -v
          resources: {cpus: 1, memory: 1Gi, time_limit: 1m}
      - id: sparse_array_rc_implementation_checks
        type: report
        format: text
        description: >-
          Focused sparse/dense agreement, charge and energy identities,
          numerical work-limit behavior, grounded capacitor-component checks
          permitting zero reference capacitance, and one full 4096-pad/64-source
          retained-state integration. Explicit non-device fixtures only;
          no reference calibration, measured acquisition configuration or
          candidate score. Partition disagreement is reported as an estimated
          consistency check, not a certified integration-error bound.
        inputs: [electrical_mechanisms_and_probes, coupled_rc_code, sparse_array_rc_code, sparse_array_rc_tests]
        recipe:
          command: python3.12 -B outputs/tools/test_sparse_array_rc.py -v
          resources: {cpus: 1, memory: 1Gi, time_limit: 2m}
      - id: causal_cpe_implementation_checks
        type: report
        format: text
        description: >-
          Focused positive log-quadrature admittance, finite-time step response,
          area scaling, two-terminal RC stamping, persistent switched states
          and exact alpha-one capacitor checks with explicit arithmetic fixtures.
          Pole-truncation bounds exclude quadrature error; finite-grid checks
          do not certify whole-band total error or infinite temporal tails.
          Stamping targets the generic sparse network; expanded full-array
          voltage-boundary integration has separate cpe_array checks below.
          No calibrated reference, physical constants or candidate score.
        inputs: [electrical_mechanisms_and_probes, passive_contact_code, coupled_rc_code,
                 sparse_array_rc_code, sparse_array_rc_tests, causal_cpe_code, causal_cpe_tests]
        recipe:
          command: python3.12 -B outputs/tools/test_causal_cpe.py -v
          resources: {cpus: 1, memory: 1Gi, time_limit: 2m}
      - id: cpe_array_implementation_checks
        type: report
        format: text
        description: >-
          Focused structured passive-star Schur action, physical voltage-port
          work, ideal driven-capacitor charge and energy balance, exact ideal
          contact response, full mixed-array state retention and atomic refusal
          checks. The complete array retains 4160 base states plus every
          fractional RC state and ideal-contact series-interface state.
          An optional joint DAQ frontend adds its explicitly supplied hold
          states; separate mux/hold integration checks cover that path below.
          All physical inputs and waveform boundaries are explicit; no unknown
          source capacitance is introduced or dynamic contact state removed.
          Retained numeric-storage limits do not bound transient process memory.
          No reference calibration, actual DAQ configuration or candidate score.
        inputs: [electrical_mechanisms_and_probes, sparse_array_rc_code, sparse_array_rc_tests,
                 passive_contact_code, causal_cpe_code, cpe_array_code, cpe_array_tests, daq_mux_hold_code]
        recipe:
          command: python3.12 -B outputs/tools/test_cpe_array.py -v
          resources: {cpus: 1, memory: 1Gi, time_limit: 2m}
      - id: acquisition_readout_implementation_checks
        type: report
        format: text
        description: >-
          Focused checks of explicitly declared rectangular apertures from
          exact analog interval means, raw quantization before digital averaging,
          absent invalid values without reweighting, independent clipping,
          atomic coverage refusal and metadata-first causal history access.
          All declared conversions, returned samples and retained pixels count
          separately, including unused startup and marker/reference work.
          Two additional fixtures check monotone fresh-only publication,
          cumulative-query independence and cursor preservation on a failed
          batch; five checks total. Publication plans sort once and advance
          only after successful batch construction. Existing cumulative,
          history and finalization behavior is preserved. Conversion/sample/
          observation inventories in this eager API remain materialized;
          the separate streaming implementation retains only live dependencies.
          These checks do not qualify production memory or throughput.
          No physical ADC defaults, R3 conditioner, calibrated reference,
          transport/power estimate or candidate comparison is supplied.
          Run these short checks within a coordinated substantive allocation.
        inputs: [electrical_mechanisms_and_probes, acquisition_readout_code, acquisition_readout_tests]
        recipe:
          command: python3.12 -B outputs/tools/test_acquisition_readout.py -v
          resources: {cpus: 1, memory: 1Gi, time_limit: 1m}
      - id: daq_mux_hold_implementation_checks
        type: report
        format: text
        description: >-
          Focused joint array/mux-hold comparisons against an independently
          reduced dense circuit, persistent hold state, bidirectional loading,
          charge/energy accounting, aperture readout and invalid-selection
          refusal. One explicitly parameterized physical hold state per ADC
          group joins the same passive solve as all array/contact states;
          array interval means are not used as constant downstream inputs.
          Fixed source shunts explicitly exclude the represented frontend.
          Explicit marker/reference voltage ports can share these same physical
          ADC groups. Include selected and off-leak conductances in the joint
          solve, preserve the hold state across neural/marker switches, and
          retain signed external-source work separately from cortical-source
          and kernel Norton work. Whole-plan checks bind all external voltages
          to the same reference before propagation; replay and storage seams
          preserve their immutable values. Marker conversions retain their
          actual ADC identity and work count, with no extra neural source.
          All clocks, mapping and physical constants remain caller inputs.
          This is a passive R3 mechanism component, not identified NI circuitry,
          active conditioning/noise/saturation, reference qualification or a
          candidate comparison. Run inside a substantive coordinated allocation.
        inputs: [electrical_mechanisms_and_probes, sparse_array_rc_code, cpe_array_code,
                 cpe_array_tests, daq_mux_hold_code, daq_mux_hold_tests, acquisition_readout_code,
                 daq_external_input_tests, cpe_external_input_tests, external_input_acquisition_tests,
                 array_acquisition_code, raw_input_hold_code, streaming_array_code,
                 development_simulation_code]
        recipe:
          command: >-
            bash -c 'cd outputs/tools && python3.12 -B -m unittest -v
            test_daq_mux_hold test_daq_external_inputs test_cpe_external_inputs
            test_external_input_acquisition'
          resources: {cpus: 1, memory: 1Gi, time_limit: 2m}
      - id: array_acquisition_implementation_checks
        type: report
        format: text
        description: >-
          Focused finite open-loop recording checks that connect the complete
          persistent array to explicit raw conversions and published observations.
          Prevalidate physical intervals, source/hold input bindings, aperture
          support and bounded plan storage before analog advancement; split at
          exact supplied aperture endpoints and apply each boundary charge once.
          Advance unsampled physical gaps, preserve separate physical time and
          final publication horizon, and latch execution failure to prevent
          replay from already advanced state. No waveform/clock generation,
          adaptive scan, physical configuration qualification or candidate score.
          Provider intervals prevalidate fields in bounded memory, preserve
          exact integer keys, retain packed32-byte numeric digests and regenerate
          one field per physical event with sparse boundary charge. Numeric
          drift permanently stops before that event advances. Seven checks
          include the provider regressions and fresh-only publication route.
          Incremental delivery preserves the existing advance_next contract
          without rebuilding all earlier observations; cumulative query and
          finalization semantics are unchanged. Complete conversion/readout
          plans in this eager API are still materialized; the separate streaming
          executor carries one persistent array across bounded readout windows.
          Runtime checks belong inside a substantive coordinated allocation.
        inputs: [electrical_mechanisms_and_probes, cpe_array_code, cpe_array_tests,
                 daq_mux_hold_code, acquisition_readout_code, array_acquisition_code, array_acquisition_tests]
        recipe:
          command: python3.12 -B outputs/tools/test_array_acquisition.py -v
          resources: {cpus: 1, memory: 1Gi, time_limit: 2m}
  development_surface_fields:
    name: Construct the complete registered direct-surface development field panel
    inputs:
      - {id: search_policy, from: ../search_policy}
      - {id: starting_catalogue, from: ../starting_catalogue}
      - {id: world_recipe, type: data, source: outputs/development_world_recipe.md}
      - {id: field_primitives, type: data, source: outputs/tools/development_fields.py}
      - {id: dense_scale_estimator, type: data, source: outputs/tools/field_power_scales.py}
      - {id: factorized_scale_estimator, type: data, source: outputs/tools/factorized_field_power_scales.py}
      - {id: factorized_scale_tests, type: data, source: outputs/tools/test_factorized_field_power_scales.py}
      - {id: focal_generator, type: data, source: outputs/tools/development_focal_worlds.py}
      - {id: focal_tests, type: data, source: outputs/tools/test_development_focal_worlds.py}
      - {id: panel_generator, type: data, source: outputs/tools/development_worlds.py}
      - {id: panel_tests, type: data, source: outputs/tools/test_development_worlds.py}
    outputs:
      - id: implementation_checks
        type: report
        format: text
        inputs: [world_recipe, field_primitives, dense_scale_estimator, factorized_scale_estimator, factorized_scale_tests, focal_generator, focal_tests, panel_generator, panel_tests]
        description: >-
          Focused equivalence and integration checks for exact factorized power
          statistics, finite focal/surprise worlds and the complete initial panel.
          Run inside the substantive generation allocation; reuse previously
          passing field primitives rather than launch another short checking job.
        recipe:
          command: >-
            ( cd outputs/tools && timeout --signal=TERM --kill-after=5s 180s
            python3.12 -B -m unittest -v -f test_factorized_field_power_scales
            test_development_focal_worlds test_development_worlds ) > {output} 2>&1
          resources: {cpus: 1, memory: 2Gi, time_limit: 4m}
      - id: constructed_surface_worlds
        type: data
        format: directory
        inputs: [search_policy, starting_catalogue, world_recipe, field_primitives, factorized_scale_estimator, focal_generator, panel_generator]
        description: >-
          All 28 B1-N4 conditions at each of three fixed development seeds:
          25-micrometre 384x384 target grid and 500-Hz 16-second raw truth,
          stored as exact float64 spatial and temporal factors in one HDF5
          container with primary-band factors, nuisance inputs and diagnostics.
          All same-seed conditions share one independence group: 84 worlds are
          three independent seed groups, not 84 independent replicates.
          These are constructed development inputs, not calibrated electronics,
          source-to-surface qualification, candidate scores or final worlds.
        recipe:
          command: >-
            python3.12 -B outputs/tools/development_worlds.py
            --output-root {output} --max-seconds 6000
          resources: {cpus: 1, memory: 7Gi, time_limit: 2h}
  outcome_blind_calibration:
    name: Existing synthetic calibration of numerical tolerances and interval-width planning
    inputs:
      - {id: model_and_resource_specification, from: ../model_specification.model_and_resource_specification}
      - {id: search_policy, from: ../search_policy}
    outputs:
      - {id: calibration_report, type: report, format: json}
  reference_fit:
    name: Fit predeclared paper-derived variants using assigned calibration measurements only
    inputs:
      - {id: model_and_resource_specification, from: ../model_specification.model_and_resource_specification}
      - {id: calibration_report, from: ../outcome_blind_calibration.calibration_report}
      - {id: dataset_contract, from: ../dataset_contract}
    outputs:
      - {id: fitted_reference_variants, type: report, format: json}
  reference_check:
    name: Held-aside published-measurement check retaining all passing variants
    inputs:
      - {id: fitted_reference_variants, from: ../reference_fit.fitted_reference_variants}
      - {id: model_and_resource_specification, from: ../model_specification.model_and_resource_specification}
      - {id: calibration_report, from: ../outcome_blind_calibration.calibration_report}
      - {id: dataset_contract, from: ../dataset_contract}
    outputs:
      - {id: accepted_reference_models, type: report, format: json}
  development_worlds:
    name: Registered field, contact and nuisance realizations with common truth and absolute inputs
    inputs:
      - {id: model_and_resource_specification, from: ../model_specification.model_and_resource_specification}
      - {id: calibration_report, from: ../outcome_blind_calibration.calibration_report}
      - {id: constructed_surface_worlds, from: ../development_surface_fields.constructed_surface_worlds}
      - {id: conditional_simulation_runner, type: data, source: outputs/tools/streaming_development_simulation.py}
    outputs:
      - id: development_world_specification
        type: report
        format: json
        description: >-
          Combine retained surface worlds with explicitly specified contact,
          circuit, acquisition and nuisance conditions. The conditional runner
          consumes saved worlds and preserves the full retained-state forward
          chain under caller parameters, but supplies no physical defaults or
          calibrated reference. Replayable bounded windows preserve unfinished
          apertures, digital dependencies, one persistent analog state and total
          costs; output records stream into a bounded sink. A compact full
          midpoint-hold tuple remains retained. Explicit prospective parameters permit
          conditional simulation; authentic measurement context is separately
          required for calibration claims. N1-N4 use the selected decoded-pixel
          overlay with explicit site/time bindings; this is not physical pickup
          or electrically failed circuitry. Completed field generation and
          component implementation alone do not complete this artifact.
  sentinel_rank_stability:
