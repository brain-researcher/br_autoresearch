<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">EP20 scientific question and decisive prediction</title>
  <desc id="desc">Synthetic schematic showing absolute field and device measurements, a two by two spatial and temporal decision rule for D0 through D3, prediction on independent held-out conditions, and a reference-model rank reversal that stops optimization.</desc>
  <defs>
    <style type="text/css">
      .bg{fill:#f7f9fc}.panel{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.card{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.3}.bluebox{fill:#eff6ff;stroke:#60a5fa;stroke-width:1.5}.orangebox{fill:#fff7ed;stroke:#fb923c;stroke-width:1.5}.greenbox{fill:#ecfdf5;stroke:#34d399;stroke-width:1.5}.purplebox{fill:#faf5ff;stroke:#c084fc;stroke-width:1.5}.redbox{fill:#fef2f2;stroke:#f87171;stroke-width:1.5}.title{font-family:Arial,sans-serif;font-size:25px;font-weight:700;fill:#0f172a}.head{font-family:Arial,sans-serif;font-size:20px;font-weight:700;fill:#0f172a}.sub{font-family:Arial,sans-serif;font-size:15px;font-weight:700;fill:#334155}.boxhead{font-family:Arial,sans-serif;font-size:14px;font-weight:700;fill:#1e293b}.text{font-family:Arial,sans-serif;font-size:14px;fill:#334155}.small{font-family:Arial,sans-serif;font-size:13px;fill:#475569}.axis{stroke:#94a3b8;stroke-width:1.5;fill:none}.grid{stroke:#64748b;stroke-width:1.6;fill:none}.arrow{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:5 4;fill:none}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
  </defs>

  <rect class="bg" width="1500" height="900"/>
  <text x="750" y="38" text-anchor="middle" class="title">EP20 — Which measurable conditions favour each NeuroCam design?</text>
  <rect x="553" y="49" width="394" height="29" rx="15" fill="#e2e8f0" stroke="#94a3b8"/>
  <text x="750" y="69" text-anchor="middle" class="small">SCHEMATIC · SYNTHETIC EXAMPLES · NOT RESULTS</text>

  <rect x="20" y="92" width="440" height="590" rx="15" class="panel"/>
  <text x="40" y="126" class="head">A  Measure inputs before outcomes</text>
  <text x="40" y="151" class="small">Only pre-outcome measurements enter the rule.</text>

  <rect x="42" y="174" width="396" height="142" rx="10" class="bluebox"/>
  <text x="58" y="200" class="sub">Field scales from truth or a separate pilot</text>
  <line x1="66" y1="275" x2="183" y2="275" class="axis"/>
  <line x1="66" y1="275" x2="66" y2="222" class="axis"/>
  <path d="M70 268 C91 244 113 234 135 249 S167 268 180 272" stroke="#2563eb" stroke-width="3" fill="none"/>
  <line x1="137" y1="218" x2="137" y2="279" class="dash"/>
  <text x="124" y="296" text-anchor="middle" class="small">k90 → lambda = 1/(2k90)</text>
  <line x1="232" y1="275" x2="414" y2="275" class="axis"/>
  <line x1="232" y1="275" x2="232" y2="222" class="axis"/>
  <path d="M237 268 C263 238 288 232 313 251 S371 270 410 273" stroke="#ea580c" stroke-width="3" fill="none"/>
  <line x1="317" y1="218" x2="317" y2="279" class="dash"/>
  <text x="323" y="296" text-anchor="middle" class="small">f90 → tau = 1/(2f90)</text>
  <text x="124" y="214" text-anchor="middle" class="small">spatial power · µm</text>
  <text x="323" y="214" text-anchor="middle" class="small">temporal power · s</text>

  <rect x="42" y="333" width="396" height="206" rx="10" class="card"/>
  <text x="58" y="359" class="sub">Absolute device characterization for each frozen arm</text>
  <text x="58" y="380" class="small">same registered probes · before reconstruction</text>
  <text x="62" y="410" class="boxhead">Arm</text>
  <text x="123" y="410" class="boxhead">noise uV</text>
  <text x="196" y="410" class="boxhead">|Z| ohm</text>
  <text x="270" y="410" class="boxhead">settle us</text>
  <text x="355" y="410" class="boxhead">cross-talk</text>
  <line x1="58" y1="418" x2="422" y2="418" class="axis"/>
  <g class="small">
    <circle cx="72" cy="439" r="7" fill="#64748b"/><text x="88" y="444">D0</text><text x="123" y="444">n_m0k</text><text x="196" y="444">Z_m0k</text><text x="270" y="444">q_m0k</text><text x="355" y="444">c_m0k</text>
    <circle cx="72" cy="466" r="7" fill="#2563eb"/><text x="88" y="471">D1</text><text x="123" y="471">n_m1k</text><text x="196" y="471">Z_m1k</text><text x="270" y="471">q_m1k</text><text x="355" y="471">c_m1k</text>
    <circle cx="72" cy="493" r="7" fill="#ea580c"/><text x="88" y="498">D2</text><text x="123" y="498">n_m2k</text><text x="196" y="498">Z_m2k</text><text x="270" y="498">q_m2k</text><text x="355" y="498">c_m2k</text>
    <circle cx="72" cy="520" r="7" fill="#059669"/><text x="88" y="525">D3</text><text x="123" y="525">n_m3k</text><text x="196" y="525">Z_m3k</text><text x="270" y="525">q_m3k</text><text x="355" y="525">c_m3k</text>
  </g>

  <rect x="42" y="556" width="396" height="93" rx="10" class="purplebox"/>
  <text x="240" y="582" text-anchor="middle" class="sub">Freeze Uhat_m,d(x_m,d,k)</text>
  <text x="240" y="606" text-anchor="middle" class="small">Predict absolute U_m,d,k = mean paired-world R²</text>
  <text x="240" y="628" text-anchor="middle" class="small">Accepted models are scored separately — never averaged.</text>

  <rect x="480" y="92" width="500" height="590" rx="15" class="panel"/>
  <text x="500" y="126" class="head">B  Frozen two-by-two prediction</text>
  <text x="500" y="151" class="small">S = short lambda + pad noise/impedance gates pass.</text>
  <text x="500" y="170" class="small">T = short tau + settling/cross-talk gates pass.</text>

  <text x="730" y="193" text-anchor="middle" class="sub">Temporal branch T</text>
  <text x="625" y="220" text-anchor="middle" class="boxhead">no</text>
  <text x="835" y="220" text-anchor="middle" class="boxhead">yes</text>
  <text x="499" y="299" text-anchor="middle" class="boxhead" transform="rotate(-90 499 299)">Spatial branch S</text>
  <text x="524" y="250" text-anchor="middle" class="boxhead">no</text>
  <text x="524" y="383" text-anchor="middle" class="boxhead">yes</text>

  <rect x="545" y="230" width="190" height="128" class="card"/>
  <rect x="735" y="230" width="190" height="128" class="bluebox"/>
  <rect x="545" y="358" width="190" height="128" class="orangebox"/>
  <rect x="735" y="358" width="190" height="128" class="greenbox"/>
  <text x="640" y="265" text-anchor="middle" class="head">D0</text>
  <text x="640" y="291" text-anchor="middle" class="boxhead">published-like</text>
  <text x="640" y="314" text-anchor="middle" class="small">neither benefit clears cost</text>
  <text x="640" y="337" text-anchor="middle" class="small">conventional reference</text>
  <text x="830" y="265" text-anchor="middle" class="head">D1</text>
  <text x="830" y="291" text-anchor="middle" class="boxhead">time only</text>
  <text x="830" y="314" text-anchor="middle" class="small">published geometry</text>
  <text x="830" y="337" text-anchor="middle" class="small">frozen schedule/software</text>
  <text x="640" y="393" text-anchor="middle" class="head">D2</text>
  <text x="640" y="419" text-anchor="middle" class="boxhead">geometry only</text>
  <text x="640" y="442" text-anchor="middle" class="small">candidate pads</text>
  <text x="640" y="465" text-anchor="middle" class="small">conventional rule</text>
  <text x="830" y="393" text-anchor="middle" class="head">D3</text>
  <text x="830" y="419" text-anchor="middle" class="boxhead">joint co-design</text>
  <text x="830" y="442" text-anchor="middle" class="small">geometry + schedule</text>
  <text x="830" y="465" text-anchor="middle" class="small">measurement-aware inverse</text>

  <rect x="505" y="515" width="218" height="74" rx="10" class="orangebox"/>
  <text x="614" y="542" text-anchor="middle" class="boxhead">Noise or |Z| gate fails</text>
  <text x="614" y="565" text-anchor="middle" class="small">switch S off only · keep T</text>
  <rect x="737" y="515" width="218" height="74" rx="10" class="bluebox"/>
  <text x="846" y="542" text-anchor="middle" class="boxhead">Settling or cross-talk fails</text>
  <text x="846" y="565" text-anchor="middle" class="small">switch T off only · keep S</text>
  <rect x="505" y="594" width="450" height="66" rx="10" class="redbox"/>
  <text x="730" y="616" text-anchor="middle" class="boxhead">Uncertain gate or mapped arm misses by &gt;0.005</text>
  <text x="730" y="638" text-anchor="middle" class="small">Predict the adjacent-arm set or fail the separable rule;</text>
  <text x="730" y="655" text-anchor="middle" class="small">never force D0.</text>

  <rect x="1000" y="92" width="480" height="370" rx="15" class="panel"/>
  <text x="1020" y="126" class="head">C  Predict independent winners</text>
  <text x="1020" y="151" class="small">Freeze one representative or selection rule for every D0–D3 arm.</text>

  <g>
    <rect x="1022" y="172" width="90" height="48" rx="8" class="card"/><text x="1067" y="202" text-anchor="middle" class="boxhead">D0</text>
    <rect x="1122" y="172" width="90" height="48" rx="8" class="bluebox"/><text x="1167" y="202" text-anchor="middle" class="boxhead">D1</text>
    <rect x="1222" y="172" width="90" height="48" rx="8" class="orangebox"/><text x="1267" y="202" text-anchor="middle" class="boxhead">D2</text>
    <rect x="1322" y="172" width="90" height="48" rx="8" class="greenbox"/><text x="1367" y="202" text-anchor="middle" class="boxhead">D3</text>
  </g>
  <path d="M1217 226 L1217 248" class="arrow"/>
  <text x="1217" y="267" text-anchor="middle" class="small">every accepted model × same independent worlds</text>

  <rect x="1022" y="286" width="212" height="143" rx="10" class="card"/>
  <text x="1128" y="307" text-anchor="middle" class="boxhead">held-out condition map</text>
  <line x1="1042" y1="352" x2="1214" y2="352" class="grid"/>
  <line x1="1128" y1="320" x2="1128" y2="410" class="grid"/>
  <text x="1085" y="423" text-anchor="middle" class="small">S=0</text><text x="1171" y="423" text-anchor="middle" class="small">S=1</text>
  <text x="1049" y="342" class="small">T=1</text><text x="1049" y="395" class="small">T=0</text>
  <circle cx="1087" cy="380" r="8" fill="#64748b" stroke="#0f172a" stroke-width="2"/>
  <circle cx="1087" cy="334" r="8" fill="#2563eb" stroke="#2563eb" stroke-width="2"/>
  <circle cx="1170" cy="380" r="8" fill="#ea580c" stroke="#ea580c" stroke-width="2"/>
  <circle cx="1170" cy="334" r="8" fill="#059669" stroke="#059669" stroke-width="2"/>
  <circle cx="1195" cy="326" r="8" fill="#059669" stroke="#0f172a" stroke-width="2"/>

  <text x="1260" y="306" class="boxhead">For each point:</text>
  <circle cx="1270" cy="331" r="7" fill="#059669"/><text x="1286" y="336" class="small">fill = predicted arm</text>
  <circle cx="1270" cy="357" r="7" fill="#fff" stroke="#0f172a" stroke-width="2"/><text x="1286" y="362" class="small">ring = observed winner</text>
  <text x="1260" y="388" class="small">score regret, ties,</text>
  <text x="1260" y="407" class="small">confusion, abstention,</text>
  <text x="1260" y="426" class="small">and gain sign vs D0</text>

  <rect x="1000" y="480" width="480" height="202" rx="15" class="panel"/>
  <text x="1020" y="514" class="head">D  Can accepted models disagree?</text>
  <text x="1020" y="538" class="small">Both models fit calibration and held-aside published anchors.</text>
  <text x="1040" y="566" class="boxhead">Model A</text>
  <rect x="1110" y="552" width="52" height="18" fill="#64748b"/><rect x="1110" y="577" width="112" height="18" fill="#059669"/>
  <text x="1230" y="567" class="small">D0</text><text x="1230" y="592" class="small">D3 winner</text>
  <text x="1040" y="626" class="boxhead">Model B</text>
  <rect x="1110" y="612" width="58" height="18" fill="#64748b"/><rect x="1110" y="637" width="118" height="18" fill="#2563eb"/>
  <text x="1236" y="627" class="small">D0</text><text x="1236" y="652" class="small">D1 winner</text>
  <path d="M1280 584 L1322 584" class="arrow"/>
  <rect x="1330" y="550" width="126" height="106" rx="10" class="redbox"/>
  <text x="1393" y="578" text-anchor="middle" class="sub">STOP</text>
  <text x="1393" y="598" text-anchor="middle" class="small">different winners</text>
  <text x="1393" y="616" text-anchor="middle" class="small">each 95% LCB</text>
  <text x="1393" y="634" text-anchor="middle" class="small">&gt; 0.005</text>
  <text x="1393" y="648" text-anchor="middle" class="small">measure response</text>

  <rect x="20" y="708" width="1460" height="158" rx="15" class="panel"/>
  <text x="40" y="742" class="head">E  What the evidence would mean</text>
  <rect x="42" y="760" width="330" height="72" rx="10" class="greenbox"/>
  <text x="207" y="786" text-anchor="middle" class="boxhead">Models agree + regret UCB &lt;= 0.005</text>
  <text x="207" y="808" text-anchor="middle" class="small">Transferable virtual design rule supported</text>
  <rect x="391" y="760" width="330" height="72" rx="10" class="orangebox"/>
  <text x="556" y="786" text-anchor="middle" class="boxhead">One D3 wins but the rule misses</text>
  <text x="556" y="808" text-anchor="middle" class="small">Model-specific virtual device only</text>
  <rect x="740" y="760" width="330" height="72" rx="10" class="redbox"/>
  <text x="905" y="786" text-anchor="middle" class="boxhead">Accepted models reverse the winner</text>
  <text x="905" y="808" text-anchor="middle" class="small">No optimization; obtain discriminating data</text>
  <rect x="1089" y="760" width="367" height="72" rx="10" class="purplebox"/>
  <text x="1272" y="786" text-anchor="middle" class="boxhead">Tie, unresolved gate, or poor coverage</text>
  <text x="1272" y="808" text-anchor="middle" class="small">State the uncertainty; do not force a winner</text>
  <text x="750" y="854" text-anchor="middle" class="small">Even the strongest positive result concerns an unfabricated design; it is a reason to bench-test, not evidence of physical superiority.</text>
</svg>
