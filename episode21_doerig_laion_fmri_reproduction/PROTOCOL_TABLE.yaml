inference:
  biological_unit: participant
  participants_required_for_verdict: 5
  above_chance_permutations: 10000
  permutation_sampling:
    exchangeability_unit: whole_image_identity_with_all_repetitions
    preserve: [participant, prespecified_fold, eligible_image_universe]
    exact_enumeration: enumerate_full_admissible_group_with_identity_exactly_once
    monte_carlo: sample_with_replacement_from_nonidentity_admissible_permutations
    duplicate_monte_carlo_draws: allowed_and_counted
    rng_and_seed_list: unresolved_required_before_lock
  permutation_p_values:
    sidedness: two_sided
    endpoint_effect_requirement: freeze_a_null_center_function_for_every_endpoint_so_zero_is_null_and_positive_is_prespecified_direction
    monte_carlo_formula: one_plus_count_abs_centered_null_at_least_abs_centered_observed_divided_by_one_plus_number_permutations
    complete_exact_enumeration_formula: count_abs_centered_null_at_least_abs_centered_observed_divided_by_total_enumerated_space
    bootstrap_consistency: recompute_and_use_the_same_centered_oriented_effect
    calibration: required_for_every_endpoint_specific_center_and_tail
    significance_count_gate: corrected_p_below_alpha_and_observed_effect_in_prespecified_direction
  interval:
    method: image_cluster_bootstrap_recompute_complete_statistic
    resamples: 2000
    level: 0.95
    rsa_scope: resample_regular_shared_image_identities_and_rebuild_both_rdms
    predictive_scope: independently_resample_subject_unique_fit_and_regular_shared_evaluation_image_identities_and_refit_complete_pipeline
    repetition_rule: carry_all_repetitions_with_each_sampled_image_identity
    preprocessing_recomputation: unresolved_exact_session_zscore_and_missingness_replay_required_before_lock
    interval_type: unresolved_percentile_basic_bca_or_other_required_before_lock
    quantile_convention: unresolved_required_before_lock
    failed_or_degenerate_replicate_action: unresolved_required_before_lock
    minimum_valid_replicates: unresolved_required_before_lock
    rng_and_seed_list: unresolved_required_before_lock
  paired_contrast_requirement:
    allowed: only_a_pre_score_method_with_simulation_demonstrated_type_i_error_for_the_exact_statistic
    forbidden: independently_swapping_model_labels_per_image_to_create_hybrid_representations
    unresolved_action: lock_affected_contrast_subclaim_not_evaluable_for_replication_with_descriptive_interval_only
    descriptive_neural_estimation_after_not_evaluable_lock: allowed
  multiplicity:
    method: benjamini_hochberg
    alpha: 0.05
    scope: within_participant_and_frozen_finding_family
    family_membership: unresolved_required_before_lock
  subclaim_verdicts:
    replicated: predicted_direction_count_at_least_4_and_corrected_significance_count_at_least_3
    partial: exactly_3_predicted_directions_or_at_least_4_directions_with_fewer_than_3_corrected_significant
    not_replicated: predicted_direction_count_at_most_2
    not_evaluable: fewer_than_5_valid_participants_or_invalid_or_unavailable_required_endpoint
  zero_effect_direction: does_not_count_as_predicted_direction
  finding_aggregation_rule: unresolved_required_before_lock

robustness:
  shared_training_exception:
    scope: nested_estimator_tuning_inside_prespecified_tau_or_cluster_k5_training_rows_only
    cannot_change: [global_method, core_fit, primary_verdict, another_fold]
  tau: authenticated_provider_regular_shared_partition
  cluster_k5:
    source: authenticated_provider_regular_shared_five_fold_partition
    predictive_models: fit_on_four_clusters_and_evaluate_unchanged_on_held_cluster
    parameter_free_rsa: compute_only_on_each_held_cluster
    learned_transform_scope: fit_scaling_pca_voxel_filters_and_other_learned_transforms_on_four_training_clusters_only
    correlation_fold_aggregation: arithmetic_mean_of_fold_fisher_z_values_with_inverse_transform_for_display
    inference_role: descriptive_secondary_nonselecting
  nsd_origin_exclusion:
    image_count: 240
    applies_to: [finding1, finding2, finding3, cross_modal_extension]
    reporting_owner:
      finding1_and_finding2: regular_pool_sensitivities
      finding3: finding3_rcnn_alignment
      cross_modal_extension: cross_modal_extension
    role: secondary_nonselecting
  caption_count_matching:
    applies_to: [finding1, finding2]
    role: secondary_nonselecting

cross_modal_extension:
  blocks: [mpnet_human_captions, dinov2, openclip, pecore, siglip2]
  block_identity_map:
    mpnet_human_captions: reference_locked_caption_feature_spec
    dinov2: unresolved_model_checkpoint_revision_layer_pooling_input_preprocess_output_normalization_before_lock
