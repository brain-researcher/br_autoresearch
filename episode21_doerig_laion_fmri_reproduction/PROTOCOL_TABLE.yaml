  primary_fit_rows: regular_subject_unique
  primary_evaluation_rows: regular_shared
  dimensionality_control:
    method: train_fold_pca_common_rank
    target_rank: 256
    fold_rank_rule: minimum_of_256_and_the_smallest_available_training_feature_rank_across_prespecified_blocks
    same_rank_for_all_blocks_within_fold: true
    centering: fit_training_fold_mean_and_apply_unchanged
    block_scaling_or_normalization: unresolved_required_before_lock
    whitening: false
    refit_scope: refit_inside_every_inner_and_outer_fold
    outcome_selected_rank: forbidden
  component_estimator:
    vision_block_combination_and_comparisons: unresolved_required_before_lock
    joint_models: unresolved_required_before_lock
    reduced_models: unresolved_required_before_lock
    commonality_formulas: unresolved_required_before_lock
    negative_component_treatment: unresolved_required_before_lock
    regularization_grid_and_nested_tuning: unresolved_fit_rows_only_before_lock
    evaluation_score_and_roi_aggregation: unresolved_required_before_lock
    fold_aggregation_by_metric: unresolved_required_before_lock
    roi_contrast_inference: unresolved_contrast_valid_null_centered_method_with_synchronized_roi_resampling_full_refit_and_simulated_type_i_calibration_required_before_lock
  endpoint_nulls:
    single_block_roi_rsa: synchronously_permute_each_tested_model_block_image_identity_relative_to_brain_and_recompute_rdm_statistic
    multiple_model_rsa: unresolved_synchronous_block_preserving_full_refit_null_required_before_lock
    fractional_ridge_encoding: permute_evaluation_image_identity_between_fixed_predictions_and_observed_responses_and_recompute_score
    variance_partitioning_components: unresolved_contrast_valid_null_centered_synchronized_full_refit_method_required_before_lock
  directional_hypotheses:
    evc_vision_unique_minus_unweighted_mean_of_ventral_lateral_dorsal: positive
    unweighted_mean_ventral_lateral_dorsal_shared_minus_evc: positive
  multiplicity_family: separate_secondary_family
  can_change_core_verdicts: false

episode_reporting:
  scientific_outcome: ordered_vector_of_finding1_finding2_finding3_verdicts
  scalar_episode_scientific_verdict: none
  operational_statuses: [complete, technical_failure, policy_violation]
