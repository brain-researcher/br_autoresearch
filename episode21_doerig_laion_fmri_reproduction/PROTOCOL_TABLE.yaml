schema_version: ep21.fixed_protocol.v1
episode_id: ep21
policy_id: ep21_doerig_laion_fmri_fixed_transfer_reproduction
recorded_on: "2026-09-28"
protocol_role: pre_neural_scoring_resolution_requirements
initial_condition: protocol_unlocked_and_neural_scoring_forbidden
neural_scoring_precondition: valid_outputs_protocol_lock_yaml_from_pipeline_conformance

freeze_rule:
  required_artifact: outputs/protocol_lock.yaml
  producer: pipeline_conformance
  condition: every_shared_field_and_every_field_for_each_runnable_module_is_resolved_or_the_unavailable_module_is_locked_not_evaluable
  forbidden_inputs_to_resolution:
    - ep04_outputs
    - ep04_candidate_scores
    - ep21_neural_scores
    - all_subject_unique_and_regular_shared_neural_response_values
    - regular_shared_or_subject_unique_neural_summaries_predictions_or_model_brain_scores
    - laion_fmri_371_ood_neural_outcomes_or_derivatives
  post_lock_pre_score_changes: require_explicit_scientist_amendment_and_regenerated_lock
  consequential_change_after_any_neural_score: terminate_ep21_and_open_new_episode

module_resolution:
  allowed_states: [runnable_locked, not_evaluable_locked]
  resolution_time: before_any_ep21_neural_result
  granularity: prespecified_module_or_subclaim
  missing_specific_asset_or_valid_method_action: lock_only_the_affected_module_or_subclaim_not_evaluable
  unresolved_shared_method_or_data_boundary_action: no_neural_scoring
  late_asset_substitution_after_scoring: forbidden

lock_resolution_input_firewall:
  allowed_structural_qc:
    - identifiers_and_roles
    - array_shapes_and_dtypes
    - finite_and_nan_masks_without_values
    - coverage_and_missingness
    - provenance_and_stimulus_universe_labels
  forbidden:
    - neural_response_values
    - neural_summary_statistics
    - predictions
    - model_brain_scores
    - ep04_results_or_runtime_state
    - all_ood_neural_values_and_derivatives

data_roles:
  fitting: regular_subject_unique_4712_per_participant_after_qualification
  fixed_evaluation: regular_shared_1121_previously_exposed
  prohibited: shared_ood_371_raw_images_features_neural_outcomes_and_all_neural_derivatives

fit_evaluation_overlap:
  exact_image_id_overlap_action: qualification_failure
  near_duplicate_policy: unresolved_choose_detector_revision_threshold_action_or_explicit_no_screen_before_lock
  detector_inputs_must_exclude_neural_values: true
  result_dependent_exclusion: forbidden

response_preprocessing:
  filter_to_regular_rows_before_any_response_derived_statistic: true
  session_zscore:
    grouping: participant_by_session_by_voxel
    reference_rows: all_and_only_regular_trials_in_that_session
    ood_rows_in_reference: forbidden
    role: fixed_transductive_response_normalization
    train_only_exception: explicit
    interpretation: evaluation_responses_contribute_to_response_location_and_scale_but_not_feature_or_model_selection
  repetition_aggregation: arithmetic_mean_by_participant_and_image_after_zscore
  noise_ceiling_and_reliability:
    allowed_source_universe: regular_images_only
    mixed_regular_ood_provider_maps: forbidden
    action_if_universe_is_unknown_or_mixed: recompute_from_regular_rows_or_mark_affected_corrected_endpoint_not_evaluable
  voxel_selection:
    anatomical_mask_intersection: unresolved_required_before_lock
    reliability_estimator: unresolved_required_before_lock
    reliability_cutoff_and_comparison_operator: unresolved_required_before_lock
    learned_reliability_threshold_scope: prespecified_fitting_rows_only
    finite_coverage_and_zero_variance_rules: unresolved_required_before_lock
    missing_data_action: unresolved_required_before_lock
    participant_specific_or_common_mask_rule: unresolved_required_before_lock
    paired_model_common_voxel_intersection: unresolved_required_before_lock
    evaluation_or_ood_based_selection: forbidden
    voxel_identities_materialized: post_lock_from_fitting_responses_only
    identities_returned_to_lock_resolver: forbidden
  conformance_simulation:
    must_reproduce: [session_structure, repetition_groups, missingness, regular_only_filtering, transductive_zscore]
    must_calibrate: [permutation_p_values, bootstrap_intervals]

rois:
  primary_high_level: [laion_ventral, laion_lateral, laion_dorsal]
  specificity_control: [retinotopic_evc]
  secondary: [category_selective_rois]
  inferential_reporting: each_roi_separately
  high_level_summary:
    role: secondary
    method: unweighted_mean_of_roi_fisher_z_scores_within_participant
  fsaverage_projection: display_only

features:
  caption_model: sentence-transformers/all-mpnet-base-v2
  caption_model_revision_and_weight_hash: unresolved_required_before_lock
  tokenizer_revision_and_hash: unresolved_required_before_lock
  pooling_truncation_and_special_token_rule: unresolved_required_before_lock
  input_text_normalization: unresolved_required_before_lock
  output_embedding_normalization: unresolved_required_before_lock
  caption_rule: embed_each_caption_then_arithmetic_mean_by_image
  shared_primary_caption_count: 5
  subject_unique_caption_count: 3
  caption_count_sensitivity:
    shared_subsets: all_10_combinations_of_3_of_5_provider_ordered_captions
    reporting: every_subset_and_fixed_unweighted_mean
    selection: forbidden
  word_control_tokenization_weighting_oov_and_empty_rules: unresolved_required_before_lock
  noun_verb_parser_revision_and_hash: unresolved_required_before_lock
  noun_verb_delimiter_order_duplicate_and_empty_rules: unresolved_required_before_lock
  object_inventory_rule: unresolved_required_before_lock
  missingness_rule: complete_case_common_image_universe_within_each_prespecified_comparison
  post_lock_caption_manifest_must_conform_to_locked_spec: true

fractional_ridge_contract:
  fraction_grid: unresolved_required_before_lock
  inner_fold_count_and_assignment: unresolved_image_grouped_required_before_lock
  tuning_loss: unresolved_required_before_lock
  fold_and_target_loss_aggregation: unresolved_required_before_lock
  hyperparameter_scope_shared_or_per_target: unresolved_required_before_lock
  feature_centering_and_scaling: unresolved_train_rows_only_required_before_lock
  target_centering: unresolved_train_rows_only_required_before_lock
  intercept_and_coefficient_convention: unresolved_required_before_lock
  deterministic_tie_rule: unresolved_required_before_lock
  outer_refit: full_prespecified_fit_rows_after_inner_selection

finding1:
  rsa:
    primary_rois: [laion_ventral, laion_lateral, laion_dorsal]
    evc_role: specificity_control
    brain_rdm: correlation_distance
    model_rdm: correlation_distance
    statistic: pearson_correlation
    above_chance_null: whole_image_identity_permutation_recompute_full_rdm_statistic
  encoding:
    fit_rows: regular_subject_unique
    evaluation_rows: regular_shared
    estimator: fractional_ridge
    hyperparameter_tuning: nested_image_grouped_folds_within_fit_rows_only
    voxel_metric: predicted_observed_pearson_r
    roi_summary: unresolved_required_before_lock
    above_chance_null: permute_evaluation_image_identity_between_fixed_predictions_and_observed_responses_then_recompute_voxel_and_roi_statistics
  decoding:
    fit_rows: regular_subject_unique
    evaluation_rows: regular_shared
    estimator: fractional_ridge
    hyperparameter_tuning: nested_image_grouped_folds_within_fit_rows_only
    target: 768_dimensional_mpnet_embedding
    neural_input_voxel_union:
      included_native_space_rois: unresolved_required_before_lock
      deduplication_key: unresolved_required_before_lock
      duplicate_voxel_action: unresolved_required_before_lock
    embedding_correlation_unit: per_image_across_embedding_dimensions
    embedding_correlation_summary: fisher_z_mean_across_evaluation_images_within_participant
    embedding_correlation_null:
      construction: permute_prediction_to_true_embedding_image_identity_and_recompute_fisher_z_mean
      chance_center_function: unresolved_mean_median_or_exact_expectation_required_before_lock
      oriented_effect: observed_fisher_z_mean_minus_locked_null_chance_center
      null_effects: subtract_same_locked_chance_center_from_each_permutation_statistic
      bootstrap_rule: recompute_the_same_chance_centered_effect_within_each_replicate
      consistency_rule: use_same_centered_effect_for_p_value_interval_sign_gate_and_adjudication
      calibration: required_for_embedding_anisotropy_and_estimated_center
    source_style_lookup_dictionary:
      role: qualitative_nearest_caption_only
      immutable_hash_and_entry_ids: unresolved_required_before_lock
      text_and_embedding_preprocessing: unresolved_required_before_lock
      nearest_lookup_metric_and_tie_rule: unresolved_required_before_lock
    adapted_rank_dictionary:
      role: target_containing_laion_candidate_set_required
      immutable_hash_and_entry_ids: unresolved_required_before_lock
      text_and_embedding_preprocessing: unresolved_required_before_lock
      correct_entry_ids_by_evaluation_image: unresolved_required_before_lock
      absent_correct_target_action: unresolved_required_before_lock
    retrieval_metric:
      similarity_or_distance: unresolved_required_before_lock
      rank_direction: unresolved_required_before_lock
      tie_rule: unresolved_required_before_lock
      within_participant_summary: unresolved_required_before_lock
      exact_chance_expectation_under_frozen_dictionary_targets_and_ties: unresolved_required_before_lock
      oriented_effect: unresolved_observed_minus_chance_or_chance_minus_observed_required_before_lock
      null_distribution: apply_same_chance_centering_and_orientation_to_every_permutation
      consistency_rule: use_same_oriented_effect_for_p_value_interval_sign_gate_and_adjudication
      null: unresolved_separate_target_mapping_valid_null_required_before_lock
  primary_subclaim_table: unresolved_required_before_lock

