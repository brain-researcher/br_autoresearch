policy_id: ep21_doerig_laion_fmri_fixed_transfer_reproduction
episode_id: ep21
evidence_mode: fixed_adapted_transfer_reproduction

# This is a local fixed-program contract, not execution or canonical authority.
authority:
  local_episode_only: true
  canonical_scientific_acceptance: false
  canonical_society_reward_or_landscape_actions: false
  neural_execution_authorized_by_this_file: false

# Every neural scorer is downstream of one outcome-independent protocol lock.
protocol_lock:
  design_table: PROTOCOL_TABLE.yaml
  required_artifact: outputs/protocol_lock.yaml
  producer: pipeline_conformance
  initial_state: incomplete_pre_neural_scoring
  required_by_every_scored_analysis: true
  unresolved_shared_item_action: no_neural_scoring
  unresolved_module_item_action: lock_affected_module_or_subclaim_not_evaluable_before_any_neural_result
  unavailable_module_does_not_block_unrelated_locked_modules: true
  resolver_allowed_neural_information: structural_qc_only
  resolver_forbidden_neural_information:
    - subject_unique_or_regular_shared_response_values
    - neural_summary_statistics
    - predictions
    - model_brain_scores
    - all_ood_neural_values_and_derivatives

# The study transfers specified source-paper findings; it is not exact or fresh.
reproduction_identity:
  source_paper:
    doi: 10.1038/s42256-025-01072-0
    title: High-level visual representations in the human brain are aligned with large language models
    original_dataset: natural_scenes_dataset
    original_code_repository: https://github.com/adriendoerig/visuo_llm
  transfer_dataset: laion_fmri
  protocol_class: adapted_cross_dataset_transfer_reproduction
  exact_reproduction: false
  adaptive_search: false
  fresh_independent_confirmation: false

# EP04 and EP21 share evidence but may not exchange live scoring artifacts.
cross_episode_boundary:
  shared_evidence_episode: ep04
  evidence_independence: correlated_not_independent
  ep04_outputs_allowed_as_inputs: false
  ep21_outputs_allowed_for_ep04_selection_or_audit: false
  regular_shared_role: previously_opened_fixed_reproduction_evaluation
  ood_371_role: forbidden_to_ep21_reserved_for_ep04_conditional_audit
  legacy_ep04_scratch_allowed: false

# Roles are fixed before scoring and the OOD payload is never an EP21 input.
dataset_roles:
  qualification:
    source: redacted_structural_metadata_plus_outcome_blind_model_asset_inventory_and_fixtures
    use: identity_join_coverage_dua_risk_and_method_conformance
  fitting:
    source: laion_fmri_4712_regular_subject_unique_images_per_participant
    use: frozen_fractional_ridge_and_train_only_transforms
    scientific_evidence: false
  fixed_evaluation:
    source: laion_fmri_1121_regular_shared_images
    use: findings_1_2_3_and_prespecified_extensions
    freshness: previously_opened_in_ep04_lineage
  robustness_tau:
    source: official_tau_partition_within_regular_shared_pool
    use: fixed_secondary_analysis
  robustness_cluster_k5:
    source: official_cluster_k5_partitions_within_regular_shared_pool
    use: fixed_secondary_analysis
  prohibited_ood:
    source: laion_fmri_371_shared_ood_raw_images_features_responses_and_neural_derivatives
    use: none_except_citation_of_published_category_level_documentation
    payload_available: false

fit_evaluation_overlap:
  exact_image_id_overlap_action: qualification_failure
  near_duplicate_policy: freeze_detector_revision_threshold_action_or_explicit_no_screen_before_scoring
  neural_outcomes_allowed_for_screen: false

# Preprocessing preserves participant-level inference and regular-only statistics.
population_and_sampling:
  participants: all_five_laion_fmri_participants
  biological_observation_unit: participant
  nonindependent_units:
    - images
    - rdm_edges
    - voxels
    - sessions
    - repetitions
    - networks
    - folds
  pooled_group_test: forbidden
  participant_population_generalization: forbidden

common_preprocessing:
  beta_representation: qualified_glmsingle_single_trial_beta
  beta_space: participant_native
  regular_rows_selected_before_any_response_derived_statistic: true
  within_session_zscore:
    grouping: participant_by_session_by_voxel
    reference_rows: all_and_only_regular_trials_in_session
    role: fixed_transductive_response_normalization
    train_only_exception: explicit
    interpretation: evaluation_responses_contribute_to_response_location_and_scale_only
  ood_rows_in_normalization_ceiling_or_reliability: forbidden
  mixed_or_unknown_ceiling_universe_action: recompute_regular_only_or_mark_endpoint_not_evaluable
  repetition_aggregation: mean_by_image_after_session_zscore
  display_projection_only: freesurfer_fsaverage
  display_projection_used_for_inference: false
  caption_model: sentence-transformers/all-mpnet-base-v2
  caption_embedding_rule: embed_each_human_caption_then_mean_by_image
  shared_caption_count: 5
  subject_unique_caption_count: 3
  learned_feature_and_model_transform_scope: prespecified_training_rows_only
  conformance_simulation_must_reproduce:
    - session_structure
    - repetition_groups
    - missingness
    - regular_only_filtering
    - transductive_zscore

# Solver and ROI choices must be complete before their endpoints can run.
fractional_ridge_contract:
  fraction_grid: freeze_before_scoring
  image_grouped_inner_fold_count_and_assignment: freeze_before_scoring
  tuning_loss_and_fold_target_aggregation: freeze_before_scoring
  hyperparameter_scope_shared_or_per_target: freeze_before_scoring
  feature_and_target_centering_scaling: fit_rows_only_and_freeze_before_scoring
  intercept_and_coefficient_convention: freeze_before_scoring
  deterministic_tie_rule: freeze_before_scoring
  outer_refit: full_prespecified_fit_rows_after_inner_selection

roi_contract:
  primary_family:
    - laion_ventral
    - laion_lateral
    - laion_dorsal
  specificity_control:
    - retinotopic_evc
  secondary_family:
    - category_selective_rois_reported_separately
  outcome_selected_masks: forbidden
  nsd_stream_equivalence_claim: forbidden
  voxel_eligibility_lock:
    anatomical_intersection_reliability_estimator_cutoff_coverage_zero_variance_missingness: freeze_before_scoring
    participant_specific_or_common_and_paired_common_voxel_rules: freeze_before_scoring
    voxel_identities: materialize_post_lock_from_fitting_responses_only_and_never_return_to_resolver

# These are the three primary source-paper findings evaluated by EP21.
fixed_findings:
  finding1:
    label: caption_geometry_encoding_and_decoding
    primary_components:
      roi_rsa:
        model_rdm: correlation_distance
        brain_rdm: correlation_distance
        statistic: pearson_correlation
      encoding:
        estimator: fractional_ridge
        fit_rows: regular_subject_unique
        evaluation_rows: regular_shared
        voxel_metric: predicted_observed_pearson_r
        roi_aggregation: freeze_before_scoring
        above_chance_null: permute_evaluation_image_identity_between_fixed_predictions_and_observed_responses
      decoding:
        estimator: fractional_ridge
        fit_rows: regular_subject_unique
        evaluation_rows: regular_shared
        hyperparameter_tuning: nested_image_grouped_folds_within_fit_rows_only
        target: 768_dimensional_mpnet_embedding
        neural_source: combined_prespecified_visual_sectors
        metrics:
          - embedding_correlation
          - qualitative_source_dictionary_nearest_caption_lookup
          - adapted_target_containing_caption_retrieval_rank
        embedding_correlation_unit: per_image_across_768_dimensions
        embedding_correlation_summary: fisher_z_mean_across_evaluation_images
        voxel_union: freeze_included_native_space_rois_and_deduplicate_voxel_ids_before_scoring
        source_style_lookup_dictionary: freeze_separate_id_hash_entries_preprocessing_metric_and_ties_before_scoring
        adapted_rank_dictionary: freeze_separate_id_hash_entries_and_embedding_preprocessing_before_scoring
        correct_target_mapping: freeze_eligible_dictionary_entries_for_every_evaluation_image
        absent_correct_target_action: freeze_before_scoring_or_mark_retrieval_not_evaluable
        retrieval_similarity_rank_ties_summary_and_exact_chance: freeze_before_scoring
        retrieval_oriented_effect: freeze_null_centered_effect_and_use_for_p_value_interval_sign_and_adjudication
        embedding_correlation_null: permute_prediction_to_true_embedding_image_identity_and_recompute_summary
        embedding_correlation_oriented_effect: freeze_null_chance_center_then_use_same_centered_effect_for_p_value_interval_sign_and_adjudication
        retrieval_null: freeze_a_separate_dictionary_and_target_mapping_valid_null_before_scoring
        retrieval_role: adapted_secondary_subclaim_not_an_original_rank_endpoint
    secondary_only:
      - searchlight_maps
      - regional_selectivity_visualizations
      - novel_sentence_maps

  finding2:
    label: contextual_integration_controls
    primary_feature_arms:
      - full_contextualized_captions
      - separately_embedded_averaged_words
      - concatenated_nouns
      - concatenated_verbs
      - detected_object_inventory
    rsa:
      brain_rdm: correlation_distance
      model_rdm: correlation_distance
      statistic: pearson_correlation
      noise_ceiling_estimator_formula_and_edge_actions: authenticate_participant_roi_rdm_ceiling_before_scoring
      provider_voxelwise_ceiling_as_substitute: forbidden
      recomputation_inside_permutations_and_bootstraps: freeze_before_scoring
      bootstrap_alignment: synchronize_image_multiplicities_across_all_five_participants_and_recompute_other_participant_mean_rdm_and_ceiling
      common_image_missingness_rule: freeze_before_scoring
      above_chance_null: permute_model_image_identity_relative_to_brain_and_recompute_complete_corrected_statistic
    adapted_secondary_shuffle_control:
      role: cannot_change_primary_finding2_verdict
      number_derangement_self_match_universe_seeds_aggregation: freeze_before_scoring
      multiplicity_family: separate_secondary_family
    comparison_note:
      object_inventory: adapted_reproduction_of_coco_category_control
    expected_direction_and_exception_table: freeze_from_source_paper_before_scoring

  finding3:
    label: llm_trained_rcnn_alignment
    model_source: released_author_weights
    preprocessing: authenticated_original
    layer: final
    time_step: final
    instance_count: 10
    brain_rdm: correlation_distance
    model_rdm: correlation_distance
    statistic: pearson_correlation
    noise_ceiling_correction_and_resampling: authenticate_and_freeze_before_scoring
    above_chance_null: synchronously_permute_instance_model_image_identity_relative_to_brain_and_recompute_aggregation
    instance_aggregation: unresolved_authenticate_implemented_order_and_scale_from_source_code_before_scoring
    working_plan: per_instance_model_brain_rsa_then_mean_ten_correlations
    outcome_selected_resolution: forbidden
    required_comparators:
      - caption_mpnet
      - category_trained_rcnn
      - authenticated_original_alternative_model_panel
    expected_direction_and_exception_table: freeze_from_source_paper_before_scoring
    unavailable_asset_action: mark_affected_subclaim_not_evaluable

feature_controls:
  caption_model_revision_weight_hash_tokenizer_pooling_truncation: pin_before_scoring
  caption_text_and_output_normalization: pin_before_scoring
  word_tokenization_weighting_oov_and_empty_rules: pin_before_scoring
  noun_verb_parser: pin_before_scoring
  noun_verb_delimiter_order_duplicate_and_empty_rules: pin_before_scoring
  object_inventory_rule: pin_before_scoring
  missingness_rule: common_eligible_image_universe_per_comparison
  feature_identity_required:
    - image_ids
    - valid_mask
    - dtype
    - normalization
    - model_and_checkpoint
    - layer_and_time_step_when_applicable
    - preprocessing
  result_dependent_feature_construction: forbidden
  post_lock_caption_manifest_must_conform_to_locked_spec: true

# Images are resampling units; verdicts are assigned within participant.
inference:
  scope: within_participant
  core_permutations: 10000
  fewer_than_10000_action: exact_enumeration_only_when_complete_space_is_smaller
  above_chance_null: permute_whole_image_identity_preserving_repetitions_and_folds
  permutation_sampling:
    exact: full_admissible_group_with_identity_once
    monte_carlo: with_replacement_from_nonidentity_admissible_permutations
    duplicate_draws: allowed_and_counted
    rng_and_seed_list: freeze_before_scoring
  p_values:
    sidedness: two_sided
    endpoint_effect_requirement: freeze_null_center_and_orientation_for_every_endpoint_so_zero_is_null_and_positive_is_prespecified_direction
    monte_carlo_formula: one_plus_count_abs_centered_null_at_least_abs_centered_observed_over_one_plus_number_permutations
    complete_exact_enumeration_formula: count_abs_centered_null_at_least_abs_centered_observed_over_total_enumerated_space
    bootstrap_must_recompute_same_centered_oriented_effect: true
    endpoint_specific_calibration_required: true
    corrected_significance_requires_predicted_observed_sign: true
  paired_model_inference:
    requirement: freeze_a_contrast_valid_method_with_simulated_type_i_calibration_before_scoring
    forbidden: per_image_model_label_swaps_that_create_hybrid_representations
    unresolved_action: lock_affected_contrast_subclaim_not_evaluable_for_replication
    descriptive_interval_when_unresolved: allowed_but_cannot_change_not_evaluable_status
    descriptive_neural_estimation_after_not_evaluable_lock: allowed
  rdm_edges_treated_as_independent: false
  interval:
    level: 0.95
    method: image_cluster_bootstrap_recompute_complete_statistic
    resamples: 2000
    rsa_scope: regular_shared_image_identities_rebuild_both_rdms
    predictive_scope: independently_resample_subject_unique_fit_and_regular_shared_evaluation_images_and_refit
    carry_all_repetitions_with_sampled_image: true
    preprocessing_replay: freeze_exact_session_zscore_and_missingness_behavior_before_scoring
    interval_type_quantile_convention_failed_degenerate_action_minimum_valid_replicates: freeze_before_scoring
    rng_and_seed_list: freeze_before_scoring
  multiplicity:
    method: benjamini_hochberg
    alpha: 0.05
    scope: separately_within_participant_and_prespecified_finding_family
    family_membership_frozen_before_scoring: true
  reporting:
    - every_participant_effect
    - every_participant_interval
    - raw_and_corrected_probabilities
    - null_distributions
    - exclusions_and_missingness

adjudication:
  unit: prespecified_directional_subclaim
  valid_participants_required: 5
  replicated:
    direction_participants_min: 4
    corrected_significance_participants_min: 3
    significance_direction_must_match: true
  partial:
    condition: exactly_3_predicted_directions_or_at_least_4_directions_with_fewer_than_3_corrected_significant
  not_replicated:
    condition: predicted_direction_count_at_most_2
  not_evaluable:
    condition: fewer_than_5_valid_participants_or_invalid_join_or_missing_required_endpoint
  zero_effect_counts_as_predicted_direction: false
  finding_rule: use_primary_subclaim_table_frozen_in_protocol_lock
  secondary_analysis_can_rescue_primary: false
  failure_implies_absence_without_equivalence_margin: false

# Secondary checks are prespecified, nonselecting, and cannot rescue a verdict.
robustness:
  shared_training_exception:
    scope: nested_estimator_tuning_inside_prespecified_tau_or_cluster_k5_training_rows_only
    cannot_change: [global_method, core_fit, primary_verdict, another_fold]
  method1_tau:
    pool: shared_regular
    planning_train_count: 897
    planning_test_count: 224
    encoding_and_decoding: train_on_tau_train_evaluate_unchanged_on_tau_test
    rsa: report_train_and_test_separately
    count_mismatch_action: resolve_outcome_blind_against_provider_manifest
  method2_cluster_k5:
    pool: shared_regular
    folds: 5
    predictive_procedure: fit_on_four_clusters_evaluate_unchanged_on_held_cluster
    parameter_free_rsa: compute_on_each_held_cluster_only
    learned_transforms: fit_on_four_training_clusters_only
    correlation_aggregation: arithmetic_mean_of_fold_fisher_z_values_with_inverse_transform_for_display
    inference_role: descriptive_secondary_nonselecting
    report: every_fold_and_fixed_unweighted_fisher_z_mean_for_correlations
    priority_findings: [finding1, finding2]
  method3_ood:
    executable: false
    reason: neural_responses_reserved_for_ep04_conditional_audit
    prohibited_categories:
      - semantic_relations
      - unusual_images
      - cropped_images
      - shape_controls
      - gabor_controls
  nsd_origin_sensitivity:
    excluded_image_count: 240
    applies_to: [finding1, finding2, finding3, cross_modal_extension]
    reporting_owner:
      finding1_and_finding2: regular_pool_sensitivities
      finding3: finding3_rcnn_alignment
      cross_modal_extension: cross_modal_extension
    role: secondary_nonselecting_sensitivity
  caption_count_sensitivity:
    applies_to: [finding1, finding2]
    shared_caption_subsets: all_10_combinations_of_3_of_5_provider_ordered_captions
    report: every_subset_and_fixed_unweighted_mean
    role: secondary_nonselecting_sensitivity

cross_modal_extension:
  role: prespecified_secondary_nonrescuing
  model_blocks:
    - mpnet_human_captions
    - dinov2
    - openclip
    - pecore
    - siglip2
  block_identity_map:
    mpnet_human_captions: use_locked_caption_feature_spec
    dinov2: freeze_model_checkpoint_revision_layer_pooling_input_preprocess_output_normalization
    openclip: freeze_model_checkpoint_revision_layer_pooling_input_preprocess_output_normalization
    pecore: freeze_model_checkpoint_revision_layer_pooling_input_preprocess_output_normalization
    siglip2: freeze_model_checkpoint_revision_layer_pooling_input_preprocess_output_normalization
  pre_score_feature_manifest_gate: require_handoff_identity_hash_shape_and_preprocessing_match_or_mark_extension_not_evaluable
  dimensionality_control:
    method: train_fold_pca_common_rank
    target_rank: 256
    fold_rank_rule: minimum_of_256_and_smallest_available_training_feature_rank
    same_rank_for_every_block_within_fold: true
    centering: fit_training_fold_mean_apply_unchanged
    block_scaling_or_normalization: freeze_before_scoring
    whitening: false
    refit_inside_every_inner_and_outer_fold: true
    outcome_selected_rank: forbidden
  fit_rows: regular_subject_unique
  evaluation_rows: regular_shared
  analyses:
    - single_block_roi_rsa
    - multiple_model_rsa
    - fractional_ridge_encoding
    - regularized_variance_partitioning
  components:
    - text_unique
    - vision_unique
    - shared
  component_estimator_lock:
    vision_block_combination_and_comparisons: freeze_before_scoring
    joint_and_reduced_models: freeze_before_scoring
    commonality_formulas: freeze_before_scoring
    negative_component_treatment: freeze_before_scoring
    regularization_and_nested_tuning: fit_rows_only_and_freeze_before_scoring
    evaluation_score_and_roi_aggregation: freeze_before_scoring
    fold_aggregation_by_metric: freeze_before_scoring
    roi_contrast_inference: freeze_contrast_valid_null_centered_synchronized_roi_resampling_full_refit_method_with_type_i_calibration
  endpoint_nulls:
    single_block_roi_rsa: permute_model_image_identity_relative_to_brain_and_recompute_rdm_statistic
    multiple_model_rsa: freeze_synchronous_block_preserving_full_refit_null
    fractional_ridge_encoding: permute_evaluation_image_identity_between_fixed_predictions_and_observed_responses
    variance_partitioning_components: freeze_contrast_valid_null_centered_synchronized_full_refit_method
  separate_multiplicity_family: true
  directional_hypotheses:
    evc_vision_unique_minus_mean_high_level: positive
    mean_high_level_shared_minus_evc: positive

# These prohibitions preserve the fixed design and the EP04 OOD boundary.
forbidden:
  - adaptive_candidate_search
  - result_dependent_operator_or_hyperparameter_expansion
  - outcome_based_caption_editing
  - outcome_selected_rois_or_voxels
  - silent_comparator_removal_or_substitution
  - use_of_regular_shared_outcomes_for_method_selection_outside_prespecified_tau_or_cluster_k5_training_rows
  - any_access_to_371_ood_raw_images_features_neural_outcomes_predictions_scores_or_summaries
  - use_of_ood_contaminated_or_unknown_universe_normalization_noise_ceiling_or_reliability_maps
  - import_of_live_ep04_outputs_or_runtime_state
  - export_of_ep21_scores_to_ep04_selection_or_audit
  - treating_rdm_edges_voxels_images_sessions_or_folds_as_participants
  - post_result_threshold_multiplicity_or_verdict_changes

# No adaptive trial, promotion, or result-dependent continuation exists here.
execution:
  mode: fixed_program
  adaptive_trials_required: false
  minimum_trial_count: 0
  maximum_trial_count: 0
  patience_rule: none
  exact_rerun_allowed_only_after_demonstrated_technical_failure: true
  consequential_change_before_first_neural_score: scientist_amendment_and_regenerated_lock
  consequential_change_after_any_neural_score: terminate_ep21_and_require_new_episode
  durable_outputs: outputs
  transient_root: $SCRATCH/br_autoresearch/episode21_doerig_laion_fmri_reproduction

# Completion reports three finding verdicts separately from operational status.
completion:
  full_report:
    requires:
      - source_qualification_complete
      - pipeline_conformance_complete
      - protocol_lock_complete
      - finding1_adjudicated_or_explicitly_not_evaluable
      - finding2_adjudicated_or_explicitly_not_evaluable
      - finding3_adjudicated_or_explicitly_not_evaluable
      - method1_tau_reported_or_explicitly_not_evaluable
      - method2_cluster_k5_reported_or_explicitly_not_evaluable
      - regular_pool_sensitivities_reported_or_explicitly_not_evaluable
      - cross_modal_extension_reported_or_explicitly_not_evaluable
      - every_deviation_and_missing_asset_reported
      - no_ood_access
  scientific_outcome:
    form: ordered_vector
    order: [finding1, finding2, finding3]
    scalar_episode_verdict: none
  operational_terminal_statuses:
    - complete
    - technical_failure
    - policy_violation

# The strongest permitted claim is directional transfer in these participants.
claim_limits:
  - no_exact_protocol_or_effect_size_reproduction_claim
  - no_fresh_independent_confirmation_claim
  - no_participant_population_generalization
  - no_ood_robustness_claim
  - no_identical_cortical_coordinates_or_computation_claim
  - no_universal_modality_general_representation_claim
  - no_platonic_representation_hypothesis_claim
  - no_scale_dependent_convergence_claim

terminal_reporting:
  canonical_status_mapping: none
  reason: fixed_reproduction_has_no_candidate_incumbent_promotion_or_candidate_lock
  preserve_finding_verdict_vector_in_final_report: true
