version: "0.0.14"
id: episode21_doerig_laion_fmri_reproduction
name: EP21 — Fixed Doerig et al. LAION-fMRI transfer reproduction
description: >-
  Fixed, non-adaptive transfer reproduction of three prespecified Doerig et al.
  findings on regular LAION-fMRI images. The program excludes the EP04-reserved
  371-image OOD payload. Runtime state, attempts, jobs, and blockers are recorded
  only in outputs/experiment_log.md.
tags: [brain_researcher, autoresearch, laion_fmri, reproduction, experiment_program]

inputs:
  - id: goal
    type: data
    source: GOAL.md
    description: Scientific question, evidence roles, findings, and claim limits.
  - id: datasets
    type: data
    source: DATASETS.md
    description: LAION-fMRI source, image roles, splits, and EP04 boundary.
  - id: search_policy
    type: data
    source: SEARCH_POLICY.yaml
    description: Fixed execution, inference, adjudication, and stopping policy.
  - id: protocol_table
    type: data
    source: PROTOCOL_TABLE.yaml
    description: Outcome-independent fields that must be resolved before scoring.
  - id: input_contract
    type: data
    source: inputs/README.md
    description: Stable input interfaces and role-specific access restrictions.
  - id: laion_regular_structural_manifest
    type: data
    source: inputs/laion_regular_structural_manifest.json
    description: Redacted regular-image structure for qualification and lock resolution.
  - id: laion_regular_feature_handoff
    type: data
    source: inputs/laion_regular_feature_handoff
    description: Non-neural regular-image stimuli, captions, and feature payloads.
  - id: laion_regular_scoring_handoff
    type: data
    source: inputs/laion_regular_scoring_handoff
    description: Post-lock, role-filtered regular-only neural scoring payload.
  - id: upstream_model_asset_inventory
    type: data
    source: inputs/upstream_model_asset_inventory.json
    description: Outcome-blind code, model, checkpoint, tokenizer, parser, and weight inventory.

outputs:
  - id: final_report
    from: final_reproduction_report.final_report

analyses:
  source_qualification:
    name: Qualify the regular-image source and model assets
    description: >-
      Verify release identity, access eligibility, joins, role membership,
      structural coverage, prior exposure, and upstream asset availability
      without reading neural values or any OOD payload.
    inputs:
      - {id: goal, from: ../goal}
      - {id: datasets, from: ../datasets}
      - {id: protocol_table, from: ../protocol_table}
      - {id: input_contract, from: ../input_contract}
      - {id: laion_regular_structural_manifest, from: ../laion_regular_structural_manifest}
      - {id: upstream_model_asset_inventory, from: ../upstream_model_asset_inventory}
    outputs:
      - id: qualification_report
        type: report
        format: json
        description: Structural QC, access decisions, exposure status, and module availability.
        inputs:
          - goal
          - datasets
          - protocol_table
          - input_contract
          - laion_regular_structural_manifest
          - upstream_model_asset_inventory

  pipeline_conformance:
    name: Verify and lock the reproduction pipeline
    description: >-
      Resolve every shared and runnable-module protocol field, test the fixed
      estimators and inference on synthetic or permuted fixtures, and lock any
      unavailable module or subclaim as not evaluable before neural scoring.
    inputs:
      - {id: goal, from: ../goal}
      - {id: search_policy, from: ../search_policy}
      - {id: protocol_table, from: ../protocol_table}
      - id: qualification_report
        from: ../source_qualification.qualification_report
    outputs:
      - id: conformance_report
        type: report
        format: json
        description: Synthetic conformance and calibration results.
        inputs: [goal, search_policy, protocol_table, qualification_report]
      - id: protocol_lock
        type: report
        format: yaml
        description: Resolved protocol plus locked not_evaluable modules or subclaims.
        inputs: [goal, search_policy, protocol_table, qualification_report]

  caption_control_feature_preparation:
    name: Prepare caption and control features
    description: >-
      Build the locked MPNet caption and control representations and bind the
      separate qualitative-lookup and adapted-rank decoder dictionaries.
    inputs:
      - {id: laion_regular_feature_handoff, from: ../laion_regular_feature_handoff}
      - id: protocol_lock
        from: ../pipeline_conformance.protocol_lock
    outputs:
      - id: caption_feature_manifest
        type: report
        format: json
        description: Image-aligned caption/control features and decoder dictionary identities.
        inputs: [laion_regular_feature_handoff, protocol_lock]

  rcnn_feature_preparation:
    name: Prepare released RCNN and comparator features
    description: >-
      Apply the locked author-code, weight, preprocessing, layer, time-step,
      instance, and comparator identities without substituting unavailable assets.
    inputs:
      - {id: laion_regular_feature_handoff, from: ../laion_regular_feature_handoff}
      - {id: upstream_model_asset_inventory, from: ../upstream_model_asset_inventory}
      - id: protocol_lock
        from: ../pipeline_conformance.protocol_lock
    outputs:
      - id: rcnn_feature_manifest
        type: report
        format: json
        description: Authenticated RCNN/comparator features or explicit not_evaluable entries.
        inputs: [laion_regular_feature_handoff, upstream_model_asset_inventory, protocol_lock]

  cross_modal_feature_preparation:
    name: Bind the cross-modal feature blocks
    description: >-
      Verify the MPNet, DINOv2, OpenCLIP, PEcore, and SigLIP2 identities and
      preprocessing against the protocol lock before cross-modal scoring.
    inputs:
      - {id: laion_regular_feature_handoff, from: ../laion_regular_feature_handoff}
      - id: protocol_lock
        from: ../pipeline_conformance.protocol_lock
      - id: caption_feature_manifest
        from: ../caption_control_feature_preparation.caption_feature_manifest
    outputs:
      - id: cross_modal_feature_manifest
        type: report
        format: json
        description: Conformant feature-block identities or an extension not_evaluable record.
        inputs: [laion_regular_feature_handoff, protocol_lock, caption_feature_manifest]

  finding1_alignment_encoding_decoding:
    name: Test caption geometry, encoding, and decoding
    description: >-
      Run the locked participant-level ROI RSA, subject-unique-to-shared
      fractional-ridge encoding, and caption-embedding decoding endpoints.
    inputs:
      - {id: laion_regular_scoring_handoff, from: ../laion_regular_scoring_handoff}
      - id: protocol_lock
        from: ../pipeline_conformance.protocol_lock
      - id: caption_feature_manifest
        from: ../caption_control_feature_preparation.caption_feature_manifest
    outputs:
      - id: finding1_report
        type: report
        format: json
        description: Participant-level effects, inference, subclaims, and Finding 1 verdict.
        inputs: [laion_regular_scoring_handoff, protocol_lock, caption_feature_manifest]

  finding2_context_controls:
    name: Test contextual caption integration against controls
    description: >-
      Compare full-caption RSA with the locked word, noun, verb, object-inventory,
      and adapted shuffled-caption controls under the prespecified exception table.
    inputs:
      - {id: laion_regular_scoring_handoff, from: ../laion_regular_scoring_handoff}
      - id: protocol_lock
        from: ../pipeline_conformance.protocol_lock
      - id: caption_feature_manifest
        from: ../caption_control_feature_preparation.caption_feature_manifest
    outputs:
      - id: finding2_report
        type: report
        format: json
        description: Participant-level contrasts, inference, subclaims, and Finding 2 verdict.
        inputs: [laion_regular_scoring_handoff, protocol_lock, caption_feature_manifest]

  finding3_rcnn_alignment:
    name: Test LLM-trained recurrent visual-model alignment
    description: >-
      Compare the locked ten-instance LLM-trained RCNN with caption MPNet,
      category-trained RCNN, and authenticated source comparators, including the
      prespecified NSD-origin exclusion sensitivity for this branch.
    inputs:
      - {id: laion_regular_scoring_handoff, from: ../laion_regular_scoring_handoff}
      - id: protocol_lock
        from: ../pipeline_conformance.protocol_lock
      - id: caption_feature_manifest
        from: ../caption_control_feature_preparation.caption_feature_manifest
      - id: rcnn_feature_manifest
        from: ../rcnn_feature_preparation.rcnn_feature_manifest
    outputs:
      - id: finding3_report
        type: report
        format: json
        description: Participant-level model contrasts, sensitivity, and Finding 3 verdict.
        inputs:
          - laion_regular_scoring_handoff
          - protocol_lock
          - caption_feature_manifest
          - rcnn_feature_manifest

  method1_tau_robustness:
    name: Run the fixed tau-split robustness analysis
    description: >-
      Evaluate Findings 1 and 2 under the official regular-shared tau split as
      a fixed secondary analysis that cannot change a core verdict.
    inputs:
      - {id: laion_regular_scoring_handoff, from: ../laion_regular_scoring_handoff}
      - id: protocol_lock
        from: ../pipeline_conformance.protocol_lock
      - id: caption_feature_manifest
        from: ../caption_control_feature_preparation.caption_feature_manifest
    outputs:
      - id: tau_report
        type: report
        format: json
        description: Fixed tau-partition predictive and RSA robustness results.
        inputs: [laion_regular_scoring_handoff, protocol_lock, caption_feature_manifest]

  method2_cluster_k5_robustness:
    name: Run the fixed cluster-k5 robustness analysis
    description: >-
      Rotate through the five official regular-image clusters for Findings 1
      and 2 and report every held-cluster result and the locked fold summary.
    inputs:
      - {id: laion_regular_scoring_handoff, from: ../laion_regular_scoring_handoff}
      - id: protocol_lock
        from: ../pipeline_conformance.protocol_lock
      - id: caption_feature_manifest
        from: ../caption_control_feature_preparation.caption_feature_manifest
    outputs:
      - id: cluster_k5_report
        type: report
        format: json
        description: Held-cluster results and fixed unweighted correlation summary.
        inputs: [laion_regular_scoring_handoff, protocol_lock, caption_feature_manifest]

  cross_modal_extension:
    name: Compare text, vision, and shared components
    description: >-
      Run the locked secondary cross-modal RSA, encoding, and variance-partitioning
      family, including its prespecified NSD-origin exclusion sensitivity.
    inputs:
      - {id: laion_regular_scoring_handoff, from: ../laion_regular_scoring_handoff}
      - id: protocol_lock
        from: ../pipeline_conformance.protocol_lock
      - id: cross_modal_feature_manifest
        from: ../cross_modal_feature_preparation.cross_modal_feature_manifest
    outputs:
      - id: cross_modal_report
        type: report
        format: json
        description: Cross-modal effects, regional contrasts, sensitivity, and inference.
        inputs: [laion_regular_scoring_handoff, protocol_lock, cross_modal_feature_manifest]

  regular_pool_sensitivities:
    name: Run caption-count and source-origin sensitivities
    description: >-
      Repeat Findings 1 and 2 over all ten three-of-five caption subsets and
      after excluding the prespecified 240 NSD-origin shared images, without selection.
    inputs:
      - {id: laion_regular_scoring_handoff, from: ../laion_regular_scoring_handoff}
      - id: protocol_lock
        from: ../pipeline_conformance.protocol_lock
      - id: caption_feature_manifest
        from: ../caption_control_feature_preparation.caption_feature_manifest
    outputs:
      - id: sensitivity_report
        type: report
        format: json
        description: Nonselecting Finding 1 and 2 regular-pool sensitivity results.
        inputs: [laion_regular_scoring_handoff, protocol_lock, caption_feature_manifest]

  final_reproduction_report:
    name: Integrate the fixed transfer-reproduction verdicts
    description: >-
      Report qualification, deviations, participant-level results, the ordered
      three-finding verdict vector, robustness, extensions, failures, and claim limits.
    inputs:
      - {id: goal, from: ../goal}
      - {id: datasets, from: ../datasets}
      - id: qualification_report
        from: ../source_qualification.qualification_report
      - id: conformance_report
        from: ../pipeline_conformance.conformance_report
      - id: protocol_lock
        from: ../pipeline_conformance.protocol_lock
      - id: finding1_report
        from: ../finding1_alignment_encoding_decoding.finding1_report
      - id: finding2_report
        from: ../finding2_context_controls.finding2_report
      - id: finding3_report
        from: ../finding3_rcnn_alignment.finding3_report
      - id: tau_report
        from: ../method1_tau_robustness.tau_report
      - id: cluster_k5_report
        from: ../method2_cluster_k5_robustness.cluster_k5_report
      - id: cross_modal_report
        from: ../cross_modal_extension.cross_modal_report
      - id: sensitivity_report
        from: ../regular_pool_sensitivities.sensitivity_report
    outputs:
      - id: final_report
        type: report
        format: md
        description: Bounded transfer verdicts with no scalar episode-wide label.
        inputs:
          - goal
          - datasets
          - qualification_report
          - conformance_report
          - protocol_lock
          - finding1_report
          - finding2_report
          - finding3_report
          - tau_report
          - cluster_k5_report
          - cross_modal_report
          - sensitivity_report

findings: {}
