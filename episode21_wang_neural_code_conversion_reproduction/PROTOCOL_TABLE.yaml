    - source_qualification
    - pipeline_conformance
    - pair_and_split_conformance
    - source_pipeline_asset_conformance
  empirical_modules:
    - laion_target_decoders
    - laion_within_source_decoders
    - laion_content_converters
    - laion_brain_loss_converters
    - finding_a_feature_decoding
    - finding_b_reconstruction
    - finding_c_identification
    - inter_site_decoders_and_converters
    - finding_d_inter_site_reconstruction
    - finding_e_inter_site_identification
