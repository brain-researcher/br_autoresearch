  laion_candidate_pool: 371_shared_ood_images
  raw_image_access: forbidden
  feature_extraction: forbidden
  neural_access: forbidden
  prediction_reconstruction_scoring_or_summary: forbidden
  published_category_level_description: allowed
  regular_result_extrapolation_to_ood: forbidden
  future_change_requires: explicit_scientist_decision_new_role_isolated_handoff_and_pre_access_contract_replacement

reporting_contract:
  findings_a_to_e_kept_separate: true
  finding_a_c_e_outputs: quantitative_result_or_not_evaluable
  finding_b_d_outputs: qualitative_complete_record_or_not_evaluable
  single_episode_wide_pass_fail: forbidden
  required_tables:
    - exact_twenty_directed_laion_pair_table
    - training_and_test_role_table
    - per_dyad_scores
    - five_source_participant_aggregates
    - target_incoming_sensitivity
    - source_style_dyadic_bootstrap_secondary
    - layerwise_and_methodwise_results
    - comparability_margin_identity_or_not_evaluable_reason
    - all_deviations_failures_and_missingness
    - inter_site_direction_strata_if_qualified
  required_disclosures:
    - adapted_not_exact_reproduction
    - regular_evidence_is_retrospective_and_correlated_with_ep04
    - brain_loss_uses_shared_training_stimuli
    - all_371_ood_payloads_were_blocked
    - inter_site_site_scanner_stimulus_task_and_preprocessing_confounding

forbidden_actions:
  - neural_scoring_before_valid_lock_and_later_execution_instruction
  - inspect_or_derive_any_ood_payload
  - use_ep04_outputs_or_legacy_scratch
  - allow_shared_stimuli_between_primary_source_converter_and_target_decoder_training
  - use_target_neural_responses_in_primary_content_loss_training
  - fit_or_tune_brain_loss_on_tau_test
  - score_brain_loss_on_its_tau_train_rows_as_held_out_evidence
  - select_examples_layers_rois_pairs_participants_seeds_or_checkpoints_from_results
  - replace_source_models_or_reconstruction_assets_after_scores
  - silently_drop_failed_or_unfavorable_results
  - treat_twenty_dyads_or_lower_level_units_as_independent_participants
  - claim_comparability_without_a_locked_margin
  - assign_quantitative_success_to_findings_b_or_d
  - pool_inter_site_directions_as_if_they_were_one_site_independent_sample
  - use_ep21_results_for_ep04_selection_confirmation_or_audit

claim_limits:
  strongest_positive_claim: adapted_retrospective_transfer_of_prespecified_wang_patterns_to_these_five_laion_participants_and_if_qualified_the_declared_laion_nsd_things_directions
  excluded_claims:
    - exact_quantitative_reproduction
    - fresh_or_independent_confirmation
    - population_generalization
    - comparability_without_prospective_margin
    - artificial_image_or_ood_generalization
    - universal_neural_code_or_cortical_identity
    - decoder_independent_target_brain_manifold_identity
    - general_scanner_or_site_invariance
    - brain_to_brain_communication
    - ep04_confirmation_or_audit

current_status:
  stage: contract_authoring
  empirical_payload_provisioned: false
  source_assets_qualified: false
  protocol_lock_exists: false
  neural_access_or_execution_authorized: false
