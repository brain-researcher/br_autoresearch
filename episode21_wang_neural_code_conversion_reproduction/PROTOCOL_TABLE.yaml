  producer: pipeline_conformance
  lock_condition: every_shared_field_and_every_field_for_each_runnable_module_is_resolved_or_the_affected_module_is_locked_not_evaluable
  permitted_module_states: [runnable_locked, not_evaluable_locked]
  unresolved_shared_field_action: no_neural_scoring
  unresolved_module_field_action: affected_module_or_subclaim_not_evaluable
  missing_asset_substitution: forbidden
  post_lock_pre_score_change: explicit_scientist_amendment_and_regenerated_lock_required
  consequential_change_after_any_score: terminate_ep21_and_require_new_episode

lock_resolution_firewall:
  allowed_inputs:
    - release_participant_session_trial_repetition_and_image_identifiers
    - declared_data_roles_and_split_membership
    - counts_shapes_dtypes_and_finite_nan_masks_without_values
    - coverage_missingness_and_native_mask_identifiers_without_values
    - exact_and_near_duplicate_results_from_non_neural_stimulus_metadata
    - licenses_data_use_terms_risk_status_and_provenance
    - source_code_and_model_asset_identities
    - synthetic_or_permuted_fixture_results
  forbidden_inputs:
    - subject_unique_neural_response_values
    - regular_shared_neural_response_values
    - neural_summary_statistics
    - converted_responses_decoded_features_or_predictions
    - reconstruction_outputs_or_identification_scores
    - any_ep04_output_candidate_ranking_or_runtime_state
    - every_371_ood_raw_image_feature_neural_value_or_derivative
  lock_facing_reports_must_not_contain_neural_values: true

module_resolution:
