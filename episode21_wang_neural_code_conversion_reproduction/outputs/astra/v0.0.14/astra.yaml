        format: text
        description: >-
          Three focused admission methods cover fixed original scope and
          resource/input bindings, actual allocation and shared absolute
          deadline, prerequisites before payload, isolated fatal collection
          file policy and exclusive single-attempt dispatch. These are
          software fixtures only; run in the selected substantive parent.
        inputs: [first_readout_grant, first_readout_entrypoint,
                 first_readout_admission_tests, first_readout_batch]
        recipe:
          command: >-
            ( cd outputs/converter_training/tests &&
            timeout --signal=TERM --kill-after=5s 180s
            python3.12 -B -m unittest -v test_finding_a_readout_admission ) > {output} 2>&1
          resources: {cpus: 1, memory: 2Gi, time_limit: 4m}
      - id: first_readout_execution_report
        type: report
        format: json
        description: >-
          One selected first original readout after successful47370327 and
          complete original cuda001 model validation. All224 tau-test images,
          19layers,38decoded slots and all855 panel slots,1000image and1000dyadic
          draws remain. The CPU parent requests3CPU16Gi72h, one numerical
          thread and216allocatedCPUh once. All eleven new EP21 checks, changed
          ASTRA, independent EP19 software companion, decoding, inference and
          publication share absolute StartTime+255600seconds bounded by EndTime
          minus60. Empirical RSS15Gi, collection40Gi, run48Gi, local scratch4Gi;
          isolated empirical child sets finite softRLIMIT_FSIZE and default
          SIGXFSZ. Runtime is unmeasured. No retry, resume or automatic successor.
          Complete quantitative Finding A and comparability remain not evaluable.
          Target neural responses, training inputs, images, OOD, B/C and the
          inactive normalization amendment remain closed. Preserve prior costs.
        inputs: [first_readout_grant, first_readout_entrypoint, first_readout_batch,
                 first_readout_admission_tests, first_readout_code, first_readout_tests,
                 empirical_input_code, empirical_input_tests, batched_inference_code,
                 batched_inference_tests, result_collection_code, protocol_lock,
                 interindividual_converter_manifest, laion_decoder_manifest]
        recipe:
          command: bash outputs/converter_training/finding_a_first_readout.sbatch
          resources: {cpus: 3, memory: 16Gi, time_limit: 72h}
      - id: finding_a_report
        type: report
        format: json
        description: >-
          Layer-, image-, participant-, and pair-level estimates, uncertainty,
          failures, contrasts, subclaim dispositions, and Finding A verdict.
          The collection adapter assembles the existing primary and secondary
          results into a standalone JSON report referencing full point vectors
          and masks in an HDF5 collection. External empirical admission,
          storage and runtime qualification remain caller responsibilities,
          including isolated caller execution, a finite process file-size limit
          and default SIGXFSZ handling for native I/O. A fatal cap breach is an
          incomplete resource failure, never a completed scientific collection.
          The separately admitted first empirical composition uses only the original
          completed sub03-to-sub01 content model and sub03 within-source
          baseline: all224 images and all19 layers, with38 decoded slots and
          all817 unavailable slots explicitly retained. It preserves the
          observed and source-inferred original sub01 brain prerequisites,
          the unchanged1000 image draws and1000 dyadic draws, target-incoming
          summaries and the complete three-method finding's not-evaluable
          disposition. This partial collection cannot establish a complete
          quantitative finding or comparability. The first-readout grant and
          dependent batch select finite resources; eleven checks and ASTRA,
          actual compute admission and a complete original model are mandatory.
          The separately selected full001 readout preserves all855 slots with
          703 decoded and152 unavailable, all224 images/all19 layers and the
          original1000 image/1000 dyadic draws. Its phase-restricted runner
          requires all32 original available models and26 checks plus ASTRA
          before payload. Within-source/content estimates retain original
          support requirements; eight missing sub01 brain pairs prevent a
          complete three-method finding and comparability. Existing first
          readout artifacts remain separate and unchanged.
        inputs:
          - laion_regular_scoring_handoff
          - laion_feature_manifest
          - laion_decoder_manifest
          - interindividual_converter_manifest
          - protocol_lock
          - prediction_bridge_code
          - prediction_implementation_bindings
          - feature_metric_code
          - feature_metric_contract
          - primary_inference_code
          - secondary_summary_code
          - result_collection_code
          - inference_decisions
          - empirical_input_code
          - first_readout_code
          - full_readout_resource_proposal
          - full_readout_dependency_bindings
          - distributed_readout_code
          - staged_collection_code
          - draw_artifact_code
      - id: decoded_feature_manifest
        type: data
        format: json
        description: >-
          Locked tau-test decoded-feature artifacts for the three methods,
          with IDs, shapes, layers, status, and no true-image optimization input.
          A standalone JSON manifest references the HDF5 decoded values,
          explicit storage axes, F/C coordinates, owner normalization and
          all855 decoded or unavailable layer slots. Missing slots are retained.
          The separately admitted first readout loads source03 and target01 decoder
          coefficients only; the other owners supply normalization metadata
          for the full roster, never subject-unique response arrays. Its
          independent common truth reader retains at most one bounded channel
          or fully connected bank and verifies exact C-unit and finite flags.
          The separately selected full001 collection retains all five native
          owners and the same exact image/unit/mask bindings, with703 decoded
          and152 original unavailable slots. Final publication shares the
          staged HDF inode and preserves its history; phase reports alone do
          not stand in for the final manifest or complete inference.
        inputs:
          - laion_regular_scoring_handoff
          - laion_feature_manifest
          - laion_decoder_manifest
          - interindividual_converter_manifest
          - protocol_lock
          - prediction_bridge_code
          - prediction_implementation_bindings
          - result_collection_code
          - empirical_input_code
          - first_readout_code
          - full_readout_resource_proposal
          - full_readout_dependency_bindings
          - full_empirical_input_code
          - full_model_preparation_code
          - grouped_collection_code
          - staged_collection_code
          - distributed_readout_code

  finding_b_natural_reconstruction:
    name: Reconstruct LAION natural images from decoded features
    description: >-
      Under the protocol lock, reconstruct the fixed outcome-blind image and
      pair display set from decoded VGG19 features alone using authenticated
      generator and the tagged custom DIST expressions. Record every attempt and failure; this is a
      qualitative finding and receives no quantitative success label.
    inputs:
      - {id: reconstruction_core_code, type: data, source: outputs/reconstruction_preparation/reconstruction_core.py}
      - {id: reconstruction_core_tests, type: data, source: outputs/reconstruction_preparation/test_reconstruction_core.py}
      - {id: reconstruction_decisions, type: data, source: outputs/protocol_decisions_2026-09-30.yaml}
      - id: reconstruction_asset_binding
        from: ../source_qualification.reconstruction_asset_binding
      - id: laion_feature_manifest
        from: ../laion_feature_preparation.laion_feature_manifest
      - id: decoded_feature_manifest
        from: ../finding_a_feature_decoding.decoded_feature_manifest
      - id: protocol_lock
        from: ../pipeline_conformance.protocol_lock
    outputs:
      - id: reconstruction_core_checks
        type: report
        format: text
        description: >-
          Focused supplied-array/model checks of the original nineteen-layer
          feature scaling, custom DIST and weighted squared error, shared
          seed42 initialization, fixed200-step latent updates, pre-final-update
          return and final clipped RGB uint8 representation. Preserve supplied
          feature dtype and the source float32 latent/model path. These checks
          use bounded fixtures, not a full-network synthetic sweep, and do not
          authenticate a generator, open empirical features, publish images,
          qualify full runtime or change the existing B/C not-evaluable lock.
          Run only within a subsequently selected substantive allocation.
        inputs: [reconstruction_core_code, reconstruction_core_tests,
                 reconstruction_decisions, reconstruction_asset_binding]
        recipe:
          command: >-
            ( cd outputs/reconstruction_preparation &&
            timeout --signal=TERM --kill-after=5s 115s
            python3.12 -B -m unittest -v test_reconstruction_core ) > {output} 2>&1
          resources: {cpus: 1, memory: 2Gi, time_limit: 3m}
      - id: finding_b_report
        type: report
        format: json
        description: Fixed display record, deviations, failures, and qualitative disposition.
        inputs: [laion_feature_manifest, decoded_feature_manifest, protocol_lock,
                 reconstruction_core_code, reconstruction_decisions, reconstruction_asset_binding]
      - id: laion_reconstruction_manifest
        type: data
        format: json
        description: >-
          Complete reconstruction identities, source decoded features, seeds,
          processing, display membership, and success or failure status.
        inputs: [laion_feature_manifest, decoded_feature_manifest, protocol_lock,
                 reconstruction_core_code, reconstruction_decisions, reconstruction_asset_binding]

  finding_c_natural_identification:
    name: Score LAION natural-image identification
    description: >-
      Under the protocol lock, score Finding B reconstructions using pixel and
      authenticated AlexNet-layer correlations against every other eligible
      image in the same locked test universe. Aggregate distractors within
      image and preserve repeated source and target dependence.
    inputs:
      - id: laion_feature_manifest
        from: ../laion_feature_preparation.laion_feature_manifest
      - id: laion_reconstruction_manifest
        from: ../finding_b_natural_reconstruction.laion_reconstruction_manifest
      - id: protocol_lock
        from: ../pipeline_conformance.protocol_lock
    outputs:
      - id: finding_c_report
        type: report
        format: json
        description: >-
          Pixel- and layer-specific pairwise identification, uncertainty,
          contrasts, failures, subclaim dispositions, and Finding C verdict.
        inputs: [laion_feature_manifest, laion_reconstruction_manifest, protocol_lock]

  artificial_analogue_disposition:
    name: Record the closed artificial-image analogue
    description: >-
      Emit only the locked blocked_by_ep04_reservation or
      not_evaluable_under_current_contract disposition. This analysis has no
      OOD input and may not inspect raw images, features, neural values,
      predictions, scores, EP04 outputs, or legacy Scratch state.
    inputs:
      - {id: goal, from: ../goal}
      - {id: datasets, from: ../datasets}
      - id: protocol_lock
        from: ../pipeline_conformance.protocol_lock
    outputs:
      - id: artificial_analogue_report
        type: report
        format: json
        description: Non-empirical OOD boundary and not-evaluable disposition.
        inputs: [goal, datasets, protocol_lock]

  external_feature_preparation:
    name: Prepare the independently qualified external feature branch
    description: >-
      Only if the external branch is locked runnable and separately authorized,
      bind or extract source-compatible NSD/THINGS VGG19 and AlexNet features,
      held-out candidate universes, and reconstruction dependencies. An absent
      or invalid handoff stops only the affected dataset or direction.
    inputs:
      - {id: external_site_feature_handoff, from: ../external_site_feature_handoff}
      - {id: upstream_pipeline_asset_inventory, from: ../upstream_pipeline_asset_inventory}
      - id: external_branch_qualification
        from: ../source_qualification.external_branch_qualification
      - id: protocol_lock
        from: ../pipeline_conformance.protocol_lock
    outputs:
      - id: external_feature_manifest
        type: data
        format: json
        description: >-
          Direction-aware NSD/THINGS feature, test-universe, preprocessing, and
          asset coverage, with independent not-evaluable dispositions.
        inputs:
          - external_site_feature_handoff
          - upstream_pipeline_asset_inventory
          - external_branch_qualification
          - protocol_lock

  external_decoder_training:
    name: Fit participant-native NSD and THINGS decoders
    description: >-
      Under the protocol lock, fit each qualified external participant's fixed
      target decoder only on that participant's native training role. Preserve
      native masks and preprocessing and record failures by dataset and direction.
    inputs:
      - {id: external_site_scoring_handoff, from: ../external_site_scoring_handoff}
      - id: external_feature_manifest
        from: ../external_feature_preparation.external_feature_manifest
      - id: protocol_lock
        from: ../pipeline_conformance.protocol_lock
    outputs:
      - id: external_decoder_manifest
        type: data
        format: json
        description: >-
          Frozen NSD/THINGS decoder identities, training roles, voxel selections,
          fits, exclusions, and failures for qualified participants.
        inputs: [external_site_scoring_handoff, external_feature_manifest, protocol_lock]

  intersite_converter_training:
    name: Fit qualified LAION-to-NSD/THINGS converters
    description: >-
      Under the protocol lock, fit content-loss converters for each qualified
      LAION-to-NSD, NSD-to-LAION, LAION-to-THINGS, and THINGS-to-LAION direction
      using only the source's native training images and a frozen target decoder.
      Enforce zero cross-training image overlap and fit no artificial brain-loss
      comparator. NSD-to-THINGS and THINGS-to-NSD are out of scope.
    inputs:
      - {id: laion_regular_scoring_handoff, from: ../laion_regular_scoring_handoff}
      - {id: external_site_scoring_handoff, from: ../external_site_scoring_handoff}
      - id: laion_feature_manifest
        from: ../laion_feature_preparation.laion_feature_manifest
      - id: external_feature_manifest
        from: ../external_feature_preparation.external_feature_manifest
      - id: laion_decoder_manifest
        from: ../laion_decoder_training.laion_decoder_manifest
      - id: external_decoder_manifest
        from: ../external_decoder_training.external_decoder_manifest
      - id: protocol_lock
        from: ../pipeline_conformance.protocol_lock
    outputs:
      - id: intersite_converter_manifest
        type: data
        format: json
        description: >-
          Direction-stratified converter identities, role and overlap receipts,
          seeds, checkpoints, and complete pair-level failure accounting.
        inputs:
          - laion_regular_scoring_handoff
          - external_site_scoring_handoff
          - laion_feature_manifest
          - external_feature_manifest
          - laion_decoder_manifest
          - external_decoder_manifest
          - protocol_lock

  finding_d_intersite_reconstruction:
    name: Reconstruct natural images across imaging sites
    description: >-
      Under the protocol lock, decode and reconstruct the fixed outcome-blind
      source images for every qualified inter-site direction using the source
      dataset's held-out test role and the target decoder. Record every attempt
      and failure; Finding D remains qualitative.
    inputs:
      - {id: laion_regular_scoring_handoff, from: ../laion_regular_scoring_handoff}
      - {id: external_site_scoring_handoff, from: ../external_site_scoring_handoff}
      - id: laion_feature_manifest
        from: ../laion_feature_preparation.laion_feature_manifest
      - id: external_feature_manifest
        from: ../external_feature_preparation.external_feature_manifest
      - id: laion_decoder_manifest
        from: ../laion_decoder_training.laion_decoder_manifest
      - id: external_decoder_manifest
        from: ../external_decoder_training.external_decoder_manifest
      - id: intersite_converter_manifest
        from: ../intersite_converter_training.intersite_converter_manifest
      - id: protocol_lock
        from: ../pipeline_conformance.protocol_lock
    outputs:
      - id: finding_d_report
        type: report
        format: json
        description: >-
          Fixed direction-stratified display record, deviations, failures, and
          qualitative Finding D disposition.
        inputs:
          - laion_regular_scoring_handoff
          - external_site_scoring_handoff
          - laion_feature_manifest
          - external_feature_manifest
          - laion_decoder_manifest
          - external_decoder_manifest
          - intersite_converter_manifest
          - protocol_lock
      - id: external_reconstruction_manifest
        type: data
        format: json
        description: >-
          Complete inter-site reconstruction identities, directions, decoded
          feature sources, seeds, displays, and success or failure status.
        inputs:
          - laion_regular_scoring_handoff
          - external_site_scoring_handoff
          - laion_feature_manifest
          - external_feature_manifest
          - laion_decoder_manifest
          - external_decoder_manifest
          - intersite_converter_manifest
          - protocol_lock

  finding_e_intersite_identification:
    name: Score inter-site natural-image identification
    description: >-
      Under the protocol lock, score Finding D reconstructions using the locked
      pixel and AlexNet pairwise-identification procedure. Report each source
      dataset, target dataset, direction, participant pair, and layer separately;
      claim comparability only under a prospectively locked matched-support margin.
    inputs:
      - id: laion_feature_manifest
        from: ../laion_feature_preparation.laion_feature_manifest
      - id: external_feature_manifest
        from: ../external_feature_preparation.external_feature_manifest
      - id: external_reconstruction_manifest
        from: ../finding_d_intersite_reconstruction.external_reconstruction_manifest
      - id: protocol_lock
        from: ../pipeline_conformance.protocol_lock
    outputs:
      - id: finding_e_report
        type: report
        format: json
        description: >-
          Direction- and layer-specific identification, uncertainty, matched
          references, failures, subclaim dispositions, and Finding E verdict.
        inputs:
          - laion_feature_manifest
          - external_feature_manifest
          - external_reconstruction_manifest
          - protocol_lock

  laion_reproduction_report:
    name: Integrate the primary LAION reproduction and branch dispositions
    description: >-
      Integrate qualification, conformance, Findings A-C, and the artificial
      analogue disposition without a scalar episode-wide pass/fail label. The
      protocol lock supplies the external branch availability disposition;
      Findings D-E are separately exported when their independent inputs exist,
      so absent external handoffs cannot block this complete primary-branch
      report. This artifact is not an integrated A-E report.
    inputs:
      - {id: goal, from: ../goal}
      - {id: datasets, from: ../datasets}
      - id: qualification_report
        from: ../source_qualification.qualification_report
      - id: conformance_report
        from: ../pipeline_conformance.conformance_report
      - id: protocol_lock
        from: ../pipeline_conformance.protocol_lock
      - id: finding_a_report
        from: ../finding_a_feature_decoding.finding_a_report
      - id: finding_b_report
        from: ../finding_b_natural_reconstruction.finding_b_report
      - id: finding_c_report
        from: ../finding_c_natural_identification.finding_c_report
      - id: artificial_analogue_report
        from: ../artificial_analogue_disposition.artificial_analogue_report
    outputs:
      - id: laion_report
        type: report
        format: md
        description: >-
          Bounded primary LAION Findings A-C verdict vector, external availability,
          artificial-image disposition, deviations, failures, dependencies,
          and claim limits; no episode-wide scalar label.
        inputs:
          - goal
          - datasets
          - qualification_report
          - conformance_report
          - protocol_lock
          - finding_a_report
          - finding_b_report
          - finding_c_report
          - artificial_analogue_report

findings: {}
