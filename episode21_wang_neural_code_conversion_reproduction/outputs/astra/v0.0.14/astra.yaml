      - {id: full_execution_contract, type: data, source: outputs/decoder_training/tools/decoder_execution_contract.py}
      - {id: full_work_planner, type: data, source: outputs/decoder_training/tools/plan_full_decoder_work.py}
      - {id: full_work_plan_checks, type: data, source: outputs/decoder_training/tests/test_plan_full_decoder_work.py}
      - {id: full_work_driver, type: data, source: outputs/decoder_training/tools/train_decoder_work_item.py}
