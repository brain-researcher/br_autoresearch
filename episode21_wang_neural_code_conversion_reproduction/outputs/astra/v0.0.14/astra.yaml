      - {id: full_work_manifest, type: data, source: outputs/decoder_training/full_continuation_001/work_manifest.json}
      - {id: parallelism_amendment_code, type: data, source: outputs/decoder_training/tools/decoder_parallelism_amendment.py}
      - {id: parallelism_amendment_checks, type: data, source: outputs/decoder_training/tests/test_decoder_parallelism_amendment.py}
      - {id: worker_scratch_checks, type: data, source: outputs/decoder_training/tests/test_worker_scratch_policy.py}
      - {id: parallel_worker_batch, type: data, source: outputs/decoder_training/full_workers_parallel_001.sbatch}
      - {id: clean_work5_remainder_batch, type: data, source: outputs/decoder_training/full_remainder_work5_001.sbatch}
      - {id: clean_work5_remainder_checks, type: data, source: outputs/decoder_training/tests/test_work5_quarantine_remainder.py}
      - {id: selected_io_inspection_child, type: data, source: outputs/decoder_training/selected_io_inspections_001.sh}
      - {id: continuation_authorization, type: data, source: outputs/decoder_training_continuation_authorization.json}
      - {id: continuation_driver, type: data, source: outputs/decoder_training/tools/train_channel_continuation.py}
      - {id: continuation_checks, type: data, source: outputs/decoder_training/tests/test_train_channel_continuation.py}
      - {id: continuation_batch, type: data, source: outputs/decoder_training/continue_channel_001.sbatch}
      - {id: layer_authorization, type: data, source: outputs/decoder_training_layer_authorization.json}
