        description: >-
          Three focused orchestration and ten affected reader fixtures cover
          all five fixed native axes, the shared twenty-pair seed42 sequence,
          complete 4712-row and 1024-step training orchestration, final-only
          publication and failure propagation. A content provider admits the
          complete catalog/recovery evidence once against a private snapshot;
          exact review/allocation checks at pass entry and exhaustion refuse
          mutation before successful pass completion. Ordinary per-block
          payload checks and spatial ordering remain, and standalone reads
          admit freshly. Run in the selected optional post-assembly tail
          under the existing qualified CPU Torch module binding, with one intra
          and inter-op thread. These fixtures do not admit empirical converter
          access or establish full-scale memory, I/O or numerical qualification.
          Three additional prospective cache fixtures cover exact selected-channel
          C-bit/Fortran-unit extraction and unchanged normalization, owning
          read-only two-pass reuse with identical loss/adjoint values, and
          pre-copy byte bounds, exhaustion, revocation and cancellation cleanup.
          The selected-channel bank plus covering flags is bounded by1GiB and
          retained exact LossBlock arrays by4GiB; other temporary arrays and
          model/optimizer tensors are additional RSS. The selected cache integration
          uses a reader factory after existing header admission,
          the original privately bound provider check_binding exposed as
          check_pass, and a driver provider factory with unchanged defaults.
          The public cache follows the original training schedule's layer order,
          and a bounded public-constructor fixture exercises its first two
          canonical schedules. Cache checks require a selected substantive allocation;
          the existing recipe retains its original fixture selection and does
          not activate the cache or authorize payload access.
