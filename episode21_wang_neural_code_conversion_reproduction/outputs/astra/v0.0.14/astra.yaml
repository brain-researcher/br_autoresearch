version: "0.0.14"
id: episode21_wang_neural_code_conversion_reproduction
name: EP21 — Fixed Wang et al. neural-code-conversion reproduction
description: >-
  Fixed, adapted reproduction of inter-individual conversion in five
  LAION-fMRI participants, with a separately provisioned LAION-to-NSD/THINGS
  inter-site branch. The program preserves no-shared-stimulus training roles,
  excludes the EP04-reserved OOD payload, and gives no access or execution
  authorization. Runtime state belongs only in outputs/experiment_log.md.
tags: [brain_researcher, autoresearch, fmri, neural_code_conversion, reproduction]

inputs:
  - id: goal
    type: data
    source: GOAL.md
    description: Scientific question, evidence roles, findings, and claim limits.
  - id: datasets
    type: data
    source: DATASETS.md
    description: LAION-fMRI and contingent external-site dataset contract.
  - id: search_policy
    type: data
    source: SEARCH_POLICY.yaml
    description: Fixed execution, inference, adjudication, and stopping policy.
  - id: protocol_table
    type: data
    source: PROTOCOL_TABLE.yaml
    description: Outcome-independent fields that must be resolved before scoring.
  - id: scientist_decision_record
    type: data
    source: outputs/protocol_decisions_2026-09-30.yaml
    description: >-
      Scientist-adopted pinned V1.0.0 fidelity choices and delegated prospective
      LAION protocol resolutions; no neural values, execution authority, or lock.
  - id: regular_neural_export_authorization
    type: data
    source: outputs/regular_neural_export_authorization_2026-09-30.json
    description: Separate bounded export-only approval required before regular beta payload access; absent until scientist approval.
  - id: fixed_provider_measurement_amendment
    type: data
    source: outputs/protocol_provider_beta_amendment_2026-09-30.yaml
    description: Scientist-approved fixed regular provider betas with accepted inherited upstream dependence; no neural execution authority.
  - id: provider_beta_preprocessing_assessment
    type: data
    source: outputs/steward_provisioning/provider_beta_eligibility_assessment_2026-09-30.json
    description: Frozen processing metadata and algorithmic reference; actual normalization/fit role exclusions remain unverified, no neural values.
  - id: native_visual_mask_amendment
    type: data
    source: outputs/protocol_mask_amendment_2026-09-30.yaml
    description: Scientist-approved fixed independent 29-mask union and bounded mask-only allocation; no neural authority.
  - id: authenticated_laion_role_metadata
    type: data
    source: outputs/steward_provisioning/source_structural_manifest.json
    description: >-
      Real provider regular image IDs, shared tau variant 0, 150 session
      headers, exact overlap and repetition support; no neural/image values.
      Whole-VC eligibility and neural missingness remain unresolved.
  - id: steward_provisioning_authorization
    type: data
    source: outputs/steward_provisioning_authorization_2026-09-30.md
    description: >-
      Scientist approval and bounded allocation for one regular-stimulus
      export, with OOD exclusion and model fitting/scoring still closed.
  - id: input_contract
    type: data
    source: inputs/README.md
    description: Stable input interfaces and stage-specific access restrictions.
  - id: conversion_structural_manifest
    type: data
    source: inputs/conversion_structural_manifest.json
    description: >-
      Redacted structural metadata for release, roles, splits, overlaps, masks,
      shapes, missingness, exposure, and branch eligibility; no neural values.
  - id: upstream_pipeline_asset_inventory
    type: data
    source: inputs/upstream_pipeline_asset_inventory.json
    description: >-
      Outcome-blind inventory of source revision, VGG19, AlexNet, decoders,
      converters, generator, DISTS, and runtime assets or verified absence.
  - id: laion_regular_feature_handoff
    type: data
    source: inputs/laion_regular_feature_handoff/
    description: Authorized regular-only LAION stimuli or aligned feature payload.
  - id: regular_vgg19_continuation_authorization
    type: data
    source: outputs/regular_vgg19_continuation_authorization_2026-10-05.json
    description: >-
      Scientist-approved two-stage regular-only continuation: publish retained
      sub05, then export the four remaining partitions. Original lock, model,
      data roles and consumed budgets are preserved; neural/scoring/OOD closed.
  - id: laion_regular_scoring_handoff
    type: data
    source: inputs/laion_regular_scoring_handoff/
    description: Post-lock regular-only LAION neural data and native-space masks.
  - id: external_site_feature_handoff
    type: data
    source: inputs/external_site_feature_handoff/
    description: >-
      Provisioning-contingent, non-neural NSD/THINGS stimuli or aligned features.
  - id: external_site_scoring_handoff
    type: data
    source: inputs/external_site_scoring_handoff/
    description: >-
      Provisioning-contingent, post-lock NSD/THINGS neural data and native masks.

outputs:
  - id: laion_report
    from: laion_reproduction_report.laion_report
  - id: finding_d_report
    from: finding_d_intersite_reconstruction.finding_d_report
  - id: finding_e_report
    from: finding_e_intersite_identification.finding_e_report

analyses:
  source_qualification:
    name: Qualify sources, roles, and released pipeline assets
    description: >-
      Without mounting feature or scoring handoffs, classify data eligibility,
      image-role separation, planned pair tables, declared-input OOD exclusion,
      prior exposure, and asset provenance as verified, absent, or unknown.
      Qualification must authenticate the V1.0.0 tag at
      commit edbff02edd6a08d3c6c829af45a957fd14bdc460 and the corresponding
      Zenodo identity (10.5281/zenodo.14910040), then record rather than resolve
      as method choices: manuscript ReLU versus tagged LeakyReLU(0.2), the
      manuscript content-loss weighting versus tagged batch/block normalized
      inverse-squared-norm weighting, the manuscript eight-layer reconstruction
      description versus the tagged nineteen-layer configuration, and the
      observable metadata and unresolved Deeprecon-specific assumptions of the
      released inter-site assets without claiming payload completeness. The
      stable replay also authenticates the two public
      non-empirical VGG/CaffeNet archives and their canonical members without
      deserializing checkpoints; this does not bind unchecksummed lab-local
      evaluator copies or authorize CaffeNet as an AlexNet substitute.
    inputs:
      - {id: goal, from: ../goal}
      - {id: datasets, from: ../datasets}
      - {id: protocol_table, from: ../protocol_table}
      - {id: input_contract, from: ../input_contract}
      - {id: conversion_structural_manifest, from: ../conversion_structural_manifest}
      - {id: upstream_pipeline_asset_inventory, from: ../upstream_pipeline_asset_inventory}
      - {id: reconstruction_binding_note, type: data, source: outputs/reconstruction_preparation/source_binding.md}
      - {id: generator_asset_code, type: data, source: outputs/reconstruction_preparation/generator_assets.py}
      - {id: generator_asset_tests, type: data, source: outputs/reconstruction_preparation/test_generator_assets.py}
      - {id: public_archive_reader, type: data, source: outputs/source_qualification/tools/audit_public_model_payloads.py}
      - {id: verified_archive_reader, type: data, source: outputs/source_qualification/tools/verified_source_archive.py}
      - {id: reconstruction_runtime_code, type: data, source: outputs/reconstruction_preparation/qualify_reconstruction.py}
      - {id: reconstruction_runtime_core, type: data, source: outputs/reconstruction_preparation/reconstruction_core.py}
      - {id: reconstruction_runtime_grant, type: data, source: outputs/reconstruction_qualification_authorization.json}
      - {id: reconstruction_runtime_admission, type: data, source: outputs/reconstruction_preparation/run_reconstruction_qualification.py}
      - {id: reconstruction_runtime_admission_tests, type: data, source: outputs/reconstruction_preparation/test_reconstruction_admission.py}
      - {id: reconstruction_runtime_batch, type: data, source: outputs/reconstruction_preparation/reconstruction_qualification.sbatch}
    outputs:
      - id: public_reconstruction_runtime_report
        type: report
        format: json
        description: >-
          Separately admitted single public-model runtime qualification using
          the exact generator archive/checkpoint/bounds, cached VGG checkpoint
          and public feature-SD statistic, and the pinned architecture source.
          One C-order modulo257 float32 fixture with zero decoder means runs
          all19 layers and200 updates with seed42. Retain actual asset identities,
          dimensions/dtypes/finite checks and operational timing/memory only;
          no image, feature values, losses or scientific scores. The oneCPU7Gi
          two-hour CPU parent has an absolute6900-second deadline from Slurm
          StartTime bounded by EndTime,6.5Gi RSS,1Gi durable including the pinned
          generator archive, and4Gi node-local work. Serialized checks and the separately granted300-second brain
          prefix share that deadline and one parent charge. The fixed report
          is outputs/runs/reconstruction_qualification/attempt001/report.json;
          incomplete work remains explicit, with no retry or automatic successor.
          This recipe describes the admitted parent, never submits a job or
          activates empirical reconstruction, scoring, or the B/C locked claims.
        inputs: [reconstruction_runtime_code, reconstruction_runtime_core,
                 reconstruction_runtime_grant, reconstruction_runtime_admission,
                 reconstruction_runtime_admission_tests, reconstruction_runtime_batch,
                 generator_asset_code, generator_asset_tests, public_archive_reader,
                 reconstruction_binding_note]
        recipe:
          command: bash outputs/reconstruction_preparation/reconstruction_qualification.sbatch
          resources: {cpus: 1, memory: 7Gi, time_limit: 2h}
      - id: generator_asset_checks
        type: report
        format: text
        description: >-
          Focused local-fixture checks of exact generator archive identity,
          the two selected member identities and exclusive bounded extraction.
          Reuse the established archive reader without expanding its historical
          VGG/CaffeNet CLI. No network, checkpoint deserialization, real payload,
          empirical reconstruction or new lock is admitted by these checks.
          Execute only inside a subsequently selected substantive allocation;
          asset authentication and runtime qualification remain distinct.
        inputs: [generator_asset_code, generator_asset_tests, public_archive_reader,
                 verified_archive_reader, reconstruction_binding_note]
        recipe:
          command: >-
            ( cd outputs/reconstruction_preparation &&
            timeout --signal=TERM --kill-after=5s 60s
            python3.12 -B -m unittest -v test_generator_assets ) > {output} 2>&1
          resources: {cpus: 1, memory: 1Gi, time_limit: 2m}
      - id: reconstruction_asset_binding
        type: report
        format: markdown
        description: >-
          Source-only binding of the tagged generator configuration, checkpoint
          and latent/statistic member identities,19-layer/200-step reconstruction
          conventions and already adopted public AlexNet evaluator route.
          Separate documentary identities from authenticated payload/runtime
          evidence. This preparation provides no empirical access, reconstruction,
          scoring, payload grant or change to the existing not-evaluable lock;
          explicit scientific amendment and regenerated lock precede activation.
        inputs: [goal, datasets, protocol_table, upstream_pipeline_asset_inventory,
                 reconstruction_binding_note]
      - id: qualification_report
        type: report
        format: json
        description: >-
          Outcome-blind provenance, discrepancy register, structural QC, access
          decisions, exposure status, and verified-present/absent/unknown assets.
          The execution ledger must export EP21_LEDGER_ATTEMPT as its prepared
          positive attempt number; the scientific program does not own mutable
          attempt state.
        inputs:
          - goal
          - datasets
          - protocol_table
          - input_contract
          - conversion_structural_manifest
          - upstream_pipeline_asset_inventory
        recipe:
          command: >-
            python outputs/source_qualification/tools/qualify_output.py
            --goal {inputs.goal}
            --datasets {inputs.datasets}
            --protocol-table {inputs.protocol_table}
            --input-contract {inputs.input_contract}
            --structural-manifest {inputs.conversion_structural_manifest}
            --asset-inventory {inputs.upstream_pipeline_asset_inventory}
            --output {output}
            --attempt "$EP21_LEDGER_ATTEMPT"
          resources:
            cpus: 1
            memory: 4Gi
            time_limit: 30m
            disk: 3Gi
      - id: laion_branch_qualification
        type: report
        format: json
        description: >-
          LAION eligibility, exact roles and pair support, or a fail-closed
          disposition independent of external-site availability.
        inputs:
          - qualification_report
        recipe:
          command: >-
            python outputs/source_qualification/tools/render_branch.py
            --branch laion
            --qualification {inputs.qualification_report}
            --output {output}
          resources:
            cpus: 1
            memory: 256Mi
            time_limit: 2m
      - id: external_branch_qualification
        type: report
        format: json
        description: >-
          Separate NSD/THINGS dataset-direction and asset availability record;
          absence does not invalidate the LAION qualification.
        inputs:
          - qualification_report
        recipe:
          command: >-
            python outputs/source_qualification/tools/render_branch.py
            --branch external
            --qualification {inputs.qualification_report}
            --output {output}
          resources:
            cpus: 1
            memory: 256Mi
            time_limit: 2m

  native_visual_mask_preparation:
    name: Materialize the approved independent native visual masks
    description: >-
      Union 29 fixed retinotopy/fLoc/object masks per participant without
      main-experiment response selection, morphology or interpolation.
      Disclose adapted coverage; this mask-only allocation opens no neural work.
    inputs:
      - {id: mask_amendment, from: ../native_visual_mask_amendment}
    outputs:
      - id: mask_report
        type: report
        format: json
        description: Native component/grid identities, actual union support and C-order voxel indices.
        inputs: [mask_amendment]
        recipe:
          command: bash outputs/steward_provisioning/tools/materialize_independent_masks.sbatch
          resources: {cpus: 1, memory: 2Gi, time_limit: 10m}
      - id: native_mask_bundle
        type: data
        format: nii.gz
        description: Five supplied-grid binary union masks with native voxel index arrays and mask-only QC.
        inputs: [mask_amendment]

  regular_neural_steward_export:
    name: Provision sealed regular-only native responses
    description: >-
      Export the fixed provider TYPED regular rows through the approved independent
      masks, preserving repetitions and native voxel identities. Discard excluded
      mixed-stream volumes as opaque bytes; no OOD numerical array, additional
      normalization, fitting or scoring. This prepared recipe is not authorized
      until the separate numeric allocation record exists. Keep sealed responses
      outside the protocol resolver; return only structural coverage metadata.
    inputs:
      - {id: export_authorization, from: ../regular_neural_export_authorization}
      - {id: measurement_amendment, from: ../fixed_provider_measurement_amendment}
      - {id: roles, from: ../authenticated_laion_role_metadata}
      - {id: masks, from: ../native_visual_mask_preparation.native_mask_bundle}
    outputs:
      - id: regular_neural_structural_report
        type: report
        format: json
        description: Row counts, native-header bindings, finite coverage without response values, and completed sealed publication.
        inputs: [export_authorization, measurement_amendment, roles, masks]
        recipe:
          command: python outputs/steward_provisioning/tools/export_regular_neural.py
          resources:
            cpus: 1
            memory: 4Gi
            time_limit: 12h
            disk: 10GB
      - id: sealed_regular_neural_bundle
        type: data
        format: directory
        description: Regular masked responses and aligned repetition/role/native-voxel records, closed to the resolver and scorer until the later lock/authority gates.
        inputs: [export_authorization, measurement_amendment, roles, masks]

  pipeline_conformance:
    name: Verify the pipeline and emit the protocol lock
    description: >-
      Resolve every shared field and each runnable branch from outcome-blind
      evidence, test implementations on synthetic or permuted fixtures, and
      lock unavailable modules or subclaims as not_evaluable. Qualification
      discrepancies are resolved by the scientist's explicit V1.0.0 choice and
      prospective decision record, with every paper/code deviation disclosed.
      Input-dependent identities, runtime bindings, and required conformance
      remain necessary; this program does not grant empirical authority.
    inputs:
      - {id: goal, from: ../goal}
      - {id: search_policy, from: ../search_policy}
      - {id: protocol_table, from: ../protocol_table}
      - {id: scientist_decision_record, from: ../scientist_decision_record}
      - {id: native_visual_mask_amendment, from: ../native_visual_mask_amendment}
      - {id: fixed_provider_measurement_amendment, from: ../fixed_provider_measurement_amendment}
      - {id: provider_beta_preprocessing_assessment, from: ../provider_beta_preprocessing_assessment}
      - {id: native_visual_mask_report, from: ../native_visual_mask_preparation.mask_report}
      - {id: regular_neural_structural_report, from: ../regular_neural_steward_export.regular_neural_structural_report}
      - {id: authenticated_laion_role_metadata, from: ../authenticated_laion_role_metadata}
      - {id: steward_provisioning_authorization, from: ../steward_provisioning_authorization}
      - id: qualification_report
        from: ../source_qualification.qualification_report
      - id: laion_branch_qualification
        from: ../source_qualification.laion_branch_qualification
      - id: external_branch_qualification
        from: ../source_qualification.external_branch_qualification
    outputs:
      - id: conformance_report
        type: report
        format: json
        description: Synthetic conformance, calibration, and branch dispositions.
        inputs:
          - goal
          - search_policy
          - protocol_table
          - scientist_decision_record
          - native_visual_mask_amendment
          - fixed_provider_measurement_amendment
          - provider_beta_preprocessing_assessment
          - native_visual_mask_report
          - regular_neural_structural_report
          - authenticated_laion_role_metadata
          - steward_provisioning_authorization
          - qualification_report
          - laion_branch_qualification
          - external_branch_qualification
      - id: protocol_lock
        type: report
        format: yaml
        description: >-
          Resolved common and branch-specific protocol, including locked
          not_evaluable units; the lock does not grant empirical access.
        inputs:
          - goal
          - search_policy
          - protocol_table
          - scientist_decision_record
          - native_visual_mask_amendment
          - fixed_provider_measurement_amendment
          - provider_beta_preprocessing_assessment
          - native_visual_mask_report
          - regular_neural_structural_report
          - authenticated_laion_role_metadata
          - steward_provisioning_authorization
          - qualification_report
          - laion_branch_qualification
          - external_branch_qualification
      - id: content_loss_correction
        type: report
        format: json
        description: >-
          Targeted source-caller correction for the historical mean-MSE
          conformance error. The tagged converter uses weighted summed squared
          errors across each complete active feature block. The report at
          outputs/pipeline_conformance/converter_loss_correction_001/report.json
          supersedes only the converter-loss fields, preserving historical
          lock/report bytes, decoder fits and VGG features. This small check
          runs within a selected substantive allocation and grants no converter
          or scoring access.
        inputs: [qualification_report, scientist_decision_record]
        recipe:
          command: python outputs/pipeline_conformance/tools/run_converter_loss_correction.py
          resources: {cpus: 1, memory: 7Gi, time_limit: 4m}

  laion_feature_preparation:
    name: Prepare regular-only LAION feature inputs
    description: >-
      After the protocol lock and separate authorization, bind or extract only
      the authenticated VGG19 and AlexNet regular-image features, preprocessing,
      image IDs, valid masks, layers, and reconstruction-asset references. No
      OOD object may be opened or derived.
    inputs:
      - {id: laion_regular_feature_handoff, from: ../laion_regular_feature_handoff}
      - {id: continuation_authorization, from: ../regular_vgg19_continuation_authorization}
      - {id: upstream_pipeline_asset_inventory, from: ../upstream_pipeline_asset_inventory}
      - id: laion_branch_qualification
        from: ../source_qualification.laion_branch_qualification
      - id: protocol_lock
        from: ../pipeline_conformance.protocol_lock
    outputs:
      - id: retained_sub05_publication
        type: report
        format: json
        description: >-
          outputs/steward_provisioning/regular_vgg19_continuation_20261005/publish-sub05_status.json.
          Publish the complete retained 4712-image partition without new
          forwards; release its exact redundant staging only after durable
          verified publication. Preserve the old partial Oak copy.
        inputs: [continuation_authorization, protocol_lock]
        recipe:
          command: >-
            bash outputs/steward_provisioning/tools/continue_regular_vgg19_publish_sub05.sbatch
          resources: {cpus: 1, memory: 4Gi, time_limit: 2h}
      - id: regular_vgg19_structural_report
        type: report
        format: json
        description: >-
          outputs/steward_provisioning/regular_vgg19_structural_report.json.
          Reuse sealed sub01/sub03 and published sub05; export only sub06,
          sub07, tau_train and tau_test (10545 new forwards), preserving all
          19 pre-ReLU float32 layers and exact image roles. Final handoff uses
          hardlinks; the 1.7TB durable ceiling includes the historical partial,
          and staging remains capped at 340GB. No neural fit/score or OOD access.
        inputs: [continuation_authorization, protocol_lock, laion_regular_feature_handoff, retained_sub05_publication]
        recipe:
          command: >-
            bash outputs/steward_provisioning/tools/continue_regular_vgg19_remaining.sbatch
          resources: {cpus: 4, gpus: 1, memory: 16Gi, time_limit: 10h}
      - id: laion_feature_manifest
        type: data
        format: json
        description: >-
          Image-aligned regular-only features, preprocessing identities,
          coverage, and authenticated reconstruction dependencies.
        inputs:
          - laion_regular_feature_handoff
          - upstream_pipeline_asset_inventory
          - laion_branch_qualification
          - protocol_lock

  laion_decoder_training:
    name: Fit frozen participant-native LAION decoders
    description: >-
      Under the protocol lock, fit each participant's VGG19 ridge decoders and
      training-only 500-voxel selections on that target's authenticated 4,712
      subject-unique regular images, excluding tau and OOD rows. Freeze each
      decoder before converter fitting.
