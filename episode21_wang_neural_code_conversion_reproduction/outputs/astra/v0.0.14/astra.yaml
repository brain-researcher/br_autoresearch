      - {id: prefix_authorization, type: data, source: outputs/decoder_training_prefix_authorization.json}
      - {id: prefix_driver, type: data, source: outputs/decoder_training/tools/train_retained_prefix.py}
      - {id: prefix_checks, type: data, source: outputs/decoder_training/tests/test_train_retained_prefix.py}
