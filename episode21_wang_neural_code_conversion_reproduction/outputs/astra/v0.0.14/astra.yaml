        format: json
        description: >-
          Separately admitted four full updates on one actual CUDA device with
          at least22GiB memory,20GiB PyTorch allocator cap,15GiB host process
          RSS cap and6300-second work deadline inside a2CPU/16GiB/1GPU/two-hour
          parent. Preserve canonical pair4 initialization, all4712rows/19layers,
          sparse256/512, float32 without TF32 or AMP. One fixed CUDA-sparse versus
