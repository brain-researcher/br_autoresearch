            r=unittest.TextTestRunner(verbosity=2).run(s); sys.exit(0 if r.wasSuccessful() else 1)"'
          resources: {cpus: 1, memory: 7Gi, time_limit: 2m}
      - id: first_cuda_content_pair_entrypoint_checks
        type: report
        format: text
        description: >-
          Five focused admission/composition methods for the original
          complete cached-CUDA pair4. An inactive profile or unset finite time
          and CPU/GPU reservations refuse before imports or input access. A
          distinct production operation binds the same actual allocation and
          original all4712/19layer/1024update/full eligible-axis scope to the
          existing exact reader/cache and final-only driver. Measurement
          contexts cannot become production. Absolute StartTime/EndTime−60
          admission, fixed host/device/cache/storage bounds, exclusive claim,
          bounded counts/timings without losses and conservative incomplete
          publication reporting remain. The selected production profile uses
          actual cached measurement plus final publication headroom and binds
          the measured Tesla V100-SXM2-32GB device family. Run these fixtures in the selected
          substantive parent, never a new checking-only job. No empirical
          payload, full fit, scientific score or broader data access follows.
        inputs: [first_cuda_content_pair_proposal, first_cuda_content_pair_entrypoint,
                 first_cuda_content_pair_admission_checks, cached_cuda_production_composition,
                 cached_cuda_production_composition_checks, empirical_content_binder,
