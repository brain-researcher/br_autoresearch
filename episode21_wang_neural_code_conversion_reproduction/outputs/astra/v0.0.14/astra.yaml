      - id: interindividual_converter_manifest
        type: data
        format: json
        description: >-
          Content-loss and brain-loss fitted-object identities, role receipts,
          seeds, checkpoints, and complete pair-level failure accounting.
          The unactivated brain-loss library implements all fifty fixed CV fits
          and one final refit per directed pair on the authenticated 897 tau-train
          image averages, with common image folds and fold-training-only moments.
          It preserves float32 primal fitting, penalized bias and the pinned
          float64 append-ones prediction path. Exact native axes are required;
          invalid scales are not repaired by voxel deletion. The library reads
          no files and grants no empirical access. Five source/fixture checks
          are selected inside work_0007, capped at 60 seconds plus five-second
          kill grace, without gating the decoder remainder. Stage access
          and full-scale resource qualification remain separate. The unactivated
          final brain-artifact helper now snapshots a supplied completed mapping,
          all897 IDs, full native axes, final tau-train moments, common folds and
          complete CV selection metadata against independent caller bindings.
          It preserves existing finals and failed partials through bounded
          exclusive publication and reads models on CPU. It authenticates no
          supplied completion or access; publication checks remain separate
          from numerical fitting and no empirical stage is opened.
          The dormant brain-input reader binds existing regular roles, lock,
          neural export and full native-mask identity, checks both participants'
          tau-train metadata before response reads, and independently averages
          every stored repetition into897 float32 image rows. No decoder
          normalization or eligible-voxel deletion is applied. Read-only maps
          close on success/failure; external operation admission and the actual
          allocation budget precede I/O. Its four focused reader fixtures remain
          separate from real-data fitting and require coordinated compute.
          The dormant brain-pair driver joins these bound inputs to the unchanged
          complete CV/final refit and exclusive final-model publisher. It resolves
          separate fit/publication authority for the exact pair/path/byte limit
          before fitting, after fitting and before writing in the same allocation.
          Existing outputs and missing parent directories refuse before fitting;
          numerical, budget and publication failures propagate without retry.
          Its three composition checks mock fitting and use the existing final
          artifact helper. This one-pair library grants no empirical access and
          does not imply complete twenty-pair execution or resource qualification.
          The final content-artifact helper snapshots supplied completed fits
          with frozen eligible axes/moments, source image IDs, channel schedule,
          pair initialization and decoder references. It publishes exclusively
          and preserves uncertain failure outputs; it does not authenticate the
          caller's completion, fit converters or open the empirical stage.
          The unactivated content-pair driver now joins complete-manifest axes,
          one canonical twenty-pair initialization sequence, supplied source
          training, the full loop and final-only publication. The provider owns
          a bounded private review snapshot and admits complete recovery evidence
          once, removing its repeated full journal replays. Exact caller-review
          and allocation checks at pass entry/exhaustion detect changes before
          pass completion; ordinary per-block validation and spatial order
          remain. Standalone readers admit freshly. The unactivated empirical
          binder consumes the explicit loss correction and joins the complete
          collection to one selective source load. Binding, disposable
          measurement and full publication require distinct resolver operations.
          Full production admission and unmeasured resource qualification
          remain separate caller obligations.
        inputs:
          - converter_implementation_plan
          - content_pair_driver_code
          - content_pair_driver_tests
          - first_cuda_content_pair_proposal
          - first_cuda_content_pair_entrypoint
          - first_cuda_content_pair_admission_checks
          - cached_cuda_production_composition
          - cached_cuda_production_composition_checks
          - converter_decoder_reader_code
          - converter_decoder_reader_tests
          - empirical_content_binder
          - brain_loss_code
          - brain_loss_checks
          - final_brain_artifact_code
          - final_brain_artifact_checks
          - empirical_brain_binder
          - empirical_brain_checks
          - brain_pair_driver_code
          - brain_pair_driver_checks
          - first_brain_pair_proposal
          - first_brain_pair_entrypoint
          - first_brain_pair_admission_checks
          - first_brain_pair_batch
          - final_content_artifact_code
          - final_content_artifact_tests
          - laion_regular_scoring_handoff
          - laion_feature_manifest
          - laion_decoder_manifest
          - protocol_lock
          - content_loss_correction

