          bounded64MiB column stripe and active-channel packed finite flags.
          Preserve4712rows,19layers,normalization,decoder coefficients and
          block/reduction order. Compare elapsed time,RSS and kernel read
          counters with the earlier report, without equating counters to
          physical storage traffic or claiming production feasibility.
          Focused changed-reader/admission checks precede empirical access;
          reuse passed interface/loss/measurement checks and the completed
