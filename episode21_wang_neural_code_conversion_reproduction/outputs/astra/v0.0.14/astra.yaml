          test images, complete native identity, bounded decoder blocks,
          float64 prediction and float32 source-file representation. Preserve
          the tagged content float32 physical round trip and the existing EP21
          common float32 decoder-input binding, disclosing its difference from
          the literal NCC brain caller. No empirical reader, fitting, scoring,
          allocation or execution authority is provided. Run these checks only
          within a substantive allocation, outside the current measurement tail.
