  - ood_is_a_stimulus_shift_within_the_same_participants
  - released_stages_differ_dinov2_layer23_patch_mean_vs_vlm_projection_heads
  - no_causal_claim_about_training_objectives_or_language_supervision
  - selection_intervention_tests_direction_not_provider_magnitude
