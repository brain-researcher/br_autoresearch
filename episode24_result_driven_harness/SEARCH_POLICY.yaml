episode_id: EP24
episode_directory: episode24_result_driven_harness
created: '2026-10-13'
mode: standalone_operational_improvement
question: Improve completion of the next authorized interpretable research result.
current_authorization:
  - Create the scoped episode and analyze the complete original session prefix.
  - Develop and apply a concrete minimal harness improvement.
  - Collect permitted prospective process evidence through existing episode owners.
  - Preserve original scientific authority and avoid duplicate submissions.
source:
  path: /home/users/zijiao/.codex/sessions/2026/10/03/rollout-2026-10-03T10-24-58-01a102cc-2ffb-7120-bd17-e442a0a313e8.jsonl
  role: already_exposed_operational_history
  access: read_only
  capture: Record capture time and fixed byte endpoint before parsing.
  coverage: Entire recorded prefix from its beginning, excluding disclosed incomplete trailing record.
  later_appends: Outside the baseline unless separately captured and identified.
  raw_export: prohibited
  external_disclosure: prohibited
outputs:
  permitted: Small derived redacted process metadata, case summaries, patches and result references.
  location: outputs/
  records: Use experiment_log.md, README.md and the existing ASTRA program convention.
  avoid: New audit bureaucracy, raw transcripts, credentials and scientific payload copies.
analysis:
  historical_cases: [EP01, EP04, EP08, EP14]
  prospective_candidates: [EP15, EP18, EP20, EP21]
  unit: Recorded event or linked task transition; report task and episode dependence.
  counts: State exact event definition, denominator and prefix coverage.
  interpretation: Label inferred redundancy, intent and causal explanations separately.
  timing: Do not infer unattended execution or active duration from thread age.
  candidate_selection: Let the observed failure determine the smallest useful patch.
  comparison: Include justified safeguards, negative results and valid stopping as counterexamples.
  benchmark: No compulsory full benchmark, generic audit or synthetic detour.
engineering_authority:
  permitted: Contract-preserving implementation, focused repair and reuse within existing caps.
  resource_flexibility: Bounded by explicitly authorized remaining total resources and site rules.
  budget_resets: prohibited
  extra_resources: Require existing explicit delegation or a new decision before exceeding the cap.
  scientific_changes: Require the owning episode's authority; EP24 grants none.
initial_compute:
  owner: coordinating_agent
  environment: task_owned_slurm_allocation
  cpus: 1
  memory_gib: 4
  maximum_total_allocation_minutes: 20
  scope: Session parsing and focused validation of that analysis.
  login_compute: prohibited
  other_episode_compute: Governed and accounted by the original episode; no duplicate launch.
prospective_execution:
  prerequisite: Current owner verifies readiness, scope, authority and available budget.
  launch_authority: Existing named episode contract and user decisions only.
  evidence: Permitted process transitions plus an actual newly completed real-data result.
  preserve: Holdout closure, scientific stopping, eligibility, independence and claim boundaries.
  ownership: One submission owner and monitor per dependency chain; scoped file ownership.
acceptance:
  required:
    - An actually applied concrete harness improvement.
    - At least one new completed real-data result under its original episode authority.
    - Observed process evidence of the changed behavior and its resource use.
  not_sufficient:
    - Retrospective analysis or completed episode documents alone.
    - Synthetic success, asset counts, submission counts or positive-result storytelling.
    - A blocker record without completion of the blocked experiment.
  report_ineffective_or_inconclusive: true
stopping:
  - Stop the current computation at its authorized resource ceiling; preserve consumed budget.
  - Respect an explicit user stop and every original episode's scientific stopping rule.
  - Report an unresolved external blocker without substituting unrequested work or declaring success.
claims:
  allowed: Bounded operational observations and case-specific prospective validation.
  prohibited:
    - New neuroscience discovery from this harness episode.
    - Causal or general harness improvement from unmatched cases alone.
    - Canonical campaign acceptance or independent confirmation without separate authority.
side_effect_limits:
  - No external communications, services or system-configuration changes.
  - No mutation of raw session history, other episodes' scientific inputs or closed outcomes.
  - No Git mutations without explicit user instruction.
