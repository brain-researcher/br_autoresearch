version: "0.0.14"
name: Result-driven research harness
inputs:
  - {id: goal, type: data, source: GOAL.md}
  - {id: data_contract, type: data, source: DATASETS.md}
  - {id: policy, type: data, source: SEARCH_POLICY.yaml}
  - {id: items, type: data, source: outputs/arm_comparison/items.md}
  - {id: key, type: data, source: outputs/arm_comparison/key.md}
outputs:
  - id: result
    from: arm_comparison.result
analyses:
  history_baseline:
    name: Analyze the complete recorded session prefix
    inputs:
      - {id: goal, from: ../goal}
      - {id: data_contract, from: ../data_contract}
    outputs:
      - id: baseline
        type: report
        format: md
        inputs: [goal, data_contract]
  harness_change:
    name: Apply the smallest evidence-supported execution change
    inputs:
      - {id: baseline, from: ../history_baseline.baseline}
    outputs:
      - id: change_record
        type: report
        format: md
        inputs: [baseline]
  prospective_validation:
    name: Observe changed behavior in real episodes (descriptive context since 2026-10-16)
    inputs:
      - {id: change_record, from: ../harness_change.change_record}
      - {id: data_contract, from: ../data_contract}
    outputs:
      - id: result
        type: report
        format: md
        inputs: [change_record, data_contract]
  arm_comparison:
    name: Blinded paired comparison of old instructions, the three result rules and a directive control
    inputs:
      - {id: policy, from: ../policy}
      - {id: items, from: ../items}
      - {id: key, from: ../key}
    outputs:
      - id: scores
        type: data
        format: csv
        inputs: [policy, items, key]
      - id: result
        type: report
        format: md
        inputs: [policy, items, key]
